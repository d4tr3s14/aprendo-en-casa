<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCFCFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aprendo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="diseno/icono-180.png">
<link rel="icon" type="image/png" href="diseno/icono-192.png">
<title>Aprendo en casa</title>
<!-- selva:tokens -->
<style>
/* ==========================================================================
   TOKENS · DESIGN.md §9 (fuente de verdad: DESIGN.md en la raíz)
   Neutros casi blancos, un solo acento azul, bordes de 1px y color solo para
   comunicar estado. Se incrusta primero en cada actividad con
   python herramientas/sincronizar.py
   ========================================================================== */
:root{
  color-scheme:light dark;
  --bg-page:#FCFCFC; --bg-wash:#F8F8F8; --bg-elevated:#FFFFFF;
  --text-primary:#191919; --text-strong:#000;
  --text-secondary:rgba(25,25,25,.56); --text-tertiary:rgba(25,25,25,.40);
  --border-primary:rgba(0,0,0,.08); --border-secondary:rgba(0,0,0,.06); --border-hover:rgba(0,0,0,.12);
  --tint-strong:rgba(0,0,0,.08); --tint-soft:rgba(0,0,0,.06); --tint-faint:rgba(0,0,0,.04);
  --accent:#317CFF; --accent-tint:rgba(51,125,244,.10); --button-neutral:#363636; --button-neutral-text:#FFF;
  --green:#00A558; --green-tint:rgba(62,237,155,.20);
  --red:#F53B3A; --red-tint:rgba(245,59,58,.12);
  --orange:#F58E3A; --orange-tint:rgba(245,142,58,.12);
  --purple:#956CDE; --purple-tint:rgba(149,108,222,.12);
  --font-ui:Inter, -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-mono:'Geist Mono','IBM Plex Mono',ui-monospace,monospace;
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-pill:999px;
  --shadow-L1:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-L2:0 1px 3px 0 rgba(0,0,0,.06),0 1px 2px 0 rgba(0,0,0,.06);
  --shadow-ring:0 0 3px 0 rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.08);
  --shadow-L3:0 10px 15px -3px rgba(0,0,0,.06);
  --shadow-L4:0 25px 50px -12px rgba(0,0,0,.25);
  --t-rapida:140ms ease-out;

  /* Adaptación a 1° básico (INSTRUCCIONES-PROYECTO.md): la app se usa con el dedo
     y por una niña que aún no lee fluido. Se mantiene el lenguaje visual de
     DESIGN.md pero el texto nunca baja de 15 px y los toques miden ≥ 48 px. */
  --fs-meta:15px; --fs-body:17px; --fs-label:17px; --fs-title:clamp(1.25rem,4.6vw,1.6rem);
  --fs-display:clamp(2rem,8vw,3rem);
  --toque:48px; --toque-respuesta:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-page:#141414; --bg-wash:#191919; --bg-elevated:#1F1F1F;
    --text-primary:rgba(255,255,255,.90); --text-strong:#FFF;
    --text-secondary:rgba(255,255,255,.52); --text-tertiary:rgba(255,255,255,.40);
    --border-primary:rgba(255,255,255,.08); --border-secondary:rgba(255,255,255,.04); --border-hover:rgba(255,255,255,.16);
    --tint-strong:rgba(255,255,255,.08); --tint-soft:rgba(255,255,255,.05); --tint-faint:rgba(255,255,255,.03);
    --accent:#49B0FF; --button-neutral:#F9F9F9; --button-neutral-text:#000;
    --green:#00EC7E; --green-tint:rgba(0,236,126,.08); --orange-tint:rgba(245,142,58,.08);
    --shadow-L1:0 1px 2px 0 rgba(0,0,0,.20);
    --shadow-L3:0 10px 15px -3px rgba(0,0,0,.64);
    --shadow-L4:0 25px 50px -12px rgba(0,0,0,.50);
  }
}
:root[data-theme="dark"]{
  --bg-page:#141414; --bg-wash:#191919; --bg-elevated:#1F1F1F;
  --text-primary:rgba(255,255,255,.90); --text-strong:#FFF;
  --text-secondary:rgba(255,255,255,.52); --text-tertiary:rgba(255,255,255,.40);
  --border-primary:rgba(255,255,255,.08); --border-secondary:rgba(255,255,255,.04); --border-hover:rgba(255,255,255,.16);
  --tint-strong:rgba(255,255,255,.08); --tint-soft:rgba(255,255,255,.05); --tint-faint:rgba(255,255,255,.03);
  --accent:#49B0FF; --button-neutral:#F9F9F9; --button-neutral-text:#000;
  --green:#00EC7E; --green-tint:rgba(0,236,126,.08); --orange-tint:rgba(245,142,58,.08);
  --shadow-L1:0 1px 2px 0 rgba(0,0,0,.20);
  --shadow-L3:0 10px 15px -3px rgba(0,0,0,.64);
  --shadow-L4:0 25px 50px -12px rgba(0,0,0,.50);
}
</style>
<!-- /selva:tokens -->
<style>
/* La portada no se sincroniza con herramientas/sincronizar.py: solo recibe
   los tokens de diseno/tokens.css (bloque de arriba). Componentes: DESIGN.md §5. */
@media (min-width:700px) and (min-height:600px){ html{font-size:112.5%} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;background:var(--bg-page);color:var(--text-primary);
  font:400 var(--fs-body)/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;
  padding:0 max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
button,a{touch-action:manipulation;font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.contenedor{width:min(900px,100%);margin:0 auto}

/* encabezado: barra superior con borde inferior */
header{
  display:flex;align-items:center;gap:12px;
  margin:0 -16px 16px;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;
  border-bottom:1px solid var(--border-primary);
}
.saludo{flex:1;min-width:0}
h1{font:500 clamp(1.6rem,6vw,2rem)/1.1 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);margin:0}
.lema{margin:4px 0 0;font-size:var(--fs-meta);color:var(--text-secondary)}
.total{
  flex:none;min-height:36px;padding:0 14px;border-radius:var(--r-pill);display:flex;align-items:center;gap:6px;
  border:1px solid var(--border-primary);color:var(--text-primary);font:500 var(--fs-meta)/1 var(--font-ui);
}

/* asignaturas: control segmentado que se desliza de lado */
.filtros{
  display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;width:fit-content;max-width:100%;
  margin:0 0 8px;padding:2px;border-radius:var(--r-sm);background:var(--tint-soft);scrollbar-width:none;
}
.filtros::-webkit-scrollbar{display:none}
.chip{
  flex:none;scroll-snap-align:start;min-height:44px;padding:0 14px;border:1px solid transparent;border-radius:var(--r-xs);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--text-secondary);
  font:500 var(--fs-meta)/1 var(--font-ui);transition:background var(--t-rapida),color var(--t-rapida);
}
.chip .e{font-size:1.1rem}
.chip:hover{color:var(--text-primary)}
.chip[aria-pressed="true"]{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-primary);box-shadow:var(--shadow-L1)}

/* encabezado de grupo: nombre + contador en text-secondary */
.separador{
  display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;padding:0 4px;
  font:500 var(--fs-label)/1.3 var(--font-ui);color:var(--text-primary);
}
.separador small{font:inherit;font-weight:400;color:var(--text-secondary)}

/* actividades: tarjetas */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.tarjeta{
  position:relative;display:flex;align-items:center;gap:12px;min-height:88px;padding:10px 60px 10px 12px;
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);border-radius:var(--r-sm);box-shadow:var(--shadow-L1);
  transition:border-color var(--t-rapida);
}
.tarjeta:hover{border-color:var(--border-hover)}
.icono{
  flex:none;width:56px;height:56px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:1.9rem;line-height:1;background:var(--tint-faint);border:1px solid var(--border-secondary);
}
.texto{min-width:0}
.texto h2{font:500 var(--fs-label)/1.3 var(--font-ui);margin:0}
/* el enlace cubre toda la tarjeta; el botón de escuchar queda encima */
.ir{color:inherit;text-decoration:none}
.ir::after{content:"";position:absolute;inset:0;border-radius:var(--r-sm)}
.ir:focus-visible{outline:none}
.tarjeta:has(.ir:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
/* pie de tarjeta: meta con separadores "·" y punto de estado */
.meta{display:flex;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:var(--fs-meta);color:var(--text-secondary)}
.meta span + span::before{content:"·";margin:0 6px;color:var(--text-tertiary)}
.meta .logro{color:var(--text-primary)}
.meta .check{font-style:normal;color:var(--green)}
.meta .nueva{display:inline-flex;align-items:center}
.meta .nueva i{width:8px;height:8px;border-radius:9999px;background:var(--accent);margin-right:6px;animation:pulso 1.5s ease-in-out infinite}
@keyframes pulso{50%{opacity:.4}}
.objetivo{display:none;margin:6px 0 0;font-size:var(--fs-meta);line-height:1.4;color:var(--text-secondary)}
.adultos .objetivo{display:block}
/* botón fantasma de ícono */
.oir{
  position:absolute;top:50%;right:8px;transform:translateY(-50%);z-index:2;
  width:44px;height:44px;border:0;border-radius:var(--r-xs);cursor:pointer;font-size:1.15rem;
  background:transparent;transition:background var(--t-rapida);
}
.oir:hover,.oir:active{background:var(--tint-strong)}

.vacio{
  grid-column:1/-1;text-align:center;padding:24px 16px;font-size:var(--fs-body);color:var(--text-secondary);
  border:1px dashed var(--border-hover);border-radius:var(--r-lg);
}

/* rincón de papá y mamá */
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border-primary);text-align:center;font-size:var(--fs-meta);color:var(--text-secondary);line-height:1.5}
.interruptor{
  display:inline-flex;align-items:center;gap:10px;min-height:var(--toque);padding:0 14px;border-radius:var(--r-xs);cursor:pointer;
  background:transparent;color:var(--text-primary);border:0;font-weight:500;margin-bottom:8px;transition:background var(--t-rapida);
}
.interruptor:hover{background:var(--tint-strong)}
.interruptor i{width:36px;height:20px;border-radius:10px;background:var(--tint-strong);position:relative;flex:none;transition:background var(--t-rapida)}
.interruptor i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg-elevated);box-shadow:var(--shadow-L2);transition:transform var(--t-rapida)}
.interruptor[aria-checked="true"] i{background:var(--accent)}
.interruptor[aria-checked="true"] i::after{transform:translateX(16px)}

@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
@media (prefers-contrast: more){ .chip,.tarjeta{border-color:currentColor} footer,.meta,.lema{color:var(--text-primary)} }
</style>
</head>
<body>
<div class="contenedor" id="raiz">

  <header>
    <div class="saludo">
      <h1>Aprendo en casa</h1>
      <p class="lema">Elige una actividad y a jugar</p>
    </div>
    <div class="total" id="total" aria-label="Estrellas ganadas">⭐ 0</div>
  </header>

  <nav class="filtros" id="filtros" aria-label="Asignaturas"></nav>
  <main id="contenido"></main>

  <footer>
    <button class="interruptor" id="adultos" role="switch" aria-checked="false"><i></i>Para papá y mamá: ver objetivos</button>
    <div>Actividades hechas en familia · <span id="conteo"></span></div>
  </footer>

</div>

<script>
const $ = id => document.getElementById(id);
let datos = null, filtro = "todas";
let progreso = {};
try{ progreso = JSON.parse(localStorage.getItem("aprendo:progreso")) || {}; }catch(e){}

function hablar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "es-ES"; u.rate = .95; u.pitch = 1.1;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith("es"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function el(tag, clase, texto){
  const e = document.createElement(tag);
  if(clase) e.className = clase;
  if(texto != null) e.textContent = texto;
  return e;
}

fetch("actividades.json?v=" + Date.now())
  .then(r => r.json())
  .then(d => { datos = d; pintarFiltros(); pintar(); })
  .catch(() => {
    $("contenido").innerHTML =
      '<div class="vacio">No se pudo leer <b>actividades.json</b>.<br>' +
      'Esto es normal si abriste el archivo directamente desde el computador: ' +
      'la portada funciona al publicarla en GitHub Pages.</div>';
  });

function pintarFiltros(){
  const cont = $("filtros");
  cont.appendChild(chip("todas", "✨", "Todas"));
  datos.asignaturas
    .filter(a => datos.actividades.some(x => x.asignatura === a.id))
    .forEach(a => cont.appendChild(chip(a.id, a.emoji, a.nombre)));
}
function chip(id, emoji, texto){
  const b = el("button", "chip");
  b.append(el("span", "e", emoji), texto);
  b.setAttribute("aria-pressed", id === filtro);
  b.onclick = () => {
    filtro = id;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    hablar(texto);
    pintar();
  };
  return b;
}

function pintar(){
  const cont = $("contenido");
  cont.innerHTML = "";
  const n = datos.actividades.length;
  $("conteo").textContent = n + " actividad" + (n === 1 ? "" : "es");
  const total = Object.values(progreso).reduce((s, p) => s + (p.mejor || 0), 0);
  $("total").textContent = "⭐ " + total;

  const lista = datos.actividades.filter(a => filtro === "todas" || a.asignatura === filtro);
  if(!lista.length){
    cont.innerHTML = '<div class="vacio">Todavía no hay actividades aquí. ¡Pronto agregaremos una!</div>';
    return;
  }
  // agrupar por curso y semestre, lo más reciente primero
  const grupos = {};
  lista.forEach(a => (grupos[a.curso + "|" + a.semestre] = grupos[a.curso + "|" + a.semestre] || []).push(a));
  Object.keys(grupos).sort().reverse().forEach(clave => {
    const [curso, semestre] = clave.split("|");
    const nombreCurso = (datos.cursos.find(c => c.id === curso) || {}).nombre || curso;
    const sep = el("h2", "separador", nombreCurso + " · Semestre " + semestre);
    sep.appendChild(el("small", "", grupos[clave].length));
    cont.appendChild(sep);
    const g = el("div", "grilla");
    grupos[clave]
      .sort((x, y) => (y.fecha || "").localeCompare(x.fecha || ""))
      .forEach(a => g.appendChild(tarjeta(a)));
    cont.appendChild(g);
  });
}

function tarjeta(a){
  const asig = datos.asignaturas.find(s => s.id === a.asignatura) || {};
  const p = progreso[a.archivo];
  const t = el("article", "tarjeta");

  const ic = el("div", "icono", a.emoji || asig.emoji || "🎲");
  ic.setAttribute("aria-hidden", "true");

  const tx = el("div", "texto");
  const h = el("h2");
  const ir = el("a", "ir", a.titulo);
  ir.href = a.archivo;
  h.appendChild(ir);

  const meta = el("div", "meta");
  meta.appendChild(el("span", "", (asig.emoji || "") + " " + (asig.nombre || a.asignatura)));
  const dias = a.fecha ? (Date.now() - new Date(a.fecha + "T12:00")) / 864e5 : 99;
  if(p && p.mejor) meta.appendChild(el("span", "logro", "⭐ " + p.mejor));
  else if(p){ const v = el("span", "logro", " Vista"); v.prepend(el("i", "check", "✓")); meta.appendChild(v); }
  else if(dias < 8){ const nv = el("span", "nueva", "Nueva"); nv.prepend(el("i")); meta.appendChild(nv); }

  tx.append(h, meta, el("p", "objetivo", a.objetivo || ""));

  const oir = el("button", "oir", "🔊");
  oir.setAttribute("aria-label", "Escuchar: " + a.titulo);
  oir.onclick = () => hablar(a.titulo + ". " + (asig.nombre || ""));

  t.append(ic, tx, oir);
  return t;
}

// rincón de papá y mamá (se recuerda en este dispositivo)
const sw = $("adultos");
function modoAdultos(on){
  sw.setAttribute("aria-checked", on);
  $("raiz").classList.toggle("adultos", on);
  try{ localStorage.setItem("aprendo:adultos", on ? "1" : ""); }catch(e){}
}
try{ modoAdultos(localStorage.getItem("aprendo:adultos") === "1"); }catch(e){}
sw.onclick = () => modoAdultos(sw.getAttribute("aria-checked") !== "true");

// funciona sin internet una vez visitada (ver sw.js)
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
