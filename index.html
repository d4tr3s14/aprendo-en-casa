<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E3B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aprendo en casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --selva:#0E3B2E; --selva-claro:#17513E; --crema:#FFF6E5;
    --sol:#FFC93C; --coral:#FF6B5A; --agua:#3FC1E0; --hoja:#7ED957;
    --sombra:0 8px 0 rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:18px 14px 40px;min-height:100vh;
    font-family:'Nunito',system-ui,sans-serif;color:var(--crema);
    background:
      radial-gradient(circle at 10% 8%, rgba(126,217,87,.20), transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(63,193,224,.20), transparent 45%),
      var(--selva);
  }
  .contenedor{width:min(820px,100%);margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  .bichos{font-size:clamp(2rem,9vw,3rem);letter-spacing:.1em}
  .bichos span{display:inline-block;animation:flota 3s ease-in-out infinite}
  .bichos span:nth-child(2){animation-delay:.4s}
  .bichos span:nth-child(3){animation-delay:.8s}
  .bichos span:nth-child(4){animation-delay:1.2s}
  @keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-family:'Baloo 2',sans-serif;font-size:clamp(2rem,8vw,3rem);color:var(--sol);margin:.1em 0 .05em;line-height:1}
  .lema{margin:0;font-size:1.05rem;opacity:.9}

  /* filtros */
  .filtros{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 6px}
  .chip{
    font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;
    background:transparent;color:var(--crema);border:3px solid rgba(255,246,229,.3);
    border-radius:999px;padding:8px 16px;cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:var(--sol)}
  .chip[aria-pressed="true"]{background:var(--sol);color:var(--selva);border-color:var(--sol)}
  .chip:focus-visible{outline:4px solid var(--agua);outline-offset:3px}
  .separador{
    display:flex;align-items:center;gap:10px;margin:26px 0 12px;
    font-family:'Baloo 2',sans-serif;font-size:1.3rem;color:var(--sol);
  }
  .separador::after{content:"";flex:1;height:3px;background:rgba(255,246,229,.18);border-radius:3px}

  /* tarjetas */
  .grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tarjeta{
    display:flex;gap:12px;align-items:center;text-decoration:none;
    background:var(--crema);color:var(--selva);
    border-radius:24px;padding:14px;box-shadow:var(--sombra);
    border-left:10px solid var(--hoja);transition:transform .12s;
  }
  .tarjeta:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .tarjeta:focus-visible{outline:4px solid var(--agua);outline-offset:3px}
  .icono{font-size:3rem;line-height:1;flex:none}
  .texto h2{font-family:'Baloo 2',sans-serif;font-size:1.35rem;margin:0 0 2px;line-height:1.1}
  .texto p{margin:0;font-size:.9rem;opacity:.75;line-height:1.3}
  .etiqueta{
    display:inline-block;margin-top:6px;font-size:.72rem;font-weight:800;
    background:rgba(14,59,46,.1);border-radius:999px;padding:3px 10px;
  }
  .vacio{
    grid-column:1/-1;text-align:center;padding:26px 14px;
    border:3px dashed rgba(255,246,229,.25);border-radius:24px;font-size:1.05rem;
  }
  footer{text-align:center;margin-top:34px;font-size:.85rem;opacity:.55;line-height:1.5}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <div class="bichos"><span>🦜</span><span>🔢</span><span>📖</span><span>🌱</span></div>
    <h1>Aprendo en casa</h1>
    <p class="lema">Elige una actividad y a jugar</p>
  </header>

  <div class="filtros" id="filtros"></div>
  <div id="contenido"></div>

  <footer>
    Actividades hechas en familia · <span id="conteo"></span>
  </footer>

</div>

<script>
const $ = id => document.getElementById(id);
let datos = null, filtro = "todas";

fetch("actividades.json?v=" + Date.now())
  .then(r => r.json())
  .then(d => { datos = d; pintarFiltros(); pintar(); })
  .catch(() => {
    $("contenido").innerHTML =
      '<div class="vacio">No se pudo leer <b>actividades.json</b>.<br>' +
      'Esto es normal si abriste el archivo directamente desde el computador: ' +
      'la portada funciona al publicarla en GitHub Pages.</div>';
  });

function pintarFiltros(){
  const cont = $("filtros");
  const todas = boton("todas", "✨ Todas");
  cont.appendChild(todas);
  datos.asignaturas.forEach(a => cont.appendChild(boton(a.id, a.emoji + " " + a.nombre)));
}
function boton(id, texto){
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = texto;
  b.setAttribute("aria-pressed", id === filtro);
  b.onclick = () => {
    filtro = id;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    pintar();
  };
  return b;
}
function pintar(){
  const cont = $("contenido");
  cont.innerHTML = "";
  const lista = datos.actividades.filter(a => filtro === "todas" || a.asignatura === filtro);
  $("conteo").textContent = datos.actividades.length + " actividad" + (datos.actividades.length === 1 ? "" : "es");

  if(!lista.length){
    cont.innerHTML = '<div class="vacio">Todavía no hay actividades aquí. ¡Pronto agregaremos una!</div>';
    return;
  }
  // agrupar por curso y semestre, lo más reciente primero
  const grupos = {};
  lista.forEach(a => {
    const clave = a.curso + "|" + a.semestre;
    (grupos[clave] = grupos[clave] || []).push(a);
  });
  Object.keys(grupos).sort().reverse().forEach(clave => {
    const [curso, semestre] = clave.split("|");
    const nombreCurso = (datos.cursos.find(c => c.id === curso) || {}).nombre || curso;
    const h = document.createElement("div");
    h.className = "separador";
    h.textContent = nombreCurso + " · Semestre " + semestre;
    cont.appendChild(h);

    const g = document.createElement("div");
    g.className = "grilla";
    grupos[clave]
      .sort((x, y) => (y.fecha || "").localeCompare(x.fecha || ""))
      .forEach(a => g.appendChild(tarjeta(a)));
    cont.appendChild(g);
  });
}
function tarjeta(a){
  const asig = datos.asignaturas.find(s => s.id === a.asignatura) || {};
  const el = document.createElement("a");
  el.className = "tarjeta";
  el.href = a.archivo;
  el.style.borderLeftColor = asig.color || "var(--hoja)";
  el.innerHTML =
    '<div class="icono">' + (a.emoji || asig.emoji || "🎲") + '</div>' +
    '<div class="texto"><h2>' + a.titulo + '</h2>' +
    '<p>' + (a.objetivo || "") + '</p>' +
    '<span class="etiqueta">' + (asig.emoji || "") + " " + (asig.nombre || a.asignatura) + '</span></div>';
  return el;
}
</script>
</body>
</html>
