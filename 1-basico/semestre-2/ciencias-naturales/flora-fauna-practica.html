<style>
/* tokens y base común: bloque generado más abajo (diseno/). Componentes: DESIGN.md §5 */
*{box-sizing:border-box}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.marco{max-width:560px;margin:0 auto;padding:0 16px 32px}
[hidden]{display:none!important}

/* barra superior */
.barra{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  margin:0 -16px 16px;padding:8px 16px;background:var(--bg-page);border-bottom:1px solid var(--border-primary);
}
.barra .esp{flex:1}
.chip{
  font:500 var(--fs-meta)/1 var(--font-ui);border:1px solid var(--border-primary);border-radius:var(--r-xs);
  padding:0 14px;min-height:var(--toque);display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--shadow-L1);cursor:pointer;touch-action:manipulation;
  transition:background var(--t-rapida);
}
.chip:hover{background:var(--tint-strong)}
.chip[aria-pressed="false"]{background:transparent;box-shadow:none;color:var(--text-secondary)}
.contador{min-height:36px;border-radius:var(--r-pill);background:transparent;box-shadow:none}
.contador.salta{animation:resalta 1s ease-out}
@keyframes resalta{0%{background:var(--accent-tint);border-color:var(--accent)}100%{background:transparent}}

/* botones */
.btn{
  font:500 1.125rem/1.2 var(--font-ui);border:1px solid transparent;border-radius:var(--r-sm);padding:0 18px;min-height:var(--toque-respuesta);
  background:var(--button-neutral);color:var(--button-neutral-text);cursor:pointer;touch-action:manipulation;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity var(--t-rapida),background var(--t-rapida);
}
.btn:hover{opacity:.9}
.btn:active{opacity:.8}
.btn.agua{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-primary);box-shadow:var(--shadow-L1)}
.btn.agua:hover{opacity:1;background:var(--tint-strong)}
.btn.ancho{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.grabando{background:var(--red);color:#FFF}

/* portada */
.portada h1{font:500 var(--fs-display)/1.05 var(--font-ui);letter-spacing:-.02em;margin:8px 0 6px;color:var(--text-strong)}
.portada .sub{font-size:var(--fs-body);margin:0 0 12px;color:var(--text-secondary)}
.leer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.leer .btn{font-size:1rem;white-space:nowrap;padding:0 10px}
.misiones{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:var(--r-lg);background:var(--bg-wash);box-shadow:var(--shadow-ring)}
.cuadro{
  position:relative;border:1px solid var(--border-primary);border-radius:var(--r-sm);min-height:124px;padding:12px 8px 10px;
  cursor:pointer;touch-action:manipulation;background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--shadow-L1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  transition:border-color var(--t-rapida);
}
.cuadro:hover{border-color:var(--border-hover)}
.cuadro:active{background:var(--tint-faint)}
.cuadro .emo{font-size:2.4rem;line-height:1}
.cuadro .nom,.cuadro .est{display:block}
.cuadro .nom{font:500 var(--fs-label)/1.2 var(--font-ui)}
.cuadro .est{font-size:var(--fs-meta);color:var(--text-secondary)}
.cuadro.hecha{border-color:var(--green);background:var(--green-tint)}
.cuadro.hecha .est{display:inline-flex;align-items:center;gap:6px;color:var(--text-primary)}
.cuadro.hecha .est::before{content:"";width:8px;height:8px;border-radius:9999px;background:var(--green)}
.cuadro.largo{grid-column:1 / -1;min-height:96px;flex-direction:row;gap:12px}
.trofeo{margin:16px 0 0;padding:16px;border-radius:var(--r-lg);text-align:center;background:var(--bg-elevated);border:1px solid var(--green);box-shadow:var(--shadow-L1)}
.trofeo .emo{font-size:3rem}
.trofeo h2{font:500 var(--fs-title)/1.25 var(--font-ui);margin:4px 0 0}
.pie{margin-top:20px;font-size:var(--fs-meta);color:var(--text-secondary);text-align:center}
.linkbtn{background:none;border:0;border-radius:var(--r-xs);padding:0 10px;color:var(--red);font-size:var(--fs-meta);cursor:pointer;min-height:44px;transition:background var(--t-rapida)}
.linkbtn:hover{background:var(--red-tint)}

/* guía para el adulto */
.guia{margin-top:16px;border:1px solid var(--border-primary);border-radius:var(--r-lg);background:var(--bg-elevated);box-shadow:var(--shadow-L1)}
.guia summary{cursor:pointer;padding:14px 16px;font:500 var(--fs-label)/1.3 var(--font-ui);min-height:var(--toque);list-style-position:inside}
.guia .dentro{padding:0 16px 16px;font-size:var(--fs-body)}
.guia h3{font:500 var(--fs-label)/1.3 var(--font-ui);margin:14px 0 6px}
.guia p{margin:0 0 8px;color:var(--text-secondary)}
.guia ul{margin:0 0 8px;padding-left:20px;color:var(--text-secondary)}
.guia li{margin-bottom:4px}
.guion-p{margin:0 0 10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--tint-faint);border:1px solid var(--border-secondary)}
.guion-p b{display:block;font-weight:500;color:var(--text-strong)}
.guion-p span{display:block;font-size:var(--fs-meta);color:var(--text-secondary)}

/* juego */
.cabeza{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cabeza h2{font:500 var(--fs-title)/1.25 var(--font-ui);margin:0;flex:1}
.puntos{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.puntos i{width:8px;height:8px;border-radius:9999px;background:var(--tint-strong);display:block}
.puntos i.ok{background:var(--green)}
.puntos i.ya{background:var(--accent)}
.tarjeta{background:var(--bg-elevated);border:1px solid var(--border-primary);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-L1)}
.pregunta{display:flex;gap:12px;align-items:center}
.pregunta .grande{font-size:3rem;line-height:1;flex:none}
.pregunta p{font:500 var(--fs-title)/1.3 var(--font-ui);margin:0;flex:1}
.oir{
  flex:none;width:var(--toque);height:var(--toque);border-radius:var(--r-xs);border:1px solid var(--border-primary);
  background:var(--bg-elevated);font-size:1.3rem;box-shadow:var(--shadow-L1);cursor:pointer;transition:background var(--t-rapida);
}
.oir:hover{background:var(--tint-strong)}
.opciones{display:grid;gap:8px;margin-top:14px}
.opciones.dos{grid-template-columns:1fr 1fr}
.opciones.fotos{grid-template-columns:repeat(3,1fr)}
.op{
  display:flex;align-items:center;gap:12px;width:100%;min-height:68px;border:1px solid var(--border-primary);border-radius:var(--r-sm);
  padding:10px 14px;text-align:left;background:var(--bg-elevated);color:var(--text-primary);font:500 var(--fs-label)/1.3 var(--font-ui);
  box-shadow:var(--shadow-L1);cursor:pointer;touch-action:manipulation;transition:background var(--t-rapida),border-color var(--t-rapida);
}
.op:hover{border-color:var(--border-hover)}
.op:active{background:var(--tint-faint)}
.op .e{font-size:2rem;line-height:1;flex:none}
.opciones.dos .op{flex-direction:column;justify-content:center;text-align:center;min-height:104px;gap:6px}
.opciones.dos .op .e{font-size:2.6rem}
.opciones.fotos .op{flex-direction:column;justify-content:center;text-align:center;padding:6px;gap:6px}
.opciones.fotos .op .ima{width:100%}
.opciones.fotos .op .rot{min-height:1.3em;font-size:var(--fs-meta)}
.op.bien{background:var(--green-tint);border-color:var(--green)}
.op.no{opacity:.4;cursor:default;box-shadow:none}
.op.pistaluz{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}

/* imágenes: foto de img-flora-fauna/ o emoji de respaldo */
.ima{
  position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;width:100%;
  border-radius:var(--r-sm);overflow:hidden;background:var(--tint-faint);
}
.ima .emo{font-size:2.6rem;line-height:1}
.ima img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.foto-ser{max-width:240px;margin:14px auto 0}
.foto-ser .emo{font-size:5rem}
.nombre-ser{font:500 1.6rem/1.2 var(--font-ui);color:var(--text-strong);text-align:center;margin:10px 0 0}

/* diapositiva de práctica (modelo y ensayo): la misma estructura que la presentación */
.diapo{border:1px solid var(--border-primary);border-radius:var(--r-lg);padding:14px;background:var(--bg-page)}
.diapo .ima.portada{max-width:240px;margin:0 auto}
.diapo .ima.portada .emo{font-size:5rem}
.titulo-d{font:500 1.7rem/1.15 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);text-align:center;margin:10px 0 4px}
.eyebrow{display:table;margin:0 auto 10px;font:500 var(--fs-meta)/1 var(--font-ui);padding:8px 12px;border:1px solid var(--border-primary);border-radius:var(--r-pill);background:var(--bg-elevated);color:var(--text-secondary)}
.ficha{display:flex;flex-direction:column;align-items:center;gap:8px}
.ficha .foto{position:relative;width:min(240px,70vw);border-radius:var(--r-sm);border:1px solid transparent;transition:border-color var(--t-rapida),box-shadow var(--t-rapida)}
.ficha .foto .emo{font-size:5rem}
.ficha .nombre{font:500 2.2rem/1.1 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);border-radius:6px;padding:0 6px}
.rasgos{display:grid;gap:8px;margin-top:12px}
.rasgo{
  position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border-primary);
  border-radius:var(--r-sm);background:var(--bg-elevated);font:500 var(--fs-label)/1.3 var(--font-ui);
  transition:border-color var(--t-rapida),box-shadow var(--t-rapida);
}
.rasgo .e{font-size:1.8rem;line-height:1;flex:none}
.cuidados{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.accion{position:relative;border:1px solid var(--border-primary);border-radius:var(--r-sm);padding:6px 6px 8px;background:var(--bg-elevated);text-align:center;transition:border-color var(--t-rapida),box-shadow var(--t-rapida)}
.accion b{display:block;font:500 var(--fs-label)/1.25 var(--font-ui);margin-top:6px;color:var(--text-strong)}
.senala{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-tint)!important}
.ficha .foto.senala::after,.accion.senala::after{content:"👈";position:absolute;right:-8px;top:-14px;font-size:1.8rem;line-height:1}
.frase{font:500 1.2rem/1.5 var(--font-ui);color:var(--text-strong);margin:14px 0 0}
.frase span{border-radius:4px;padding:0 2px;transition:background var(--t-rapida)}
.frase span.senala{background:var(--accent-tint);box-shadow:none!important}
.frase .hueco{display:inline-block;min-width:4.5em;border-bottom:2px dashed var(--border-hover);color:var(--text-tertiary);font-weight:400}
.consejo{margin:12px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--tint-faint);font-size:var(--fs-body);color:var(--text-primary)}
.respuesta{margin:14px 0 0;padding:12px 14px;border-radius:var(--r-sm);border:1px dashed var(--border-hover);font:500 var(--fs-label)/1.4 var(--font-ui);color:var(--text-primary)}

/* orden */
.fila{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.fila span{
  aspect-ratio:1;border-radius:var(--r-xs);border:1px dashed var(--border-hover);
  display:flex;align-items:center;justify-content:center;font:500 1.1rem/1 var(--font-mono);color:var(--text-tertiary);
}
.fila span.lleno{border:1px solid var(--border-primary);background:var(--bg-elevated);font-size:1.6rem}
.escenas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.escena{position:relative}
.escena .op{flex-direction:column;justify-content:center;text-align:center;min-height:118px;padding:10px 8px 12px}
.escena .op .e{font-size:2.4rem}
.escena .mini{
  position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:var(--r-xs);border:0;
  background:transparent;font-size:1.1rem;cursor:pointer;transition:background var(--t-rapida);
}
.escena .mini:hover{background:var(--tint-strong)}
.escena.usada{visibility:hidden}

/* aviso */
.aviso{
  position:relative;margin-top:14px;border-radius:var(--r-sm);padding:12px 14px 12px 32px;
  font-weight:500;font-size:var(--fs-body);line-height:1.4;
  background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);
}
.aviso::before{content:"";position:absolute;left:14px;top:19px;width:8px;height:8px;border-radius:9999px;background:var(--green)}
.aviso.dato b{display:block;font:500 var(--fs-title)/1.3 var(--font-ui);color:var(--text-strong)}
.aviso.casi::before{background:var(--orange)}
.acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acciones .btn{flex:1 1 auto}
.acciones .btn.chico{flex:0 0 64px;padding:0;font-size:1.4rem}
.estado{font-size:var(--fs-meta);color:var(--text-secondary);margin:8px 0 0;text-align:center;min-height:1.2em}

/* rúbrica */
.nivel{flex-direction:column;align-items:flex-start;gap:2px}
.nivel .pts{font:500 var(--fs-meta)/1 var(--font-mono);color:var(--text-secondary)}
.nivel .desc{font-weight:400;font-size:var(--fs-body);line-height:1.35}

/* final */
.final{text-align:center}
.final .lamina{font-size:5rem;line-height:1;margin:8px auto;width:140px;height:140px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;background:var(--tint-faint);border:1px solid var(--border-primary)}
.final h2{font:500 var(--fs-display)/1.1 var(--font-ui);letter-spacing:-.02em;margin:10px 0 4px;color:var(--text-strong)}
.final .estrellas{font-size:1.6rem;letter-spacing:2px;margin:6px 0 14px;word-break:break-all}
.final .btn{margin-top:8px}
.nota{font:500 3rem/1 var(--font-mono);color:var(--text-strong);margin:6px 0}

@keyframes sacude{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes salta{from{opacity:0}to{opacity:1}}
.sacude{animation:sacude .3s ease-out}
.salta{animation:salta .16s ease-out}
.confeti{position:fixed;top:-40px;font-size:1.4rem;pointer-events:none;z-index:9;animation:cae 1.6s linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
@media (max-width:380px){ .ficha .nombre{font-size:1.8rem} .titulo-d{font-size:1.45rem} }
</style>

<script>
"use strict";
/* ================== DATOS ================== */
const DATOS=JSON.parse(document.getElementById("datos").textContent);
const FR=DATOS.frases, MISIONES=DATOS.misiones, PASOS=DATOS.diapos;
const SER={}; DATOS.seres.forEach(s=>SER[s.id]=s);

/* ================== UTILIDADES ================== */
const $=s=>document.querySelector(s);
function el(tag,attrs,...hijos){
  const n=document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==="class") n.className=attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null&&attrs[k]!==undefined) n.setAttribute(k,attrs[k]);
  }
  for(const h of hijos){ if(h===null||h===undefined||h===false) continue; n.append(h.nodeType?h:document.createTextNode(h)); }
  return n;
}
function baraja(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const reducido=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function anima(n,c){ if(!n||reducido()) return; n.classList.remove(c); void n.offsetWidth; n.classList.add(c); }
const espera=ms=>new Promise(r=>setTimeout(r,ms));

/* ================== IMÁGENES ================== */
const CARPETA="img-flora-fauna/", EXT=[".jpg",".jpeg",".png",".webp"], rutas={};
function ruta(id){
  if(!rutas[id]) rutas[id]=new Promise(res=>{
    (function prueba(k){
      if(k>=EXT.length){ res(null); return; }
      const im=new Image(); im.onload=()=>res(CARPETA+id+EXT[k]); im.onerror=()=>prueba(k+1); im.src=CARPETA+id+EXT[k];
    })(0);
  });
  return rutas[id];
}
function ima(id,emoji,clase){
  const caja=el("span",{class:"ima"+(clase?" "+clase:""),"aria-hidden":"true"},el("span",{class:"emo"},emoji));
  ruta(id).then(u=>{ if(u) caja.append(el("img",{src:u,alt:""})); });
  return caja;
}

/* ================== VOZ ==================
   Cada frase se busca primero como audio grabado con voz natural
   (audio/flora-fauna/<huella>.mp3, lo crea herramientas/generar-audios.py).
   Si no está, habla la voz del dispositivo.
   decir() devuelve "ok", "silencio" o "reemplazada". */
const Voz=(()=>{
  const DIR=DATOS.audio;
  const au=new Audio(); au.preload="auto";
  let on=true, turno=0, vozES=null;
  const clips=new Map();
  const SILENCIO="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  let listo=false;
  function desbloquea(){
    if(listo) return; listo=true;
    try{ au.src=SILENCIO; const p=au.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  }
  addEventListener("pointerdown",desbloquea,{capture:true});
  addEventListener("keydown",desbloquea,{capture:true});

  function limpia(t){
    return String(t).normalize("NFC").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}«»]/gu,"").replace(/\s+/g," ").trim();
  }
  /* huella FNV-1a de 32 bits: la misma que calcula generar-audios.py */
  function huella(t){
    let h=0x811c9dc5;
    for(const b of new TextEncoder().encode(t)){ h^=b; h=Math.imul(h,0x01000193)>>>0; }
    return h.toString(16).padStart(8,"0");
  }
  function clip(t){
    const h=huella(t);
    if(!clips.has(h)){
      clips.set(h,fetch(DIR+h+".mp3")
        .then(r=>r.ok?r.blob():null)
        .then(b=>b&&b.size>0?URL.createObjectURL(b):null)
        .catch(()=>null));
    }
    return clips.get(h);
  }
  function parar(){
    try{ au.pause(); }catch(e){}
    try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  }
  function toca(url,mio,lento){
    return new Promise(res=>{
      let fin=false;
      const vel=lento?.8:1;
      const acaba=r=>{ if(fin) return; fin=true; clearInterval(vig); au.onended=au.onerror=au.onplaying=null; res(r); };
      au.onended=()=>acaba("ok"); au.onerror=()=>acaba("error");
      au.onplaying=()=>{ try{ au.playbackRate=vel; }catch(e){} };
      au.src=url;
      try{ au.defaultPlaybackRate=vel; au.playbackRate=vel; au.preservesPitch=true; au.webkitPreservesPitch=true; }catch(e){}
      try{ const p=au.play(); if(p&&p.catch) p.catch(()=>acaba("error")); }catch(e){ acaba("error"); }
      const vig=setInterval(()=>{ if(mio!==turno){ try{au.pause()}catch(e){} acaba("reemplazada"); } },150);
    });
  }
  function eligeVoz(){
    if(!("speechSynthesis" in window)) return;
    const vs=speechSynthesis.getVoices(), lang=v=>v.lang.replace("_","-").toLowerCase();
    vozES=null;
    for(const p of ["es-cl","es-419","es-mx","es-us","es-es"]){ const v=vs.find(v=>lang(v).startsWith(p)); if(v){vozES=v;break;} }
    if(!vozES) vozES=vs.find(v=>lang(v).startsWith("es"))||null;
  }
  if("speechSynthesis" in window){ eligeVoz(); speechSynthesis.onvoiceschanged=eligeVoz; }
  function sintetiza(t,mio,lento){
    return new Promise(res=>{
      if(!("speechSynthesis" in window)){ res("ok"); return; }
      try{ speechSynthesis.cancel(); }catch(e){}
      let fin=false, arranco=false; const t0=Date.now();
      const estimado=Math.min(16000,1200+t.length*(lento?85:65));
      const acaba=r=>{ if(fin) return; fin=true; clearInterval(vig); res(mio===turno?r:"reemplazada"); };
      const u=new SpeechSynthesisUtterance(t);
      u.lang=vozES?vozES.lang:"es-CL"; if(vozES) u.voice=vozES;
      u.rate=lento?.7:.9; u.pitch=1.05;
      u.onstart=()=>{arranco=true}; u.onend=()=>acaba("ok"); u.onerror=()=>acaba("ok");
      speechSynthesis.speak(u);
      const vig=setInterval(()=>{
        if(mio!==turno){ acaba("reemplazada"); return; }
        const habla=speechSynthesis.speaking||speechSynthesis.pending;
        if(habla) arranco=true;
        if(arranco&&!habla&&Date.now()-t0>500){ acaba("ok"); return; }
        if(!arranco&&Date.now()-t0>1800){ clearInterval(vig); setTimeout(()=>acaba("ok"),Math.max(0,estimado-1800)); }
      },220);
    });
  }
  /* partes: "texto", {t:"texto", marca, lento}, {pausa:ms, marca} */
  function normaliza(partes){
    return [].concat(partes).map(p=>{
      if(typeof p==="string") return {t:limpia(p)};
      if(p.pausa) return Object.assign({},p);
      return Object.assign({},p,{t:limpia(p.t)});
    }).filter(p=>p.pausa||/[\p{L}\p{N}]/u.test(p.t));
  }
  async function decir(partes,opc){
    opc=opc||{};
    const mio=++turno; parar();
    const lista=normaliza(partes);
    if(!on||!lista.length){ if(opc.alParte) opc.alParte(-1,null); return "silencio"; }
    lista.forEach(p=>{ if(p.t) clip(p.t); });
    for(let i=0;i<lista.length;i++){
      const p=lista[i];
      if(opc.alParte) opc.alParte(i,p);
      let r;
      if(p.pausa){ await espera(p.pausa); r="ok"; }
      else{
        const lento=p.lento||opc.lento;
        const url=await clip(p.t);
        if(mio!==turno) return "reemplazada";
        if(url){ r=await toca(url,mio,lento); if(r==="error") r=await sintetiza(p.t,mio,lento); }
        else r=await sintetiza(p.t,mio,lento);
      }
      if(r!=="ok"||mio!==turno){ if(opc.alParte&&mio===turno) opc.alParte(-1,null); return r==="ok"?"reemplazada":r; }
      if(i<lista.length-1) await espera(170);
      if(mio!==turno) return "reemplazada";
    }
    if(opc.alParte) opc.alParte(-1,null);
    return "ok";
  }
  async function blob(b){
    const mio=++turno; parar();
    const url=URL.createObjectURL(b);
    const r=await toca(url,mio,false);
    URL.revokeObjectURL(url);
    return r;
  }
  return {
    decir, blob,
    calla(){ turno++; parar(); },
    get on(){ return on; }, set on(v){ on=v; if(!v){ turno++; parar(); } }
  };
})();
const dice=(p,o)=>Voz.decir(p,o);

let ctx=null;
function audio(){
  if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } }
  if(ctx&&ctx.state==="suspended"){ try{ctx.resume()}catch(e){} }
  return ctx;
}
function pito(f,dur,ret,tipo,vol){
  const c=audio(); if(!c||!Voz.on) return;
  const o=c.createOscillator(), g=c.createGain(); const t=c.currentTime+(ret||0);
  o.type=tipo||"sine"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sAcierto=()=>{pito(523,.18,0,"triangle");pito(659,.18,.1,"triangle");pito(784,.3,.2,"triangle")};
const sError=()=>{pito(330,.18,0,"sine",.15);pito(262,.28,.14,"sine",.15)};
const sClic=()=>pito(880,.06,0,"sine",.08);
const sFanfarria=()=>{[523,659,784,1047].forEach((f,i)=>pito(f,.25,i*.13,"triangle"));pito(1319,.5,.55,"triangle")};

}

/* frases de ánimo sin repetir */
function sinRepetir(lista,memo){
  let x, n=0;
  do{ x=lista[Math.floor(Math.random()*lista.length)]; n++; }while(memo.includes(x)&&n<20);
  memo.push(x); if(memo.length>4) memo.shift(); return x;
}

/* nota chilena de 1,0 a 7,0 con exigencia de 60 % sobre 20 puntos (como la rúbrica) */
function notaChile(p){

}

/* ---- 🔢 ordeno mi presentación ---- */
let ord={paso:0,orden:[]};
function rOrden(pre){
  const card=el("div",{class:"tarjeta"},
    el("div",{class:"pregunta"},el("span",{class:"grande","aria-hidden":"true"},"📽️"),
      el("p",{id:"txtPreg"},"Toca las partes en orden."),
      el("button",{class:"oir","aria-label":"Escuchar otra vez",onclick:()=>dice([vozOrden()])},"🔊")));

  PASOS.forEach((_,k)=>fila.append(el("span",{},String(k+1))));
  const grid=el("div",{class:"escenas"});
  ord.orden.forEach(k=>{
    const p=PASOS[k];
    const b=el("button",{class:"op","data-k":String(k)},el("span",{class:"e","aria-hidden":"true"},p.e),el("span",{},p.orden_t));
    const oreja=el("button",{class:"mini","aria-label":"Escuchar"},"👂");
    oreja.addEventListener("click",ev=>{ev.stopPropagation();dice([p.orden_t])});
    const caja=el("div",{class:"escena"},b,oreja);
    b.addEventListener("click",()=>{
      if(resuelto||caja.classList.contains("usada")) return;
      if(k===ord.paso){
        fila.children[ord.paso].textContent=p.e; fila.children[ord.paso].classList.add("lleno");
        anima(fila.children[ord.paso],"salta");
        caja.classList.add("usada"); b.disabled=true; oreja.disabled=true;
        sumaEstrella(); sClic();
        grid.querySelectorAll(".pistaluz").forEach(x=>x.classList.remove("pistaluz"));
        ord.paso++; errores=0; puntos();
        if(ord.paso>=PASOS.length){
          resuelto=true; sAcierto(); confeti(); const a=animo();
          aviso("dato",a,M.dato); cierra([a,M.dato],true);
        }else dice([p.orden_t]);
      }else{
        falla(k>ord.paso?FR.despues:FR.yaPaso,b);
        if(errores>=2){ const bien=grid.querySelector('.op[data-k="'+ord.paso+'"]'); if(bien) bien.classList.add("pistaluz"); }
      }
    });
    grid.append(caja);
  });
  card.append(fila,grid); zona().append(card);
  dice(pre.concat([vozOrden()]));
}
const vozOrden=()=>ord.paso===0?FR.primero:FR.yDespues;

/* ---- 🎤 ensayo general, con grabadora ---- */
let rec=null, flujo=null;
function detenGrabacion(){
  try{ if(rec&&rec.state!=="inactive") rec.stop(); }catch(e){}
  rec=null;
  if(flujo){ flujo.getTracks().forEach(t=>t.stop()); flujo=null; }
}
function rEnsayo(pre){
  const p=PASOS[idx], ultima=idx===PASOS.length-1;
  const card=el("div",{class:"tarjeta"});
  const d=diapo(p); card.append(d);
  card.append(el("p",{class:"consejo"},"💡 "+p.consejo));
  let grabacion=null;
  const estado=el("p",{class:"estado",role:"status"},"");
  const bModelo=el("button",{class:"btn agua chico","aria-label":"Escuchar el modelo",onclick:()=>reproduce(p,d)},"🔊");
  const bLento=el("button",{class:"btn agua chico","aria-label":"Escuchar lento",onclick:()=>reproduce(p,d,{lento:true})},"🐢");
  const bGrabar=el("button",{class:"btn agua"},"🎙️ Grabarme");
  const bOirme=el("button",{class:"btn agua",disabled:""},"▶️ Escucharme");
  bGrabar.addEventListener("click",async()=>{
    if(rec){ detenGrabacion(); return; }
    if(!navigator.mediaDevices||!window.MediaRecorder){ estado.textContent="Este navegador no permite grabar. Prueba en Safari actualizado."; return; }
    calla();
    try{ flujo=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ estado.textContent="No hay permiso para usar el micrófono."; return; }
    const trozos=[];
    rec=new MediaRecorder(flujo);
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) trozos.push(e.data); };
    rec.onstop=()=>{
      if(flujo){ flujo.getTracks().forEach(t=>t.stop()); flujo=null; }
      grabacion=new Blob(trozos,{type:(rec&&rec.mimeType)||"audio/mp4"}); rec=null;
      bGrabar.textContent="🎙️ Grabar otra vez"; bGrabar.classList.remove("grabando");
      bOirme.disabled=false; estado.textContent="";
      dice([FR.escuchate]);
    };
    rec.start();
    bGrabar.textContent="⏹️ Parar"; bGrabar.classList.add("grabando");
    estado.textContent="🔴 Grabando… habla ahora";
  });
  bOirme.addEventListener("click",()=>{ if(grabacion) Voz.blob(grabacion); });
  const bDije=el("button",{class:"btn ancho",id:"sig",style:"margin-top:8px"},ultima?"✅ ¡Lo dije! Terminar":"✅ ¡Lo dije! Siguiente");
  bDije.addEventListener("click",()=>{
    detenGrabacion();
    if(!resuelto){ resuelto=true; sumaEstrella(); sAcierto(); }
    siguiente();
  });
  card.append(el("div",{class:"acciones"},bModelo,bLento,bGrabar,bOirme),estado,bDije);
  zona().append(card);
  reproduce(p,d,{antes:pre}).then(r=>{ if(r==="ok") dice([p.consejo]); });
}

<script id="selva-js">
/* ==========================================================================
   SELVA v2 · comportamiento común
   1. Guarda el progreso (veces jugada y mejor puntaje) para que la portada
      muestre las estrellas ganadas. Solo en este dispositivo, sin internet.
   2. Si ya hay estrellas en la ronda, "Inicio" pregunta antes de salir.
   3. Hace saltar el contador cuando se gana una estrella.
   4. Etiqueta los botones que solo tienen un ícono.
   ========================================================================== */
(function(){
  var CLAVE = "aprendo:progreso";
  var ruta = decodeURIComponent(location.pathname).replace(/^.*?(\d+-basico\/)/, "$1");
  var $ = function(s){ return document.querySelector(s); };

  function estrellas(){
    var el = $("#puntaje, #cuenta");
    var m = el && el.textContent.match(/\d+/);
    return m ? +m[0] : 0;
  }
  function registrar(){
    var d = {};
    try{ d = JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){}
    var r = d[ruta] || { veces:0, mejor:0 };
    r.veces++;
    r.mejor = Math.max(r.mejor || 0, estrellas());
    r.ultima = new Date().toISOString().slice(0, 10);
    d[ruta] = r;
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
  }

  /* 1. fin de la actividad: pantalla #final (juegos) o #pFinal (misiones) */
  var fin = $("#final, #pFinal");
  if(fin){
    var visto = false;
    new MutationObserver(function(){
      var ve = fin.classList.contains("activa") || (fin.id === "pFinal" && !fin.hidden);
      if(ve && !visto){ visto = true; setTimeout(registrar, 400); }
      if(!ve) visto = false;
    }).observe(fin, { attributes:true, attributeFilter:["class", "hidden"] });
  }
  /* presentaciones: cuenta como vista al llegar a la última diapositiva */
  var cont = $("#contador");
  if(cont && !fin){
    var vista = false;
    new MutationObserver(function(){
      var p = cont.textContent.match(/(\d+)\s*\/\s*(\d+)/);
      if(p && p[1] === p[2] && !vista){ vista = true; registrar(); }
    }).observe(cont, { childList:true, characterData:true, subtree:true });
  }

  /* 2. confirmar antes de salir a mitad de una ronda */
  function enRonda(){
    return !!$("#juego.activa, #ensayo.activa, #pJuego:not([hidden])") && estrellas() > 0;
  }
  var dlg = null;
  function preguntarSalida(destino){
    if(!window.HTMLDialogElement){ location.href = destino; return; }
    if(!dlg){
      dlg = document.createElement("dialog");
      dlg.className = "selva-dialogo";
      dlg.innerHTML =
        '<div class="selva-dialogo-emo" aria-hidden="true">🏠</div>' +
        '<h2>¿Quieres salir?</h2>' +
        '<p>Si sales ahora, se pierden las estrellas de esta ronda.</p>' +
        '<button class="selva-seguir" value="seguir">▶️ Seguir jugando</button>' +
        '<button class="selva-salir" value="salir">Salir</button>';
      dlg.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        dlg.close();
        if(b.value === "salir") location.href = dlg.dataset.destino;
      });
      document.body.appendChild(dlg);
    }
    dlg.dataset.destino = destino;
    dlg.showModal();
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance("¿Quieres salir? Si sales ahora, se pierden las estrellas de esta ronda.");
        u.lang = "es-ES"; speechSynthesis.speak(u);
      }
    }catch(e){}
    dlg.querySelector(".selva-seguir").focus();
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href$="index.html"]');
    if(!a || !enRonda()) return;
    e.preventDefault();
    preguntarSalida(a.href);
  }, true);

  /* 3. el contador salta al ganar una estrella */
  var pts = $("#puntaje");
  if(pts){
    var antes = estrellas();
    new MutationObserver(function(){
      var ahora = estrellas();
      if(ahora > antes){
        pts.classList.remove("salta"); void pts.offsetWidth; pts.classList.add("salta");
      }
      antes = ahora;
    }).observe(pts, { childList:true, characterData:true, subtree:true });
  }

  /* 4. etiquetas para lectores de pantalla */
  var nombres = { btnGeneral:"Ver todas las diapositivas", btnPantalla:"Pantalla completa", btnVoz:"Voz", sonido:"Voz y sonidos" };
  Object.keys(nombres).forEach(function(id){
    var b = document.getElementById(id);
    if(b && !b.getAttribute("aria-label") && !/[a-záéíóú]{3}/i.test(b.textContent)) b.setAttribute("aria-label", nombres[id]);
  });
  /* el iPhone no permite pantalla completa en páginas web: se oculta el botón */
  var d = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) d.classList.add("selva-sin-pantalla-completa");
})();
</script>
