<!DOCTYPE html>
<html lang="es-CL">
<!--
  Flora y fauna de Chile · Presentación para proyector
  Aprendo en casa · 1° Básico · Ciencias Naturales

  Archivo único autocontenido: CSS y JS inline, sin librerías ni CDNs.
  Dependencias locales: imágenes de img-flora-fauna/ y voz natural de audio/flora-fauna/.

  CÓMO FUNCIONA
  · Lienzo fijo de 1600x900 (16:9) que se escala completo, como una diapositiva.
  · Se avanza tocando la mitad derecha (o ›, flechas, espacio). Atrás: mitad izquierda.
  · ▦ todas las diapositivas · ⛶ pantalla completa · 📝 guion (apagado al presentar)
  · 🔊 lee la diapositiva y marca lo que va nombrando, como el puntero.
  · ⬇️ PowerPoint descarga flora-fauna-presentacion.pptx (lo arma
    herramientas/generar-pptx-flora-fauna.py con las mismas imágenes y textos).

  IMÁGENES: img-flora-fauna/ junto a este archivo (.jpg, .jpeg, .png o .webp).
    portada copihue pudu no-arrancar sin-basura gracias
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCFCFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>Flora y fauna de Chile · Presentación</title>
<style>
/* tokens y componentes comunes: bloque generado más abajo (diseno/) */
:root{--W:1600; --H:900}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;display:flex;flex-direction:column;font-family:var(--font-ui)}

/* ============ barra superior ============ */
.barra{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;z-index:20}
.grupo{display:flex;gap:6px;align-items:center}
.contador{font:500 var(--fs-meta)/1 var(--font-mono);color:var(--text-secondary);white-space:nowrap}

/* ============ escenario y lienzo ============ */
.escenario{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:var(--bg-wash)}
.zona{position:absolute;top:0;bottom:0;width:24%;border:none;background:transparent;cursor:pointer;z-index:15}
.zona.izq{left:0}
.zona.der{right:0}
/* la diapositiva siempre es clara, como en el PowerPoint: se proyecta igual en modo oscuro */
.lienzo{
  width:1600px;height:900px;flex:0 0 auto;position:relative;overflow:hidden;
  transform-origin:center center;background:#FFFFFF;color:#191919;
  border:1px solid var(--border-primary);border-radius:var(--r-lg);box-shadow:var(--shadow-L3);
}

/* ============ diapositivas ============ */
.diapo{position:absolute;inset:0;opacity:0;pointer-events:none;background:#FFFFFF;transition:opacity .16s ease-out}
.diapo.activa{opacity:1;pointer-events:auto;z-index:2}
.pagina{position:absolute;right:56px;bottom:26px;font:500 22px/1 var(--font-mono);color:rgba(25,25,25,.40);z-index:6}
.progreso{position:absolute;left:0;bottom:0;height:4px;background:#317CFF;z-index:8;transition:width .16s ease-out}

.cuadro{border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,.08);background:#F8F8F8;position:relative;display:flex;align-items:center;justify-content:center}
.cuadro .emo{font-size:150px;line-height:1}
.cuadro img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* --- portada, fichas y cierre: texto + imagen cuadrada --- */
.d-duo{height:100%;display:grid;grid-template-columns:1fr 900px;gap:0}
.d-duo .txt{display:flex;flex-direction:column;justify-content:center;padding:0 40px 0 88px}
.d-duo>.cuadro{border-radius:0;border:0;border-left:1px solid rgba(0,0,0,.08);height:100%;transition:box-shadow .14s ease-out}
.d-duo>.cuadro .emo{font-size:260px}
.d-duo>.cuadro.senala{box-shadow:inset 0 0 0 10px #317CFF}
.d-duo>.cuadro.senala::after{content:"👈";position:absolute;left:40px;top:50%;transform:translateY(-50%);font-size:120px;line-height:1}
.eyebrow{font:500 28px/1.2 var(--font-ui);color:rgba(25,25,25,.56);margin:0 0 18px}
.chip-grupo{align-self:flex-start;font:500 30px/1 var(--font-ui);padding:14px 20px;border:1px solid rgba(0,0,0,.08);border-radius:999px;color:#191919;background:#FFF;margin:0 0 22px}
.d-duo h1{font:500 104px/1.02 var(--font-ui);letter-spacing:-.03em;color:#000;margin:0 0 32px}
.d-duo h2{font:500 150px/1 var(--font-ui);letter-spacing:-.03em;color:#000;margin:0 0 36px}
.d-duo h2.chico{font-size:96px;line-height:1.06;margin:0}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chips span{font:500 32px/1 var(--font-ui);padding:14px 20px;border:1px solid rgba(0,0,0,.08);border-radius:999px;color:#191919;background:#FFF}
.rasgos{display:flex;flex-direction:column;gap:16px}
.rasgo{
  position:relative;display:flex;align-items:center;gap:22px;padding:20px 24px;border:1px solid rgba(0,0,0,.08);border-radius:20px;
  background:#FFF;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);font:500 40px/1.15 var(--font-ui);color:#191919;
  transition:box-shadow .14s ease-out,border-color .14s ease-out;
}
.rasgo .e{font-size:58px;line-height:1;flex:none}
.rasgo.senala{border-color:#317CFF;box-shadow:0 0 0 8px rgba(51,125,244,.25)}

/* --- cómo los cuidamos: dos acciones con foto para señalar --- */
.d-cuidado{height:100%;padding:52px 64px 84px;display:flex;flex-direction:column}
.d-cuidado .cabeza{display:flex;align-items:center;gap:28px;margin:0 0 36px}
.d-cuidado .cabeza .e{font-size:110px;line-height:1}
.d-cuidado h2{font:500 104px/1 var(--font-ui);letter-spacing:-.03em;color:#000;margin:0;border-radius:12px}
.par{display:grid;grid-template-columns:repeat(2,632px);gap:48px;justify-content:center;flex:1;align-items:start}
.accion{border:1px solid rgba(0,0,0,.08);border-radius:20px;overflow:hidden;background:#FFF;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);position:relative;transition:box-shadow .14s ease-out,border-color .14s ease-out}
.accion .cuadro{border:0;border-radius:0;height:474px;border-bottom:1px solid rgba(0,0,0,.08)}
.accion b{display:flex;align-items:center;justify-content:center;gap:18px;height:100px;padding:0 16px;text-align:center;font:500 42px/1.05 var(--font-ui);color:#000}
.accion b i{font-style:normal;font:500 30px/1 var(--font-mono);width:52px;height:52px;border-radius:999px;border:1px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;flex:none;color:rgba(25,25,25,.56)}
.accion.senala{border-color:#317CFF;box-shadow:0 0 0 8px rgba(51,125,244,.25)}
.accion.senala::after{content:"👆";position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-size:90px;line-height:1}

/* ============ vista general ============ */
.general{position:fixed;inset:0;background:var(--bg-page);z-index:60;display:none;flex-direction:column;padding:16px 20px}
.general.abierta{display:flex}
.general-tope{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--border-primary)}
.general h3{font:500 var(--fs-label)/1.3 var(--font-ui);color:var(--text-primary);margin:0;flex:1}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:auto;flex:1;align-content:start}
.mini-diapo{
  background:var(--bg-elevated);border:1px solid var(--border-primary);border-radius:var(--r-sm);overflow:hidden;
  box-shadow:var(--shadow-L1);cursor:pointer;padding:0;display:flex;flex-direction:column;text-align:left;color:var(--text-primary);
  transition:border-color var(--t-rapida);
}
.mini-diapo:hover{border-color:var(--border-hover)}
.mini-diapo.ahora{border-color:var(--accent)}
.mini-diapo .cuadro{border-radius:0;border:0;aspect-ratio:16/10}
.mini-diapo .cuadro .emo{font-size:48px}
.mini-diapo span.t{padding:8px 10px;font:500 var(--fs-meta)/1.3 var(--font-ui)}
.mini-diapo span.t b{font-family:var(--font-mono);font-weight:500;color:var(--text-secondary);margin-right:6px}

/* ============ guion y pie ============ */
.guion{flex:0 0 auto;background:var(--bg-wash);border-top:1px solid var(--border-primary);padding:10px 16px;font-size:var(--fs-body);line-height:1.4;display:none;z-index:20;color:var(--text-primary)}
.guion.visible{display:block}
.guion .tip{display:block;font-size:var(--fs-meta);color:var(--text-secondary)}
.pie{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 12px 14px;flex:0 0 auto;z-index:20}
.nav{
  width:72px;height:var(--toque-respuesta);border-radius:var(--r-sm);cursor:pointer;
  background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);
  display:flex;align-items:center;justify-content:center;font:400 2rem/1 var(--font-ui);
  transition:background var(--t-rapida),opacity var(--t-rapida);
}
.nav:hover{background:var(--tint-strong)}
.nav.sol{background:var(--button-neutral);color:var(--button-neutral-text);border-color:transparent;box-shadow:none}
.nav.sol:hover{opacity:.9}
.nav[disabled]{opacity:.35;cursor:default}
.puntos{display:flex;gap:8px;align-items:center}
.puntos i{width:8px;height:8px;border-radius:9999px;background:var(--tint-strong);display:block;transition:background var(--t-rapida)}
.puntos i.ahora{background:var(--accent)}

.gira{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:18;
  background:var(--bg-elevated);color:var(--text-secondary);border:1px solid var(--border-primary);box-shadow:var(--shadow-L3);
  font:500 var(--fs-meta)/1 var(--font-ui);border-radius:var(--r-pill);padding:10px 16px;white-space:nowrap}
@media (orientation:portrait) and (max-width:820px){ .gira{display:block} }
@media (max-width:700px){
  .solo-ancho{display:none}
  .nav{width:64px;height:var(--toque)}
  .mini-grid{grid-template-columns:repeat(2,1fr)}
}

/* ============ impresión / PDF ============ */
@media print{
  @page{size:landscape;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  .barra,.pie,.guion,.zona,.general,.gira{display:none !important}
  .escenario{display:block;overflow:visible}
  .lienzo{transform:none !important;border:0;border-radius:0;box-shadow:none;width:1600px;height:auto;overflow:visible;display:block}
  .diapo{position:relative;inset:auto;opacity:1 !important;display:block;width:1600px;height:900px;overflow:hidden;page-break-after:always;break-after:page}
  .diapo:last-of-type{page-break-after:auto;break-after:auto}
  .progreso{display:none}
}
</style>

  "filas":[{"marca":"c1","e":"🔔","rotulo":"Flores rojas con forma de campanita"},{"marca":"c2","e":"⭐","rotulo":"Flor nacional de Chile"}],

 {"tipo":"ficha","id":"pudu","e":"🦌","img":"pudu","grupo":"🐾 Animal de Chile","rotulo":"Pudú","orden_t":"El animal",
  "filas":[{"marca":"c1","e":"🐕","rotulo":"Pequeñito, del tamaño de un perrito"},{"marca":"c2","e":"🌎","rotulo":"El ciervo más pequeño del mundo"}],
  "partes":[{"t":"Este animal es el pudú.","marca":"nombre"},{"t":"Es pequeñito, del tamaño de un perrito.","marca":"c1"},{"t":"Es el ciervo más pequeño del mundo.","marca":"c2"}],
  "consejo":"Señala la foto del pudú. Habla fuerte, para que te escuchen hasta atrás."},
 {"tipo":"cuidado","id":"cuidar","e":"💚","rotulo":"¿Cómo los cuidamos?","orden_t":"Cómo los cuidamos",

  "partes":[{"t":"Para cuidarlos:","marca":"titulo"},{"t":"Uno: no arrancar las flores.","marca":"a1"},{"t":"Dos: no dejar basura en el bosque.","marca":"a2"}],
  "consejo":"Muestra un dedo y después dos: así no se te olvida ninguna de las dos acciones."},
 {"tipo":"cierre","id":"gracias","e":"💛","img":"gracias","rotulo":"¡Muchas gracias!","orden_t":"Las gracias",

<script>
"use strict";
const DATOS=JSON.parse(document.getElementById("datos").textContent);
const DIAPOS=DATOS.diapos;
const $=id=>document.getElementById(id);
function el(tag,attrs,...hijos){
  const n=document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==="class") n.className=attrs[k];
    else if(attrs[k]!==null&&attrs[k]!==undefined) n.setAttribute(k,attrs[k]);
  }
  for(const h of hijos){ if(h===null||h===undefined) continue; n.append(h.nodeType?h:document.createTextNode(h)); }
  return n;
}
const espera=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ imágenes: img-flora-fauna/ o emoji de respaldo ============ */
const CARPETA="img-flora-fauna/", EXT=[".jpg",".jpeg",".png",".webp"], rutas={};
function ruta(id){
  if(!rutas[id]) rutas[id]=new Promise(res=>{
    (function prueba(k){
      if(k>=EXT.length){ res(null); return; }
      const im=new Image(); im.onload=()=>res(CARPETA+id+EXT[k]); im.onerror=()=>prueba(k+1); im.src=CARPETA+id+EXT[k];
    })(0);
  });
  return rutas[id];
}
function cuadro(id,emoji,attrs){
  const c=el("div",Object.assign({class:"cuadro"},attrs||{}),el("span",{class:"emo","aria-hidden":"true"},emoji));
  ruta(id).then(u=>{ if(u) c.append(el("img",{src:u,alt:""})); });
  return c;
}

/* ============ voz natural (audio/flora-fauna/), con respaldo del dispositivo ============ */
const Voz=(()=>{
  const DIR=DATOS.audio, au=new Audio(); au.preload="auto";
  let turno=0, vozES=null; const clips=new Map();
  function limpia(t){ return String(t).normalize("NFC").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}«»]/gu,"").replace(/\s+/g," ").trim(); }
  function huella(t){ let h=0x811c9dc5; for(const b of new TextEncoder().encode(t)){ h^=b; h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); }
  function clip(t){
    const h=huella(t);
    if(!clips.has(h)) clips.set(h,fetch(DIR+h+".mp3").then(r=>r.ok?r.blob():null).then(b=>b&&b.size>0?URL.createObjectURL(b):null).catch(()=>null));
    return clips.get(h);
  }
  function parar(){ try{au.pause()}catch(e){} try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
  function toca(url,mio){
    return new Promise(res=>{
      let fin=false;
      const acaba=r=>{ if(fin) return; fin=true; clearInterval(vig); au.onended=au.onerror=null; res(r); };
      au.onended=()=>acaba("ok"); au.onerror=()=>acaba("error"); au.src=url;
      try{ const p=au.play(); if(p&&p.catch) p.catch(()=>acaba("error")); }catch(e){ acaba("error"); }
      const vig=setInterval(()=>{ if(mio!==turno){ try{au.pause()}catch(e){} acaba("reemplazada"); } },150);
    });
  }
  function eligeVoz(){
    if(!("speechSynthesis" in window)) return;
    const vs=speechSynthesis.getVoices(), lang=v=>v.lang.replace("_","-").toLowerCase();
    for(const p of ["es-cl","es-419","es-mx","es-us","es-es","es"]){ const v=vs.find(v=>lang(v).startsWith(p)); if(v){vozES=v;return;} }
  }
  if("speechSynthesis" in window){ eligeVoz(); speechSynthesis.onvoiceschanged=eligeVoz; }
  function sintetiza(t,mio){
    return new Promise(res=>{
      if(!("speechSynthesis" in window)){ res("ok"); return; }
      const u=new SpeechSynthesisUtterance(t); u.lang=vozES?vozES.lang:"es-CL"; if(vozES) u.voice=vozES; u.rate=.9;
      let fin=false; const acaba=r=>{ if(fin) return; fin=true; clearInterval(vig); res(r); };
      u.onend=()=>acaba("ok"); u.onerror=()=>acaba("ok");
      speechSynthesis.speak(u);
      const vig=setInterval(()=>{ if(mio!==turno) acaba("reemplazada"); },150);
      setTimeout(()=>acaba("ok"),1500+t.length*80);
    });
  }
  /* partes: [{t, marca} | {pausa, marca}] · alParte(marca) ilumina lo que se está diciendo */
  async function decir(partes,alParte){
    const mio=++turno; parar();
    partes.forEach(p=>{ if(p.t) clip(limpia(p.t)); });
    for(const p of partes){
      if(mio!==turno) return;
      alParte(p.marca);
      if(p.pausa){ await espera(p.pausa); continue; }
      const t=limpia(p.t), url=await clip(t);
      if(mio!==turno) return;
      let r=url?await toca(url,mio):"error";
      if(r==="error") r=await sintetiza(t,mio);
      if(r!=="ok") return;
      await espera(170);
    }
    if(mio===turno) alParte(null);
  }
  return { decir, calla(){ turno++; parar(); } };
})();

/* ============ diapositivas ============ */
let actual=0, vozOn=false, guionOn=false;
function armar(d,n){
  const s=el("section",{class:"diapo tipo-"+d.tipo,id:"diapo"+n});
  if(d.tipo==="portada"){
    s.append(el("div",{class:"d-duo"},
      el("div",{class:"txt"},
        el("p",{class:"eyebrow"},"Ciencias Naturales · 1° Básico"),
        el("h1",{},"Flora y fauna de Chile"),
        el("div",{class:"chips"},el("span",{},"🌺 Copihue"),el("span",{},"🦌 Pudú"))),
      cuadro(d.img,"🌿")));
  }else if(d.tipo==="ficha"){
    const r=el("div",{class:"rasgos"});
    d.filas.forEach(f=>r.append(el("div",{class:"rasgo","data-marca":f.marca},el("span",{class:"e","aria-hidden":"true"},f.e),el("span",{},f.rotulo))));
    s.append(el("div",{class:"d-duo"},
      el("div",{class:"txt"},el("span",{class:"chip-grupo"},d.grupo),el("h2",{},d.rotulo),r),
      cuadro(d.img,d.e,{"data-marca":"nombre"})));
  }else if(d.tipo==="cuidado"){
    const par=el("div",{class:"par"});
    d.acciones.forEach((a,k)=>par.append(el("div",{class:"accion","data-marca":a.marca},cuadro(a.img,a.e),el("b",{},el("i",{},String(k+1)),a.rotulo))));
    s.append(el("div",{class:"d-cuidado"},
      el("div",{class:"cabeza"},el("span",{class:"e","aria-hidden":"true"},d.e),el("h2",{},d.rotulo)),
      par));
  }else{
    s.append(el("div",{class:"d-duo"},
      el("div",{class:"txt"},el("h2",{class:"chico","data-marca":"0"},d.rotulo)),
      cuadro(d.img,d.e)));
  }
  s.append(el("div",{class:"pagina"},String(n+1)));
  return s;
}
const guionDe=d=>d.partes.map(x=>x.pausa?"___.":x.t).join(" ");
function leer(){
  const sec=$("diapo"+actual);
  Voz.decir(DIAPOS[actual].partes,marca=>{
    sec.querySelectorAll(".senala").forEach(n=>n.classList.remove("senala"));
    if(marca!==null&&marca!==undefined) sec.querySelectorAll('[data-marca="'+marca+'"]').forEach(n=>n.classList.add("senala"));
  });
}
function limpiaMarcas(){ document.querySelectorAll(".senala").forEach(n=>n.classList.remove("senala")); }

function ajustar(){
  const c=$("escenario"), l=$("lienzo");
  const s=Math.min((c.clientWidth-16)/1600,(c.clientHeight-16)/900);
  l.style.transform="scale("+Math.max(s,.05)+")";
}
addEventListener("resize",ajustar);
addEventListener("orientationchange",()=>setTimeout(ajustar,250));

function construir(){
  const l=$("lienzo");
  DIAPOS.forEach((d,i)=>l.append(armar(d,i)));
  l.append(el("div",{class:"progreso",id:"progreso"}));
}
function mostrar(){
  Voz.calla(); limpiaMarcas();
  DIAPOS.forEach((_,i)=>$("diapo"+i).classList.toggle("activa",i===actual));
  const d=DIAPOS[actual];
  $("contador").textContent=(actual+1)+" / "+DIAPOS.length;
  const g=$("guion"); g.textContent="";
  g.append(el("b",{},"Digo: "),guionDe(d),el("span",{class:"tip"},"💡 "+d.consejo));
  $("progreso").style.width=((actual+1)/DIAPOS.length*100)+"%";
  $("btnAtras").disabled=actual===0;
  $("btnSig").disabled=actual===DIAPOS.length-1;
  const p=$("puntos"); p.textContent="";
  DIAPOS.forEach((_,k)=>p.append(el("i",{class:k===actual?"ahora":""})));
  document.querySelectorAll(".mini-diapo").forEach((b,k)=>b.classList.toggle("ahora",k===actual));
  if(vozOn) leer();
}
function ir(n){
  const nuevo=Math.min(DIAPOS.length-1,Math.max(0,n));
  if(nuevo===actual) return;
  actual=nuevo; mostrar();
}
function armarGeneral(){
  const g=$("miniGrid");
  DIAPOS.forEach((d,i)=>{
    const img=d.img||(d.acciones&&d.acciones[0].img);
    const b=el("button",{class:"mini-diapo"},cuadro(img,d.e),el("span",{class:"t"},el("b",{},String(i+1)),d.tipo==="portada"?"Flora y fauna de Chile":d.rotulo));
    b.addEventListener("click",()=>{ ir(i); $("general").classList.remove("abierta"); });
    g.append(b);
  });
}

$("btnSig").onclick=()=>ir(actual+1);
$("btnAtras").onclick=()=>ir(actual-1);
$("zonaDer").onclick=()=>ir(actual+1);
$("zonaIzq").onclick=()=>ir(actual-1);
$("btnGeneral").onclick=()=>$("general").classList.add("abierta");
$("btnCerrarGeneral").onclick=()=>$("general").classList.remove("abierta");
$("general").onclick=e=>{ if(e.target===$("general")) $("general").classList.remove("abierta"); };
$("btnVoz").onclick=function(){
  vozOn=!vozOn;
  this.setAttribute("aria-pressed",String(vozOn));
  this.textContent=""; this.append(vozOn?"🔊":"🔇",el("span",{class:"solo-ancho"}," Leer"));
  if(vozOn) leer(); else{ Voz.calla(); limpiaMarcas(); }
};
$("btnGuion").onclick=function(){
  guionOn=!guionOn; this.setAttribute("aria-pressed",String(guionOn));
  $("guion").classList.toggle("visible",guionOn); setTimeout(ajustar,40);
};
$("btnPantalla").onclick=function(){
  const r=document.documentElement;
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else (r.requestFullscreen||r.webkitRequestFullscreen).call(r);
  }catch(e){}
  setTimeout(ajustar,300);
};
document.addEventListener("fullscreenchange",()=>setTimeout(ajustar,120));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ $("general").classList.toggle("abierta"); e.preventDefault(); return; }
  if($("general").classList.contains("abierta")) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); ir(actual+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); ir(actual-1); }
  if(e.key==="Home") ir(0);
  if(e.key==="End") ir(DIAPOS.length-1);
});

construir();
armarGeneral();
ajustar();
mostrar();
</script>

<script id="selva-js">
/* ==========================================================================
   SELVA v2 · comportamiento común
   1. Guarda el progreso (veces jugada y mejor puntaje) para que la portada
      muestre las estrellas ganadas. Solo en este dispositivo, sin internet.
   2. Si ya hay estrellas en la ronda, "Inicio" pregunta antes de salir.
   3. Hace saltar el contador cuando se gana una estrella.
   4. Etiqueta los botones que solo tienen un ícono.
   ========================================================================== */
(function(){
  var CLAVE = "aprendo:progreso";
  var ruta = decodeURIComponent(location.pathname).replace(/^.*?(\d+-basico\/)/, "$1");
  var $ = function(s){ return document.querySelector(s); };

  function estrellas(){
    var el = $("#puntaje, #cuenta");
    var m = el && el.textContent.match(/\d+/);
    return m ? +m[0] : 0;
  }
  function registrar(){
    var d = {};
    try{ d = JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){}
    var r = d[ruta] || { veces:0, mejor:0 };
    r.veces++;
    r.mejor = Math.max(r.mejor || 0, estrellas());
    r.ultima = new Date().toISOString().slice(0, 10);
    d[ruta] = r;
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
  }

  /* 1. fin de la actividad: pantalla #final (juegos) o #pFinal (misiones) */
  var fin = $("#final, #pFinal");
  if(fin){
    var visto = false;
    new MutationObserver(function(){
      var ve = fin.classList.contains("activa") || (fin.id === "pFinal" && !fin.hidden);
      if(ve && !visto){ visto = true; setTimeout(registrar, 400); }
      if(!ve) visto = false;
    }).observe(fin, { attributes:true, attributeFilter:["class", "hidden"] });
  }
  /* presentaciones: cuenta como vista al llegar a la última diapositiva */
  var cont = $("#contador");
  if(cont && !fin){
    var vista = false;
    new MutationObserver(function(){
      var p = cont.textContent.match(/(\d+)\s*\/\s*(\d+)/);
      if(p && p[1] === p[2] && !vista){ vista = true; registrar(); }
    }).observe(cont, { childList:true, characterData:true, subtree:true });
  }

  /* 2. confirmar antes de salir a mitad de una ronda */
  function enRonda(){
    return !!$("#juego.activa, #ensayo.activa, #pJuego:not([hidden])") && estrellas() > 0;
  }
  var dlg = null;
  function preguntarSalida(destino){
    if(!window.HTMLDialogElement){ location.href = destino; return; }
    if(!dlg){
      dlg = document.createElement("dialog");
      dlg.className = "selva-dialogo";
      dlg.innerHTML =
        '<div class="selva-dialogo-emo" aria-hidden="true">🏠</div>' +
        '<h2>¿Quieres salir?</h2>' +
        '<p>Si sales ahora, se pierden las estrellas de esta ronda.</p>' +
        '<button class="selva-seguir" value="seguir">▶️ Seguir jugando</button>' +
        '<button class="selva-salir" value="salir">Salir</button>';
      dlg.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        dlg.close();
        if(b.value === "salir") location.href = dlg.dataset.destino;
      });
      document.body.appendChild(dlg);
    }
    dlg.dataset.destino = destino;
    dlg.showModal();
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance("¿Quieres salir? Si sales ahora, se pierden las estrellas de esta ronda.");
        u.lang = "es-ES"; speechSynthesis.speak(u);
      }
    }catch(e){}
    dlg.querySelector(".selva-seguir").focus();
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href$="index.html"]');
    if(!a || !enRonda()) return;
    e.preventDefault();
    preguntarSalida(a.href);
  }, true);

  /* 3. el contador salta al ganar una estrella */
  var pts = $("#puntaje");
  if(pts){
    var antes = estrellas();
    new MutationObserver(function(){
      var ahora = estrellas();
      if(ahora > antes){
        pts.classList.remove("salta"); void pts.offsetWidth; pts.classList.add("salta");
      }
      antes = ahora;
    }).observe(pts, { childList:true, characterData:true, subtree:true });
  }

  /* 4. etiquetas para lectores de pantalla */
  var nombres = { btnGeneral:"Ver todas las diapositivas", btnPantalla:"Pantalla completa", btnVoz:"Voz", sonido:"Voz y sonidos" };
  Object.keys(nombres).forEach(function(id){
    var b = document.getElementById(id);
    if(b && !b.getAttribute("aria-label") && !/[a-záéíóú]{3}/i.test(b.textContent)) b.setAttribute("aria-label", nombres[id]);
  });
  /* el iPhone no permite pantalla completa en páginas web: se oculta el botón */
  var d = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) d.classList.add("selva-sin-pantalla-completa");
})();
</script>
