:root{
  --selva:#0E3B2E; --tarjeta:#17513E; --crema:#FFF6E5;
  --sol:#FFC93C; --coral:#FF6B5A; --agua:#3FC1E0; --hoja:#7ED957;
  --sombra:#082419;
  --tit:"Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --txt:"Nunito", ui-rounded, -apple-system, system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--selva);color:var(--crema);font-family:var(--txt);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.marco{max-width:540px;margin:0 auto;padding:10px 14px 32px}
:focus-visible{outline:4px solid var(--sol);outline-offset:3px}
[hidden]{display:none!important}

/* barra */
.barra{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.barra .esp{flex:1}
.chip{font-family:var(--tit);font-weight:800;font-size:1.05rem;border:0;border-radius:18px;
  padding:8px 14px;min-height:48px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  background:var(--tarjeta);color:var(--crema);box-shadow:0 4px 0 var(--sombra);cursor:pointer;touch-action:manipulation}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sombra)}
.contador{background:var(--sol);color:var(--selva);box-shadow:0 4px 0 #b3861b}

/* botones */
.btn{font-family:var(--tit);font-weight:800;font-size:1.25rem;border:0;border-radius:24px;padding:12px 22px;min-height:60px;
  background:var(--sol);color:var(--selva);box-shadow:0 6px 0 #b3861b;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b3861b}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 6px 0 #b8453a}
.btn.agua{background:var(--agua);color:var(--selva);box-shadow:0 6px 0 #1f8aa3}
.btn.hoja{background:var(--hoja);color:var(--selva);box-shadow:0 6px 0 #4c9a2f}
.btn.ancho{width:100%}

/* frazada tejida: el sello visual de esta actividad (la colcha a crochet del libro) */
.granny{--c1:var(--coral);--c2:var(--sol);--c3:var(--agua);
  background:
   radial-gradient(circle at 50% 50%, var(--c1) 0 16%, transparent 17%),
   conic-gradient(from 45deg at 50% 50%, var(--c2) 0 25%, var(--c3) 0 50%, var(--c2) 0 75%, var(--c3) 0),
   #2a2a3a;
}
.cinta{height:34px;border-radius:14px;margin:4px 0 14px;
  background-image:
   radial-gradient(circle, var(--coral) 0 5px, transparent 6px),
   radial-gradient(circle, var(--sol) 0 10px, transparent 11px),
   radial-gradient(circle, var(--agua) 0 14px, transparent 15px),
   linear-gradient(#3a3350,#3a3350);
  background-size:34px 34px;background-position:center;border:3px solid #3a3350}

/* portada */
.portada h1{font-family:var(--tit);font-weight:800;font-size:clamp(2.4rem,11vw,3.4rem);line-height:.95;margin:6px 0 4px;color:var(--crema)}
.portada .sub{font-size:1.15rem;margin:0 0 12px;opacity:.95}
.leer{display:flex;gap:10px;margin-bottom:16px}
.frazada{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-radius:26px;background:#3a3350;box-shadow:0 8px 0 #231e33}
.cuadro{position:relative;border:0;border-radius:18px;min-height:132px;padding:12px 8px 10px;cursor:pointer;touch-action:manipulation;
  background:var(--crema);color:var(--selva);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 5px 0 #c9b99a;text-align:center}
.cuadro:active{transform:translateY(3px);box-shadow:0 2px 0 #c9b99a}
.cuadro .emo{font-size:2.8rem;line-height:1}
.cuadro .nom,.cuadro .est{display:block}
.cuadro .nom{font-family:var(--tit);font-weight:800;font-size:1.12rem;line-height:1.05}
.cuadro .est{font-size:.95rem;font-weight:700;opacity:.8}
.cuadro.tejido{background:
   radial-gradient(circle at 50% 42%, var(--crema) 0 30%, transparent 31%),
   conic-gradient(from 45deg, var(--sol) 0 25%, var(--agua) 0 50%, var(--coral) 0 75%, var(--hoja) 0);
  box-shadow:0 5px 0 #231e33}
.cuadro.tejido .nom{background:var(--crema);border-radius:10px;padding:0 8px;margin-bottom:3px}
.cuadro.tejido .est{opacity:1;background:var(--selva);color:var(--sol);border-radius:10px;padding:0 8px}
.cuadro.largo{grid-column:1 / -1;min-height:110px;flex-direction:row;gap:12px}
.trofeo{margin:16px 0 0;padding:16px;border-radius:24px;background:var(--sol);color:var(--selva);text-align:center}
.trofeo .emo{font-size:3.4rem}
.trofeo h2{font-family:var(--tit);margin:0;font-size:1.6rem;line-height:1.1}
.pie{margin-top:18px;font-size:.95rem;opacity:.75;text-align:center}
.linkbtn{background:none;border:0;color:var(--crema);text-decoration:underline;font-size:.95rem;cursor:pointer;min-height:44px}

/* juego */
.cabeza{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cabeza h2{font-family:var(--tit);font-size:1.35rem;margin:0;line-height:1.1;flex:1}
.puntos{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.puntos i{width:16px;height:16px;border-radius:50%;background:var(--tarjeta);display:block;border:2px solid #2d6e56}
.puntos i.ok{background:var(--hoja);border-color:var(--hoja)}
.puntos i.ya{background:var(--sol);border-color:var(--sol)}
.tarjeta{background:var(--tarjeta);border-radius:28px;padding:16px;box-shadow:0 6px 0 var(--sombra)}
.pregunta{display:flex;gap:12px;align-items:center}
.pregunta .grande{font-size:3.6rem;line-height:1;flex:none}
.pregunta p{font-size:1.3rem;font-weight:800;margin:0;line-height:1.25}
.oir{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--agua);font-size:1.6rem;box-shadow:0 4px 0 #1f8aa3;cursor:pointer}
.oir:active{transform:translateY(3px);box-shadow:0 1px 0 #1f8aa3}
.opciones{display:grid;gap:10px;margin-top:14px}
.op{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;border:0;border-radius:22px;padding:10px 14px;text-align:left;
  background:var(--crema);color:var(--selva);font-weight:800;font-size:1.2rem;box-shadow:0 5px 0 #c9b99a;cursor:pointer;touch-action:manipulation}
.op:active{transform:translateY(3px);box-shadow:0 2px 0 #c9b99a}
.op .e{font-size:2.3rem;line-height:1;flex:none;width:48px;text-align:center}
.op.solo{justify-content:center;text-align:center;font-family:var(--tit);font-size:1.35rem}
.op.bien{background:var(--hoja)}
.op.no{opacity:.4;text-decoration:line-through;cursor:default}
.op.pistaluz{box-shadow:0 0 0 5px var(--sol),0 5px 0 #c9b99a}
.vf{grid-template-columns:1fr 1fr}
.vf .op{flex-direction:column;justify-content:center;text-align:center;min-height:110px;font-family:var(--tit)}
.vf .op .e{font-size:2.8rem;width:auto}

.aviso{margin-top:14px;border-radius:22px;padding:12px 14px;font-weight:800;font-size:1.15rem;line-height:1.3}
.aviso.dato{background:var(--crema);color:var(--selva);border:4px solid var(--hoja)}
.aviso.dato b{display:block;font-family:var(--tit);font-size:1.4rem;color:#2c7a1a}
.aviso.casi{background:#fff0d6;color:#7a3b00;border:4px solid var(--sol)}
.acciones{display:flex;gap:10px;margin-top:14px}
.acciones .btn{flex:1}

/* sílabas */
.huecos{display:flex;justify-content:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.hueco{min-width:70px;height:66px;border-radius:18px;border:3px dashed var(--crema);display:flex;align-items:center;justify-content:center;
  font-family:var(--tit);font-weight:800;font-size:1.9rem;padding:0 8px}
.hueco.lleno{border-style:solid;background:var(--crema);color:var(--selva)}
.banco{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.sil{min-width:86px;min-height:70px;border:0;border-radius:20px;background:var(--sol);color:var(--selva);font-family:var(--tit);font-weight:800;font-size:1.9rem;
  box-shadow:0 5px 0 #b3861b;cursor:pointer;touch-action:manipulation}
.sil:active{transform:translateY(3px);box-shadow:0 2px 0 #b3861b}
.sil:disabled{opacity:.25;cursor:default}

/* orden */
.fila{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:4px 0 12px}
.fila span{aspect-ratio:1;border-radius:12px;border:2px dashed #5d9a83;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:#9cc9b5}
.fila span.lleno{border:0;background:var(--crema);font-size:1.5rem}
.escenas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.escena{position:relative}
.escena .op{flex-direction:column;justify-content:center;text-align:center;min-height:132px;font-size:1.02rem;line-height:1.2;padding:10px 8px 12px}
.escena .op .e{font-size:2.6rem;width:auto}
.escena .mini{position:absolute;top:-6px;right:-6px;width:44px;height:44px;border-radius:50%;border:0;background:var(--agua);font-size:1.2rem;box-shadow:0 3px 0 #1f8aa3;cursor:pointer}
.escena.usada{visibility:hidden}

/* final */
.final{text-align:center}
.final .lamina{font-size:6rem;line-height:1;margin:8px auto;width:150px;height:150px;border-radius:28px;display:flex;align-items:center;justify-content:center}
.final h2{font-family:var(--tit);font-size:2rem;margin:10px 0 4px}
.final .estrellas{font-size:1.8rem;letter-spacing:2px;margin:6px 0 14px;word-break:break-all}
.final .btn{margin-top:10px}

/* animaciones */
@keyframes sacude{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes salta{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.sacude{animation:sacude .35s}
.salta{animation:salta .45s}
.confeti{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;z-index:9;animation:cae 1.6s linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .confeti{display:none}
}

}

  const n=document.createElement(tag);

/* ================== VOZ ================== */
let vozOn=true, vozES=null, turno=0;
function eligeVoz(){
  if(!("speechSynthesis" in window)) return;
  const vs=speechSynthesis.getVoices();
  const pref=["es-cl","es-419","es-mx","es-us","es-es"];
  for(const p of pref){ const v=vs.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(p)); if(v){vozES=v;return;} }
  vozES=vs.find(v=>v.lang.toLowerCase().startsWith("es"))||null;
}
if("speechSynthesis" in window){ eligeVoz(); speechSynthesis.onvoiceschanged=eligeVoz; }
function limpia(t){ return String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}«»]/gu,"").replace(/\s+/g," ").trim(); }
function trozos(t){
  const frases=t.match(/[^.!?¿¡…]+[.!?…]*|[¿¡][^?!]+[?!]?/g)||[t];
  const out=[]; let act="";
  for(const f of frases){
    if((act+" "+f).trim().length>130 && act){ out.push(act.trim()); act=f; } else act+=" "+f;
  }
  if(act.trim()) out.push(act.trim());
  return out.length?out:[t];
}
/* Devuelve una promesa que se resuelve cuando la voz terminó ("ok"),

    const t=limpia(txt);
    if(!vozOn||!("speechSynthesis" in window)||!t){ res("silencio"); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    let listo=false, arranco=false; const t0=Date.now();
    const estimado=Math.min(16000,1200+t.length*65);
    const fin=r=>{ if(listo) return; listo=true; clearInterval(vig); res(mio===turno?r:"reemplazada"); };
    const partes=trozos(t);
    partes.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);
      u.lang=vozES?vozES.lang:"es-CL"; if(vozES) u.voice=vozES;
      u.rate=.9; u.pitch=1.05;
      u.onstart=()=>{arranco=true};
      if(i===partes.length-1){ u.onend=()=>fin("ok"); u.onerror=()=>fin("ok"); }
      speechSynthesis.speak(u);
    });
    const vig=setInterval(()=>{
      if(mio!==turno){ fin("reemplazada"); return; }
      const habla=speechSynthesis.speaking||speechSynthesis.pending;
      if(habla) arranco=true;
      if(arranco&&!habla&&Date.now()-t0>500){ fin("ok"); return; }
      if(!arranco&&Date.now()-t0>1800){ clearInterval(vig); setTimeout(()=>fin("ok"),Math.max(0,estimado-1800)); }
    },220);
  });
}
function calla(){ turno++; try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }

/* ================== SONIDO ================== */
let ctx=null;
function audio(){
  if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } }
  if(ctx&&ctx.state==="suspended"){ try{ctx.resume()}catch(e){} }
  return ctx;
}
function pito(f,dur,ret,tipo,vol){
  const c=audio(); if(!c||!vozOn) return;
  const o=c.createOscillator(), g=c.createGain(); const t=c.currentTime+(ret||0);
  o.type=tipo||"sine"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sAcierto=()=>{pito(523,.18,0,"triangle");pito(659,.18,.1,"triangle");pito(784,.3,.2,"triangle")};
const sError=()=>{pito(330,.18,0,"sine",.15);pito(262,.28,.14,"sine",.15)};
const sClic=()=>pito(880,.06,0,"sine",.08);
const sFanfarria=()=>{[523,659,784,1047].forEach((f,i)=>pito(f,.25,i*.13,"triangle"));pito(1319,.5,.55,"triangle")};

function confeti(){
  if(reducido()) return;
  const cosas=["⭐","🧶","💛","✨","🌟"];
  for(let i=0;i<14;i++){
    const c=el("span",{class:"confeti","aria-hidden":"true"},cosas[i%cosas.length]);
    c.style.left=(Math.random()*95)+"vw"; c.style.animationDelay=(Math.random()*.4)+"s";
    document.body.append(c); setTimeout(()=>c.remove(),2200);
  }
}

/* ================== PROGRESO ================== */
const CLAVE="la-cama-de-mama:v1";
let prog={};
try{ prog=JSON.parse(localStorage.getItem(CLAVE)||"{}")||{}; }catch(e){ prog={}; }
function guarda(){ try{ localStorage.setItem(CLAVE,JSON.stringify(prog)); }catch(e){} }
let totalEstrellas=0;
function pintaCuenta(){ $("#cuenta").textContent="⭐ "+totalEstrellas; }
function recalcula(){ totalEstrellas=0; for(const k in prog) totalEstrellas+=prog[k].est||0; pintaCuenta(); }

/* ================== PANTALLAS ================== */
function pantalla(id){
  for(const p of ["pInicio","pJuego","pFinal"]) $("#"+p).hidden=(p!==id);
  window.scrollTo(0,0);
}

const UNIDAD={elige:"preguntas",vf:"frases",orden:"escenas",silabas:"palabras",ensayo:"preguntas para decir"};
function pintaInicio(){
  const f=$("#frazada"); f.textContent="";
  MISIONES.forEach((m,i)=>{
    const hecha=prog[m.id]&&prog[m.id].hecha;
    const b=el("button",{class:"cuadro"+(hecha?" tejido":"")+(m.largo?" largo":""),
      "aria-label":m.nombre+(hecha?", terminada":""),onclick:()=>{sClic();abrir(i)}},
      el("span",{class:"emo","aria-hidden":"true"},m.e),
      el("span",{},el("span",{class:"nom"},m.nombre),
        el("span",{class:"est"},hecha?"✔ "+prog[m.id].est+" ⭐":m.items.length+" "+UNIDAD[m.tipo])));
    f.append(b);
  });
  const todas=MISIONES.every(m=>prog[m.id]&&prog[m.id].hecha);
  $("#trofeo").hidden=!todas;
  recalcula();
}

/* ================== MOTOR DE MISIONES ================== */
let M=null, mi=0, idx=0, estrellas=0, resuelto=false, avanceTimer=null, errores=0;
const zona=()=>$("#zona");

function abrir(i){
  audio(); M=MISIONES[i]; mi=i; idx=0; estrellas=0;
  $("#titMision").textContent=M.e+" "+M.nombre;
  pantalla("pJuego");
  if(M.tipo==="orden"){ prepOrden(); }
  render(true);
}
function puntos(){
  const p=$("#puntos"); p.textContent="";
  const n=M.tipo==="orden"?M.items.length:M.items.length;
  const hechos=M.tipo==="orden"?ord.paso:idx;
  for(let k=0;k<n;k++) p.append(el("i",{class:k<hechos?"ok":(k===hechos?"ya":"")}));
}
function render(conIntro){
  clearTimeout(avanceTimer); resuelto=false; errores=0;
  zona().textContent=""; puntos();
  const pre=conIntro?M.intro+" ":"";
  if(M.tipo==="elige") rElige(pre);
  else if(M.tipo==="vf") rVF(pre);
  else if(M.tipo==="silabas") rSil(pre);
  else if(M.tipo==="orden") rOrden(pre);
  else if(M.tipo==="ensayo") rEnsayo(pre);
}
function tarjetaPregunta(emoji,texto,voz){
  return el("div",{class:"tarjeta"},
    el("div",{class:"pregunta"},
      el("span",{class:"grande","aria-hidden":"true"},emoji),
      el("p",{id:"txtPreg"},texto),
      el("button",{class:"oir","aria-label":"Escuchar otra vez",onclick:()=>dice(voz())},"🔊")));
}
function aviso(tipo,titulo,txt){
  const v=$("#aviso"); if(v) v.remove();
  const a=el("div",{class:"aviso "+tipo,id:"aviso",role:"status"},titulo?el("b",{},titulo):null,txt);
  const card=zona().querySelector(".tarjeta"), fila=card.querySelector(".fila");
  if(fila) fila.after(a); else card.append(a);
  anima(a,"salta"); return a;
}
function gana(dato,extraVoz){
  resuelto=true; estrellas++; totalEstrellas++; pintaCuenta();
  sAcierto(); confeti();
  const a=animo();
  aviso("dato",a,dato);
  cierra(a+" "+(extraVoz||dato));
}
function falla(pista,nodo){
  errores++; sError(); if(nodo) anima(nodo,"sacude");
  const c=casi();
  aviso("casi",null,c+" "+pista);
  dice(c+" "+pista);
}
/* único punto que avanza: botón Siguiente + avance solo cuando la voz terminó */
function cierra(txtVoz){
  const acc=el("div",{class:"acciones"},el("button",{class:"btn hoja",id:"sig",onclick:siguiente},"Siguiente ▶️"));
  zona().querySelector(".tarjeta").append(acc);
  const yo=idx+"|"+(M&&M.id), t0=Date.now(), minimo=Math.min(9000,2200+txtVoz.length*45);
  $("#sig").focus({preventScroll:true});
  dice(txtVoz).then(r=>{
    if(r==="reemplazada") return;
    const falta=Math.max(0,minimo-(Date.now()-t0));
    avanceTimer=setTimeout(()=>{ if(resuelto&&yo===idx+"|"+(M&&M.id)&&!$("#pJuego").hidden) siguiente(); },falta+600);
  });
}
function siguiente(){
  clearTimeout(avanceTimer); calla();
  if(M.tipo==="orden"){ termina(); return; }
  idx++;
  if(idx>=M.items.length) termina(); else render(false);
}
function termina(){
  clearTimeout(avanceTimer);
  const antes=prog[M.id]?prog[M.id].est:0;
  prog[M.id]={hecha:true,est:Math.max(antes,estrellas)}; guarda(); recalcula();
  $("#lamina").textContent=M.e; anima($("#lamina"),"salta");
  $("#finTit").textContent="¡Misión cumplida!";
  $("#finTxt").textContent="Tejiste el cuadrito «"+M.nombre+"».";
  $("#finEst").textContent="⭐".repeat(estrellas);
  pantalla("pFinal"); sFanfarria(); confeti();
  const todas=MISIONES.every(m=>prog[m.id]&&prog[m.id].hecha);
  dice("¡Misión cumplida! Ganaste "+estrellas+" estrellas y tejiste el cuadrito "+M.nombre+"."+
    (todas?" ¡Completaste toda la frazada! Estás lista para la prueba.":" Vuelve a la frazada para seguir."));
  $("#btnVolver").focus({preventScroll:true});
}

/* ---- elige ---- */
function rElige(pre){
  const it=M.items[idx];
  const ops=baraja(it.ops.map((o,k)=>({e:o[0],t:o[1],ok:k===0})));
  const vozPreg=()=>it.q+" "+ops.map((o,k)=>(k===ops.length-1?"o ":"")+o.t).join("… ")+"?";
  const card=tarjetaPregunta(it.e,it.q,vozPreg);
  const cont=el("div",{class:"opciones"});
  ops.forEach(o=>{
    const b=el("button",{class:"op"+(o.e?"":" solo"),"data-ok":o.ok?"1":"0"},o.e?el("span",{class:"e","aria-hidden":"true"},o.e):null,o.t);
    b.addEventListener("click",()=>{
      if(resuelto||b.classList.contains("no")) return;
      if(o.ok){ b.classList.add("bien"); cont.querySelectorAll(".op").forEach(x=>x.disabled=true); gana(it.dato); }
      else{ b.classList.add("no"); b.setAttribute("aria-disabled","true"); falla(it.pista,b); }
    });
    cont.append(b);
  });
  card.append(cont); zona().append(card);
  dice(pre+vozPreg());
}

/* ---- verdadero / falso ---- */
function rVF(pre){
  const it=M.items[idx];
  const voz=()=>"¿Pasó en el cuento? "+it.f;
  const card=tarjetaPregunta(it.e,it.f,voz);
  const cont=el("div",{class:"opciones vf"});
  [[true,"✅","Sí pasó"],[false,"❌","No pasó"]].forEach(([val,e,t])=>{
    const b=el("button",{class:"op","data-ok":val===it.v?"1":"0"},el("span",{class:"e","aria-hidden":"true"},e),t);
    b.addEventListener("click",()=>{
      if(resuelto||b.classList.contains("no")) return;
      if(val===it.v){ b.classList.add("bien"); cont.querySelectorAll(".op").forEach(x=>x.disabled=true); gana(it.dato); }
      else{ b.classList.add("no"); falla(it.v?"Esa parte sí está en el cuento. Recuerda bien.":"Mmm… eso no pasó en el cuento.",b); }
    });
    cont.append(b);
  });
  card.append(cont); zona().append(card);
  dice(pre+voz());
}

/* ---- sílabas ---- */
function rSil(pre){
  const it=M.items[idx]; let pos=0;
  const voz=()=>"Arma la palabra "+it.p+".";
  const card=tarjetaPregunta(it.e,"Arma la palabra que escuchas.",voz);
  const huecos=el("div",{class:"huecos","aria-label":"Palabra de "+it.s.length+" sílabas"});
  it.s.forEach(()=>huecos.append(el("span",{class:"hueco"},"")));
  const banco=el("div",{class:"banco"});
  const fichas=baraja(it.s.map((s,k)=>({s,k})).concat(it.d.map(s=>({s,k:-1}))));
  fichas.forEach(f=>{
    const b=el("button",{class:"sil","data-k":String(f.k)},f.s);
    b.addEventListener("click",()=>{
      if(resuelto||b.disabled) return;
      if(f.s===it.s[pos]){
        huecos.children[pos].textContent=f.s; huecos.children[pos].classList.add("lleno");
        anima(huecos.children[pos],"salta"); b.disabled=true; sClic(); pos++;
        if(pos>=it.s.length){ banco.querySelectorAll(".sil").forEach(x=>x.disabled=true); gana("«"+it.p+"». "+it.dato); }
        else dice(f.s);
      }else{
        falla("Escucha otra vez: "+it.s.join("… ")+".",b);
      }
    });
    banco.append(b);
  });
  card.append(huecos,banco); zona().append(card);
  dice(pre+voz());
}

/* ---- orden ---- */
let ord={paso:0,orden:[]};
function prepOrden(){ ord={paso:0,orden:baraja(M.items.map((x,k)=>k))}; }
function rOrden(pre){
  const card=el("div",{class:"tarjeta"},
    el("div",{class:"pregunta"},el("span",{class:"grande","aria-hidden":"true"},"📚"),
      el("p",{id:"txtPreg"},"Toca las escenas en orden: ¿qué pasó primero?"),
      el("button",{class:"oir","aria-label":"Escuchar otra vez",onclick:()=>dice(vozOrden())},"🔊")));
  const fila=el("div",{class:"fila","aria-hidden":"true"});
  M.items.forEach((_,k)=>fila.append(el("span",{},String(k+1))));
  const grid=el("div",{class:"escenas"});
  ord.orden.forEach(k=>{
    const it=M.items[k];
    const b=el("button",{class:"op","data-k":String(k)},el("span",{class:"e","aria-hidden":"true"},it.e),it.t);
    const oreja=el("button",{class:"mini","aria-label":"Escuchar: "+it.t},"👂");
    oreja.addEventListener("click",ev=>{ev.stopPropagation();dice(it.t)});
    const caja=el("div",{class:"escena"},b,oreja);
    b.addEventListener("click",()=>{
      if(resuelto||caja.classList.contains("usada")) return;
      if(k===ord.paso){
        fila.children[ord.paso].textContent=it.e; fila.children[ord.paso].classList.add("lleno");
        anima(fila.children[ord.paso],"salta");
        caja.classList.add("usada"); b.disabled=true; oreja.disabled=true;
        estrellas++; totalEstrellas++; pintaCuenta(); sClic();
        grid.querySelectorAll(".pistaluz").forEach(x=>x.classList.remove("pistaluz"));
        ord.paso++; errores=0; puntos();
        if(ord.paso>=M.items.length){
          resuelto=true; sAcierto(); confeti(); const a=animo();
          aviso("dato",a,M.dato); cierra(a+" "+M.dato);
        }else dice(ordinal(ord.paso-1)+": "+it.t+".");
      }else{
        const pista=k>ord.paso?"Eso pasa después. ¿Qué pasó antes?":"Eso ya pasó.";
        falla(pista,b);
        if(errores>=2){
          const bien=grid.querySelector('.op[data-k="'+ord.paso+'"]');
          if(bien){ bien.classList.add("pistaluz"); }
        }
      }
    });
    grid.append(caja);
  });
  card.append(fila,grid); zona().append(card);
  dice(pre+vozOrden());
}
const ORD=["Primero","Segundo","Tercero","Cuarto","Quinto","Sexto","Séptimo","Octavo"];
const ordinal=k=>ORD[k]||"Después";
function vozOrden(){ return ord.paso===0?"¿Qué pasó primero en el cuento?":"¿Y qué pasó después?"; }

/* ---- ensayo oral ---- */
function rEnsayo(pre){
  const it=M.items[idx];
  const voz=()=>it.q;
  const card=tarjetaPregunta(it.e,it.q,voz);
  const acc=el("div",{class:"acciones"});
  const bIdea=el("button",{class:"btn agua"},"💡 Una idea");
  const bDije=el("button",{class:"btn hoja"},"🎤 ¡Ya lo dije!");
  bIdea.addEventListener("click",()=>{
    const v=$("#idea"); if(v) v.remove();
    const a=el("div",{class:"aviso casi",id:"idea"},"Podrías decir: "+it.idea);
    card.insertBefore(a,acc); dice("Podrías decir: "+it.idea+" Ahora dilo tú, con tus palabras.");
  });
  bDije.addEventListener("click",()=>{
    if(resuelto) return; acc.remove(); const v=$("#idea"); if(v) v.remove();
    gana("Responder con tus palabras y explicar por qué te da puntos en la prueba.","¡Qué bien lo dijiste! Recuerda siempre explicar por qué.");
  });
  acc.append(bIdea,bDije); card.append(acc); zona().append(card);
  dice(pre+voz());
}

/* ================== ARRANQUE ================== */
$("#sonido").addEventListener("click",()=>{
  vozOn=!vozOn; if(!vozOn) calla();
  $("#sonido").textContent=vozOn?"🔊":"🔇";
  $("#sonido").setAttribute("aria-pressed",String(vozOn));
  $("#sonido").setAttribute("aria-label",vozOn?"Silenciar voz y sonidos":"Activar voz y sonidos");
});
$("#btnInstr").addEventListener("click",()=>{ audio(); dice("Vamos a preparar la prueba del libro La cama de mamá. Hay siete cuadritos. Cada uno es una misión. Cuando terminas una misión, el cuadrito se teje de colores. ¡Completa toda la frazada!"); });
$("#btnVolver").addEventListener("click",()=>{ calla(); pintaInicio(); pantalla("pInicio"); });
$("#btnRepetir").addEventListener("click",()=>{ calla(); abrir(mi); });
$("#borrar").addEventListener("click",()=>{ if(confirm("¿Borrar el avance y empezar la frazada de nuevo?")){ prog={}; guarda(); pintaInicio(); } });
pintaInicio();
window.__prueba={MISIONES,get M(){return M},get idx(){return idx},get ord(){return ord},set voz(v){vozOn=v}};
</script>
