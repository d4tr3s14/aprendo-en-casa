<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFCFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>La cama de mamá · Preparo mi prueba de lectura</title>
<style>
/* tokens y base común: bloque generado más abajo (diseno/). Componentes: DESIGN.md §5 */
*{box-sizing:border-box}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.marco{max-width:540px;margin:0 auto;padding:0 16px 32px}
[hidden]{display:none!important}

/* barra superior: fija, borde inferior de 1px */
.barra{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  margin:0 -16px 16px;padding:8px 16px;background:var(--bg-page);border-bottom:1px solid var(--border-primary);
}
.barra .esp{flex:1}
/* botón secundario */
.chip{
  font:500 var(--fs-meta)/1 var(--font-ui);border:1px solid var(--border-primary);border-radius:var(--r-xs);
  padding:0 14px;min-height:var(--toque);display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--shadow-L1);cursor:pointer;touch-action:manipulation;
  transition:background var(--t-rapida);
}
.chip:hover{background:var(--tint-strong)}
.chip[aria-pressed="false"]{background:transparent;box-shadow:none;color:var(--text-secondary)}
/* contador de estrellas: chip pill */
.contador{min-height:36px;border-radius:var(--r-pill);background:transparent;box-shadow:none}
.contador.salta{animation:resalta 1s ease-out}
@keyframes resalta{0%{background:var(--accent-tint);border-color:var(--accent)}100%{background:transparent}}

/* botones: primario (button-neutral) y secundario */
.btn{
  font:500 1.125rem/1.2 var(--font-ui);border:1px solid transparent;border-radius:var(--r-sm);padding:0 20px;min-height:var(--toque-respuesta);
  background:var(--button-neutral);color:var(--button-neutral-text);cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity var(--t-rapida),background var(--t-rapida);
}
.btn:hover{opacity:.9}
.btn:active{opacity:.8}
.btn.hoja{background:var(--button-neutral);color:var(--button-neutral-text)}
.btn.agua{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-primary);box-shadow:var(--shadow-L1)}
.btn.agua:hover{opacity:1;background:var(--tint-strong)}
.btn.coral{background:transparent;color:var(--red);border-color:var(--border-primary)}
.btn.coral:hover{opacity:1;background:var(--red-tint)}
.btn.ancho{width:100%}

/* la frazada tejida del libro, ahora como panel agrupado */
.granny{background:var(--tint-faint);border:1px solid var(--border-primary)}
.cinta{display:none}

/* portada */
.portada h1{font:500 var(--fs-display)/1.05 var(--font-ui);letter-spacing:-.02em;margin:8px 0 6px;color:var(--text-strong)}
.portada .sub{font-size:var(--fs-body);margin:0 0 12px;color:var(--text-secondary)}
.leer{display:flex;gap:8px;margin-bottom:16px}
.frazada{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:var(--r-lg);background:var(--bg-wash);box-shadow:var(--shadow-ring)}
/* cada misión: tarjeta */
.cuadro{
  position:relative;border:1px solid var(--border-primary);border-radius:var(--r-sm);min-height:124px;padding:12px 8px 10px;
  cursor:pointer;touch-action:manipulation;background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--shadow-L1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  transition:border-color var(--t-rapida);
}
.cuadro:hover{border-color:var(--border-hover)}
.cuadro:active{background:var(--tint-faint)}
.cuadro .emo{font-size:2.4rem;line-height:1}
.cuadro .nom,.cuadro .est{display:block}
.cuadro .nom{font:500 var(--fs-label)/1.2 var(--font-ui)}
.cuadro .est{font-size:var(--fs-meta);color:var(--text-secondary)}
/* misión terminada: borde verde y estado con punto */
.cuadro.tejido{border-color:var(--green);background:var(--green-tint)}
.cuadro.tejido .est{display:inline-flex;align-items:center;gap:6px;color:var(--text-primary)}
.cuadro.tejido .est::before{content:"";width:8px;height:8px;border-radius:9999px;background:var(--green)}
.cuadro.largo{grid-column:1 / -1;min-height:96px;flex-direction:row;gap:12px}
.trofeo{
  margin:16px 0 0;padding:16px;border-radius:var(--r-lg);text-align:center;
  background:var(--bg-elevated);border:1px solid var(--green);box-shadow:var(--shadow-L1);
}
.trofeo .emo{font-size:3rem}
.trofeo h2{font:500 var(--fs-title)/1.25 var(--font-ui);margin:4px 0 0}
.pie{margin-top:20px;font-size:var(--fs-meta);color:var(--text-secondary);text-align:center}
/* destructivo: texto rojo, hover red-tint */
.linkbtn{background:none;border:0;border-radius:var(--r-xs);padding:0 10px;color:var(--red);font-size:var(--fs-meta);cursor:pointer;min-height:44px;transition:background var(--t-rapida)}
.linkbtn:hover{background:var(--red-tint)}

/* juego */
.cabeza{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cabeza h2{font:500 var(--fs-title)/1.25 var(--font-ui);margin:0;flex:1}
/* progreso: puntos de estado (hecho verde, saltado naranja) */
.puntos{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.puntos i{width:8px;height:8px;border-radius:9999px;background:var(--tint-strong);display:block}
.puntos i.ok{background:var(--green)}
.puntos i.ya{background:var(--accent)}
.tarjeta{background:var(--bg-elevated);border:1px solid var(--border-primary);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-L1)}
.pregunta{display:flex;gap:12px;align-items:center}
.pregunta .grande{font-size:3.2rem;line-height:1;flex:none}
.pregunta p{font:500 var(--fs-title)/1.3 var(--font-ui);margin:0}
/* botón de ícono */
.oir{
  flex:none;width:var(--toque);height:var(--toque);border-radius:var(--r-xs);border:1px solid var(--border-primary);
  background:var(--bg-elevated);font-size:1.3rem;box-shadow:var(--shadow-L1);cursor:pointer;transition:background var(--t-rapida);
}
.oir:hover{background:var(--tint-strong)}
.opciones{display:grid;gap:8px;margin-top:14px}
.op{
  display:flex;align-items:center;gap:12px;width:100%;min-height:68px;border:1px solid var(--border-primary);border-radius:var(--r-sm);
  padding:10px 14px;text-align:left;background:var(--bg-elevated);color:var(--text-primary);font:500 var(--fs-label)/1.3 var(--font-ui);
  box-shadow:var(--shadow-L1);cursor:pointer;touch-action:manipulation;transition:background var(--t-rapida),border-color var(--t-rapida);
}
.op:hover{border-color:var(--border-hover)}
.op:active{background:var(--tint-faint)}
.op .e{font-size:2.1rem;line-height:1;flex:none;width:48px;text-align:center}
.op.solo{justify-content:center;text-align:center;font-size:1.25rem}
.op.bien{background:var(--green-tint);border-color:var(--green)}
.op.no{opacity:.4;text-decoration:line-through;cursor:default;box-shadow:none}
.op.pistaluz{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.vf{grid-template-columns:1fr 1fr}
.vf .op{flex-direction:column;justify-content:center;text-align:center;min-height:104px}
.vf .op .e{font-size:2.4rem;width:auto}

/* aviso: tarjeta con punto de estado (verde = dato, naranja = casi) */
.aviso{
  position:relative;margin-top:14px;border-radius:var(--r-sm);padding:12px 14px 12px 32px;
  font-weight:500;font-size:var(--fs-body);line-height:1.4;
  background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);
}
.aviso::before{content:"";position:absolute;left:14px;top:19px;width:8px;height:8px;border-radius:9999px;background:var(--green)}
.aviso.dato b{display:block;font:500 var(--fs-title)/1.3 var(--font-ui);color:var(--text-strong)}
.aviso.casi::before{background:var(--orange)}
.acciones{display:flex;gap:8px;margin-top:14px}
.acciones .btn{flex:1}

/* sílabas */
.huecos{display:flex;justify-content:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.hueco{
  min-width:70px;height:64px;border-radius:var(--r-sm);border:1px dashed var(--border-hover);
  display:flex;align-items:center;justify-content:center;font:500 1.8rem/1 var(--font-ui);padding:0 8px;color:var(--text-primary);
}
.hueco.lleno{border:1px solid var(--green);background:var(--green-tint)}
.banco{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.sil{
  min-width:84px;min-height:68px;border:1px solid var(--border-primary);border-radius:var(--r-sm);
  background:var(--bg-elevated);color:var(--text-primary);font:500 1.8rem/1 var(--font-ui);
  box-shadow:var(--shadow-L1);cursor:pointer;touch-action:manipulation;transition:background var(--t-rapida),border-color var(--t-rapida);
}
.sil:hover{border-color:var(--border-hover)}
.sil:active{background:var(--tint-faint)}
.sil:disabled{opacity:.25;cursor:default}

/* orden */
.fila{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:4px 0 12px}
.fila span{
  aspect-ratio:1;border-radius:var(--r-xs);border:1px dashed var(--border-hover);
  display:flex;align-items:center;justify-content:center;font:500 1.1rem/1 var(--font-mono);color:var(--text-tertiary);
}
.fila span.lleno{border:1px solid var(--border-primary);background:var(--bg-elevated);font-size:1.4rem}
.escenas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.escena{position:relative}
.escena .op{flex-direction:column;justify-content:center;text-align:center;min-height:128px;font-size:var(--fs-meta);line-height:1.3;padding:10px 8px 12px}
.escena .op .e{font-size:2.4rem;width:auto}
.escena .mini{
  position:absolute;top:4px;right:4px;width:40px;height:40px;border-radius:var(--r-xs);border:0;
  background:transparent;font-size:1.1rem;cursor:pointer;transition:background var(--t-rapida);
}
.escena .mini:hover{background:var(--tint-strong)}
.escena.usada{visibility:hidden}

/* cuento */
.escenario{
  background:var(--tint-faint);border:1px solid var(--border-secondary);border-radius:var(--r-sm);min-height:150px;
  display:flex;align-items:center;justify-content:center;font-size:4rem;line-height:1.1;gap:6px;flex-wrap:wrap;padding:12px;text-align:center;
}
.escenario.noche{background:#141414;border-color:#141414}
.pagina{margin:10px 0 4px;font:500 var(--fs-meta)/1.3 var(--font-mono);color:var(--text-secondary)}
.relato{font-size:1.25rem;line-height:1.55;margin:0}
.relato span{border-radius:4px;padding:0 2px;transition:background var(--t-rapida)}
.relato span.leyendo{background:var(--accent-tint);color:var(--text-strong)}
.aclara{font-size:var(--fs-meta);color:var(--text-secondary);margin:12px 0 0;text-align:center}
.acciones .btn.chico{flex:0 0 64px;padding:0;font-size:1.4rem}
.acciones .btn{white-space:nowrap}

/* final */
.final{text-align:center}
.final .lamina{font-size:5rem;line-height:1;margin:8px auto;width:140px;height:140px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center}
.final h2{font:500 var(--fs-display)/1.1 var(--font-ui);letter-spacing:-.02em;margin:10px 0 4px;color:var(--text-strong)}
.final .estrellas{font-size:1.6rem;letter-spacing:2px;margin:6px 0 14px;word-break:break-all}
.final .btn{margin-top:8px}

/* animaciones: cortas y sin rebote */
@keyframes sacude{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes salta{from{opacity:0}to{opacity:1}}
.sacude{animation:sacude .3s ease-out}
.salta{animation:salta .16s ease-out}
.confeti{position:fixed;top:-40px;font-size:1.4rem;pointer-events:none;z-index:9;animation:cae 1.6s linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
</style>

<div class="marco">
  <nav class="barra" aria-label="Controles">
    <a class="chip" href="../../../index.html">🏠 Inicio</a>
    <span class="esp"></span>
    <span class="chip contador" id="cuenta" aria-live="polite">⭐ 0</span>
    <button class="chip" id="sonido" aria-pressed="true" aria-label="Silenciar voz y sonidos">🔊</button>

  <section id="pInicio" class="portada">

    <div class="frazada" id="frazada"></div>

      <div class="emo">🏆</div>
      <h2>¡Frazada completa!</h2>
      <p>Estás lista para la prueba de «La cama de mamá».</p>
    </div>
    <p class="pie">Libro de Joi Carlin, con ilustraciones de Morella Fuenmayor.<br>
      <button class="linkbtn" id="borrar">Empezar todo de nuevo</button></p>
  </section>

  <!-- JUEGO -->
  <section id="pJuego" hidden>
    <div class="cabeza"><h2 id="titMision"></h2></div>
    <div class="puntos" id="puntos" aria-hidden="true"></div>
    <div id="zona"></div>
  </section>

  <!-- FINAL DE MISIÓN -->
  <section id="pFinal" class="final" hidden>
    <div class="lamina granny salta" id="lamina" aria-hidden="true"></div>
    <h2 id="finTit"></h2>
    <p id="finTxt" style="font-size:1.15rem;margin:0 0 4px"></p>

function sinRepetir(lista,memo){
  let x; let n=0;
  do{ x=lista[Math.floor(Math.random()*lista.length)]; n++; }while(memo.includes(x)&&n<20);
  memo.push(x); if(memo.length>3) memo.shift(); return x;
}
const memA=[], memC=[];
const animo=()=>sinRepetir(ANIMO,memA);
const casi=()=>sinRepetir(CASI,memC);

/* ================== UTILIDADES ================== */
const $=s=>document.querySelector(s);
function el(tag,attrs,...hijos){
  const n=document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==="class") n.className=attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null&&attrs[k]!==undefined) n.setAttribute(k,attrs[k]);
  }
  for(const h of hijos){ if(h===null||h===undefined) continue; n.append(h.nodeType?h:document.createTextNode(h)); }
  return n;
}
function baraja(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const reducido=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function anima(n,c){ if(!n||reducido()) return; n.classList.remove(c); void n.offsetWidth; n.classList.add(c); }

/* ================== VOZ ================== */
let vozOn=true, vozES=null, turno=0;
function eligeVoz(){
  if(!("speechSynthesis" in window)) return;
  const vs=speechSynthesis.getVoices();
  const pref=["es-cl","es-419","es-mx","es-us","es-es"];
  for(const p of pref){ const v=vs.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(p)); if(v){vozES=v;return;} }
  vozES=vs.find(v=>v.lang.toLowerCase().startsWith("es"))||null;
}
if("speechSynthesis" in window){ eligeVoz(); speechSynthesis.onvoiceschanged=eligeVoz; }
function limpia(t){ return String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}«»]/gu,"").replace(/\s+/g," ").trim(); }
function trozos(t){
  const frases=t.match(/[^.!?¿¡…]+[.!?…]*|[¿¡][^?!]+[?!]?/g)||[t];
  const out=[]; let act="";
  for(const f of frases){
    if((act+" "+f).trim().length>130 && act){ out.push(act.trim()); act=f; } else act+=" "+f;
  }
  if(act.trim()) out.push(act.trim());
  return out.length?out:[t];
}
/* Devuelve una promesa que se resuelve cuando la voz terminó ("ok"),
   si no hay voz ("silencio") o si otra frase la interrumpió ("reemplazada"). */
function dice(txt){
  const mio=++turno;
  return new Promise(res=>{
    const t=limpia(txt);
    if(!vozOn||!("speechSynthesis" in window)||!t){ res("silencio"); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    let listo=false, arranco=false; const t0=Date.now();
    const estimado=Math.min(16000,1200+t.length*65);
    const fin=r=>{ if(listo) return; listo=true; clearInterval(vig); res(mio===turno?r:"reemplazada"); };
    const partes=trozos(t);
    partes.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);
      u.lang=vozES?vozES.lang:"es-CL"; if(vozES) u.voice=vozES;
      u.rate=.9; u.pitch=1.05;
      u.onstart=()=>{arranco=true};
      if(i===partes.length-1){ u.onend=()=>fin("ok"); u.onerror=()=>fin("ok"); }
      speechSynthesis.speak(u);
    });
    const vig=setInterval(()=>{
      if(mio!==turno){ fin("reemplazada"); return; }
      const habla=speechSynthesis.speaking||speechSynthesis.pending;
      if(habla) arranco=true;
      if(arranco&&!habla&&Date.now()-t0>500){ fin("ok"); return; }
      if(!arranco&&Date.now()-t0>1800){ clearInterval(vig); setTimeout(()=>fin("ok"),Math.max(0,estimado-1800)); }
    },220);
  });
}
function calla(){ turno++; try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }

/* ================== SONIDO ================== */
let ctx=null;
function audio(){
  if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } }
  if(ctx&&ctx.state==="suspended"){ try{ctx.resume()}catch(e){} }
  return ctx;
}
function pito(f,dur,ret,tipo,vol){
  const c=audio(); if(!c||!vozOn) return;
  const o=c.createOscillator(), g=c.createGain(); const t=c.currentTime+(ret||0);
  o.type=tipo||"sine"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}

const sError=()=>{pito(330,.18,0,"sine",.15);pito(262,.28,.14,"sine",.15)};
const sClic=()=>pito(880,.06,0,"sine",.08);
const sFanfarria=()=>{[523,659,784,1047].forEach((f,i)=>pito(f,.25,i*.13,"triangle"));pito(1319,.5,.55,"triangle")};

function confeti(){
  if(reducido()) return;
  const cosas=["⭐","🧶","💛","✨","🌟"];
  for(let i=0;i<14;i++){
    const c=el("span",{class:"confeti","aria-hidden":"true"},cosas[i%cosas.length]);
    c.style.left=(Math.random()*95)+"vw"; c.style.animationDelay=(Math.random()*.4)+"s";
    document.body.append(c); setTimeout(()=>c.remove(),2200);
  }
}

/* ================== PROGRESO ================== */
const CLAVE="la-cama-de-mama:v1";
let prog={};
try{ prog=JSON.parse(localStorage.getItem(CLAVE)||"{}")||{}; }catch(e){ prog={}; }
function guarda(){ try{ localStorage.setItem(CLAVE,JSON.stringify(prog)); }catch(e){} }
let totalEstrellas=0;
function pintaCuenta(){ $("#cuenta").textContent="⭐ "+totalEstrellas; }
function recalcula(){ totalEstrellas=0; for(const k in prog) totalEstrellas+=prog[k].est||0; pintaCuenta(); }

/* ================== PANTALLAS ================== */
function pantalla(id){
  for(const p of ["pInicio","pJuego","pFinal"]) $("#"+p).hidden=(p!==id);
  window.scrollTo(0,0);
}

const UNIDAD={cuento:"páginas",elige:"preguntas",vf:"frases",orden:"escenas",silabas:"palabras",ensayo:"preguntas para decir"};
function pintaInicio(){
  const f=$("#frazada"); f.textContent="";
  MISIONES.forEach((m,i)=>{
    const hecha=prog[m.id]&&prog[m.id].hecha;
    const b=el("button",{class:"cuadro"+(hecha?" tejido":"")+(m.largo?" largo":""),
      "aria-label":m.nombre+(hecha?", terminada":""),onclick:()=>{sClic();abrir(i)}},
      el("span",{class:"emo","aria-hidden":"true"},m.e),
      el("span",{},el("span",{class:"nom"},m.nombre),
        el("span",{class:"est"},hecha?"✔ "+prog[m.id].est+" ⭐":m.items.length+" "+UNIDAD[m.tipo])));
    f.append(b);
  });
  const todas=MISIONES.every(m=>prog[m.id]&&prog[m.id].hecha);
  $("#trofeo").hidden=!todas;
  recalcula();
}

/* ================== MOTOR DE MISIONES ================== */
let M=null, mi=0, idx=0, estrellas=0, resuelto=false, avanceTimer=null, errores=0;
const zona=()=>$("#zona");

function abrir(i){
  audio(); M=MISIONES[i]; mi=i; idx=0; estrellas=0;
  $("#titMision").textContent=M.e+" "+M.nombre;
  pantalla("pJuego");
  if(M.tipo==="orden"){ prepOrden(); }
  render(true);
}
function puntos(){
  const p=$("#puntos"); p.textContent="";
  const n=M.tipo==="orden"?M.items.length:M.items.length;
  const hechos=M.tipo==="orden"?ord.paso:idx;
  for(let k=0;k<n;k++) p.append(el("i",{class:k<hechos?"ok":(k===hechos?"ya":"")}));
}
function render(conIntro){
  clearTimeout(avanceTimer); resuelto=false; errores=0;
  zona().textContent=""; puntos();
  const pre=conIntro?M.intro+" ":"";
  if(M.tipo==="cuento") rCuento(pre);
  else if(M.tipo==="elige") rElige(pre);
  else if(M.tipo==="vf") rVF(pre);
  else if(M.tipo==="silabas") rSil(pre);
  else if(M.tipo==="orden") rOrden(pre);
  else if(M.tipo==="ensayo") rEnsayo(pre);
}
function tarjetaPregunta(emoji,texto,voz){
  return el("div",{class:"tarjeta"},
    el("div",{class:"pregunta"},
      el("span",{class:"grande","aria-hidden":"true"},emoji),
      el("p",{id:"txtPreg"},texto),
      el("button",{class:"oir","aria-label":"Escuchar otra vez",onclick:()=>dice(voz())},"🔊")));
}
function aviso(tipo,titulo,txt){
  const v=$("#aviso"); if(v) v.remove();
  const a=el("div",{class:"aviso "+tipo,id:"aviso",role:"status"},titulo?el("b",{},titulo):null,txt);
  const card=zona().querySelector(".tarjeta"), fila=card.querySelector(".fila");
  if(fila) fila.after(a); else card.append(a);
  anima(a,"salta"); return a;
}
function gana(dato,extraVoz){
  resuelto=true; estrellas++; totalEstrellas++; pintaCuenta();
  sAcierto(); confeti();
  const a=animo();
  aviso("dato",a,dato);
  cierra(a+" "+(extraVoz||dato));
}
function falla(pista,nodo){
  errores++; sError(); if(nodo) anima(nodo,"sacude");
  const c=casi();
  aviso("casi",null,c+" "+pista);
  dice(c+" "+pista);
}
/* único punto que avanza: botón Siguiente + avance solo cuando la voz terminó */
function cierra(txtVoz){
  const acc=el("div",{class:"acciones"},el("button",{class:"btn hoja",id:"sig",onclick:siguiente},"Siguiente ▶️"));
  zona().querySelector(".tarjeta").append(acc);
  const yo=idx+"|"+(M&&M.id), t0=Date.now(), minimo=Math.min(9000,2200+txtVoz.length*45);
  $("#sig").focus({preventScroll:true});
  dice(txtVoz).then(r=>{
    if(r==="reemplazada") return;
    const falta=Math.max(0,minimo-(Date.now()-t0));
    avanceTimer=setTimeout(()=>{ if(resuelto&&yo===idx+"|"+(M&&M.id)&&!$("#pJuego").hidden) siguiente(); },falta+600);
  });
}
function siguiente(){
  clearTimeout(avanceTimer); calla();
  if(M.tipo==="orden"){ termina(); return; }
  if(M.tipo==="cuento"&&idx+1>estrellas){ estrellas++; totalEstrellas++; pintaCuenta(); }
  idx++;
  if(idx>=M.items.length) termina(); else render(false);
}
function termina(){
  clearTimeout(avanceTimer);
  const antes=prog[M.id]?prog[M.id].est:0;
  prog[M.id]={hecha:true,est:Math.max(antes,estrellas)}; guarda(); recalcula();
  $("#lamina").textContent=M.e; anima($("#lamina"),"salta");
  $("#finTit").textContent="¡Misión cumplida!";
  $("#finTxt").textContent="Tejiste el cuadrito «"+M.nombre+"».";
  $("#finEst").textContent="⭐".repeat(estrellas);
  pantalla("pFinal"); sFanfarria(); confeti();
  const todas=MISIONES.every(m=>prog[m.id]&&prog[m.id].hecha);
  dice("¡Misión cumplida! Ganaste "+estrellas+" estrellas y tejiste el cuadrito "+M.nombre+"."+
    (todas?" ¡Completaste toda la frazada! Estás lista para la prueba.":" Vuelve a la frazada para seguir."));
  $("#btnVolver").focus({preventScroll:true});
}

/* ---- escucho el cuento ---- */
let cuentoAuto=true, hoja=0;
function rCuento(pre){
  const it=M.items[idx], ultima=idx===M.items.length-1, mia=++hoja;
  const frases=it.t.match(/[^.!?]+[.!?]+/g)||[it.t];
  const txt=el("p",{class:"relato",id:"txtPreg"});
  const spans=frases.map(f=>{const sp=el("span",{},f.trim()); txt.append(sp," "); return sp;});
  const card=el("div",{class:"tarjeta"},
    el("div",{class:"escenario"+(it.n?" noche":""),"aria-hidden":"true"},it.e),
    el("p",{class:"pagina"},"Página "+(idx+1)+" de "+M.items.length),
    txt);
  const bAtras=el("button",{class:"btn agua chico","aria-label":"Página anterior",onclick:()=>{ if(idx>0){ calla(); clearTimeout(avanceTimer); idx--; render(false);} }},"◀️");
  if(idx===0) bAtras.disabled=true;
  const bOir=el("button",{class:"btn agua chico","aria-label":"Escuchar otra vez",onclick:()=>{ clearTimeout(avanceTimer); lee(""); }},"🔊");
  const bSig=el("button",{class:"btn hoja",id:"sig",onclick:siguiente},ultima?"Terminar ✔️":"Siguiente ▶️");
  const bAuto=el("button",{class:"btn agua ancho","aria-pressed":String(cuentoAuto),style:"margin-top:12px"},"");
  const pintaAuto=()=>{ bAuto.textContent=cuentoAuto?"⏸️ Pasar las páginas yo":"▶️ Que las páginas pasen solas"; bAuto.setAttribute("aria-pressed",String(cuentoAuto)); };
  bAuto.addEventListener("click",()=>{ cuentoAuto=!cuentoAuto; pintaAuto(); if(!cuentoAuto) clearTimeout(avanceTimer); });
  pintaAuto();
  card.append(el("div",{class:"acciones"},bAtras,bOir,bSig),bAuto);
  if(idx===0) card.append(el("p",{class:"aclara"},"El cuento está contado con otras palabras. Para la prueba, lee también el libro."));
  zona().append(card);
  async function lee(antes){
    if(antes){ const r=await dice(antes); if(r!=="ok"||mia!==hoja) return; }
    for(const sp of spans){
      if(mia!==hoja) return;
      spans.forEach(x=>x.classList.remove("leyendo")); sp.classList.add("leyendo");
      const r=await dice(sp.textContent);
      if(r!=="ok"||mia!==hoja){ sp.classList.remove("leyendo"); return; }
    }
    spans.forEach(x=>x.classList.remove("leyendo"));
    if(cuentoAuto&&mia===hoja&&!$("#pJuego").hidden) avanceTimer=setTimeout(()=>{ if(mia===hoja&&!$("#pJuego").hidden) siguiente(); },1300);
  }
  lee(pre);
}

/* ---- elige ---- */
function rElige(pre){
  const it=M.items[idx];
  const ops=baraja(it.ops.map((o,k)=>({e:o[0],t:o[1],ok:k===0})));
  const vozPreg=()=>it.q+" "+ops.map((o,k)=>(k===ops.length-1?"o ":"")+o.t).join("… ")+"?";
  const card=tarjetaPregunta(it.e,it.q,vozPreg);
  const cont=el("div",{class:"opciones"});
  ops.forEach(o=>{
    const b=el("button",{class:"op"+(o.e?"":" solo"),"data-ok":o.ok?"1":"0"},o.e?el("span",{class:"e","aria-hidden":"true"},o.e):null,o.t);
    b.addEventListener("click",()=>{
      if(resuelto||b.classList.contains("no")) return;
      if(o.ok){ b.classList.add("bien"); cont.querySelectorAll(".op").forEach(x=>x.disabled=true); gana(it.dato); }
      else{ b.classList.add("no"); b.setAttribute("aria-disabled","true"); falla(it.pista,b); }
    });
    cont.append(b);
  });
  card.append(cont); zona().append(card);
  dice(pre+vozPreg());
}

/* ---- verdadero / falso ---- */
function rVF(pre){
  const it=M.items[idx];
  const voz=()=>"¿Pasó en el cuento? "+it.f;
  const card=tarjetaPregunta(it.e,it.f,voz);
  const cont=el("div",{class:"opciones vf"});
  [[true,"✅","Sí pasó"],[false,"❌","No pasó"]].forEach(([val,e,t])=>{
    const b=el("button",{class:"op","data-ok":val===it.v?"1":"0"},el("span",{class:"e","aria-hidden":"true"},e),t);
    b.addEventListener("click",()=>{
      if(resuelto||b.classList.contains("no")) return;
      if(val===it.v){ b.classList.add("bien"); cont.querySelectorAll(".op").forEach(x=>x.disabled=true); gana(it.dato); }
      else{ b.classList.add("no"); falla(it.v?"Esa parte sí está en el cuento. Recuerda bien.":"Mmm… eso no pasó en el cuento.",b); }
    });
    cont.append(b);
  });
  card.append(cont); zona().append(card);
  dice(pre+voz());
}

/* ---- sílabas ---- */
function rSil(pre){
  const it=M.items[idx]; let pos=0;
  const voz=()=>"Arma la palabra "+it.p+".";
  const card=tarjetaPregunta(it.e,"Arma la palabra que escuchas.",voz);
  const huecos=el("div",{class:"huecos","aria-label":"Palabra de "+it.s.length+" sílabas"});
  it.s.forEach(()=>huecos.append(el("span",{class:"hueco"},"")));
  const banco=el("div",{class:"banco"});
  const fichas=baraja(it.s.map((s,k)=>({s,k})).concat(it.d.map(s=>({s,k:-1}))));
  fichas.forEach(f=>{
    const b=el("button",{class:"sil","data-k":String(f.k)},f.s);
    b.addEventListener("click",()=>{
      if(resuelto||b.disabled) return;
      if(f.s===it.s[pos]){
        huecos.children[pos].textContent=f.s; huecos.children[pos].classList.add("lleno");
        anima(huecos.children[pos],"salta"); b.disabled=true; sClic(); pos++;
        if(pos>=it.s.length){ banco.querySelectorAll(".sil").forEach(x=>x.disabled=true); gana("«"+it.p+"». "+it.dato); }
        else dice(f.s);
      }else{
        falla("Escucha otra vez: "+it.s.join("… ")+".",b);
      }
    });
    banco.append(b);
  });
  card.append(huecos,banco); zona().append(card);
  dice(pre+voz());
}

/* ---- orden ---- */
let ord={paso:0,orden:[]};
function prepOrden(){ ord={paso:0,orden:baraja(M.items.map((x,k)=>k))}; }
function rOrden(pre){
  const card=el("div",{class:"tarjeta"},
    el("div",{class:"pregunta"},el("span",{class:"grande","aria-hidden":"true"},"📚"),
      el("p",{id:"txtPreg"},"Toca las escenas en orden: ¿qué pasó primero?"),
      el("button",{class:"oir","aria-label":"Escuchar otra vez",onclick:()=>dice(vozOrden())},"🔊")));
  const fila=el("div",{class:"fila","aria-hidden":"true"});
  M.items.forEach((_,k)=>fila.append(el("span",{},String(k+1))));
  const grid=el("div",{class:"escenas"});
  ord.orden.forEach(k=>{
    const it=M.items[k];
    const b=el("button",{class:"op","data-k":String(k)},el("span",{class:"e","aria-hidden":"true"},it.e),it.t);
    const oreja=el("button",{class:"mini","aria-label":"Escuchar: "+it.t},"👂");
    oreja.addEventListener("click",ev=>{ev.stopPropagation();dice(it.t)});
    const caja=el("div",{class:"escena"},b,oreja);
    b.addEventListener("click",()=>{
      if(resuelto||caja.classList.contains("usada")) return;
      if(k===ord.paso){
        fila.children[ord.paso].textContent=it.e; fila.children[ord.paso].classList.add("lleno");
        anima(fila.children[ord.paso],"salta");
        caja.classList.add("usada"); b.disabled=true; oreja.disabled=true;
        estrellas++; totalEstrellas++; pintaCuenta(); sClic();
        grid.querySelectorAll(".pistaluz").forEach(x=>x.classList.remove("pistaluz"));
        ord.paso++; errores=0; puntos();
        if(ord.paso>=M.items.length){
          resuelto=true; sAcierto(); confeti(); const a=animo();
          aviso("dato",a,M.dato); cierra(a+" "+M.dato);
        }else dice(ordinal(ord.paso-1)+": "+it.t+".");
      }else{
        const pista=k>ord.paso?"Eso pasa después. ¿Qué pasó antes?":"Eso ya pasó.";
        falla(pista,b);
        if(errores>=2){
          const bien=grid.querySelector('.op[data-k="'+ord.paso+'"]');
          if(bien){ bien.classList.add("pistaluz"); }
        }
      }
    });
    grid.append(caja);
  });
  card.append(fila,grid); zona().append(card);
  dice(pre+vozOrden());
}
const ORD=["Primero","Segundo","Tercero","Cuarto","Quinto","Sexto","Séptimo","Octavo"];
const ordinal=k=>ORD[k]||"Después";
function vozOrden(){ return ord.paso===0?"¿Qué pasó primero en el cuento?":"¿Y qué pasó después?"; }

/* ---- ensayo oral ---- */
function rEnsayo(pre){
  const it=M.items[idx];
  const voz=()=>it.q;
  const card=tarjetaPregunta(it.e,it.q,voz);
  const acc=el("div",{class:"acciones"});
  const bIdea=el("button",{class:"btn agua"},"💡 Una idea");
  const bDije=el("button",{class:"btn hoja"},"🎤 ¡Ya lo dije!");
  bIdea.addEventListener("click",()=>{
    const v=$("#idea"); if(v) v.remove();
    const a=el("div",{class:"aviso casi",id:"idea"},"Podrías decir: "+it.idea);
    card.insertBefore(a,acc); dice("Podrías decir: "+it.idea+" Ahora dilo tú, con tus palabras.");
  });
  bDije.addEventListener("click",()=>{
    if(resuelto) return; acc.remove(); const v=$("#idea"); if(v) v.remove();
    gana("Responder con tus palabras y explicar por qué te da puntos en la prueba.","¡Qué bien lo dijiste! Recuerda siempre explicar por qué.");
  });
  acc.append(bIdea,bDije); card.append(acc); zona().append(card);
  dice(pre+voz());
}

/* ================== ARRANQUE ================== */
$("#sonido").addEventListener("click",()=>{
  vozOn=!vozOn; if(!vozOn) calla();
  $("#sonido").textContent=vozOn?"🔊":"🔇";
  $("#sonido").setAttribute("aria-pressed",String(vozOn));
  $("#sonido").setAttribute("aria-label",vozOn?"Silenciar voz y sonidos":"Activar voz y sonidos");
});
$("#btnInstr").addEventListener("click",()=>{ audio(); dice("Vamos a preparar la prueba del libro La cama de mamá. Primero, escucha el cuento en el cuadrito de arriba. Después hay siete misiones. Cuando terminas una, el cuadrito se teje de colores. ¡Completa toda la frazada!"); });
$("#btnVolver").addEventListener("click",()=>{ calla(); pintaInicio(); pantalla("pInicio"); });
$("#btnRepetir").addEventListener("click",()=>{ calla(); abrir(mi); });
$("#borrar").addEventListener("click",()=>{ if(confirm("¿Borrar el avance y empezar la frazada de nuevo?")){ prog={}; guarda(); pintaInicio(); } });
pintaInicio();
window.__prueba={MISIONES,get M(){return M},get idx(){return idx},get ord(){return ord},set voz(v){vozOn=v}};
</script>

<script id="selva-js">
/* ==========================================================================
   SELVA v2 · comportamiento común
   1. Guarda el progreso (veces jugada y mejor puntaje) para que la portada
      muestre las estrellas ganadas. Solo en este dispositivo, sin internet.
   2. Si ya hay estrellas en la ronda, "Inicio" pregunta antes de salir.
   3. Hace saltar el contador cuando se gana una estrella.
   4. Etiqueta los botones que solo tienen un ícono.
   ========================================================================== */
(function(){
  var CLAVE = "aprendo:progreso";
  var ruta = decodeURIComponent(location.pathname).replace(/^.*?(\d+-basico\/)/, "$1");
  var $ = function(s){ return document.querySelector(s); };

  function estrellas(){
    var el = $("#puntaje, #cuenta");
    var m = el && el.textContent.match(/\d+/);
    return m ? +m[0] : 0;
  }
  function registrar(){
    var d = {};
    try{ d = JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){}
    var r = d[ruta] || { veces:0, mejor:0 };
    r.veces++;
    r.mejor = Math.max(r.mejor || 0, estrellas());
    r.ultima = new Date().toISOString().slice(0, 10);
    d[ruta] = r;
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
  }

  /* 1. fin de la actividad: pantalla #final (juegos) o #pFinal (misiones) */
  var fin = $("#final, #pFinal");
  if(fin){
    var visto = false;
    new MutationObserver(function(){
      var ve = fin.classList.contains("activa") || (fin.id === "pFinal" && !fin.hidden);
      if(ve && !visto){ visto = true; setTimeout(registrar, 400); }
      if(!ve) visto = false;
    }).observe(fin, { attributes:true, attributeFilter:["class", "hidden"] });
  }
  /* presentaciones: cuenta como vista al llegar a la última diapositiva */
  var cont = $("#contador");
  if(cont && !fin){
    var vista = false;
    new MutationObserver(function(){
      var p = cont.textContent.match(/(\d+)\s*\/\s*(\d+)/);
      if(p && p[1] === p[2] && !vista){ vista = true; registrar(); }
    }).observe(cont, { childList:true, characterData:true, subtree:true });
  }

  /* 2. confirmar antes de salir a mitad de una ronda */
  function enRonda(){
    return !!$("#juego.activa, #ensayo.activa, #pJuego:not([hidden])") && estrellas() > 0;
  }
  var dlg = null;
  function preguntarSalida(destino){
    if(!window.HTMLDialogElement){ location.href = destino; return; }
    if(!dlg){
      dlg = document.createElement("dialog");
      dlg.className = "selva-dialogo";
      dlg.innerHTML =
        '<div class="selva-dialogo-emo" aria-hidden="true">🏠</div>' +
        '<h2>¿Quieres salir?</h2>' +
        '<p>Si sales ahora, se pierden las estrellas de esta ronda.</p>' +
        '<button class="selva-seguir" value="seguir">▶️ Seguir jugando</button>' +
        '<button class="selva-salir" value="salir">Salir</button>';
      dlg.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        dlg.close();
        if(b.value === "salir") location.href = dlg.dataset.destino;
      });
      document.body.appendChild(dlg);
    }
    dlg.dataset.destino = destino;
    dlg.showModal();
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance("¿Quieres salir? Si sales ahora, se pierden las estrellas de esta ronda.");
        u.lang = "es-ES"; speechSynthesis.speak(u);
      }
    }catch(e){}
    dlg.querySelector(".selva-seguir").focus();
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href$="index.html"]');
    if(!a || !enRonda()) return;
    e.preventDefault();
    preguntarSalida(a.href);
  }, true);

  /* 3. el contador salta al ganar una estrella */
  var pts = $("#puntaje");
  if(pts){
    var antes = estrellas();
    new MutationObserver(function(){
      var ahora = estrellas();
      if(ahora > antes){
        pts.classList.remove("salta"); void pts.offsetWidth; pts.classList.add("salta");
      }
      antes = ahora;
    }).observe(pts, { childList:true, characterData:true, subtree:true });
  }

  /* 4. etiquetas para lectores de pantalla */
  var nombres = { btnGeneral:"Ver todas las diapositivas", btnPantalla:"Pantalla completa", btnVoz:"Voz", sonido:"Voz y sonidos" };
  Object.keys(nombres).forEach(function(id){
    var b = document.getElementById(id);
    if(b && !b.getAttribute("aria-label") && !/[a-záéíóú]{3}/i.test(b.textContent)) b.setAttribute("aria-label", nombres[id]);
  });
  /* el iPhone no permite pantalla completa en páginas web: se oculta el botón */
  var d = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) d.classList.add("selva-sin-pantalla-completa");
})();
</script>
