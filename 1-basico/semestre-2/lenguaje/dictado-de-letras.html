<style>
/* tokens y componentes comunes: bloque generado más abajo (diseno/) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

.barra-sup{display:flex;align-items:center;justify-content:space-between;gap:8px}

.pantalla{display:none;text-align:center}
.pantalla.activa{display:block;animation:entra .16s ease-out}
@keyframes entra{from{opacity:0}to{opacity:1}}

h1{margin:.2em 0 .1em}
.intro{margin:0 auto 16px}
.iconos{letter-spacing:.1em;margin:6px 0 2px}

.nivel-chip{margin-bottom:8px}
.pregunta{margin:0 0 10px}

/* escena: tarjeta del ejercicio */
.escena{
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);border-radius:var(--r-lg);box-shadow:var(--shadow-L1);
  padding:12px 8px;margin:0 auto 12px;min-height:128px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:border-color var(--t-rapida);
}
.escena.mal{animation:tiembla .3s ease-out}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.escena.bien{border-color:var(--green)}

.numerote{font:500 clamp(3rem,15vw,4.6rem)/1 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong)}

.controles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:440px;margin:0 auto}
.ctrl{padding:0 16px;font-size:var(--fs-label);display:flex;align-items:center;gap:6px}

.opciones{display:grid;gap:8px;max-width:440px;margin:0 auto}
.opciones.dos{grid-template-columns:1fr 1fr}
.opcion{padding:12px 10px;font-size:var(--fs-label);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.opcion .emo{font-size:2.4rem}
.opcion b{font-size:1.3rem}

.aviso{min-height:52px;margin-top:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}

.album{padding:12px;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.album span{font-size:2rem}
.trofeo{font-size:4rem;display:block}
.confeti{position:absolute;top:-20px;font-size:1.4rem;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(360deg);opacity:0}}

/* ---------- pizarra de trazo ---------- */
.pizarra{
  width:min(330px,86vw);background:var(--bg-elevated);border:1px solid var(--border-primary);
  border-radius:var(--r-lg);box-shadow:var(--shadow-L1);touch-action:none;position:relative;overflow:hidden;
}
/* el viewBox del svg da la proporción: no se depende de aspect-ratio */
.pizarra svg{display:block;width:100%;height:auto;touch-action:none}
.pauta{stroke:var(--border-hover);stroke-width:2}
.pauta.base{stroke:var(--red);stroke-opacity:.55;stroke-width:2.5}
.pauta.media{stroke-dasharray:7 7}
.pizarra.mal{animation:tiembla .3s ease-out;border-color:var(--red)}
.pizarra.mal .guia{stroke:var(--red-tint)}

.barraTrazo{width:min(330px,86vw);height:6px;background:var(--tint-soft);border-radius:var(--r-pill);overflow:hidden}
.barraTrazo i{display:block;height:100%;width:0%;background:var(--green);border-radius:var(--r-pill);transition:width .08s linear}

.guia{fill:none;stroke:var(--tint-strong);stroke-width:30;stroke-linecap:round;stroke-linejoin:round;transition:stroke .16s,opacity .16s}
.guia.tenue{opacity:.3}
.guia.hecha{stroke:var(--green-tint)}
/* marcador: translúcido y por trocitos, así el cruce se ve más oscuro */
.marca{fill:none;stroke:var(--accent);stroke-opacity:.35;stroke-width:24;stroke-linecap:butt;stroke-linejoin:round}
#marcas.ok .marca{stroke:var(--green);stroke-opacity:.5}
/* la línea punteada va SIEMPRE encima del marcador: nunca se pierde el camino */
.guiaPunteada{fill:none;stroke:var(--text-tertiary);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 16}
.demo{fill:none;stroke:var(--accent);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.puntoInicio{fill:var(--green);stroke:var(--bg-elevated);stroke-width:3}
.puntoInicio.pulsa{animation:latido 1.5s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.45}}
/* punto que va un poco adelante del dedo: dice hacia dónde sigue el camino */
.proximo{fill:var(--accent);stroke:var(--bg-elevated);stroke-width:3;opacity:.9;animation:tic 1.5s ease-in-out infinite}
@keyframes tic{0%,100%{opacity:.9}50%{opacity:.4}}
.lapiz{fill:none;stroke:var(--text-secondary);stroke-width:3;pointer-events:none;opacity:.85}

.filaTrazo{display:flex;flex-direction:column;align-items:center;gap:8px}
.chipLetra{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-primary);border-radius:var(--r-pill);
  padding:4px 16px;font:500 1.5rem/1.2 var(--font-ui);color:var(--text-primary);
}
.chipLetra .emo{font-size:1.5rem}

/* ---------- banco de letras ---------- */
.banco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px;margin:0 auto}
.letraBtn{
  background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-primary);border-radius:var(--r-sm);
  width:64px;height:64px;font:500 2rem/1 var(--font-ui);cursor:pointer;box-shadow:var(--shadow-L1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background var(--t-rapida),border-color var(--t-rapida);
}
.letraBtn small{font-weight:400;color:var(--text-secondary)}
.letraBtn:hover{border-color:var(--border-hover)}
.letraBtn:active{background:var(--tint-faint)}
.letraBtn.bien{background:var(--green-tint);border-color:var(--green)}
.letraBtn.mal{background:var(--red-tint);border-color:var(--red);opacity:.7}
.letraBtn[disabled]{cursor:default}
@media (max-width:400px){ .letraBtn{width:56px;height:56px;font-size:1.75rem} }

.emojote{font-size:clamp(3.6rem,17vw,5rem);line-height:1}
.dato{font-size:var(--fs-meta);font-weight:500;color:var(--text-secondary);max-width:34ch;line-height:1.4}
.par{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.formas{display:flex;gap:14px;align-items:baseline;justify-content:center;font:400 2.2rem/1.2 var(--font-ui);color:var(--text-primary)}
.formas b{font-size:2.6rem;font-weight:500}

.oreja{font-size:clamp(3.2rem,15vw,4.6rem);line-height:1}
.pista-escucha{font-size:var(--fs-meta);font-weight:500}
.modelo{
  font:500 1.6rem/1.2 var(--font-ui);color:var(--text-primary);letter-spacing:.1em;
  background:var(--tint-faint);border:1px solid var(--border-secondary);border-radius:var(--r-xs);padding:4px 16px;
}
</style>

<style id="selva">
/* ==========================================================================
   TOKENS · DESIGN.md §9 (fuente de verdad: DESIGN.md en la raíz)
   Neutros casi blancos, un solo acento azul, bordes de 1px y color solo para
   comunicar estado. Se incrusta primero en cada actividad con
   python herramientas/sincronizar.py
   ========================================================================== */
:root{
  color-scheme:light dark;
  --bg-page:#FCFCFC; --bg-wash:#F8F8F8; --bg-elevated:#FFFFFF;
  --text-primary:#191919; --text-strong:#000;
  --text-secondary:rgba(25,25,25,.56); --text-tertiary:rgba(25,25,25,.40);
  --border-primary:rgba(0,0,0,.08); --border-secondary:rgba(0,0,0,.06); --border-hover:rgba(0,0,0,.12);
  --tint-strong:rgba(0,0,0,.08); --tint-soft:rgba(0,0,0,.06); --tint-faint:rgba(0,0,0,.04);
  --accent:#317CFF; --accent-tint:rgba(51,125,244,.10); --button-neutral:#363636; --button-neutral-text:#FFF;
  --green:#00A558; --green-tint:rgba(62,237,155,.20);
  --red:#F53B3A; --red-tint:rgba(245,59,58,.12);
  --orange:#F58E3A; --orange-tint:rgba(245,142,58,.12);
  --purple:#956CDE; --purple-tint:rgba(149,108,222,.12);
  --font-ui:Inter, -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-mono:'Geist Mono','IBM Plex Mono',ui-monospace,monospace;
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-pill:999px;
  --shadow-L1:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-L2:0 1px 3px 0 rgba(0,0,0,.06),0 1px 2px 0 rgba(0,0,0,.06);
  --shadow-ring:0 0 3px 0 rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.08);
  --shadow-L3:0 10px 15px -3px rgba(0,0,0,.06);
  --shadow-L4:0 25px 50px -12px rgba(0,0,0,.25);
  --t-rapida:140ms ease-out;

  /* Adaptación a 1° básico (INSTRUCCIONES-PROYECTO.md): la app se usa con el dedo
     y por una niña que aún no lee fluido. Se mantiene el lenguaje visual de
     DESIGN.md pero el texto nunca baja de 15 px y los toques miden ≥ 48 px. */
  --fs-meta:15px; --fs-body:17px; --fs-label:17px; --fs-title:clamp(1.25rem,4.6vw,1.6rem);
  --fs-display:clamp(2rem,8vw,3rem);
  --toque:48px; --toque-respuesta:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-page:#141414; --bg-wash:#191919; --bg-elevated:#1F1F1F;
    --text-primary:rgba(255,255,255,.90); --text-strong:#FFF;
    --text-secondary:rgba(255,255,255,.52); --text-tertiary:rgba(255,255,255,.40);
    --border-primary:rgba(255,255,255,.08); --border-secondary:rgba(255,255,255,.04); --border-hover:rgba(255,255,255,.16);
    --tint-strong:rgba(255,255,255,.08); --tint-soft:rgba(255,255,255,.05); --tint-faint:rgba(255,255,255,.03);
    --accent:#49B0FF; --button-neutral:#F9F9F9; --button-neutral-text:#000;
    --green:#00EC7E; --green-tint:rgba(0,236,126,.08); --orange-tint:rgba(245,142,58,.08);
    --shadow-L1:0 1px 2px 0 rgba(0,0,0,.20);
    --shadow-L3:0 10px 15px -3px rgba(0,0,0,.64);
    --shadow-L4:0 25px 50px -12px rgba(0,0,0,.50);
  }
}
:root[data-theme="dark"]{
  --bg-page:#141414; --bg-wash:#191919; --bg-elevated:#1F1F1F;
  --text-primary:rgba(255,255,255,.90); --text-strong:#FFF;
  --text-secondary:rgba(255,255,255,.52); --text-tertiary:rgba(255,255,255,.40);
  --border-primary:rgba(255,255,255,.08); --border-secondary:rgba(255,255,255,.04); --border-hover:rgba(255,255,255,.16);
  --tint-strong:rgba(255,255,255,.08); --tint-soft:rgba(255,255,255,.05); --tint-faint:rgba(255,255,255,.03);
  --accent:#49B0FF; --button-neutral:#F9F9F9; --button-neutral-text:#000;
  --green:#00EC7E; --green-tint:rgba(0,236,126,.08); --orange-tint:rgba(245,142,58,.08);
  --shadow-L1:0 1px 2px 0 rgba(0,0,0,.20);
  --shadow-L3:0 10px 15px -3px rgba(0,0,0,.64);

/* ==========================================================================
   BASE común (tipografía, superficie, accesibilidad) · ver DESIGN.md
   Fuente de verdad: diseno/. No edites el bloque dentro de cada actividad:
   edita aquí y corre  python herramientas/sincronizar.py
   ========================================================================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPad: se mira a más distancia, todo crece un 12 % */
@media (min-width:700px) and (min-height:600px){ html{font-size:112.5%} }
*{-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg-page);color:var(--text-primary);
  font:400 var(--fs-body)/1.45 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-ui);font-weight:500;letter-spacing:-.01em}
b,strong{font-weight:600}
button,a{touch-action:manipulation}
button{font-family:var(--font-ui)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  .confeti{display:none !important}
}

/* diálogo "¿Quieres salir?" (lo crea selva.js) · modal: bg-elevated + sombra L4 */
.selva-dialogo{
  border:1px solid var(--border-primary);border-radius:var(--r-lg);padding:20px 20px 16px;
  width:min(360px, calc(100vw - 32px));
  background:var(--bg-elevated);color:var(--text-primary);text-align:center;box-shadow:var(--shadow-L4);
  font-family:var(--font-ui);
}
.selva-dialogo::backdrop{background:rgba(0,0,0,.32)}
.selva-dialogo-emo{font-size:2.6rem;line-height:1}
.selva-dialogo h2{font:500 1.25rem/1.3 var(--font-ui);margin:10px 0 4px;color:var(--text-strong)}
.selva-dialogo p{font-size:var(--fs-body);line-height:1.4;margin:0 0 16px;color:var(--text-secondary)}
.selva-dialogo button{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--toque);
  border:1px solid transparent;border-radius:var(--r-xs);cursor:pointer;
  font:500 var(--fs-label)/1 var(--font-ui);transition:background var(--t-rapida);
}
.selva-seguir{background:var(--button-neutral);color:var(--button-neutral-text);margin-bottom:8px}
.selva-salir{background:transparent;color:var(--red)}
.selva-salir:hover{background:var(--red-tint)}
/* ==========================================================================
   Capa para actividades de juego (pantallas inicio / juego / final)
   Se carga DESPUÉS del estilo propio de cada archivo, así que lo reemplaza
   sin tocar la lógica del juego. Componentes según DESIGN.md §5.
   ========================================================================== */

/* ---------- vista a pantalla completa sobre bg-page ---------- */
body{
  display:block;min-height:100vh;min-height:100dvh;margin:0;
  padding:0 max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:var(--bg-page);
}
.marco{
  width:min(720px,100%);margin:0 auto;padding:0 0 8px;
  background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;
}

/* ---------- barra superior: fija, borde inferior de 1px, respeta el notch ---------- */
.marco > .barra,.marco > .barra-sup{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:0 -16px 20px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  background:var(--bg-page);border-bottom:1px solid var(--border-primary);
}
/* botón secundario: bg-elevated + borde + L1 */
.marco > .barra .mini,.marco > .barra-sup .mini,.pantalla .mini{
  min-height:var(--toque);padding:0 14px;border:1px solid var(--border-primary);border-radius:var(--r-xs);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--shadow-L1);
  font:500 var(--fs-meta)/1 var(--font-ui);text-decoration:none;cursor:pointer;
  transition:background var(--t-rapida),border-color var(--t-rapida);
}
.marco > .barra .mini:hover,.marco > .barra-sup .mini:hover,.pantalla .mini:hover{background:var(--tint-strong)}
.marco > .barra .mini[aria-pressed="false"],.marco > .barra-sup .mini[aria-pressed="false"]{background:transparent;box-shadow:none;color:var(--text-secondary)}
/* contador de estrellas: chip pill */
.puntaje{
  min-height:36px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--border-primary);color:var(--text-primary);box-shadow:none;
  font:500 var(--fs-meta)/1 var(--font-ui);letter-spacing:0;white-space:nowrap;
  transition:background var(--t-rapida);
}
.puntaje.salta{animation:selva-salta 1s ease-out}
@keyframes selva-salta{0%{background:var(--accent-tint);border-color:var(--accent)}100%{background:transparent}}

/* ---------- títulos y texto: jerarquía por peso y opacidad ---------- */
.pantalla{padding-top:4px}
h1{font:500 var(--fs-display)/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);text-shadow:none}
h1 span{display:block;font-size:var(--fs-body) !important;font-weight:400;letter-spacing:0 !important;line-height:1.4;color:var(--text-secondary);margin-top:8px}
.intro{font-size:var(--fs-body);line-height:1.5;max-width:40ch;color:var(--text-secondary)}
.intro b{color:var(--text-primary)}
.pregunta{font:500 var(--fs-title)/1.3 var(--font-ui);color:var(--text-primary);letter-spacing:-.01em}
.nivel-chip,.nivelChip{
  display:inline-flex;align-items:center;gap:6px;min-height:32px;
  font:500 var(--fs-meta)/1 var(--font-ui) !important;padding:0 12px !important;
  border-radius:var(--r-pill);border:1px solid var(--border-primary);background:transparent;color:var(--text-secondary);box-shadow:none;
}

/* ---------- botón principal: button-neutral, sin volumen 3D ---------- */
.btn{
  min-height:var(--toque-respuesta);padding:0 24px;border:1px solid transparent;border-radius:var(--r-sm);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:500 1.125rem/1.2 var(--font-ui);
  background:var(--button-neutral);color:var(--button-neutral-text);box-shadow:none;cursor:pointer;
  transition:opacity var(--t-rapida);
}
.btn:hover{opacity:.9}
.btn:active{transform:none;opacity:.8;box-shadow:none}
/* sol y hoja ("Siguiente", "Jugar de nuevo") también son primarios */
.btn.sol,.btn.sol:active,.btn.hoja,.btn.hoja:active{background:var(--button-neutral);color:var(--button-neutral-text);box-shadow:none}
/* agua ("Escuchar otra vez", "Ir a la presentación"): botón secundario */
.btn.agua,.btn.secundario{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-primary);box-shadow:var(--shadow-L1)}
.btn.agua:hover,.btn.secundario:hover{opacity:1;background:var(--tint-strong)}
.btn.agua:active,.btn.secundario:active{box-shadow:var(--shadow-L1)}
.btn[disabled]{opacity:.4;cursor:default}

/* ---------- tarjeta del ítem (escenario) ---------- */
.escenario{
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);border-radius:var(--r-lg);box-shadow:var(--shadow-L1);
}
.nombre{font:500 var(--fs-title)/1.25 var(--font-ui);color:var(--text-primary)}

/* ---------- respuestas, controles y teclas: tarjetas tocables ≥ 56 px ---------- */
.opcion,.ctrl,.tecla{
  min-height:var(--toque-respuesta);border-radius:var(--r-sm);cursor:pointer;
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);
  font-family:var(--font-ui);font-weight:500;
  transition:background var(--t-rapida),border-color var(--t-rapida);
}
.opcion:hover,.ctrl:hover,.tecla:hover{border-color:var(--border-hover);background:var(--bg-elevated)}
.opcion:active,.ctrl:active,.tecla:active{transform:none;background:var(--tint-faint);box-shadow:var(--shadow-L1)}
.opcion b,.ctrl b,.tecla b{font-family:var(--font-ui);font-weight:500}
.ctrl.audio{color:var(--accent)}
.ctrl.listo{background:var(--button-neutral);color:var(--button-neutral-text);border-color:transparent}
.ctrl.listo:hover{background:var(--button-neutral);opacity:.9}
.ctrl.quitar{color:var(--red)}
.ctrl.quitar:hover{background:var(--red-tint)}
/* estados: color solo en borde y fondo tint (DESIGN.md §6) */
.opcion.bien,.opcion.correcta{background:var(--green-tint);border-color:var(--green);color:var(--text-primary);box-shadow:none}
.opcion.mal,.opcion.incorrecta{background:var(--red-tint);border-color:var(--red);color:var(--text-primary);box-shadow:none}
.opcion[disabled],.ctrl[disabled],.tecla[disabled]{cursor:default}
.opcion.incorrecta[disabled],.opcion.mal[disabled]{opacity:.7}

/* ---------- aviso: el dato para repetir en la prueba · tarjeta con punto de estado ---------- */
.aviso{border-radius:var(--r-sm);line-height:1.4;font-weight:500;font-size:var(--fs-body);color:var(--text-primary)}
.aviso.ok:not(:empty),.aviso.ups:not(:empty){
  position:relative;background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);padding:12px 14px 12px 32px;text-align:left;
}
.aviso.ok:not(:empty)::before,.aviso.ups:not(:empty)::before{

<script>
/* ==================== UTILIDADES COMUNES ==================== */
const $ = id => document.getElementById(id);
const azar = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const mezclar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

let vozOn = true;
let vozSerie = 0;

/* Parte el texto en trozos cortos: Safari corta las frases muy largas. */
function trozos(txt, max){
  max = max || 130;
  const out = []; let act = "";
  txt.split(" ").forEach(w=>{
    if((act + " " + w).trim().length > max){ if(act) out.push(act.trim()); act = w; }
    else act = (act + " " + w).trim();
  });
  if(act.trim()) out.push(act.trim());
  return out.length ? out : [txt];
}
function eligeVoz(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang==="es-CL") || vs.find(v=>v.lang==="es-MX") ||
         vs.find(v=>v.lang==="es-ES") || vs.find(v=>v.lang.startsWith("es")) || null;
}
/* dice(): promesa que se resuelve SOLO cuando la voz terminó de verdad.
   Resuelve "reemplazada" si otra frase la interrumpió, para que quien esperaba
   el final no avance de pantalla por error. */
function dice(txt){
  const mio = ++vozSerie;
  return new Promise(res=>{
    const espera = Math.min(11000, 1300 + txt.length*58);
    if(!window.speechSynthesis || !vozOn){
      try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
      setTimeout(()=>res(mio === vozSerie ? "sin-voz" : "reemplazada"), espera);
      return;
    }
    try{ speechSynthesis.cancel(); }catch(_){}
    let listo = false, vig = null;
    const fin = r => { if(listo) return; listo = true; if(vig) clearInterval(vig); res(r); };
    const partes = trozos(txt);
    partes.forEach((t,i)=>{
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "es-CL"; u.rate = .85; u.pitch = 1.1;
      const v = eligeVoz(); if(v) u.voice = v;
      if(i === partes.length-1){ u.onend = ()=>fin("fin"); u.onerror = ()=>fin("error"); }
      speechSynthesis.speak(u);
    });
    /* Vigilante: en iOS el evento onend a veces no llega nunca. */
    let arranco = false; const t0 = Date.now();
    vig = setInterval(()=>{
      if(mio !== vozSerie){ fin("reemplazada"); return; }
      if(speechSynthesis.speaking || speechSynthesis.pending) arranco = true;
      else if(arranco){ fin("vigilante"); return; }
      /* Si el motor de voz nunca partió (pasa en iOS con el timbre en silencio),
         se da igualmente el tiempo de lectura antes de continuar. */
      if(!arranco && Date.now() - t0 > 1800){
        clearInterval(vig); vig = null;
        setTimeout(()=>fin("sin-voz"), Math.max(0, espera - 1800));
        return;
      }
      if(Date.now() - t0 > 25000) fin("tope");
    }, 220);
  });
}
function hablar(txt, cb){ const p = dice(txt); if(cb) p.then(cb); return p; }
function hablando(){
  return !!(window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending));
}
/* Un solo AudioContext reutilizado: Safari en iPhone permite muy pocos. */
let ctxAudio = null;
function audio(){
  try{
    if(!ctxAudio) ctxAudio = new (window.AudioContext||window.webkitAudioContext)();
    if(ctxAudio.state === "suspended") ctxAudio.resume();
    return ctxAudio;
  }catch(e){ return null; }
}
function pito(ok){
  const ctx = audio(); if(!ctx) return;
  try{
    const notas = ok ? [523,659,784] : [330,262];
    notas.forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.001,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02+i*.11);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.20+i*.11);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+i*.11); o.stop(ctx.currentTime+.4+i*.11);
    });
  }catch(e){}
}
function clic(){
  const ctx = audio(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(.09,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+.1);
  }catch(e){}
}
function pantalla(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
  $(id).classList.add("activa");
}
function confeti(emojis){
  emojis = emojis || ["⭐","🎉","🌟","✨"];
  for(let i=0;i<24;i++){
    const c = document.createElement("div");
    c.className = "confeti";
    c.textContent = emojis[i%emojis.length];
    c.style.left = Math.random()*100+"%";
    c.style.animationDuration = (2+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*.6)+"s";
    document.querySelector(".marco").appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}
const ANIMOS = ["¡Excelente!","¡Muy bien!","¡Lo lograste!","¡Qué crack!","¡Perfecto!",
  "¡Así se hace!","¡Brillante!","¡Genial!","¡Increíble!","¡Bravo!"];
const CASIS = ["Casi... observa bien.","Casi lo tienes, mira otra vez.","Uy, casi. Inténtalo de nuevo.",
  "No pasa nada, prueba otra vez.","Vas bien, revisa una vez más.","Tranquila, mira con calma."];
let usadosAnimo = [];
function animo(){
  if(usadosAnimo.length >= ANIMOS.length) usadosAnimo = [];
  let f; do { f = ANIMOS[azar(0,ANIMOS.length-1)]; } while(usadosAnimo.includes(f));
  usadosAnimo.push(f); return f;
}
function casi(){ return CASIS[azar(0,CASIS.length-1)]; }

function conectarVoz(){
  const b = $("btnVoz");
  b.addEventListener("click", ()=>{
    vozOn = !vozOn;
    b.textContent = vozOn ? "🔊 Voz" : "🔇 Voz";
    b.setAttribute("aria-pressed", vozOn);
    if(!vozOn && window.speechSynthesis){ vozSerie++; speechSynthesis.cancel(); }
  });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
}

/* ==================== TRAZO DE LETRA LIGADA ====================
   Marco 240x240 · techo 30 · media 105 · base 180 · pie 232
   - Acepta letras de una o de dos partes (la te lleva el palito aparte).
   - El trazo hecho se pinta como MARCADOR: translúcido y en trocitos, así
     cuando la letra se cruza a sí misma (la pe, la ge, la ye) se ve el
     cruce más oscuro y no se pierde de vista por dónde iba el dedo.
   - La línea punteada blanca va SIEMPRE por encima del marcador, y un
     punto coral marca hacia dónde sigue el camino. */

const TOL      = 15;   // desviación máxima respecto al centro de la guía (el camino gris mide 30 de ancho)
const TOL_INI  = 24;   // margen para empezar sobre el punto verde
const META     = 0.97; // hay que recorrer el 97% del trazo
const VENTANA  = 40;   // cuántos puntos hacia adelante se pueden avanzar de una vez
const CHUNK    = 14;   // puntos por trocito de marcador (los trocitos se superponen y oscurecen)
const ADELANTE = 18;   // cuántos puntos más adelante se muestra el punto "sigue por aquí"

let trazo = null;

const partesDe = L => L.ds || [L.d];
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
/* distancia de un punto al segmento a-b: sirve para detectar atajos */
function distSeg(p, a, b){
  const vx = b.x-a.x, vy = b.y-a.y;
  const len2 = vx*vx + vy*vy;
  if(len2 === 0) return dist(p, a);
  let t = ((p.x-a.x)*vx + (p.y-a.y)*vy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t*vx), p.y - (a.y + t*vy));
}

function pizarraHTML(L, etiqueta){
  const ds = partesDe(L);
  const guias = ds.map((d,i)=>`<path class="guia${i ? " tenue" : ""}" id="guia${i}" d="${d}"/>`).join("");
  const punts = ds.map((d,i)=>`<path class="guiaPunteada" id="punt${i}" d="${d}"${i ? ' style="display:none"' : ""}/>`).join("");
  return `
    <div class="pizarra" id="pizarra">
      <svg id="svgLetra" viewBox="0 0 240 240" aria-label="${etiqueta}">
        <line class="pauta" x1="6" y1="30" x2="234" y2="30"/>
        <line class="pauta media" x1="6" y1="105" x2="234" y2="105"/>
        <line class="pauta base" x1="6" y1="180" x2="234" y2="180"/>
        <line class="pauta" x1="6" y1="232" x2="234" y2="232"/>
        ${guias}
        <g id="marcas"></g>
        ${punts}
        <path id="demoPath" class="demo" d="${ds[0]}"/>
        <circle id="proximo" class="proximo" r="9" style="display:none"/>
        <circle id="pIni" class="puntoInicio pulsa" r="13"/>
        <circle id="lapiz" class="lapiz" r="10" style="display:none"/>
      </svg>
    </div>
    <div class="barraTrazo"><i id="barra"></i></div>`;
}

function iniciaTrazo(L, k){
  const svg = $("svgLetra");
  trazo = {
    svg, L, k, ds: partesDe(L), parte: 0,
    pts: [], N: 0, largo: 0, i: 0, prev: null,
    dibujando: false, listo: false, demoOn: false, demoTok: 0,
    chunk: null, chunkIni: 0, ultimo: 0, chunksParte: []
  };

  const aSvg = ev => {
    const m = svg.getScreenCTM().inverse();
    try { return new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m); }
    catch(_){ const q = svg.createSVGPoint(); q.x=ev.clientX; q.y=ev.clientY; return q.matrixTransform(m); }
  };

  svg.addEventListener("pointerdown", e=>{
    if(!trazo || trazo.listo || cerrado) return;
    e.preventDefault();
    if(trazo.demoOn){ cancelaDemo(); }
    const p = aSvg(e);
    if(trazo.i === 0 && dist(p, trazo.pts[0]) > TOL_INI){
      $("pIni").classList.add("pulsa");
      aviso("ups", "Empieza justo en el punto verde 🟢");
      dice("Empieza justo en el punto verde.");
      return;
    }
    if(trazo.i > 0 && dist(p, trazo.pts[trazo.i]) > TOL){
      aviso("ups", "Sigue desde donde ibas, sin saltarte nada.");
      return;
    }
    trazo.dibujando = true;
    trazo.prev = p;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){ }
    $("lapiz").style.display = "";
    mueveLapiz(p);
  });

  svg.addEventListener("pointermove", e=>{
    if(!trazo || !trazo.dibujando || trazo.listo) return;
    e.preventDefault();
    let evs = [e];
    if(e.getCoalescedEvents){
      const c = e.getCoalescedEvents();
      if(c && c.length) evs = c;
    }
    for(const ev of evs){ if(!avanza(aSvg(ev))) break; }
  });

  const soltar = () => {
    if(!trazo || !trazo.dibujando) return;
    trazo.dibujando = false;
    const l = $("lapiz"); if(l) l.style.display = "none";
    if(trazo.listo) return;
    if(trazo.i/trazo.N >= META) exitoParte();
    else falla("levanto");
  };
  svg.addEventListener("pointerup", soltar);
  svg.addEventListener("pointercancel", soltar);
  svg.addEventListener("pointerleave", soltar);

  preparaParte(0);
}

/* Deja lista la parte p de la letra: puntos, punto verde, guía activa. */
function preparaParte(p){
  trazo.parte = p;
  const guia = $("guia"+p);
  const largo = guia.getTotalLength();
  const N = Math.max(60, Math.round(largo/2));
  const pts = [];
  for(let i=0;i<=N;i++) pts.push(guia.getPointAtLength(largo*i/N));
  trazo.pts = pts; trazo.N = N; trazo.largo = largo;
  trazo.i = 0; trazo.prev = null; trazo.dibujando = false;
  trazo.chunk = null; trazo.chunkIni = 0; trazo.ultimo = 0; trazo.chunksParte = [];

  trazo.ds.forEach((_,i)=>{
    const g = $("guia"+i), pu = $("punt"+i);
    if(g) g.classList.toggle("tenue", i !== p);
    if(pu) pu.style.display = (i === p) ? "" : "none";
  });
  const dp = $("demoPath");
  if(dp){ dp.setAttribute("d", trazo.ds[p]); dp.style.strokeDasharray = largo; dp.style.strokeDashoffset = largo; }
  const ini = $("pIni");
  ini.style.display = "";
  ini.setAttribute("cx", pts[0].x);
  ini.setAttribute("cy", pts[0].y);
  ini.classList.add("pulsa");
  pintaBarra();
  muestraProximo(true);
}

/* ---------- marcador ---------- */
function nuevoChunk(desde){
  const g = $("marcas"); if(!g) return;
  const el = document.createElementNS("http://www.w3.org/2000/svg","path");
  el.setAttribute("class","marca");
  g.appendChild(el);
  trazo.chunk = el;
  trazo.chunkIni = desde;
  trazo.chunksParte.push(el);
}
/* Los trocitos comparten sólo el punto de unión, nunca un tramo entero:
   si compartieran tramo se pintaría dos veces y aparecerían bandas oscuras. */
function pintaMarca(){
  if(!trazo.chunk || trazo.i - trazo.chunkIni >= CHUNK) nuevoChunk(trazo.ultimo);
  let d = "";
  for(let k = trazo.chunkIni; k <= trazo.i; k++){
    const p = trazo.pts[k];
    d += (k === trazo.chunkIni ? "M " : " L ") + p.x.toFixed(1) + " " + p.y.toFixed(1);
  }
  trazo.chunk.setAttribute("d", d);
  trazo.ultimo = trazo.i;
  const ini = $("pIni");
  if(ini && trazo.i > 2){ ini.classList.remove("pulsa"); ini.style.display = "none"; }
}
function borraMarcasParte(){
  trazo.chunksParte.forEach(el=>el.remove());
  trazo.chunksParte = [];
  trazo.chunk = null; trazo.chunkIni = 0; trazo.ultimo = 0;
}
function pintaBarra(){
  const barra = $("barra"); if(!barra) return;
  const pc = (trazo.parte + trazo.i/trazo.N) / trazo.ds.length;
  barra.style.width = Math.round(pc*100) + "%";
}
/* Punto coral un poco más adelante: se ve más allá del dedo y dice hacia dónde sigue. */
function muestraProximo(ver){
  const c = $("proximo"); if(!c) return;
  if(!ver || trazo.listo){ c.style.display = "none"; return; }
  const j = Math.min(trazo.N, trazo.i + ADELANTE);
  c.setAttribute("cx", trazo.pts[j].x);
  c.setAttribute("cy", trazo.pts[j].y);
  c.style.display = "";
}

/* Devuelve false cuando el intento terminó (por acierto o por falla) */
function avanza(p){
  mueveLapiz(p);

  /* 1) Se avanza punto a punto mientras el dedo se vaya ACERCANDO al siguiente.
        Así nunca se salta un pico ni el cruce de un bucle, aunque los dos
        tramos de la letra pasen uno al lado del otro. */
  let j = trazo.i;
  let dj = dist(p, trazo.pts[j]);
  const lim = Math.min(trazo.N, trazo.i + VENTANA);
  while(j < lim){
    const dn = dist(p, trazo.pts[j+1]);
    if(dn <= dj + 0.4){ j++; dj = dn; } else break;
  }

  /* ¿se salió del camino? Se permite dudar y retroceder un poco. */
  if(dj > TOL){
    let atras = dj;
    for(let q = Math.max(0, trazo.i - 12); q < trazo.i; q++){
      const d2 = dist(p, trazo.pts[q]);
      if(d2 < atras) atras = d2;
    }
    if(atras > TOL){ falla("fuera"); return false; }
    trazo.prev = p;
    return true;
  }

  /* 2) No se puede avanzar por la letra más de lo que se movió el dedo.
        Esto evita que en las puntas (donde el trazo de subida y el de bajada
        quedan pegados) salte de un lado al otro sin recorrer la curva.
        Aquí no se falla: simplemente no avanza. */
  if(j > trazo.i && trazo.prev){
    const arcoPaso = trazo.largo / trazo.N;
    const maxPasos = Math.ceil((dist(trazo.prev, p) + 14) / arcoPaso);
    if(j - trazo.i > maxPasos) j = trazo.i + maxPasos;
  }

  /* 3) ¿pasó por encima de todos los puntos intermedios? Nada de cortar camino. */
  if(j > trazo.i && trazo.prev){
    for(let k = trazo.i + 1; k <= j; k++){
      if(distSeg(trazo.pts[k], trazo.prev, p) > TOL){ falla("atajo"); return false; }
    }
  }
  trazo.prev = p;

  if(j > trazo.i){
    trazo.i = j;
    pintaMarca();
    pintaBarra();
    muestraProximo(true);
    if(trazo.i/trazo.N >= META){ exitoParte(); return false; }
  }
  return true;
}

function mueveLapiz(p){
  const l = $("lapiz");
  if(l){ l.setAttribute("cx", p.x); l.setAttribute("cy", p.y); }
}
function reiniciaTrazo(){
  if(!trazo || !trazo.svg || !trazo.svg.isConnected) return;
  borraMarcasParte();
  trazo.i = 0; trazo.prev = null; trazo.listo = false; trazo.dibujando = false;
  const l = $("lapiz"); if(l) l.style.display = "none";
  const ini = $("pIni");
  ini.style.display = "";
  ini.setAttribute("cx", trazo.pts[0].x);
  ini.setAttribute("cy", trazo.pts[0].y);
  ini.classList.add("pulsa");
  pintaBarra();
  muestraProximo(true);
}

/* Terminó una parte: si la letra tiene otra (el palito de la te), sigue con ella. */
function exitoParte(){
  if(trazo.listo) return;
  trazo.dibujando = false;
  const l = $("lapiz"); if(l) l.style.display = "none";
  if(trazo.parte < trazo.ds.length - 1){
    pito(true);
    const g = $("guia"+trazo.parte); if(g) g.classList.add("hecha");
    const txt = trazo.L.paso2 || "¡Muy bien! Ahora la segunda parte: empieza otra vez en el punto verde.";
    aviso("ok", txt);
    const s = serie;
    preparaParte(trazo.parte + 1);
    dice(txt).then(()=>{ if(s === serie && trazo && !trazo.listo) $("pIni").classList.add("pulsa"); });
    return;
  }
  exitoTrazo();
}

function exitoTrazo(){
  trazo.listo = true; trazo.dibujando = false;
  const m = $("marcas"); if(m) m.classList.add("ok");
  muestraProximo(false);
  const barra = $("barra"); if(barra) barra.style.width = "100%";
  const l = $("lapiz"); if(l) l.style.display = "none";
  $("pIni").classList.remove("pulsa");
  $("pIni").style.display = "none";
  pito(true); sumaEstrella();
  $("escena").classList.add("bien");
  const L = trazo.L;
  const txt = `${animo()} Trazaste la ${L.son} completa y sin salirte. La ${L.son} de ${L.ej}.`;
  aviso("ok", txt);
  cierra(txt);
}

function falla(motivo){
  if(trazo.listo) return;
  trazo.dibujando = false;
  const l = $("lapiz"); if(l) l.style.display = "none";
  const piz = $("pizarra");
  if(piz){ piz.classList.add("mal"); setTimeout(()=>piz.classList.remove("mal"), 600); }
  pito(false);
  intentos++;
  reiniciaTrazo();
  const pistas = {
    fuera:  "Te saliste de la línea. Empieza otra vez desde el punto verde y mantén el dedo dentro del camino gris.",
    atajo:  "No cortes camino: hay que recorrer toda la línea, sin saltarse las curvas.",
    levanto:"Te faltó llegar al final. No levantes el dedo hasta terminar."
  };
  const pista = pistas[motivo] || pistas.fuera;
  aviso("ups", `${casi()} ${pista}`);
  const s = serie;
  dice(`${casi()} ${pista}`).then(r=>{
    if(r !== "reemplazada" && s === serie && intentos >= 2) demo(false);
  });
}

function cancelaDemo(){
  if(!trazo || !trazo.demoOn) return;
  trazo.demoTok++;
  trazo.demoOn = false;
  const dp = $("demoPath"); if(dp) dp.style.strokeDashoffset = trazo.largo;
  const l = $("lapiz"); if(l) l.style.display = "none";
  aviso("", "");
  muestraProximo(true);
}
function demo(conVoz){
  if(!trazo || trazo.listo || !trazo.svg.isConnected) return;
  const s = serie;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(conVoz) dice(`Mira cómo se escribe la ${trazo.L.son}.`);
  if(reduce){ aviso("", "Empieza en el punto verde y sigue la línea hasta el final."); return; }
  trazo.demoOn = true;
  const tok = ++trazo.demoTok;
  const dp = $("demoPath"), lap = $("lapiz"), guia = $("guia"+trazo.parte);
  dp.style.strokeDashoffset = trazo.largo;
  lap.style.display = "";
  const t0 = performance.now(), dur = 2600;
  function paso(t){
    if(s !== serie || !trazo || trazo.demoTok !== tok || !trazo.svg.isConnected) return;
    const k = Math.min(1, (t - t0)/dur);
    dp.style.strokeDashoffset = trazo.largo * (1 - k);
    const p = guia.getPointAtLength(trazo.largo * k);
    lap.setAttribute("cx", p.x); lap.setAttribute("cy", p.y);
    if(k < 1) requestAnimationFrame(paso);
    else setTimeout(()=>{
      if(s !== serie || !trazo || trazo.demoTok !== tok || !trazo.svg.isConnected) return;
      lap.style.display = "none";
      dp.style.strokeDashoffset = trazo.largo;
      trazo.demoOn = false;
      aviso("", "Ahora hazlo tú: empieza en el punto verde 🟢");
      muestraProximo(true);
    }, 600);
  }
  requestAnimationFrame(paso);
}

/* ==================== LAS 12 LETRAS DEL DICTADO ==================== */
const LETRAS = {

  g:{ son:"ge", ej:"gato",    emo:"🐱", tip:"La ge es una ce con una colita que baja y da la vuelta.", d:'M 130 122 C 124 104 98 98 82 114 C 64 132 70 164 92 170 C 108 175 124 166 128 152 C 130 176 128 192 124 206 C 118 226 100 234 86 226 C 74 219 82 204 102 196 C 120 189 134 180 144 169' },
  y:{ son:"ye", ej:"yogur",   emo:"🥛", tip:"La ye tiene una colita que baja y da la vuelta.", d:'M 56 176 C 60 148 68 118 74 104 C 77 97 84 100 81 110 C 76 136 72 160 80 168 C 90 176 106 168 112 152 C 116 138 120 116 122 104 C 124 96 131 99 128 110 C 124 138 118 170 114 192 C 110 220 96 234 82 226 C 70 219 78 204 98 196 C 116 189 132 180 142 169' },
  n:{ son:"ene", ej:"nube",   emo:"☁️", tip:"La ene tiene una montañita.", d:'M 56 178 C 60 148 66 118 72 104 C 74 98 80 100 78 110 C 84 96 104 92 114 106 C 122 118 118 150 116 166 C 114 178 128 184 144 176 C 154 171 162 164 168 156' }
};

/* Nivel 1: escucho el nombre de la letra y la toco. Los distractores son
   justo las letras que se le parecen. */
const OIR = [
  { l:"d", op:["d","b","p","g"] },
  { l:"b", op:["b","d","p","l"] },
  { l:"f", op:["f","t","l","b"] },
  { l:"l", op:["l","t","f","b"] },
  { l:"t", op:["t","f","l","d"] },
  { l:"c", op:["c","s","g","r"] },
  { l:"r", op:["r","s","m","t"] },
  { l:"g", op:["g","c","y","p"] },
  { l:"y", op:["y","g","p","r"] },
  { l:"m", op:["m","n","s","r"] }
];

/* Nivel 2: las que escribe con el dedo. Van las tres que falló en el dictado
   de agosto (d, b, f) y las cinco nuevas del temario (t, c, r, g, y). */
const ORDEN_TRAZO = ["d","b","f","t","c","r","g","y"];

/* Nivel 3: ¿con qué letra empieza? */
const INICIALES = [
  { p:"mano",   emo:"✋", l:"m", op:["m","n","p"] },
  { p:"sol",    emo:"☀️", l:"s", op:["s","c","r"] },
  { p:"pelota", emo:"⚽", l:"p", op:["p","b","d"] },
  { p:"tomate", emo:"🍅", l:"t", op:["t","l","f"] },
  { p:"casa",   emo:"🏠", l:"c", op:["c","s","g"] },
  { p:"gato",   emo:"🐱", l:"g", op:["g","c","y"] },
  { p:"ratón",  emo:"🐭", l:"r", op:["r","s","m"] },
  { p:"yogur",  emo:"🥛", l:"y", op:["y","g","l"] },
  { p:"foca",   emo:"🦭", l:"f", op:["f","t","b"] },
  { p:"balde",  emo:"🪣", l:"b", op:["b","d","p"] }
];

const PREMIOS = ["🌙","🐬","🪣","🌲","🦭","✋","🍉","🍅","🏠","🐭","🐱","🥛","⚽","☀️","⭐","🌟","✏️","📖","🌈","🦋","🎈","🍀","🐞","🌻"];

let nivel = 1, idx = 0, estrellas = 0, album = [], intentos = 0, cerrado = false, serie = 0;

function aviso(tipo, txt){
  const a = $("aviso");
  a.className = "aviso" + (tipo ? " "+tipo : "");
  a.textContent = txt || "";
}
function sumaEstrella(){
  estrellas++;
  $("puntaje").textContent = "⭐ " + estrellas;
  album.push(PREMIOS[(estrellas-1) % PREMIOS.length]);
}
function cierra(txtVoz){
  cerrado = true;
  const s = serie;
  $("avanzar").innerHTML = `<button class="btn hoja" id="btnSig">Siguiente ▶️</button>`;
  $("btnSig").onclick = ()=>{ if(window.speechSynthesis) speechSynthesis.cancel(); siguiente(); };
  const t0 = Date.now();
  const minimo = Math.min(9000, 2200 + txtVoz.length*45);
  dice(txtVoz).then(r=>{
    if(r === "reemplazada" || s !== serie || !cerrado) return;
    const falta = Math.max(1200, minimo - (Date.now() - t0));
    setTimeout(()=>{ if(s === serie && cerrado && !hablando()) siguiente(); }, falta);
  });
}
function siguiente(){
  if(!cerrado) return;
  cerrado = false;
  idx++;
  const largo = nivel===1 ? OIR.length : nivel===2 ? ORDEN_TRAZO.length : INICIALES.length;
  if(idx >= largo){ idx = 0; nivel++; }
  if(nivel > 3){ terminar(); return; }
  render();
}

/* botón de letra: minúscula grande y mayúscula chica, como en el cuaderno */
function botonLetra(l){
  return `<button class="letraBtn" data-l="${l}" aria-label="letra ${LETRAS[l] ? LETRAS[l].son : l}">
      ${l}<small>${l.toUpperCase()}</small></button>`;
}

/* ==================== NIVEL 1: ESCUCHO Y TOCO LA LETRA ==================== */
function nivel1(){
  const it = OIR[idx], L = LETRAS[it.l];
  $("chip").textContent = `Nivel 1 · ${idx+1} de ${OIR.length}`;
  $("pregunta").textContent = "Escucha y toca la letra";
  $("escena").className = "escena";
  $("escena").innerHTML = `
    <div class="oreja">👂</div>
    <div class="pista-escucha">Toca 🔁 si quieres escucharla otra vez</div>`;
  $("respuesta").innerHTML = `
    <div class="banco">${mezclar(it.op).map(botonLetra).join("")}</div>
    <div class="controles" style="margin-top:10px">
      <button class="ctrl audio" id="repetir">🔁 Escuchar otra vez</button>
    </div>`;
  $("avanzar").innerHTML = "";
  aviso("", "");
  intentos = 0;
  const frase = `Escribe la letra ${L.son}. La ${L.son} de ${L.ej}.`;
  $("repetir").onclick = ()=>dice(frase);
  document.querySelectorAll(".letraBtn").forEach(b=>{
    b.onclick = ()=>revisa1(b, b.dataset.l, it.l);
  });
  dice(frase);
}
function revisa1(btn, elegida, correcta){
  if(cerrado || btn.disabled) return;
  const L = LETRAS[correcta];
  if(elegida === correcta){
    btn.classList.add("bien"); clic(); pito(true); sumaEstrella();
    document.querySelectorAll(".letraBtn").forEach(b=>b.disabled = true);
    $("escena").classList.add("bien");
    const txt = `${animo()} Esa es la ${L.son}, la ${L.son} de ${L.ej}. ${L.tip}`;
    aviso("ok", txt);
    cierra(txt);
  }else{
    btn.classList.add("mal"); btn.disabled = true; pito(false);
    intentos++;
    const E = LETRAS[elegida];
    const pista = E ? `Esa es la ${E.son}, la de ${E.ej}. Busca la ${L.son}, la de ${L.ej}.`
                    : `Busca la ${L.son}, la de ${L.ej}.`;
    aviso("ups", `${casi()} ${pista}`);
    dice(`${casi()} ${pista}`);
  }
}

/* ==================== NIVEL 2: ESCRIBO LA LETRA CON EL DEDO ==================== */
function nivel2(){
  const k = ORDEN_TRAZO[idx], L = LETRAS[k];
  $("chip").textContent = `Nivel 2 · ${idx+1} de ${ORDEN_TRAZO.length}`;
  $("pregunta").textContent = "Escribe la letra con el dedo";
  $("escena").className = "escena";
  $("escena").innerHTML = `
    <div class="filaTrazo">
      <div class="chipLetra"><span class="emo">${L.emo}</span> la ${L.son} de <b>${L.ej}</b></div>
      ${pizarraHTML(L, "Pizarra para trazar la letra "+L.son)}
    </div>`;
  $("respuesta").innerHTML = `<div class="controles">
      <button class="ctrl audio" id="verComo">👀 Ver cómo se hace</button>
      <button class="ctrl quitar" id="limpiar">↩️ Empezar de nuevo</button>
    </div>`;
  $("avanzar").innerHTML = "";
  aviso("", "");
  intentos = 0;
  iniciaTrazo(L, k);
  $("verComo").onclick = ()=>demo(true);
  $("limpiar").onclick = ()=>{ reiniciaTrazo(); aviso("", ""); };
  const s = serie;
  const dosPartes = (L.ds && L.ds.length > 1) ? " Esta letra se escribe en dos partes." : "";
  dice(`Vamos a escribir la ${L.son}, la ${L.son} de ${L.ej}.${dosPartes} Mira cómo se hace y después hazlo tú. Empieza en el punto verde y no te salgas de la línea.`)
    .then(r=>{ if(r !== "reemplazada" && s === serie) demo(false); });
}

/* ==================== NIVEL 3: ¿CON QUÉ LETRA EMPIEZA? ==================== */
function nivel3(){
  const it = INICIALES[idx], L = LETRAS[it.l];
  $("chip").textContent = `Nivel 3 · ${idx+1} de ${INICIALES.length}`;
  $("pregunta").textContent = "¿Con qué letra empieza?";
  $("escena").className = "escena";
  $("escena").innerHTML = `
    <div class="emojote">${it.emo}</div>
    <div class="modelo">${it.p}</div>`;
  $("respuesta").innerHTML = `<div class="banco">${mezclar(it.op).map(botonLetra).join("")}</div>`;
  $("avanzar").innerHTML = "";
  aviso("", "");
  intentos = 0;
  document.querySelectorAll(".letraBtn").forEach(b=>{
    b.onclick = ()=>revisa3(b, b.dataset.l, it);
  });
  dice(`${it.p}. ¿Con qué letra empieza ${it.p}?`);
}
function revisa3(btn, elegida, it){
  if(cerrado || btn.disabled) return;
  const L = LETRAS[it.l];
  if(elegida === it.l){
    btn.classList.add("bien"); clic(); pito(true); sumaEstrella();
    document.querySelectorAll(".letraBtn").forEach(b=>b.disabled = true);
    $("escena").classList.add("bien");
    const txt = `${animo()} ${it.p} empieza con ${L.son}. ${L.tip}`;
    aviso("ok", txt);
    cierra(txt);
  }else{
    btn.classList.add("mal"); btn.disabled = true; pito(false);
    intentos++;
    const E = LETRAS[elegida];
    const pista = `Escucha el comienzo: ${it.p.charAt(0)}... ${it.p}.` + (E ? ` Esa es la ${E.son}.` : "");
    aviso("ups", `${casi()} ${pista}`);
    dice(`${casi()} ${pista}`);
  }
}

/* ==================== FLUJO ==================== */
function render(){
  serie++;
  if(nivel === 1) nivel1();
  else if(nivel === 2) nivel2();
  else nivel3();
}
function terminar(){
  serie++;
  pantalla("final");
  $("album").innerHTML = album.map(e=>`<span>${e}</span>`).join("");
  const total = OIR.length + ORDEN_TRAZO.length + INICIALES.length;
  $("resumen").textContent = `Juntaste ${estrellas} estrellas de ${total}. Reconociste las letras al escucharlas, las escribiste con el dedo y descubriste con cuál empieza cada palabra. ¡Estás lista para el dictado!`;
  confeti(["⭐","✏️","🎉","📖"]);
  dice(`${animo()} Juntaste ${estrellas} estrellas. Ya sabes las doce letras del dictado. Si quieres, juega de nuevo.`);
}
function arranca(){
  audio();
  nivel = 1; idx = 0; estrellas = 0; album = []; cerrado = false;
  $("puntaje").textContent = "⭐ 0";
  pantalla("juego");
  render();
}
conectarVoz();
$("btnEmpezar").onclick = arranca;
$("btnOtraVez").onclick = arranca;

</script>

<script id="selva-js">
/* ==========================================================================
   SELVA v2 · comportamiento común
   1. Guarda el progreso (veces jugada y mejor puntaje) para que la portada
      muestre las estrellas ganadas. Solo en este dispositivo, sin internet.
   2. Si ya hay estrellas en la ronda, "Inicio" pregunta antes de salir.
   3. Hace saltar el contador cuando se gana una estrella.
   4. Etiqueta los botones que solo tienen un ícono.
   ========================================================================== */
(function(){
  var CLAVE = "aprendo:progreso";
  var ruta = decodeURIComponent(location.pathname).replace(/^.*?(\d+-basico\/)/, "$1");
  var $ = function(s){ return document.querySelector(s); };

  function estrellas(){
    var el = $("#puntaje, #cuenta");
    var m = el && el.textContent.match(/\d+/);
    return m ? +m[0] : 0;
  }
  function registrar(){
    var d = {};
    try{ d = JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){}
    var r = d[ruta] || { veces:0, mejor:0 };
    r.veces++;
    r.mejor = Math.max(r.mejor || 0, estrellas());
    r.ultima = new Date().toISOString().slice(0, 10);
    d[ruta] = r;
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
  }

  /* 1. fin de la actividad: pantalla #final (juegos) o #pFinal (misiones) */
  var fin = $("#final, #pFinal");
  if(fin){
    var visto = false;
    new MutationObserver(function(){
      var ve = fin.classList.contains("activa") || (fin.id === "pFinal" && !fin.hidden);
      if(ve && !visto){ visto = true; setTimeout(registrar, 400); }
      if(!ve) visto = false;
    }).observe(fin, { attributes:true, attributeFilter:["class", "hidden"] });
  }
  /* presentaciones: cuenta como vista al llegar a la última diapositiva */
  var cont = $("#contador");
  if(cont && !fin){
    var vista = false;
    new MutationObserver(function(){
      var p = cont.textContent.match(/(\d+)\s*\/\s*(\d+)/);
      if(p && p[1] === p[2] && !vista){ vista = true; registrar(); }
    }).observe(cont, { childList:true, characterData:true, subtree:true });
  }

  /* 2. confirmar antes de salir a mitad de una ronda */
  function enRonda(){
    return !!$("#juego.activa, #ensayo.activa, #pJuego:not([hidden])") && estrellas() > 0;
  }
  var dlg = null;
  function preguntarSalida(destino){
    if(!window.HTMLDialogElement){ location.href = destino; return; }
    if(!dlg){
      dlg = document.createElement("dialog");
      dlg.className = "selva-dialogo";
      dlg.innerHTML =
        '<div class="selva-dialogo-emo" aria-hidden="true">🏠</div>' +
        '<h2>¿Quieres salir?</h2>' +
        '<p>Si sales ahora, se pierden las estrellas de esta ronda.</p>' +
        '<button class="selva-seguir" value="seguir">▶️ Seguir jugando</button>' +
        '<button class="selva-salir" value="salir">Salir</button>';
      dlg.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        dlg.close();
        if(b.value === "salir") location.href = dlg.dataset.destino;
      });
      document.body.appendChild(dlg);
    }
    dlg.dataset.destino = destino;
    dlg.showModal();
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance("¿Quieres salir? Si sales ahora, se pierden las estrellas de esta ronda.");
        u.lang = "es-ES"; speechSynthesis.speak(u);
      }
    }catch(e){}
    dlg.querySelector(".selva-seguir").focus();
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href$="index.html"]');
    if(!a || !enRonda()) return;
    e.preventDefault();
    preguntarSalida(a.href);
  }, true);

  /* 3. el contador salta al ganar una estrella */
  var pts = $("#puntaje");
  if(pts){
    var antes = estrellas();
    new MutationObserver(function(){
      var ahora = estrellas();
      if(ahora > antes){
        pts.classList.remove("salta"); void pts.offsetWidth; pts.classList.add("salta");
      }
      antes = ahora;
    }).observe(pts, { childList:true, characterData:true, subtree:true });
  }

  /* 4. etiquetas para lectores de pantalla */
  var nombres = { btnGeneral:"Ver todas las diapositivas", btnPantalla:"Pantalla completa", btnVoz:"Voz", sonido:"Voz y sonidos" };
  Object.keys(nombres).forEach(function(id){
    var b = document.getElementById(id);
    if(b && !b.getAttribute("aria-label") && !/[a-záéíóú]{3}/i.test(b.textContent)) b.setAttribute("aria-label", nombres[id]);
  });
  /* el iPhone no permite pantalla completa en páginas web: se oculta el botón */
  var d = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) d.classList.add("selva-sin-pantalla-completa");
})();
</script>
