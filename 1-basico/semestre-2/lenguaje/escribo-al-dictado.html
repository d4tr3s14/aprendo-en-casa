:root{
  --selva:#0E3B2E; --selva-claro:#17513E; --crema:#FFF6E5;
  --sol:#FFC93C; --coral:#FF6B5A; --agua:#3FC1E0; --hoja:#7ED957;
  --sombra:0 8px 0 rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 10%, rgba(63,193,224,.22), transparent 45%),
    radial-gradient(circle at 88% 82%, rgba(126,217,87,.20), transparent 45%),
    var(--selva);
  color:var(--crema);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:12px;
}
.marco{
  width:min(760px,100%);
  background:var(--selva-claro);
  border:6px solid var(--sol);
  border-radius:34px;
  padding:14px 12px 18px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
  position:relative;overflow:hidden;
}
h1,h2,h3,.btn,.tecla,.puntaje,.numerote,.ecuacion,.contador b,.rot,.opcion b{font-family:'Baloo 2',system-ui,sans-serif}

.barra-sup{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.puntaje{font-size:1.3rem;letter-spacing:2px;color:var(--sol)}
.mini{
  background:transparent;border:3px solid rgba(255,246,229,.35);color:var(--crema);
  border-radius:999px;padding:6px 13px;font-size:.92rem;font-weight:800;cursor:pointer;
  font-family:'Nunito',system-ui,sans-serif;text-decoration:none;display:inline-block;
}
.mini:hover{border-color:var(--sol)}
.mini:focus-visible,.btn:focus-visible,.tecla:focus-visible,.ctrl:focus-visible,.opcion:focus-visible,.varilla:focus-visible{outline:4px solid var(--agua);outline-offset:3px}

.pantalla{display:none;text-align:center}
.pantalla.activa{display:block;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1{font-size:clamp(1.9rem,6.5vw,2.9rem);margin:.2em 0 .1em;color:var(--sol);line-height:1.05}
h1 span{display:block;color:var(--crema);font-size:.4em;letter-spacing:1px}
.intro{font-size:1.05rem;max-width:44ch;margin:0 auto 16px;line-height:1.5}
.iconos{font-size:clamp(2.2rem,9vw,3.2rem);letter-spacing:.1em;margin:6px 0 2px}
.iconos span{display:inline-block;animation:flota 3s ease-in-out infinite}
.iconos span:nth-child(2){animation-delay:.4s}
.iconos span:nth-child(3){animation-delay:.8s}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.btn{
  background:var(--coral);color:#fff;border:none;border-radius:999px;
  padding:15px 30px;font-size:1.35rem;font-weight:800;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .12s;
}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.sol{background:var(--sol);color:var(--selva)}
.btn.agua{background:var(--agua);color:var(--selva)}
.btn.hoja{background:var(--hoja);color:var(--selva)}

.nivel-chip{
  display:inline-block;background:rgba(255,246,229,.14);border-radius:999px;
  padding:4px 14px;font-size:.9rem;font-weight:800;margin-bottom:6px;color:var(--crema);
}
.pregunta{font-size:clamp(1.15rem,4.3vw,1.55rem);margin:0 0 10px;color:var(--sol);font-family:'Baloo 2',sans-serif;line-height:1.2}

.escena{
  background:var(--crema);color:var(--selva);
  border-radius:26px;padding:12px 8px;margin:0 auto 12px;
  box-shadow:var(--sombra);min-height:128px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.escena.mal{animation:tiembla .4s}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.escena.bien{animation:brinca .5s}
@keyframes brinca{0%,100%{transform:scale(1)}45%{transform:scale(1.06)}}

.numerote{font-size:clamp(3rem,15vw,4.6rem);line-height:1;color:var(--selva)}

.controles{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;max-width:440px;margin:0 auto}
.ctrl{
  background:var(--crema);color:var(--selva);border:none;border-radius:20px;
  padding:12px 16px;font-size:1.05rem;font-weight:800;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .1s;
  font-family:'Nunito',system-ui,sans-serif;display:flex;align-items:center;gap:6px;
}
.ctrl:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ctrl.quitar{background:#FFD7D2}
.ctrl.listo{background:var(--hoja)}
.ctrl.audio{background:var(--agua)}

.opciones{display:grid;gap:9px;max-width:440px;margin:0 auto}
.opciones.dos{grid-template-columns:1fr 1fr}
.opcion{
  background:var(--crema);color:var(--selva);border:none;border-radius:20px;
  padding:12px 10px;font-size:1.15rem;font-weight:800;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .1s;
  font-family:'Nunito',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;
}
.opcion .emo{font-size:2.6rem}
.opcion b{font-size:1.35rem}
.opcion:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opcion.bien{background:var(--hoja)}
.opcion.mal{background:#FFD7D2;opacity:.75}
.opcion[disabled]{cursor:default}

.aviso{
  min-height:52px;margin-top:10px;font-size:1.05rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 6px;line-height:1.35;
}
.aviso.ok{color:var(--hoja)}
.aviso.ups{color:var(--sol)}

.album{background:var(--crema);border-radius:24px;padding:14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.album span{font-size:2rem;animation:aparece .4s ease both}
@keyframes aparece{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.trofeo{font-size:4.6rem;display:block;animation:flota 2.5s ease-in-out infinite}
.confeti{position:absolute;top:-20px;font-size:1.6rem;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ---------- pizarra de trazo ---------- */
.pizarra{
  width:min(330px,86vw);background:#fff;border-radius:22px;
  box-shadow:inset 0 0 0 3px rgba(14,59,46,.10);touch-action:none;position:relative;
}
/* el viewBox del svg da la proporción: no se depende de aspect-ratio */
.pizarra svg{display:block;width:100%;height:auto;touch-action:none}
.pauta{stroke:#e3d9c2;stroke-width:2}
.pauta.base{stroke:#FF6B5A;stroke-width:2.5}
.pauta.media{stroke-dasharray:7 7}
.pizarra.mal{animation:tiembla .45s}
.pizarra.mal .guia{stroke:#FFC0B6}
.barraTrazo{width:min(330px,86vw);height:12px;background:rgba(14,59,46,.12);border-radius:999px;overflow:hidden}
.barraTrazo i{display:block;height:100%;width:0%;background:var(--hoja);border-radius:999px;transition:width .08s linear}
.guia{fill:none;stroke:#ded4bf;stroke-width:30;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.guiaPunteada{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:2 16}
.hecho{fill:none;stroke:var(--hoja);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.hecho.listo{stroke:var(--hoja)}
.puntoInicio{fill:var(--hoja);stroke:#0E3B2E;stroke-width:3}
.puntoInicio.pulsa{animation:latido 1.3s ease-in-out infinite}
@keyframes latido{0%,100%{r:13}50%{r:18}}
.lapiz{fill:var(--coral);stroke:#fff;stroke-width:3;pointer-events:none}
.letraModelo{font-family:'Baloo 2',sans-serif;font-size:2.2rem;fill:#c9bda4}

.filaTrazo{display:flex;flex-direction:column;align-items:center;gap:8px}
.chipLetra{
  background:rgba(14,59,46,.10);border-radius:14px;padding:3px 16px;
  font-family:'Baloo 2',sans-serif;font-size:1.5rem;color:var(--selva);
}
.chipLetra .emo{font-size:1.6rem}

/* ---------- visor de palabra ---------- */
.visor{
  background:#fff;color:var(--selva);border-radius:20px;
  font-family:'Baloo 2',sans-serif;font-size:clamp(1.8rem,8vw,2.4rem);
  padding:6px 14px;margin:0 auto;min-width:200px;max-width:95%;
  box-shadow:inset 0 0 0 3px rgba(14,59,46,.10);letter-spacing:.10em;min-height:1.5em;
  word-break:break-word;
}
.visor .vacia{color:#c2b79f}
.visor .err{color:var(--coral)}
.emojote{font-size:clamp(3.6rem,17vw,5rem);line-height:1}
.modelo{
  font-family:'Baloo 2',sans-serif;font-size:1.5rem;color:#3d6b57;letter-spacing:.12em;
  background:rgba(14,59,46,.08);border-radius:12px;padding:2px 14px;
}
.silabas{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.silabas span{
  background:var(--sol);color:var(--selva);border-radius:12px;padding:3px 12px;
  font-family:'Baloo 2',sans-serif;font-size:1.25rem;
}

.banco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px;margin:0 auto}
.letraBtn{
  background:var(--crema);color:var(--selva);border:none;border-radius:16px;
  width:56px;height:56px;font-size:1.9rem;font-weight:800;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .1s;font-family:'Baloo 2',sans-serif;
}
.letraBtn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.letraBtn[disabled]{opacity:.35;cursor:default}
.letraBtn:focus-visible{outline:4px solid var(--agua);outline-offset:3px}

@media (max-width:400px){

<body>
<div class="marco">

<script>
/* ==================== UTILIDADES COMUNES ==================== */
const $ = id => document.getElementById(id);
const azar = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const mezclar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

let vozOn = true;
let vozSerie = 0;

/* Parte el texto en trozos cortos: Safari corta las frases muy largas. */
function trozos(txt, max){
  max = max || 130;
  const out = []; let act = "";
  txt.split(" ").forEach(w=>{
    if((act + " " + w).trim().length > max){ if(act) out.push(act.trim()); act = w; }
    else act = (act + " " + w).trim();
  });
  if(act.trim()) out.push(act.trim());
  return out.length ? out : [txt];
}
function eligeVoz(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang==="es-CL") || vs.find(v=>v.lang==="es-MX") ||
         vs.find(v=>v.lang==="es-ES") || vs.find(v=>v.lang.startsWith("es")) || null;
}
/* dice(): promesa que se resuelve SOLO cuando la voz terminó de verdad.
   Resuelve "reemplazada" si otra frase la interrumpió, para que quien esperaba
   el final no avance de pantalla por error. */
function dice(txt){
  const mio = ++vozSerie;
  return new Promise(res=>{
    const espera = Math.min(11000, 1300 + txt.length*58);
    if(!window.speechSynthesis || !vozOn){
      try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
      setTimeout(()=>res(mio === vozSerie ? "sin-voz" : "reemplazada"), espera);
      return;
    }
    try{ speechSynthesis.cancel(); }catch(_){}
    let listo = false, vig = null;
    const fin = r => { if(listo) return; listo = true; if(vig) clearInterval(vig); res(r); };
    const partes = trozos(txt);
    partes.forEach((t,i)=>{
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "es-CL"; u.rate = .85; u.pitch = 1.1;
      const v = eligeVoz(); if(v) u.voice = v;
      if(i === partes.length-1){ u.onend = ()=>fin("fin"); u.onerror = ()=>fin("error"); }
      speechSynthesis.speak(u);
    });
    /* Vigilante: en iOS el evento onend a veces no llega nunca. */
    let arranco = false; const t0 = Date.now();
    vig = setInterval(()=>{
      if(mio !== vozSerie){ fin("reemplazada"); return; }
      if(speechSynthesis.speaking || speechSynthesis.pending) arranco = true;
      else if(arranco){ fin("vigilante"); return; }
      /* Si el motor de voz nunca partió (pasa en iOS con el timbre en silencio),
         se da igualmente el tiempo de lectura antes de continuar. */
      if(!arranco && Date.now() - t0 > 1800){
        clearInterval(vig); vig = null;
        setTimeout(()=>fin("sin-voz"), Math.max(0, espera - 1800));
        return;
      }
      if(Date.now() - t0 > 25000) fin("tope");
    }, 220);
  });
}
function hablar(txt, cb){ const p = dice(txt); if(cb) p.then(cb); return p; }
function hablando(){
  return !!(window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending));
}
/* Un solo AudioContext reutilizado: Safari en iPhone permite muy pocos. */
let ctxAudio = null;
function audio(){
  try{
    if(!ctxAudio) ctxAudio = new (window.AudioContext||window.webkitAudioContext)();
    if(ctxAudio.state === "suspended") ctxAudio.resume();
    return ctxAudio;
  }catch(e){ return null; }
}
function pito(ok){
  const ctx = audio(); if(!ctx) return;
  try{
    const notas = ok ? [523,659,784] : [330,262];
    notas.forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.001,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02+i*.11);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.20+i*.11);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+i*.11); o.stop(ctx.currentTime+.4+i*.11);
    });
  }catch(e){}
}
function clic(){
  const ctx = audio(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(.09,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+.1);
  }catch(e){}
}
function pantalla(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
  $(id).classList.add("activa");
}
function confeti(emojis){
  emojis = emojis || ["⭐","🎉","🌟","✨"];
  for(let i=0;i<24;i++){
    const c = document.createElement("div");
    c.className = "confeti";
    c.textContent = emojis[i%emojis.length];
    c.style.left = Math.random()*100+"%";
    c.style.animationDuration = (2+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*.6)+"s";
    document.querySelector(".marco").appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}
const ANIMOS = ["¡Excelente!","¡Muy bien!","¡Lo lograste!","¡Qué crack!","¡Perfecto!",
  "¡Así se hace!","¡Brillante!","¡Genial!","¡Increíble!","¡Bravo!"];
const CASIS = ["Casi... observa bien.","Casi lo tienes, mira otra vez.","Uy, casi. Inténtalo de nuevo.",
  "No pasa nada, prueba otra vez.","Vas bien, revisa una vez más.","Tranquila, mira con calma."];
let usadosAnimo = [];
function animo(){
  if(usadosAnimo.length >= ANIMOS.length) usadosAnimo = [];
  let f; do { f = ANIMOS[azar(0,ANIMOS.length-1)]; } while(usadosAnimo.includes(f));
  usadosAnimo.push(f); return f;
}
function casi(){ return CASIS[azar(0,CASIS.length-1)]; }

function conectarVoz(){
  const b = $("btnVoz");
  b.addEventListener("click", ()=>{
    vozOn = !vozOn;
    b.textContent = vozOn ? "🔊 Voz" : "🔇 Voz";
    b.setAttribute("aria-pressed", vozOn);
    if(!vozOn && window.speechSynthesis){ vozSerie++; speechSynthesis.cancel(); }
  });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
}

/* ==================== TRAZOS DE LETRA LIGADA ====================
   Marco 240x240 · techo 30 · media 105 · base 180 · pie 232 */
const LETRAS = {
  l: { son:"ele", ej:"luna",   emo:"🌙", d:'M 60 180 C 64 136 76 58 94 36 C 108 19 122 30 114 60 C 106 92 90 126 86 152 C 82 173 98 185 118 178 C 134 172 146 164 156 152' },
  d: { son:"de",  ej:"delfín", emo:"🐬", d:'M 124 112 C 118 96 94 94 80 110 C 64 128 72 160 92 166 C 110 171 124 158 126 140 L 146 40 C 149 28 159 31 156 44 L 134 152 C 130 172 149 182 171 170' },
  b: { son:"be",  ej:"balde",  emo:"🪣", d:'M 60 180 C 64 136 76 58 94 36 C 108 19 122 30 114 60 C 106 92 90 128 86 154 C 83 174 102 186 124 176 C 146 166 158 138 146 122 C 134 107 108 114 106 136 C 104 156 122 168 146 160 C 158 156 168 149 176 140' },
  p: { son:"pe",  ej:"pino",   emo:"🌲", d:'M 80 98 C 70 146 60 194 54 220 C 52 232 42 231 45 218 C 53 174 66 124 80 98 C 94 72 132 82 132 114 C 132 146 104 172 72 172 C 66 172 64 168 66 164 C 74 180 102 184 126 174 C 140 168 150 160 158 150' },
  f: { son:"efe", ej:"foca",   emo:"🦭", d:'M 58 178 C 64 138 76 62 94 38 C 106 22 120 34 112 62 C 102 98 82 158 72 198 C 66 222 52 232 42 224 C 34 218 40 206 54 206 C 78 206 112 196 134 182' },
  n: { son:"ene", ej:"nube",   emo:"☁️", d:'M 56 178 C 60 148 66 118 72 104 C 74 98 80 100 78 110 C 84 96 104 92 114 106 C 122 118 118 150 116 166 C 114 178 128 184 144 176 C 154 171 162 164 168 156' },
  m: { son:"eme", ej:"mano",   emo:"✋", d:'M 44 178 C 48 148 54 118 60 104 C 62 98 68 100 66 110 C 72 96 90 92 98 106 C 104 116 100 146 98 164 C 100 138 104 112 110 102 C 116 92 134 94 140 108 C 146 120 142 150 140 166 C 138 178 152 184 168 176 C 178 172 186 165 192 157' },
  s: { son:"ese", ej:"sandía", emo:"🍉", d:'M 58 178 C 74 156 92 126 104 102 C 108 93 115 97 111 107 C 116 130 110 154 94 168 C 84 176 70 178 62 172 C 72 184 102 184 124 174 C 138 168 148 161 156 152' }
};
const ORDEN_LETRAS = ["l","d","b","p","f","n","m","s"];

/* Qué tan exigente es el trazo (en unidades del marco de 240) */
const TOL      = 15;   // desviación máxima respecto al centro de la guía (el camino gris mide 30 de ancho)
const TOL_INI  = 24;   // margen para empezar sobre el punto verde
const META     = 0.97; // hay que recorrer el 97% de la letra
const VENTANA  = 40;   // cuántos puntos hacia adelante se pueden avanzar de una vez

/* ==================== PALABRAS DEL DICTADO ==================== */
const PALS = [
  { p:"luna",   emo:"🌙", sil:["lu","na"] },
  { p:"pino",   emo:"🌲", sil:["pi","no"] },
  { p:"balde",  emo:"🪣", sil:["bal","de"] },
  { p:"delfín", emo:"🐬", sil:["del","fín"] },
  { p:"lupa",   emo:"🔍", sil:["lu","pa"] },
  { p:"sandía", emo:"🍉", sil:["san","dí","a"] },
  { p:"tomate", emo:"🍅", sil:["to","ma","te"] },
  { p:"pelota", emo:"⚽", sil:["pe","lo","ta"] }
];

/* ==================== PARES QUE SUENAN PARECIDO ==================== */
const PARES = [
  { a:{p:"luna",emo:"🌙"}, b:{p:"lupa",emo:"🔍"}, clave:"El final: lu-NA termina con na." },
  { a:{p:"dado",emo:"🎲"}, b:{p:"dedo",emo:"☝️"}, clave:"El medio: da-do lleva a; de-do lleva e." },
  { a:{p:"foca",emo:"🦭"}, b:{p:"boca",emo:"👄"}, clave:"El comienzo: la efe sopla, la be suena con los labios." },
  { a:{p:"pato",emo:"🦆"}, b:{p:"gato",emo:"🐱"}, clave:"El comienzo: pa suena con los labios, ga suena atrás." },
  { a:{p:"mano",emo:"✋"}, b:{p:"mono",emo:"🐒"}, clave:"El medio: ma-no lleva a; mo-no lleva o." },
  { a:{p:"sopa",emo:"🍲"}, b:{p:"ropa",emo:"👕"}, clave:"El comienzo: la ese silba, la erre suena fuerte." },
  { a:{p:"bota",emo:"👢"}, b:{p:"bola",emo:"⚽"}, clave:"El medio: bo-TA con te; bo-LA con ele." },
  { a:{p:"pino",emo:"🌲"}, b:{p:"piña",emo:"🍍"}, clave:"El medio: pi-NO con ene; pi-ÑA con eñe." }
];

const PREMIOS = ["🌙","🐬","🪣","🌲","🦭","☁️","✋","🍉","🔍","🍅","⚽","🎲","👄","🦆","🐒","🍲","👢","🍍","⭐","🌟","✏️","📖","🌈","🦋"];

let nivel = 1, idx = 0, estrellas = 0, album = [], intentos = 0, cerrado = false, serie = 0;

function aviso(tipo, txt){
  const a = $("aviso");
  a.className = "aviso" + (tipo ? " "+tipo : "");
  a.textContent = txt || "";
}
function sumaEstrella(){
  estrellas++;
  $("puntaje").textContent = "⭐ " + estrellas;
  album.push(PREMIOS[(estrellas-1) % PREMIOS.length]);
}

/* Cierra el ítem: muestra el botón Siguiente y espera a que la voz TERMINE
   antes de avanzar sola. Nunca corta la narración a la mitad. */
function cierra(txtVoz){
  cerrado = true;
  const s = serie;
  $("avanzar").innerHTML = `<button class="btn hoja" id="btnSig">Siguiente ▶️</button>`;
  $("btnSig").onclick = ()=>{ if(window.speechSynthesis) speechSynthesis.cancel(); siguiente(); };
  const t0 = Date.now();
  /* Tiempo mínimo en pantalla, por si el motor de voz no funciona o va muy rápido */
  const minimo = Math.min(9000, 2200 + txtVoz.length*45);
  dice(txtVoz).then(r=>{
    if(r === "reemplazada" || s !== serie || !cerrado) return;
    const falta = Math.max(1200, minimo - (Date.now() - t0));
    setTimeout(()=>{ if(s === serie && cerrado && !hablando()) siguiente(); }, falta);
  });
}
function siguiente(){
  if(!cerrado) return;
  cerrado = false;
  idx++;
  const largo = nivel===1 ? ORDEN_LETRAS.length : nivel===2 ? PALS.length : PARES.length;
  if(idx >= largo){ idx = 0; nivel++; }
  if(nivel > 3){ terminar(); return; }
  render();
}

/* ==================== NIVEL 1: TRAZO LA LETRA (estricto) ==================== */
let trazo = null;
function nivel1(){
  const k = ORDEN_LETRAS[idx], L = LETRAS[k];
  $("chip").textContent = `Nivel 1 · ${idx+1} de ${ORDEN_LETRAS.length}`;
  $("pregunta").textContent = "Traza la letra sin salirte de la línea";
  $("escena").className = "escena";
  $("escena").innerHTML = `
    <div class="filaTrazo">
      <div class="chipLetra"><span class="emo">${L.emo}</span> la ${L.son} de <b>${L.ej}</b></div>
      <div class="pizarra" id="pizarra">
        <svg id="svgLetra" viewBox="0 0 240 240" aria-label="Pizarra para trazar la letra ${L.son}">
          <line class="pauta" x1="6" y1="30" x2="234" y2="30"/>
          <line class="pauta media" x1="6" y1="105" x2="234" y2="105"/>
          <line class="pauta base" x1="6" y1="180" x2="234" y2="180"/>
          <line class="pauta" x1="6" y1="232" x2="234" y2="232"/>
          <path id="guia" class="guia" d="${L.d}"/>
          <path class="guiaPunteada" d="${L.d}"/>
          <path id="hecho" class="hecho" d="${L.d}"/>
          <circle id="pIni" class="puntoInicio pulsa" r="13"/>
          <circle id="lapiz" class="lapiz" r="9" style="display:none"/>
        </svg>
      </div>
      <div class="barraTrazo"><i id="barra"></i></div>
    </div>`;
  $("respuesta").innerHTML = `<div class="controles">
      <button class="ctrl audio" id="verComo">👀 Ver cómo se hace</button>
      <button class="ctrl quitar" id="limpiar">↩️ Empezar de nuevo</button>
    </div>`;
  $("avanzar").innerHTML = "";
  aviso("", "");
  intentos = 0;
  iniciaTrazo(L, k);
  $("verComo").onclick = ()=>demo(true);
  $("limpiar").onclick = ()=>{ reiniciaTrazo(); aviso("", ""); };
  const s = serie;
  dice(`Vamos a escribir la ${L.son}, la ${L.son} de ${L.ej}. Mira cómo se hace y después hazlo tú. Empieza en el punto verde y no te salgas de la línea.`)
    .then(r=>{ if(r !== "reemplazada" && s === serie) demo(false); });
}

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
/* distancia de un punto al segmento a-b: sirve para detectar atajos */
function distSeg(p, a, b){
  const vx = b.x-a.x, vy = b.y-a.y;
  const len2 = vx*vx + vy*vy;
  if(len2 === 0) return dist(p, a);
  let t = ((p.x-a.x)*vx + (p.y-a.y)*vy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t*vx), p.y - (a.y + t*vy));
}

function iniciaTrazo(L, k){
  const svg = $("svgLetra"), guia = $("guia"), hecho = $("hecho");
  const largo = guia.getTotalLength();
  const N = Math.max(80, Math.round(largo/2));
  const pts = [];
  for(let i=0;i<=N;i++) pts.push(guia.getPointAtLength(largo*i/N));
  hecho.style.strokeDasharray = largo;
  hecho.style.strokeDashoffset = largo;
  $("pIni").setAttribute("cx", pts[0].x); $("pIni").setAttribute("cy", pts[0].y);

  trazo = { svg, hecho, pts, N, largo, i:0, prev:null, dibujando:false, L, listo:false, demoOn:false, demoTok:0 };

  const aSvg = ev => {
    const m = svg.getScreenCTM().inverse();
    try { return new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m); }
    catch(_){ const q = svg.createSVGPoint(); q.x=ev.clientX; q.y=ev.clientY; return q.matrixTransform(m); }
  };

  svg.addEventListener("pointerdown", e=>{
    if(trazo.listo || cerrado) return;
    e.preventDefault();
    /* si toca mientras corre la demostración, la corta y empieza ella */
    if(trazo.demoOn){ cancelaDemo(); }
    const p = aSvg(e);
    if(trazo.i === 0 && dist(p, trazo.pts[0]) > TOL_INI){
      $("pIni").classList.add("pulsa");
      aviso("ups", "Empieza justo en el punto verde 🟢");
      dice("Empieza justo en el punto verde.");
      return;
    }
    if(trazo.i > 0 && dist(p, trazo.pts[trazo.i]) > TOL){
      aviso("ups", "Sigue desde donde ibas, sin saltarte nada.");
      return;
    }
    trazo.dibujando = true;
    trazo.prev = p;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){ }
    $("lapiz").style.display = "";
    mueveLapiz(p);
  });

  svg.addEventListener("pointermove", e=>{
    if(!trazo.dibujando || trazo.listo) return;
    e.preventDefault();
    let evs = [e];
    if(e.getCoalescedEvents){
      const c = e.getCoalescedEvents();
      if(c && c.length) evs = c;
    }
    for(const ev of evs){ if(!avanza(aSvg(ev))) break; }
  });

  const soltar = () => {
    if(!trazo.dibujando) return;
    trazo.dibujando = false;
    $("lapiz").style.display = "none";
    if(trazo.listo) return;
    if(trazo.i/trazo.N >= META) exitoTrazo();
    else falla("levanto");
  };
  svg.addEventListener("pointerup", soltar);
  svg.addEventListener("pointercancel", soltar);
  svg.addEventListener("pointerleave", soltar);
}

/* Devuelve false cuando el intento terminó (por acierto o por falla) */
function avanza(p){
  mueveLapiz(p);

  /* 1) Se avanza punto a punto mientras el dedo se vaya ACERCANDO al siguiente.
        Así nunca se salta un pico ni el cruce de un bucle, aunque los dos
        tramos de la letra pasen uno al lado del otro. */
  let j = trazo.i;
  let dj = dist(p, trazo.pts[j]);
  const lim = Math.min(trazo.N, trazo.i + VENTANA);
  while(j < lim){
    const dn = dist(p, trazo.pts[j+1]);
    if(dn <= dj + 0.4){ j++; dj = dn; } else break;
  }

  /* ¿se salió del camino? Se permite dudar y retroceder un poco. */
  if(dj > TOL){
    let atras = dj;
    for(let q = Math.max(0, trazo.i - 12); q < trazo.i; q++){
      const d2 = dist(p, trazo.pts[q]);
      if(d2 < atras) atras = d2;
    }
    if(atras > TOL){ falla("fuera"); return false; }
    trazo.prev = p;
    return true;
  }

  /* 2) No se puede avanzar por la letra más de lo que se movió el dedo.
        Esto evita que en las puntas (donde el trazo de subida y el de bajada
        quedan pegados) salte de un lado al otro sin recorrer la curva.
        Aquí no se falla: simplemente no avanza. */
  if(j > trazo.i && trazo.prev){
    const arcoPaso = trazo.largo / trazo.N;
    const maxPasos = Math.ceil((dist(trazo.prev, p) + 14) / arcoPaso);
    if(j - trazo.i > maxPasos) j = trazo.i + maxPasos;
  }

  /* 3) ¿pasó por encima de todos los puntos intermedios? Nada de cortar camino. */
  if(j > trazo.i && trazo.prev){
    for(let k = trazo.i + 1; k <= j; k++){
      if(distSeg(trazo.pts[k], trazo.prev, p) > TOL){ falla("atajo"); return false; }
    }
  }
  trazo.prev = p;

  if(j > trazo.i){
    trazo.i = j;
    const pc = trazo.i / trazo.N;
    trazo.hecho.style.strokeDashoffset = trazo.largo * (1 - pc);
    const barra = $("barra"); if(barra) barra.style.width = Math.round(pc*100) + "%";
    if(pc >= META){ exitoTrazo(); return false; }
  }
  return true;
}

function mueveLapiz(p){
  const l = $("lapiz");
  if(l){ l.setAttribute("cx", p.x); l.setAttribute("cy", p.y); }
}
function reiniciaTrazo(){
  if(!trazo || !trazo.hecho || !trazo.hecho.isConnected) return;
  trazo.i = 0; trazo.prev = null; trazo.listo = false; trazo.dibujando = false;
  trazo.hecho.style.strokeDashoffset = trazo.largo;
  const barra = $("barra"); if(barra) barra.style.width = "0%";
  const l = $("lapiz"); if(l) l.style.display = "none";
  $("pIni").classList.add("pulsa");
}
function exitoTrazo(){
  if(trazo.listo) return;
  trazo.listo = true; trazo.dibujando = false;
  trazo.hecho.style.strokeDashoffset = 0;
  const barra = $("barra"); if(barra) barra.style.width = "100%";
  const l = $("lapiz"); if(l) l.style.display = "none";
  $("pIni").classList.remove("pulsa");
  pito(true); sumaEstrella();
  $("escena").classList.add("bien");
  const L = trazo.L;
  aviso("ok", `${animo()} Trazaste la ${L.son} completa y sin salirte. La ${L.son} de ${L.ej}.`);
  cierra(`${animo()} Trazaste la ${L.son} completa y sin salirte. La ${L.son} de ${L.ej}.`);
}
function falla(motivo){
  if(trazo.listo) return;
  trazo.dibujando = false;
  const l = $("lapiz"); if(l) l.style.display = "none";
  const piz = $("pizarra");
  if(piz){ piz.classList.add("mal"); setTimeout(()=>piz.classList.remove("mal"), 600); }
  pito(false);
  intentos++;
  reiniciaTrazo();
  const pistas = {
    fuera:  "Te saliste de la línea. Empieza otra vez desde el punto verde y mantén el dedo dentro del camino gris.",
    atajo:  "No cortes camino: hay que recorrer toda la línea, sin saltarse las curvas.",
    levanto:"Te faltó llegar al final. No levantes el dedo hasta terminar la letra."
  };
  const pista = pistas[motivo] || pistas.fuera;
  aviso("ups", `${casi()} ${pista}`);
  const s = serie;
  dice(`${casi()} ${pista}`).then(r=>{
    if(r !== "reemplazada" && s === serie && intentos >= 2) demo(false);
  });
}
function cancelaDemo(){
  if(!trazo || !trazo.demoOn) return;
  trazo.demoTok++;
  trazo.demoOn = false;
  const l = $("lapiz"); if(l) l.style.display = "none";
  reiniciaTrazo();
  aviso("", "");
}
function demo(conVoz){
  if(!trazo || trazo.listo || !trazo.hecho || !trazo.hecho.isConnected) return;
  const s = serie;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(conVoz) dice(`Mira cómo se escribe la ${trazo.L.son}.`);
  if(reduce){ aviso("", "Empieza en el punto verde y sigue la línea hasta el final."); return; }
  trazo.demoOn = true;
  const tok = ++trazo.demoTok;
  reiniciaTrazo();
  const lap = $("lapiz");
  lap.style.display = "";
  const t0 = performance.now(), dur = 3000;
  function paso(t){
    if(s !== serie || !trazo || trazo.demoTok !== tok || !trazo.hecho.isConnected) return;
    const k = Math.min(1, (t - t0)/dur);
    trazo.hecho.style.strokeDashoffset = trazo.largo * (1 - k);
    const p = $("guia").getPointAtLength(trazo.largo * k);
    lap.setAttribute("cx", p.x); lap.setAttribute("cy", p.y);
    if(k < 1) requestAnimationFrame(paso);
    else setTimeout(()=>{
      if(s !== serie || !trazo || trazo.demoTok !== tok || !trazo.hecho.isConnected) return;
      lap.style.display = "none";
      trazo.hecho.style.strokeDashoffset = trazo.largo;
      trazo.demoOn = false;
      aviso("", "Ahora hazlo tú: empieza en el punto verde 🟢");
    }, 600);
  }
  requestAnimationFrame(paso);
}

/* ==================== NIVEL 2: ESCUCHO Y ESCRIBO ==================== */
let escrito = [];
function nivel2(){
  const W = PALS[idx];
  const letras = Array.from(W.p);
  escrito = []; intentos = 0;
  $("chip").textContent = `Nivel 2 · ${idx+1} de ${PALS.length}`;
  $("pregunta").textContent = "Escucha y escribe la palabra";
  $("escena").className = "escena";
  $("escena").innerHTML = `
    <div class="emojote">${W.emo}</div>
    <div class="visor" id="visor"><span class="vacia">${"_ ".repeat(letras.length).trim()}</span></div>
    <div id="ayuda"></div>`;

  const distractoras = mezclar(["b","d","f","l","p","n","m","t"].filter(x=>!letras.includes(x))).slice(0,3);
  const banco = mezclar(letras.concat(distractoras));

  $("respuesta").innerHTML =
    `<div class="banco" id="banco">` +
    banco.map((c,i)=>`<button class="letraBtn" data-c="${c}" data-i="${i}">${c}</button>`).join("") +
    `</div>
     <div class="controles" style="margin-top:10px">
       <button class="ctrl audio" id="repetir">🔊 Escuchar</button>
       <button class="ctrl" id="porSilabas">🐢 Por sílabas</button>
       <button class="ctrl" id="verPal">👀 Ver la palabra</button>
       <button class="ctrl quitar" id="borrar">⬅️ Borrar</button>
     </div>`;
  $("avanzar").innerHTML = "";

  document.querySelectorAll("#banco .letraBtn").forEach(b=>{
    b.onclick = ()=>{
      if(b.disabled || cerrado || escrito.length >= letras.length) return;
      b.disabled = true; clic();
      escrito.push({c:b.dataset.c, btn:b});
      pintaVisor(letras.length);
      if(escrito.length === letras.length) revisa2(W);
    };
  });
  $("repetir").onclick = ()=>dice(W.p);
  $("porSilabas").onclick = ()=>{ dice(W.sil.join(", ")); pintaSilabas(W); };
  $("verPal").onclick = ()=>{
    pistaModelo(W); dice(W.p);
    const s0 = serie;
    setTimeout(()=>{ if(s0===serie && $("ayuda") && !$("ayuda").querySelector(".silabas")) $("ayuda").innerHTML=""; }, 3500);
  };
  $("borrar").onclick = ()=>{
    if(cerrado) return;
    const u = escrito.pop();
    if(u){ u.btn.disabled = false; clic(); pintaVisor(letras.length); aviso("",""); }
  };
  aviso("", "");
  pintaVisor(letras.length);
  const s = serie;
  dice(`Escucha bien y escribe: ${W.p}. ${W.p}.`)
    .then(r=>{ if(r !== "reemplazada" && s === serie && !vozOn && $("ayuda")) pistaModelo(W); });
  if(!vozOn) pistaModelo(W);
}
function pintaVisor(n){
  const v = $("visor");
  if(!v) return;
  const puestas = escrito.map(e=>e.c).join(" ");
  const faltan = n - escrito.length;
  v.innerHTML = (puestas ? puestas : "") + (faltan>0 ? `<span class="vacia"> ${"_ ".repeat(faltan).trim()}</span>` : "");
}
function pintaSilabas(W){
  if($("ayuda")) $("ayuda").innerHTML = `<div class="silabas">${W.sil.map(s=>`<span>${s}</span>`).join("")}</div>`;
}
function pistaModelo(W){
  if($("ayuda")) $("ayuda").innerHTML = `<div class="modelo">${W.p}</div>`;
}
function revisa2(W){
  const escritaTxt = escrito.map(e=>e.c).join("");
  if(escritaTxt === W.p){
    document.querySelectorAll("#banco .letraBtn").forEach(b=>b.disabled=true);
    pito(true); sumaEstrella();
    $("escena").classList.add("bien");
    $("visor").innerHTML = `<b style="color:var(--hoja)">${W.p}</b>`;
    pintaSilabas(W);
    aviso("ok", `${animo()} ${W.p.toUpperCase()} se escribe ${W.sil.join(" - ")}.`);
    cierra(`${animo()} ${W.p} se escribe ${W.sil.join(", ")}.`);
  }else{
    intentos++; pito(false);
    $("escena").classList.remove("bien"); $("escena").classList.add("mal");
    setTimeout(()=>{ if($("escena")) $("escena").classList.remove("mal"); }, 450);
    let i = 0; while(i < escritaTxt.length && escritaTxt[i] === W.p[i]) i++;
    const buena = W.p.slice(0, i);
    $("visor").innerHTML = (buena ? buena.split("").join(" ") + " " : "") +
      `<span class="err">${escritaTxt.slice(i).split("").join(" ")}</span>`;
    pintaSilabas(W);
    const pista = i === 0
      ? `Escucha el comienzo: ${W.sil[0]}...`
      : `Hasta "${buena}" vas bien. Escucha lo que sigue: ${W.sil.join(", ")}.`;
    aviso("ups", `${casi()} ${pista}`);
    const s = serie;
    dice(`${casi()} ${pista}`).then(r=>{
      if(r === "reemplazada" || s !== serie || !$("visor")) return;
      escrito.forEach(e=>{ e.btn.disabled = false; });
      escrito = [];
      pintaVisor(W.p.length);
      dice(W.p);
      if(intentos >= 2) pistaModelo(W);
    });
  }
}

/* ==================== NIVEL 3: ¿CUÁL ESCUCHASTE? ==================== */
function nivel3(){
  const P = PARES[idx];
  const cual = Math.random() < .5 ? P.a : P.b;
  const ops = mezclar([P.a, P.b]);
  intentos = 0;
  $("chip").textContent = `Nivel 3 · ${idx+1} de ${PARES.length}`;
  $("pregunta").textContent = "¿Cuál de las dos escuchaste?";
  $("escena").className = "escena";
  $("escena").innerHTML = `<div class="emojote">👂</div><div id="ayuda"></div>`;
  $("respuesta").innerHTML =
    `<div class="opciones dos">` +
    ops.map(o=>`<button class="opcion" data-p="${o.p}"><span class="emo">${o.emo}</span><b>${o.p}</b></button>`).join("") +
    `</div>
     <div class="controles" style="margin-top:10px">
       <button class="ctrl audio" id="repetir">🔊 Escuchar otra vez</button>
       <button class="ctrl" id="verPal">👀 Ver la palabra</button>
     </div>`;
  $("avanzar").innerHTML = "";
  const decir = () => dice(`Escucha: ${cual.p}. ${cual.p}. ¿Cuál es?`);
  $("repetir").onclick = decir;
  $("verPal").onclick = ()=>{
    $("ayuda").innerHTML = `<div class="modelo">${cual.p}</div>`;
    const s0 = serie;
    setTimeout(()=>{ if(s0===serie && $("ayuda")) $("ayuda").innerHTML=""; }, 3000);
  };
  document.querySelectorAll("#respuesta .opcion").forEach(b=>{
    b.onclick = ()=>revisa3(b, b.dataset.p, cual, P);
  });
  aviso("", "");
  decir();
  if(!vozOn) $("ayuda").innerHTML = `<div class="modelo">${cual.p}</div>`;
}
function revisa3(btn, elegido, cual, P){
  if(btn.disabled || cerrado) return;
  if(elegido === cual.p){
    document.querySelectorAll("#respuesta .opcion").forEach(b=>b.disabled=true);
    btn.classList.add("bien"); pito(true); sumaEstrella();
    $("escena").classList.add("bien");
    $("escena").querySelector(".emojote").textContent = cual.emo;
    aviso("ok", `${animo()} Era ${cual.p}. ${P.clave}`);
    cierra(`${animo()} Era ${cual.p}. ${P.clave}`);
  }else{
    btn.classList.add("mal"); btn.disabled = true; pito(false);
    intentos++;
    aviso("ups", `${casi()} ${P.clave}`);
    dice(`${casi()} ${P.clave} Escucha otra vez: ${cual.p}.`);
    setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("mal"); btn.disabled = false; } }, 3000);
  }
}

/* ==================== FLUJO ==================== */
function render(){
  serie++;
  cerrado = false;
  window.scrollTo(0,0);
  if(nivel===1) nivel1(); else if(nivel===2) nivel2(); else nivel3();
}
function terminar(){
  serie++;
  pantalla("final");
  const total = ORDEN_LETRAS.length + PALS.length + PARES.length;
  $("resumen").textContent = `Ganaste ${estrellas} de ${total} estrellas. Ya trazaste 8 letras ligadas y escribiste 8 palabras al dictado. ✏️`;
  $("album").innerHTML = album.map(e=>`<span>${e}</span>`).join("");
  confeti(["✏️","⭐","🌟","📖","✨"]);
  pito(true);
  dice(`${animo()} Ganaste ${estrellas} estrellas. Cada vez escribes mejor.`);
}
function arranca(){
  nivel = 1; idx = 0; estrellas = 0; album = []; trazo = null;
  $("puntaje").textContent = "⭐ 0";
  pantalla("juego"); render();
}
conectarVoz();
$("btnEmpezar").onclick = arranca;
$("btnOtraVez").onclick = arranca;

</script>
