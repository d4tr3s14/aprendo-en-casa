:root{
  --selva:#0E3B2E; --selva-claro:#17513E; --crema:#FFF6E5;
  --sol:#FFC93C; --coral:#FF6B5A; --agua:#3FC1E0; --hoja:#7ED957;
  --sombra:0 8px 0 rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 10%, rgba(63,193,224,.22), transparent 45%),
    radial-gradient(circle at 88% 82%, rgba(126,217,87,.20), transparent 45%),
    var(--selva);
  color:var(--crema);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:12px;
}
.marco{
  width:min(760px,100%);
  background:var(--selva-claro);
  border:6px solid var(--sol);
  border-radius:34px;
  padding:14px 12px 18px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
  position:relative;overflow:hidden;
}
h1,h2,h3,.btn,.tecla,.puntaje,.numerote,.ecuacion,.contador b{font-family:'Baloo 2',system-ui,sans-serif}

/* ---------- barra superior ---------- */
.barra-sup{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.puntaje{font-size:1.3rem;letter-spacing:2px;color:var(--sol)}
.mini{
  background:transparent;border:3px solid rgba(255,246,229,.35);color:var(--crema);
  border-radius:999px;padding:6px 13px;font-size:.92rem;font-weight:800;cursor:pointer;
  font-family:'Nunito',system-ui,sans-serif;text-decoration:none;display:inline-block;
}
.mini:hover{border-color:var(--sol)}
.mini:focus-visible,.btn:focus-visible,.tecla:focus-visible{outline:4px solid var(--agua);outline-offset:3px}

/* ---------- pantallas ---------- */
.pantalla{display:none;text-align:center}
.pantalla.activa{display:block;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1{font-size:clamp(1.9rem,6.5vw,2.9rem);margin:.2em 0 .1em;color:var(--sol);line-height:1.05}
h1 span{display:block;color:var(--crema);font-size:.4em;letter-spacing:1px}
.intro{font-size:1.05rem;max-width:44ch;margin:0 auto 16px;line-height:1.5}
.iconos{font-size:clamp(2.2rem,9vw,3.2rem);letter-spacing:.1em;margin:6px 0 2px}
.iconos span{display:inline-block;animation:flota 3s ease-in-out infinite}
.iconos span:nth-child(2){animation-delay:.4s}
.iconos span:nth-child(3){animation-delay:.8s}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.btn{
  background:var(--coral);color:#fff;border:none;border-radius:999px;
  padding:15px 30px;font-size:1.35rem;font-weight:800;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .12s;
}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.sol{background:var(--sol);color:var(--selva)}
.btn.agua{background:var(--agua);color:var(--selva)}

.nivel-chip{
  display:inline-block;background:rgba(255,246,229,.14);border-radius:999px;
  padding:4px 14px;font-size:.9rem;font-weight:800;margin-bottom:6px;color:var(--crema);
}
.pregunta{font-size:clamp(1.15rem,4.3vw,1.55rem);margin:0 0 10px;color:var(--sol);font-family:'Baloo 2',sans-serif;line-height:1.2}

/* ---------- escena ---------- */
.escena{
  background:var(--crema);color:var(--selva);
  border-radius:26px;padding:12px 8px;margin:0 auto 12px;
  box-shadow:var(--sombra);min-height:128px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.escena.mal{animation:tiembla .4s}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.escena.bien{animation:brinca .5s}
@keyframes brinca{0%,100%{transform:scale(1)}45%{transform:scale(1.06)}}

.numerote{font-size:clamp(3.4rem,17vw,5.4rem);line-height:1;color:var(--selva)}
.oreja{font-size:clamp(3.2rem,15vw,4.6rem);line-height:1;animation:flota 2.6s ease-in-out infinite}
.pista-escucha{font-size:1rem;font-weight:800;color:#3d6b57}

/* ---------- bloques base 10 ---------- */
.bloques{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap;min-height:120px}
.pila{display:flex;flex-direction:column;align-items:center;gap:6px}
.grupo{display:flex;gap:5px;align-items:flex-end;min-height:206px}
.barra{
  display:flex;flex-direction:column-reverse;gap:2px;
  background:rgba(14,59,46,.14);padding:3px;border-radius:7px;
}
.barra i,.cubito{
  width:18px;height:18px;border-radius:4px;display:block;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.20);
  animation:pop .25s ease both;
}
.barra i{background:var(--agua)}
.cubito{background:var(--sol)}
.uni{display:flex;flex-direction:column-reverse;gap:2px;min-height:0}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.etiqueta{font-size:.95rem;font-weight:800;color:#3d6b57;display:flex;align-items:center;gap:5px}
.vacio{font-size:.95rem;font-weight:800;color:#8aa79a}
.sw{display:inline-block;border-radius:3px;flex:none}
.sw.dec{width:9px;height:18px;background:var(--agua)}
.sw.uni{width:14px;height:14px;background:var(--sol)}
.grupo:empty::before,.grupo > .uni:empty::before{
  content:"";display:block;width:24px;height:198px;
  border:3px dashed rgba(14,59,46,.16);border-radius:9px;
}

/* ---------- ecuación ---------- */
.ecuacion{
  font-size:clamp(2rem,9vw,3rem);color:var(--selva);line-height:1.2;
  display:flex;align-items:center;justify-content:center;gap:.25em;flex-wrap:wrap;
}
.hueco{
  display:inline-block;min-width:1.6em;border-bottom:6px solid var(--coral);
  border-radius:4px;padding:0 .1em;color:var(--coral);
}

/* ---------- teclado ---------- */
.visor{
  background:var(--crema);color:var(--selva);border-radius:20px;
  font-family:'Baloo 2',sans-serif;font-size:clamp(1.9rem,9vw,2.5rem);
  padding:4px 10px;margin:0 auto 8px;min-width:140px;max-width:220px;
  box-shadow:var(--sombra);letter-spacing:.06em;min-height:1.5em;
}
.visor.vacio-txt{color:#a9bdb2}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.tecla{
  background:var(--crema);color:var(--selva);border:none;border-radius:18px;
  padding:11px 0;font-size:1.6rem;font-weight:800;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .1s;
}
.tecla:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tecla.borrar{background:#FFD7D2}
.tecla.ok{background:var(--hoja);color:#0E3B2E}
.tecla[disabled]{opacity:.55;cursor:default}

/* ---------- controles de cubos ---------- */
.controles{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;max-width:420px;margin:0 auto}
.ctrl{
  background:var(--crema);color:var(--selva);border:none;border-radius:20px;
  padding:12px 14px;font-size:1.05rem;font-weight:800;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .1s;
  font-family:'Nunito',system-ui,sans-serif;display:flex;align-items:center;gap:6px;
}
.ctrl:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ctrl:focus-visible{outline:4px solid var(--agua);outline-offset:3px}
.ctrl .muestra{width:16px;height:16px;border-radius:3px;display:inline-block}
.ctrl .muestra.dec{background:var(--agua);height:26px;width:11px}
.ctrl .muestra.uni{background:var(--sol)}
.ctrl.quitar{background:#FFD7D2}
.ctrl.listo{background:var(--hoja)}
.contador{font-size:1.05rem;font-weight:800;color:#3d6b57;margin-top:2px}
.contador b{color:var(--selva);font-size:1.25rem}

.aviso{
  min-height:52px;margin-top:10px;font-size:1.05rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 6px;line-height:1.35;
}
.aviso.ok{color:var(--hoja)}
.aviso.ups{color:var(--sol)}

/* ---------- final ---------- */
.album{background:var(--crema);border-radius:24px;padding:14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.album span{font-size:2rem;animation:aparece .4s ease both}
@keyframes aparece{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.trofeo{font-size:4.6rem;display:block;animation:flota 2.5s ease-in-out infinite}
.confeti{position:absolute;top:-20px;font-size:1.6rem;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

@media (max-width:400px){
  .barra i,.cubito{width:15px;height:15px}
  .grupo{min-height:176px}
  .grupo:empty::before,.grupo > .uni:empty::before{height:168px;width:21px}
  .tecla{font-size:1.45rem;padding:10px 0}
  .ctrl{padding:10px 12px;font-size:.98rem}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="marco">

  <div class="barra-sup">
    <a class="mini" href="../../../index.html">🏠 Inicio</a>
    <div class="puntaje" id="puntaje">⭐ 0</div>
    <button class="mini" id="btnVoz" aria-pressed="true">🔊 Voz</button>
  </div>

  <!-- INICIO -->
  <section class="pantalla activa" id="inicio">
    <div class="iconos"><span>🟦</span><span>🟨</span><span>🔢</span></div>
    <h1>Cubos y números<span>Decenas, unidades y dictado</span></h1>
    <p class="intro">Tres desafíos: <b>escuchar y escribir</b> números, <b>armar con cubos</b> las decenas y unidades, y <b>componer y descomponer</b>. Se juega tocando. ¡Equivocarse no quita estrellas!</p>
    <button class="btn" id="btnEmpezar">¡Empezar!</button>
  </section>

  <!-- JUEGO -->
  <section class="pantalla" id="juego">
    <div class="nivel-chip" id="chip">Nivel 1</div>
    <h2 class="pregunta" id="pregunta"></h2>
    <div class="escena" id="escena"></div>
    <div id="respuesta"></div>
    <div class="aviso" id="aviso" aria-live="polite"></div>
  </section>

  <!-- FINAL -->
  <section class="pantalla" id="final">
    <span class="trofeo">🏆</span>
    <h1 id="tituloFinal">¡Lo lograste!</h1>
    <p class="intro" id="resumen"></p>
    <div class="album" id="album"></div>
    <button class="btn sol" id="btnOtraVez">Jugar de nuevo 🔁</button>
  </section>

</div>

<script>
/* ==================== UTILIDADES ==================== */
const $ = id => document.getElementById(id);
const azar = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const mezclar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

const PALABRAS = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
  "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte",
  "veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete",
  "veintiocho","veintinueve","treinta"];
const DECENAS = {1:"diez",2:"veinte",3:"treinta",4:"cuarenta",5:"cincuenta"};
function palabra(n){
  if(n<=30) return PALABRAS[n];
  const d = Math.floor(n/10), u = n%10;
  return u===0 ? DECENAS[d] : DECENAS[d] + " y " + PALABRAS[u];
}
function plural(n, sing, plu){ return n === 1 ? "1 " + sing : n + " " + plu; }

let vozOn = true;
function hablar(txt){
  if(!vozOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "es-CL"; u.rate = .9; u.pitch = 1.12;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v=>v.lang==="es-CL") || vs.find(v=>v.lang==="es-MX") ||
            vs.find(v=>v.lang==="es-ES") || vs.find(v=>v.lang.startsWith("es"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function pito(ok){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notas = ok ? [523,659,784] : [330,262];
    notas.forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.001,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02+i*.11);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.20+i*.11);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+i*.11); o.stop(ctx.currentTime+.4+i*.11);
    });
  }catch(e){}
}
function pantalla(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
  $(id).classList.add("activa");
}
function confeti(){
  const emojis = ["⭐","🎉","🌟","🔢","✨"];
  for(let i=0;i<24;i++){
    const c = document.createElement("div");
    c.className = "confeti";
    c.textContent = emojis[i%emojis.length];
    c.style.left = Math.random()*100+"%";
    c.style.animationDuration = (2+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*.6)+"s";
    document.querySelector(".marco").appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}

/* ==================== BLOQUES BASE 10 ==================== */
function htmlBloques(dec, uni, conEtiquetas){
  let barras = "";
  for(let i=0;i<dec;i++){
    let cubos = "";
    for(let j=0;j<10;j++) cubos += '<i style="animation-delay:'+((i*10+j)*.012)+'s"></i>';
    barras += '<div class="barra">'+cubos+'</div>';
  }
  let sueltos = "";
  for(let k=0;k<uni;k++) sueltos += '<div class="cubito" style="animation-delay:'+(k*.05)+'s"></div>';

  const et = conEtiquetas !== false;
  return '<div class="bloques">' +
    '<div class="pila"><div class="grupo">' + barras + '</div>' +
      (et ? '<span class="etiqueta"><span class="sw dec"></span>decenas: '+dec+'</span>' : '') + '</div>' +
    '<div class="pila"><div class="grupo"><div class="uni">' + sueltos + '</div></div>' +
      (et ? '<span class="etiqueta"><span class="sw uni"></span>unidades: '+uni+'</span>' : '') + '</div>' +
  '</div>';
}
function nodoBarra(){
  const b = document.createElement("div");
  b.className = "barra";
  for(let j=0;j<10;j++) b.appendChild(document.createElement("i"));
  return b;
}
function nodoCubito(){
  const c = document.createElement("div");
  c.className = "cubito";
  return c;
}

/* ==================== GENERACIÓN DE ÍTEMS ==================== */
function itemsNivel1(){
  // Dictado 0 a 30: mezcla de un dígito, "difíciles" 11-19 y veintis
  const chicos  = mezclar([...Array(10).keys()]).slice(0,2);              // 0-9
  const dificil = mezclar([11,12,13,14,15,16,17,18,19]).slice(0,3);
  const veintis = mezclar([20,21,23,25,26,28,29,30]).slice(0,3);
  return mezclar([...chicos, ...dificil, ...veintis]).map(n=>({tipo:"dictado", n}));
}
function itemsNivel2(){
  // 0 a 50: primero armar con cubos, después leer los cubos
  const armar = mezclar([12,25,34,41,50,17,23,46]).slice(0,4).map(n=>({tipo:"armar", n}));
  const base  = mezclar([13,20,27,32,38,45,49,16]).filter(n=>!armar.some(a=>a.n===n));
  const leer  = base.slice(0,4).map(n=>({tipo:"leer", n}));
  return [...armar, ...leer];
}
function itemsNivel3(){
  const nums = mezclar([14,23,27,31,35,42,46,48,19,26,38,45]).slice(0,8);
  return nums.map((n,i)=>{
    const d = Math.floor(n/10)*10, u = n%10;
    if(i % 3 === 0) return {tipo:"componer",   n, d, u};
    if(i % 3 === 1) return {tipo:"falta-uni",  n, d, u};
    return {tipo:"falta-dec", n, d, u};
  });
}

const NIVELES = [
  {chip:"Nivel 1", titulo:"Dictado de números", items:itemsNivel1,
   aviso:"Escucha bien el número y escríbelo con el teclado.",
   voz:"Nivel uno. Dictado de números. Escucha con atención y escribe el número que oigas."},
  {chip:"Nivel 2", titulo:"Decenas y unidades", items:itemsNivel2,
   aviso:"Cada barra azul vale 10. Cada cubito amarillo vale 1.",
   voz:"Nivel dos. Decenas y unidades. Recuerda: cada barra azul vale diez y cada cubito amarillo vale uno."},
  {chip:"Nivel 3", titulo:"Componer y descomponer", items:itemsNivel3,
   aviso:"Todo número se puede separar en decenas más unidades.",
   voz:"Nivel tres. Componer y descomponer. Todo número se puede separar en decenas más unidades."}
];

const APLAUSOS = ["¡Muy bien!","¡Excelente!","¡Lo lograste!","¡Qué buena matemática eres!",
  "¡Perfecto!","¡Increíble!","¡Vas volando!","¡Esa es!"];
const PISTAS = ["Casi... observa bien e inténtalo otra vez.",
  "Casi... cuenta de nuevo con calma.",
  "Uy, por poquito. Mira otra vez y prueba.",
  "Casi lo tienes. Respira y vuelve a intentar."];
const unaDe = a => a[Math.floor(Math.random()*a.length)];

/* ==================== ESTADO ==================== */
let nivel = 0, indice = 0, estrellas = 0, lista = [], album = [];
let tecleado = "", decPuestas = 0, uniPuestas = 0, bloqueado = false;

/* ==================== TECLADO ==================== */
function pintarVisor(){
  const v = $("visor");
  if(!v) return;
  v.textContent = tecleado === "" ? "▢" : tecleado;
  v.classList.toggle("vacio-txt", tecleado === "");
}
function htmlTeclado(){
  let t = '<div class="visor vacio-txt" id="visor">▢</div><div class="teclado" id="teclado">';
  [1,2,3,4,5,6,7,8,9].forEach(n=>{ t += '<button class="tecla" data-d="'+n+'">'+n+'</button>'; });
  t += '<button class="tecla borrar" data-a="borrar" aria-label="Borrar">⌫</button>';
  t += '<button class="tecla" data-d="0">0</button>';
  t += '<button class="tecla ok" data-a="ok" aria-label="Comprobar">✔</button>';
  return t + '</div>';
}
function conectarTeclado(alResponder){
  tecleado = "";
  pintarVisor();
  $("teclado").addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b || bloqueado) return;
    if(b.dataset.d !== undefined){
      if(tecleado.length < 2) tecleado += b.dataset.d;
      if(tecleado.length === 2 && tecleado[0] === "0") tecleado = tecleado[1];
      pintarVisor();
    } else if(b.dataset.a === "borrar"){
      tecleado = tecleado.slice(0,-1);
      pintarVisor();
    } else if(b.dataset.a === "ok"){
      if(tecleado === "") { hablar("Escribe un número primero."); return; }
      alResponder(parseInt(tecleado,10));
    }
  });
}

/* ==================== PINTAR CADA ÍTEM ==================== */
function mostrar(){
  const it = lista[indice];
  bloqueado = false;
  $("escena").className = "escena";
  $("aviso").textContent = "";
  $("aviso").className = "aviso";
  $("chip").textContent = NIVELES[nivel].chip + " · " + (indice+1) + " de " + lista.length;

  if(it.tipo === "dictado")   return pintarDictado(it);
  if(it.tipo === "armar")     return pintarArmar(it);
  if(it.tipo === "leer")      return pintarLeer(it);
  return pintarEcuacion(it);
}

/* --- Nivel 1: dictado --- */
function pintarDictado(it){
  $("pregunta").textContent = "Escucha el número y escríbelo";
  $("escena").innerHTML =
    '<span class="oreja">👂</span>' +
    '<button class="btn agua" id="btnRepetir">🔊 Escuchar otra vez</button>' +
    '<span class="pista-escucha">Toca el botón si quieres oírlo de nuevo</span>';
  $("respuesta").innerHTML = htmlTeclado();
  const decir = ()=> hablar("Escribe el número " + palabra(it.n));
  $("btnRepetir").onclick = decir;
  conectarTeclado(r=>{
    if(r === it.n){
      acierto(it, "El número " + palabra(it.n) + " se escribe " + it.n + ".");
    } else {
      error("Escucha otra vez y fíjate en las decenas.");
      $("btnRepetir").focus();
    }
  });
  setTimeout(decir, 350);
}

/* --- Nivel 2a: armar con cubos --- */
function pintarArmar(it){
  const d = Math.floor(it.n/10), u = it.n%10;
  decPuestas = 0; uniPuestas = 0;
  $("pregunta").textContent = "Arma el número " + it.n + " con los cubos";
  $("respuesta").innerHTML =
    '<div class="controles" id="controles">' +
      '<button class="ctrl" data-a="+d"><span class="muestra dec"></span>+ decena</button>' +
      '<button class="ctrl" data-a="+u"><span class="muestra uni"></span>+ unidad</button>' +
      '<button class="ctrl quitar" data-a="-d">− decena</button>' +
      '<button class="ctrl quitar" data-a="-u">− unidad</button>' +
      '<button class="ctrl listo" data-a="ok">✔ Listo</button>' +
    '</div>';
  // Se dibuja una sola vez y después se agregan o quitan cubos de a uno:
  // así los cubos ya puestos no vuelven a animarse en cada toque.
  $("escena").innerHTML =
    '<div class="bloques">' +
      '<div class="pila"><div class="grupo" id="gDec"></div>' +
        '<span class="etiqueta"><span class="sw dec"></span>decenas: <b id="nDec">0</b></span></div>' +
      '<div class="pila"><div class="grupo"><div class="uni" id="gUni"></div></div>' +
        '<span class="etiqueta"><span class="sw uni"></span>unidades: <b id="nUni">0</b></span></div>' +
    '</div>' +
    '<div class="contador">Llevas <b id="llevas">0</b></div>';
  const marcador = ()=>{
    $("nDec").textContent = decPuestas;
    $("nUni").textContent = uniPuestas;
    $("llevas").textContent = decPuestas*10 + uniPuestas;
  };
  $("controles").addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b || bloqueado) return;
    const a = b.dataset.a;
    if(a === "+d" && decPuestas < 5){ decPuestas++; $("gDec").appendChild(nodoBarra()); }
    else if(a === "+u" && uniPuestas < 9){ uniPuestas++; $("gUni").appendChild(nodoCubito()); }
    else if(a === "-d" && decPuestas > 0){ decPuestas--; $("gDec").lastElementChild.remove(); }
    else if(a === "-u" && uniPuestas > 0){ uniPuestas--; $("gUni").lastElementChild.remove(); }
    else if(a === "ok"){
      if(decPuestas === d && uniPuestas === u){
        acierto(it, "El " + it.n + " tiene " + plural(d,"decena","decenas") + " y " + plural(u,"unidad","unidades") + ".");
      } else {
        error("Cuenta de nuevo: cada barra azul vale 10 y cada cubito vale 1.");
      }
      return;
    } else return;
    marcador();
    hablar(palabra(decPuestas*10 + uniPuestas));
  });
  hablar("Arma el número " + palabra(it.n) + " con barras de diez y cubitos de uno.");
}

/* --- Nivel 2b: leer los bloques --- */
function pintarLeer(it){
  const d = Math.floor(it.n/10), u = it.n%10;
  $("pregunta").textContent = "¿Qué número formaron los cubos?";
  $("escena").innerHTML = htmlBloques(d, u, false);
  $("respuesta").innerHTML = htmlTeclado();
  conectarTeclado(r=>{
    if(r === it.n){
      acierto(it, plural(d,"decena","decenas") + " y " + plural(u,"unidad","unidades") + " forman el " + it.n + ".");
    } else {
      error("Cuenta las barras de 10 primero y después los cubitos.");
    }
  });
  hablar("¿Qué número formaron los cubos? Cuenta las barras y los cubitos.");
}

/* --- Nivel 3: componer y descomponer --- */
function pintarEcuacion(it){
  const d = it.d, u = it.u;
  let preg, ecu, correcta, dato, vozPreg, pistaErr;

  if(it.tipo === "componer"){
    preg = "¿Qué número se forma?";
    ecu  = d + ' <span>+</span> ' + u + ' <span>=</span> <span class="hueco">▢</span>';
    correcta = it.n;
    dato = d + " más " + u + " es igual a " + it.n + ".";
    vozPreg = "¿Qué número se forma? " + palabra(d) + " más " + palabra(u) + ", es igual a...";
    pistaErr = "Junta las decenas con las unidades.";
  } else if(it.tipo === "falta-uni"){
    preg = "¿Qué número va en el cuadrado?";
    ecu  = it.n + ' <span>=</span> ' + d + ' <span>+</span> <span class="hueco">▢</span>';
    correcta = u;
    dato = "El " + it.n + " se descompone en " + d + " más " + u + ".";
    vozPreg = palabra(it.n) + ", es igual a " + palabra(d) + ", más... ¿qué número?";
    pistaErr = "Mira las unidades del número, el último dígito.";
  } else {
    preg = "¿Qué número va en el cuadrado?";
    ecu  = it.n + ' <span>=</span> <span class="hueco">▢</span> <span>+</span> ' + u;
    correcta = d;
    dato = "El " + it.n + " tiene " + plural(d/10,"decena","decenas") + ", y eso vale " + d + ".";
    vozPreg = palabra(it.n) + ", es igual a... ¿qué número?, más " + palabra(u) + ".";
    pistaErr = "Son las decenas completas: 10, 20, 30, 40 o 50.";
  }

  $("pregunta").textContent = preg;
  $("escena").innerHTML = '<div class="ecuacion">' + ecu + '</div>';
  $("respuesta").innerHTML = htmlTeclado();
  conectarTeclado(r=>{
    if(r === correcta){
      $("escena").innerHTML = '<div class="ecuacion">' +
        ecu.replace('<span class="hueco">▢</span>','<span class="hueco">'+correcta+'</span>') +
        '</div>' + htmlBloques(d/10, u);
      acierto(it, dato);
    } else {
      error(pistaErr);
    }
  });
  hablar(vozPreg);
}

/* ==================== RESPUESTAS ==================== */
function acierto(it, dato){
  bloqueado = true;
  document.querySelectorAll("#respuesta button").forEach(b=>b.disabled = true);
  $("escena").classList.add("bien");
  estrellas++;
  $("puntaje").textContent = "⭐ " + estrellas;
  album.push("⭐");
  const frase = unaDe(APLAUSOS);
  $("aviso").textContent = frase + " " + dato;
  $("aviso").className = "aviso ok";
  pito(true);
  hablar(frase + " " + dato);
  setTimeout(siguiente, 3400);
}
function error(pista){
  $("escena").classList.remove("mal");
  void $("escena").offsetWidth;
  $("escena").classList.add("mal");
  $("aviso").textContent = unaDe(PISTAS) + " " + pista;
  $("aviso").className = "aviso ups";
  pito(false);
  hablar(pista);
  tecleado = "";
  pintarVisor();
}

/* ==================== FLUJO ==================== */
function iniciar(){
  nivel = 0; estrellas = 0; album = [];
  $("puntaje").textContent = "⭐ 0";
  pantalla("juego");
  armarNivel();
}
function armarNivel(){
  indice = 0;
  lista = NIVELES[nivel].items();
  mostrar();
}
function siguiente(){
  indice++;
  if(indice < lista.length){ mostrar(); return; }
  if(nivel < NIVELES.length - 1){
    nivel++;
    const N = NIVELES[nivel];
    $("chip").textContent = N.chip;
    $("pregunta").textContent = "¡" + N.chip + "!";
    $("escena").className = "escena";
    $("escena").innerHTML = '<span class="oreja">🎉</span><div class="contador">' + N.titulo + '</div>';
    $("respuesta").innerHTML = '';
    $("aviso").textContent = N.aviso;
    $("aviso").className = "aviso ok";
    confeti();
    hablar("¡Muy bien! " + N.voz);
    setTimeout(armarNivel, 4200);
    return;
  }
  terminar();
}
function terminar(){
  $("resumen").textContent = "Ganaste " + plural(estrellas,"estrella","estrellas") + ": escribiste números al dictado, " +
    "armaste decenas y unidades con cubos, y compusiste y descompusiste números hasta el 50. " +
    "¡Estás lista para tu evaluación!";
  const al = $("album");
  al.innerHTML = "";
  album.forEach((e,i)=>{
    const s = document.createElement("span");
    s.textContent = e;
    s.style.animationDelay = (i*.06)+"s";
    al.appendChild(s);
  });
  pantalla("final");
  confeti();
  hablar("¡Felicitaciones! Ganaste " + palabra(estrellas) + (estrellas===1 ? " estrella" : " estrellas") +
         ". Ya sabes representar decenas y unidades hasta el cincuenta.");
}

/* ==================== EVENTOS ==================== */
$("btnEmpezar").onclick = iniciar;
$("btnOtraVez").onclick = iniciar;
$("btnVoz").onclick = function(){
  vozOn = !vozOn;
  this.textContent = vozOn ? "🔊 Voz" : "🔇 Voz";
  this.setAttribute("aria-pressed", vozOn);
  if(!vozOn && window.speechSynthesis) speechSynthesis.cancel();
};
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
</script>
</body>
</html>
