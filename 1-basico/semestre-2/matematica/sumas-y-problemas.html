.escena{

.ctrl{padding:0 16px;font-size:var(--fs-label);display:flex;align-items:center;gap:6px}

.opciones{display:grid;gap:8px;max-width:440px;margin:0 auto}
.opciones.dos{grid-template-columns:1fr 1fr}

.aviso{min-height:52px;margin-top:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}

.album span{font-size:2rem}
.trofeo{font-size:4rem;display:block}
.confeti{position:absolute;top:-20px;font-size:1.4rem;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(360deg);opacity:0}}

/* decenas = acento, unidades = naranja: es codificación de datos (DESIGN.md §6, gráficos),
   la misma en todas las actividades de matemática */

/* ---------- escucha ---------- */
.oreja{font-size:clamp(3rem,14vw,4.2rem);line-height:1}
.pista-escucha{font-size:var(--fs-meta);font-weight:500}

/* ---------- casillas de decena y unidad ---------- */
.casillas{display:flex;gap:12px;justify-content:center}
.casilla{
  background:var(--tint-faint);border:1px solid var(--border-primary);border-radius:var(--r-sm);

  transition:border-color var(--t-rapida);
}

.casilla span .vacia{color:var(--text-tertiary)}

.casilla.llena{border-color:var(--accent);background:var(--bg-elevated)}

/* ---------- teclado ---------- */
.teclado{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:400px;margin:0 auto}
.tecla{padding:10px 0;font-size:1.6rem}

/* ---------- tira de números ---------- */
.tira{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ficha{
  background:var(--tint-faint);color:var(--text-primary);border:1px solid var(--border-secondary);border-radius:var(--r-sm);
  min-width:60px;padding:8px 6px;font:500 1.9rem/1.1 var(--font-ui);
}
.ficha.falta{background:var(--accent-tint);border:1px dashed var(--accent);color:var(--accent);animation:pulso 1.5s ease-in-out infinite}
@keyframes pulso{50%{opacity:.55}}
.ficha.puesta{background:var(--green-tint);border-color:var(--green)}

.opciones.tres{grid-template-columns:1fr 1fr 1fr}
.opcion.num{font:500 2rem/1 var(--font-ui);padding:14px 6px}

/* ---------- sumas ---------- */
.ecuacion{font:500 clamp(2.1rem,10vw,3rem)/1.1 var(--font-ui);color:var(--text-strong);letter-spacing:.02em}
.ecuacion .hueco{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--accent);color:var(--accent)}
.grupos{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.grupo-emo{

}

@keyframes pop{from{opacity:0}to{opacity:1}}
.mas{font:400 2.2rem/1 var(--font-ui);color:var(--text-secondary)}

/* barras de diez y cubitos sueltos */
.base10{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.pila10{display:flex;flex-direction:column;align-items:center;gap:4px}
.barra10{display:flex;flex-direction:column-reverse;gap:2px;background:var(--tint-soft);padding:3px;border-radius:var(--r-xs)}
.barra10 i,.suelto{width:16px;height:16px;border-radius:3px;display:block}
.barra10 i{background:var(--accent)}
.suelto{background:var(--orange)}
.sueltos{display:flex;flex-direction:column-reverse;gap:2px}
.rot{font-weight:500;color:var(--text-secondary)}

/* ---------- problema ---------- */
.cuento{
  background:var(--tint-faint);border:1px solid var(--border-secondary);border-radius:var(--r-sm);
  padding:10px 12px;color:var(--text-primary);font-size:var(--fs-body);font-weight:500;line-height:1.45;max-width:38ch;
}
.escenita{font-size:2.1rem;line-height:1.25;letter-spacing:.06em;max-width:20ch}
.dato{font-size:var(--fs-meta);font-weight:500;color:var(--text-secondary);max-width:34ch;line-height:1.4}
.grupo-emo.grande{align-items:center;gap:6px;padding:8px 12px;font:500 1.9rem/1.2 var(--font-ui);color:var(--text-primary)}
.grupo-emo.grande span{font-size:2.4rem}
</style>

:root{

  --fs-meta:15px; --fs-body:17px; --fs-label:17px; --fs-title:clamp(1.25rem,4.6vw,1.6rem);

:root[data-theme="dark"]{
  --bg-page:#141414; --bg-wash:#191919; --bg-elevated:#1F1F1F;

/* ==========================================================================
   BASE común (tipografía, superficie, accesibilidad) · ver DESIGN.md

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPad: se mira a más distancia, todo crece un 12 % */
@media (min-width:700px) and (min-height:600px){ html{font-size:112.5%} }
*{-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg-page);color:var(--text-primary);
  font:400 var(--fs-body)/1.45 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-ui);font-weight:500;letter-spacing:-.01em}
b,strong{font-weight:600}
button,a{touch-action:manipulation}
button{font-family:var(--font-ui)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}

}

/* diálogo "¿Quieres salir?" (lo crea selva.js) · modal: bg-elevated + sombra L4 */
.selva-dialogo{
  border:1px solid var(--border-primary);border-radius:var(--r-lg);padding:20px 20px 16px;
  width:min(360px, calc(100vw - 32px));
  background:var(--bg-elevated);color:var(--text-primary);text-align:center;box-shadow:var(--shadow-L4);
  font-family:var(--font-ui);
}
.selva-dialogo::backdrop{background:rgba(0,0,0,.32)}
.selva-dialogo-emo{font-size:2.6rem;line-height:1}
.selva-dialogo h2{font:500 1.25rem/1.3 var(--font-ui);margin:10px 0 4px;color:var(--text-strong)}
.selva-dialogo p{font-size:var(--fs-body);line-height:1.4;margin:0 0 16px;color:var(--text-secondary)}
.selva-dialogo button{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--toque);
  border:1px solid transparent;border-radius:var(--r-xs);cursor:pointer;
  font:500 var(--fs-label)/1 var(--font-ui);transition:background var(--t-rapida);
}
.selva-seguir{background:var(--button-neutral);color:var(--button-neutral-text);margin-bottom:8px}
.selva-salir{background:transparent;color:var(--red)}
.selva-salir:hover{background:var(--red-tint)}
/* ==========================================================================
   Capa para actividades de juego (pantallas inicio / juego / final)
   Se carga DESPUÉS del estilo propio de cada archivo, así que lo reemplaza
   sin tocar la lógica del juego. Componentes según DESIGN.md §5.
   ========================================================================== */

/* ---------- vista a pantalla completa sobre bg-page ---------- */
body{
  display:block;min-height:100vh;min-height:100dvh;margin:0;
  padding:0 max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:var(--bg-page);
}
.marco{
  width:min(720px,100%);margin:0 auto;padding:0 0 8px;
  background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;
}

/* ---------- barra superior: fija, borde inferior de 1px, respeta el notch ---------- */
.marco > .barra,.marco > .barra-sup{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:0 -16px 20px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  background:var(--bg-page);border-bottom:1px solid var(--border-primary);
}
/* botón secundario: bg-elevated + borde + L1 */
.marco > .barra .mini,.marco > .barra-sup .mini,.pantalla .mini{
  min-height:var(--toque);padding:0 14px;border:1px solid var(--border-primary);border-radius:var(--r-xs);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--shadow-L1);
  font:500 var(--fs-meta)/1 var(--font-ui);text-decoration:none;cursor:pointer;
  transition:background var(--t-rapida),border-color var(--t-rapida);
}
.marco > .barra .mini:hover,.marco > .barra-sup .mini:hover,.pantalla .mini:hover{background:var(--tint-strong)}
.marco > .barra .mini[aria-pressed="false"],.marco > .barra-sup .mini[aria-pressed="false"]{background:transparent;box-shadow:none;color:var(--text-secondary)}
/* contador de estrellas: chip pill */
.puntaje{
  min-height:36px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--border-primary);color:var(--text-primary);box-shadow:none;
  font:500 var(--fs-meta)/1 var(--font-ui);letter-spacing:0;white-space:nowrap;
  transition:background var(--t-rapida);
}
.puntaje.salta{animation:selva-salta 1s ease-out}
@keyframes selva-salta{0%{background:var(--accent-tint);border-color:var(--accent)}100%{background:transparent}}

/* ---------- títulos y texto: jerarquía por peso y opacidad ---------- */
.pantalla{padding-top:4px}
h1{font:500 var(--fs-display)/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);text-shadow:none}
h1 span{display:block;font-size:var(--fs-body) !important;font-weight:400;letter-spacing:0 !important;line-height:1.4;color:var(--text-secondary);margin-top:8px}
.intro{font-size:var(--fs-body);line-height:1.5;max-width:40ch;color:var(--text-secondary)}
.intro b{color:var(--text-primary)}
.pregunta{font:500 var(--fs-title)/1.3 var(--font-ui);color:var(--text-primary);letter-spacing:-.01em}
.nivel-chip,.nivelChip{
  display:inline-flex;align-items:center;gap:6px;min-height:32px;
  font:500 var(--fs-meta)/1 var(--font-ui) !important;padding:0 12px !important;
  border-radius:var(--r-pill);border:1px solid var(--border-primary);background:transparent;color:var(--text-secondary);box-shadow:none;
}

/* ---------- botón principal: button-neutral, sin volumen 3D ---------- */
.btn{
  min-height:var(--toque-respuesta);padding:0 24px;border:1px solid transparent;border-radius:var(--r-sm);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:500 1.125rem/1.2 var(--font-ui);
  background:var(--button-neutral);color:var(--button-neutral-text);box-shadow:none;cursor:pointer;
  transition:opacity var(--t-rapida);
}
.btn:hover{opacity:.9}
.btn:active{transform:none;opacity:.8;box-shadow:none}
/* sol y hoja ("Siguiente", "Jugar de nuevo") también son primarios */
.btn.sol,.btn.sol:active,.btn.hoja,.btn.hoja:active{background:var(--button-neutral);color:var(--button-neutral-text);box-shadow:none}
/* agua ("Escuchar otra vez", "Ir a la presentación"): botón secundario */
.btn.agua,.btn.secundario{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-primary);box-shadow:var(--shadow-L1)}
.btn.agua:hover,.btn.secundario:hover{opacity:1;background:var(--tint-strong)}
.btn.agua:active,.btn.secundario:active{box-shadow:var(--shadow-L1)}
.btn[disabled]{opacity:.4;cursor:default}

/* ---------- tarjeta del ítem (escenario) ---------- */
.escenario{
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);border-radius:var(--r-lg);box-shadow:var(--shadow-L1);
}
.nombre{font:500 var(--fs-title)/1.25 var(--font-ui);color:var(--text-primary)}

/* ---------- respuestas, controles y teclas: tarjetas tocables ≥ 56 px ---------- */
.opcion,.ctrl,.tecla{
  min-height:var(--toque-respuesta);border-radius:var(--r-sm);cursor:pointer;
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);
  font-family:var(--font-ui);font-weight:500;
  transition:background var(--t-rapida),border-color var(--t-rapida);
}
.opcion:hover,.ctrl:hover,.tecla:hover{border-color:var(--border-hover);background:var(--bg-elevated)}
.opcion:active,.ctrl:active,.tecla:active{transform:none;background:var(--tint-faint);box-shadow:var(--shadow-L1)}
.opcion b,.ctrl b,.tecla b{font-family:var(--font-ui);font-weight:500}
.ctrl.audio{color:var(--accent)}
.ctrl.listo{background:var(--button-neutral);color:var(--button-neutral-text);border-color:transparent}
.ctrl.listo:hover{background:var(--button-neutral);opacity:.9}
.ctrl.quitar{color:var(--red)}
.ctrl.quitar:hover{background:var(--red-tint)}
/* estados: color solo en borde y fondo tint (DESIGN.md §6) */
.opcion.bien,.opcion.correcta{background:var(--green-tint);border-color:var(--green);color:var(--text-primary);box-shadow:none}
.opcion.mal,.opcion.incorrecta{background:var(--red-tint);border-color:var(--red);color:var(--text-primary);box-shadow:none}
.opcion[disabled],.ctrl[disabled],.tecla[disabled]{cursor:default}
.opcion.incorrecta[disabled],.opcion.mal[disabled]{opacity:.7}

/* ---------- aviso: el dato para repetir en la prueba · tarjeta con punto de estado ---------- */
.aviso{border-radius:var(--r-sm);line-height:1.4;font-weight:500;font-size:var(--fs-body);color:var(--text-primary)}
.aviso.ok:not(:empty),.aviso.ups:not(:empty){
  position:relative;background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);padding:12px 14px 12px 32px;text-align:left;
}
.aviso.ok:not(:empty)::before,.aviso.ups:not(:empty)::before{
  content:"";position:absolute;left:14px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:9999px;background:var(--green);
}
.aviso.ups:not(:empty)::before{background:var(--orange)}

/* ---------- detalles ---------- */
.ecuacion .hueco,.escena .hueco,.cuento .hueco{color:var(--accent);border-bottom-color:var(--accent)}
.rot small,.letraBtn small{font-size:var(--fs-meta)}          /* "decenas", "unidades", letra mayúscula */
.base10 .rot,.casilla b{font-size:var(--fs-meta)}
.pista-escucha{color:var(--text-secondary)}

/* ---------- cierre: panel agrupado (álbum) ---------- */

<div class="marco">

    <p class="intro">Tres desaf&iacute;os: <b>sumar contando</b> los dibujos, <b>juntar decenas y unidades</b> para sumar n&uacute;meros grandes, y <b>resolver problemas</b> escuchando el cuento.</p>

    <div class="album" id="album"></div>
    <button class="btn sol" id="btnOtraVez">Jugar de nuevo 🔁</button>
  </section>

</div>

<script>
/* ==================== UTILIDADES COMUNES ==================== */
const $ = id => document.getElementById(id);
const azar = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const mezclar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

let vozOn = true;
let vozSerie = 0;

/* Parte el texto en trozos cortos: Safari corta las frases muy largas. */
function trozos(txt, max){
  max = max || 130;
  const out = []; let act = "";
  txt.split(" ").forEach(w=>{
    if((act + " " + w).trim().length > max){ if(act) out.push(act.trim()); act = w; }
    else act = (act + " " + w).trim();
  });
  if(act.trim()) out.push(act.trim());
  return out.length ? out : [txt];
}
function eligeVoz(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang==="es-CL") || vs.find(v=>v.lang==="es-MX") ||
         vs.find(v=>v.lang==="es-ES") || vs.find(v=>v.lang.startsWith("es")) || null;
}
/* dice(): promesa que se resuelve SOLO cuando la voz terminó de verdad.
   Resuelve "reemplazada" si otra frase la interrumpió, para que quien esperaba
   el final no avance de pantalla por error. */
function dice(txt){
  const mio = ++vozSerie;
  return new Promise(res=>{
    const espera = Math.min(11000, 1300 + txt.length*58);
    if(!window.speechSynthesis || !vozOn){
      try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
      setTimeout(()=>res(mio === vozSerie ? "sin-voz" : "reemplazada"), espera);
      return;
    }
    try{ speechSynthesis.cancel(); }catch(_){}
    let listo = false, vig = null;
    const fin = r => { if(listo) return; listo = true; if(vig) clearInterval(vig); res(r); };
    const partes = trozos(txt);
    partes.forEach((t,i)=>{
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "es-CL"; u.rate = .85; u.pitch = 1.1;
      const v = eligeVoz(); if(v) u.voice = v;
      if(i === partes.length-1){ u.onend = ()=>fin("fin"); u.onerror = ()=>fin("error"); }
      speechSynthesis.speak(u);
    });
    /* Vigilante: en iOS el evento onend a veces no llega nunca. */
    let arranco = false; const t0 = Date.now();
    vig = setInterval(()=>{
      if(mio !== vozSerie){ fin("reemplazada"); return; }
      if(speechSynthesis.speaking || speechSynthesis.pending) arranco = true;
      else if(arranco){ fin("vigilante"); return; }
      /* Si el motor de voz nunca partió (pasa en iOS con el timbre en silencio),
         se da igualmente el tiempo de lectura antes de continuar. */
      if(!arranco && Date.now() - t0 > 1800){
        clearInterval(vig); vig = null;
        setTimeout(()=>fin("sin-voz"), Math.max(0, espera - 1800));
        return;
      }
      if(Date.now() - t0 > 25000) fin("tope");
    }, 220);
  });
}
function hablar(txt, cb){ const p = dice(txt); if(cb) p.then(cb); return p; }
function hablando(){
  return !!(window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending));
}
/* Un solo AudioContext reutilizado: Safari en iPhone permite muy pocos. */
let ctxAudio = null;
function audio(){
  try{
    if(!ctxAudio) ctxAudio = new (window.AudioContext||window.webkitAudioContext)();
    if(ctxAudio.state === "suspended") ctxAudio.resume();
    return ctxAudio;
  }catch(e){ return null; }
}
function pito(ok){
  const ctx = audio(); if(!ctx) return;
  try{
    const notas = ok ? [523,659,784] : [330,262];
    notas.forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.001,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02+i*.11);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.20+i*.11);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+i*.11); o.stop(ctx.currentTime+.4+i*.11);
    });
  }catch(e){}
}
function clic(){
  const ctx = audio(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(.09,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+.1);
  }catch(e){}
}
function pantalla(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
  $(id).classList.add("activa");
}
function confeti(emojis){
  emojis = emojis || ["⭐","🎉","🌟","✨"];
  for(let i=0;i<24;i++){
    const c = document.createElement("div");
    c.className = "confeti";
    c.textContent = emojis[i%emojis.length];
    c.style.left = Math.random()*100+"%";
    c.style.animationDuration = (2+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*.6)+"s";
    document.querySelector(".marco").appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}
const ANIMOS = ["¡Excelente!","¡Muy bien!","¡Lo lograste!","¡Qué crack!","¡Perfecto!",
  "¡Así se hace!","¡Brillante!","¡Genial!","¡Increíble!","¡Bravo!"];
const CASIS = ["Casi... observa bien.","Casi lo tienes, mira otra vez.","Uy, casi. Inténtalo de nuevo.",
  "No pasa nada, prueba otra vez.","Vas bien, revisa una vez más.","Tranquila, mira con calma."];
let usadosAnimo = [];
function animo(){
  if(usadosAnimo.length >= ANIMOS.length) usadosAnimo = [];
  let f; do { f = ANIMOS[azar(0,ANIMOS.length-1)]; } while(usadosAnimo.includes(f));
  usadosAnimo.push(f); return f;
}
function casi(){ return CASIS[azar(0,CASIS.length-1)]; }

function conectarVoz(){
  const b = $("btnVoz");
  b.addEventListener("click", ()=>{
    vozOn = !vozOn;
    b.textContent = vozOn ? "🔊 Voz" : "🔇 Voz";
    b.setAttribute("aria-pressed", vozOn);
    if(!vozOn && window.speechSynthesis){ vozSerie++; speechSynthesis.cancel(); }
  });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
}

/* ==================== SUMAS Y PROBLEMAS ==================== */
const UNI = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"];
const DIEZ = ["diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];
const VEINTE = ["veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
const DECENAS = {3:"treinta", 4:"cuarenta", 5:"cincuenta", 6:"sesenta", 7:"setenta"};
function palabras(n){
  if(n < 10) return UNI[n];
  if(n < 20) return DIEZ[n-10];
  if(n < 30) return VEINTE[n-20];
  const d = Math.floor(n/10), u = n%10;
  return u === 0 ? DECENAS[d] : DECENAS[d] + " y " + UNI[u];
}

/* Nivel 1: sumas de un dígito, con los objetos a la vista para contarlos. */
const SUMAS1 = [
  { a:3, b:4, emo:"🍎", op:[7,6,8,5] },
  { a:5, b:2, emo:"🐞", op:[7,8,6,9] },
  { a:6, b:3, emo:"⭐", op:[9,8,10,7] },
  { a:4, b:4, emo:"🐟", op:[8,7,9,6] },
  { a:7, b:2, emo:"🌻", op:[9,10,8,11] },
  { a:5, b:5, emo:"🎈", op:[10,9,11,15] },
  { a:8, b:3, emo:"🐢", op:[11,10,12,9] },
  { a:6, b:6, emo:"🍓", op:[12,11,13,16] }
];

/* Nivel 2: dos dígitos, sin reserva. Se ven las barras de diez y los cubitos
   sueltos, y ella escribe el resultado en las casillas de decena y unidad. */
const SUMAS2 = [
  { a:23, b:4  },
  { a:31, b:5  },
  { a:12, b:20 },
  { a:24, b:13 },
  { a:35, b:4  },
  { a:40, b:16 },
  { a:22, b:25 },
  { a:30, b:27 }
];

/* Nivel 3: problemas. Siempre se junta, nunca se quita: es lo que pide la rúbrica. */
const PROBLEMAS = [
  { txt:"En el patio hay 6 mariposas y llegan 3 más.", pre:"¿Cuántas mariposas hay ahora?",
    emo:"🦋", a:6, b:3, r:9,  op:[9,8,10] },
  { txt:"Tengo 12 lápices y me regalan 5.", pre:"¿Cuántos lápices tengo ahora?",
    emo:"✏️", a:12, b:5, r:17, op:[17,16,71] },
  { txt:"En el árbol hay 20 manzanas y en el suelo hay 7.", pre:"¿Cuántas manzanas hay en total?",
    emo:"🍎", a:20, b:7, r:27, op:[27,72,17] },
  { txt:"Ana juntó 15 conchitas y su hermano juntó 4.", pre:"¿Cuántas juntaron entre los dos?",
    emo:"🐚", a:15, b:4, r:19, op:[19,18,91] },
  { txt:"En el corral hay 11 pollitos y nacen 6 más.", pre:"¿Cuántos pollitos hay ahora?",
    emo:"🐥", a:11, b:6, r:17, op:[17,16,71] },
  { txt:"En el tren van 30 pasajeros y suben 8.", pre:"¿Cuántos pasajeros van ahora?",
    emo:"🚂", a:30, b:8, r:38, op:[38,83,28] },
  { txt:"En la caja hay 24 lápices y llegan 5 más.", pre:"¿Cuántos lápices hay en la caja?",
    emo:"🖍️", a:24, b:5, r:29, op:[29,28,92] },
  { txt:"En la feria compré 40 huevos y después 9 más.", pre:"¿Cuántos huevos compré?",
    emo:"🥚", a:40, b:9, r:49, op:[49,39,94] }
];

const PREMIOS = ["➕","🧮","⭐","🌟","🍎","🐞","🌻","🎈","🐢","🍓","🦋","✏️","🐚","🐥","🚂","🥚","🌈","🍀","🎯","🏅","🐬","🍉","🚀","🧩"];

let nivel = 1, idx = 0, estrellas = 0, album = [], intentos = 0, cerrado = false, serie = 0;
let escrito = [];

function aviso(tipo, txt){
  const a = $("aviso");
  a.className = "aviso" + (tipo ? " "+tipo : "");
  a.textContent = txt || "";
}
function sumaEstrella(){
  estrellas++;
  $("puntaje").textContent = "⭐ " + estrellas;
  album.push(PREMIOS[(estrellas-1) % PREMIOS.length]);
}
function cierra(txtVoz){
  cerrado = true;
  const s = serie;
  $("avanzar").innerHTML = `<button class="btn hoja" id="btnSig">Siguiente ▶️</button>`;
  $("btnSig").onclick = ()=>{ if(window.speechSynthesis) speechSynthesis.cancel(); siguiente(); };
  const t0 = Date.now();
  const minimo = Math.min(9000, 2200 + txtVoz.length*45);
  dice(txtVoz).then(r=>{
    if(r === "reemplazada" || s !== serie || !cerrado) return;
    const falta = Math.max(1200, minimo - (Date.now() - t0));
    setTimeout(()=>{ if(s === serie && cerrado && !hablando()) siguiente(); }, falta);
  });
}
function siguiente(){
  if(!cerrado) return;
  cerrado = false;
  idx++;
  const largo = nivel===1 ? SUMAS1.length : nivel===2 ? SUMAS2.length : PROBLEMAS.length;
  if(idx >= largo){ idx = 0; nivel++; }
  if(nivel > 3){ terminar(); return; }
  render();
}

/* dibuja n con barras de diez y cubitos sueltos */
function base10(n){
  const d = Math.floor(n/10), u = n%10;
  let h = "";
  for(let i=0;i<d;i++) h += `<div class="barra10">${"<i></i>".repeat(10)}</div>`;
  if(u) h += `<div class="sueltos">${'<span class="suelto"></span>'.repeat(u)}</div>`;
  return `<div class="pila10"><div class="base10">${h || '<span class="rot">0</span>'}</div>
          <span class="rot">${n}</span></div>`;
}

/* ==================== NIVEL 1: SUMO CONTANDO OBJETOS ==================== */
function nivel1(){
  const it = SUMAS1[idx], r = it.a + it.b;
  $("chip").textContent = `Nivel 1 · ${idx+1} de ${SUMAS1.length}`;
  $("pregunta").textContent = "Cuenta y suma";
  $("escena").className = "escena";
  $("escena").innerHTML = `
    <div class="grupos">
      <div class="grupo-emo">${`<span>${it.emo}</span>`.repeat(it.a)}</div>
      <div class="mas">+</div>
      <div class="grupo-emo">${`<span>${it.emo}</span>`.repeat(it.b)}</div>
    </div>
    <div class="ecuacion">${it.a} + ${it.b} = <span class="hueco">?</span></div>`;
  $("respuesta").innerHTML = `
    <div class="opciones dos">${mezclar(it.op).map(n=>`<button class="opcion num" data-n="${n}">${n}</button>`).join("")}</div>
    <div class="controles" style="margin-top:10px">
      <button class="ctrl audio" id="repetir">🔁 Escuchar otra vez</button>
    </div>`;
  $("avanzar").innerHTML = "";
  aviso("", "");
  intentos = 0;
  const frase = `${palabras(it.a)} más ${palabras(it.b)}. ¿Cuánto es?`;
  $("repetir").onclick = ()=>dice(frase);
  document.querySelectorAll(".opcion").forEach(b=>{
    b.onclick = ()=>revisa1(b, +b.dataset.n, it, r);
  });
  dice(frase);
}
function revisa1(btn, elegido, it, r){
  if(cerrado || btn.disabled) return;
  if(elegido === r){
    btn.classList.add("bien"); clic(); pito(true); sumaEstrella();
    document.querySelectorAll(".opcion").forEach(b=>b.disabled = true);
    const h = $("escena").querySelector(".hueco"); if(h) h.textContent = r;
    $("escena").classList.add("bien");
    const txt = `${animo()} ${it.a} más ${it.b} es ${r}. Para sumar rápido, parte del número más grande y sigue contando.`;
    aviso("ok", txt);
    cierra(txt);
  }else{
    btn.classList.add("mal"); btn.disabled = true; pito(false); intentos++;
    const pista = intentos >= 2
      ? `Cuenta los dibujos de uno en uno: ${it.a}, y después sigue ${it.b} más.`
      : `Cuenta otra vez los dibujos: primero ${it.a} y después ${it.b} más.`;
    aviso("ups", `${casi()} ${pista}`);
    dice(`${casi()} ${pista}`);
  }
}

/* ==================== NIVEL 2: SUMO DECENAS Y UNIDADES ==================== */
function nivel2(){
  const it = SUMAS2[idx], r = it.a + it.b;
  $("chip").textContent = `Nivel 2 · ${idx+1} de ${SUMAS2.length}`;
  $("pregunta").textContent = "Junta las decenas y las unidades";
  $("escena").className = "escena";
  $("escena").innerHTML = `
    <div class="grupos">${base10(it.a)}<div class="mas">+</div>${base10(it.b)}</div>
    <div class="ecuacion">${it.a} + ${it.b} = <span class="hueco">?</span></div>`;
  $("respuesta").innerHTML = `
    <div class="casillas">
      <div class="casilla" id="cD"><span class="vacia">?</span><b>decena</b></div>
      <div class="casilla" id="cU"><span class="vacia">?</span><b>unidad</b></div>
    </div>
    <div class="teclado" style="margin-top:10px">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button class="tecla" data-d="${d}">${d}</button>`).join("")}</div>
    <div class="controles" style="margin-top:10px">
      <button class="ctrl quitar" id="borrar">⌫ Borrar</button>
      <button class="ctrl listo" id="listo">✅ Listo</button>
    </div>`;
  $("avanzar").innerHTML = "";
  aviso("", "");
  intentos = 0; escrito = [];
  $("borrar").onclick = ()=>{ escrito.pop(); clic(); pintaCasillas(); };
  $("listo").onclick = ()=>revisa2(it, r);
  document.querySelectorAll(".tecla").forEach(b=>{
    b.onclick = ()=>{
      if(cerrado || escrito.length >= 2) return;
      escrito.push(+b.dataset.d); clic(); pintaCasillas();
    };
  });
  dice(`${palabras(it.a)} más ${palabras(it.b)}. Junta primero las barras de diez y después los cubitos sueltos.`);
}
function pintaCasillas(){
  [$("cD"), $("cU")].forEach((el,i)=>{
    if(!el) return;
    const v = escrito[i];
    el.querySelector("span").innerHTML = (v === undefined) ? '<span class="vacia">?</span>' : v;
    el.classList.toggle("llena", v !== undefined);
  });
}
function revisa2(it, r){
  if(cerrado) return;
  if(escrito.length < 2){
    aviso("ups", "Escribe las dos cifras: primero la decena y después la unidad.");
    dice("Escribe las dos cifras: primero la decena y después la unidad.");
    return;
  }
  const puesto = escrito[0]*10 + escrito[1];
  const dA = Math.floor(it.a/10), uA = it.a%10, dB = Math.floor(it.b/10), uB = it.b%10;
  if(puesto === r){
    pito(true); sumaEstrella();
    const h = $("escena").querySelector(".hueco"); if(h) h.textContent = r;
    $("escena").classList.add("bien");
    const dec = n => n === 1 ? "1 decena" : n + " decenas";
    const uni = n => n === 1 ? "1 unidad" : n + " unidades";
    const txt = `${animo()} ${dec(dA)} más ${dec(dB)} son ${dec(dA+dB)}, y ${uni(uA)} más ${uni(uB)} son ${uni(uA+uB)}: ${r}.`;
    aviso("ok", txt);
    cierra(txt);
  }else{
    pito(false); intentos++;
    $("escena").classList.add("mal");
    setTimeout(()=>$("escena").classList.remove("mal"), 500);
    const pista = intentos >= 2
      ? `Cuenta las barras de diez: ${dA} y ${dB} son ${dA+dB}. Ahora los cubitos sueltos: ${uA} y ${uB} son ${uA+uB}.`
      : `Primero junta las barras de diez y después los cubitos sueltos.`;
    aviso("ups", `${casi()} ${pista}`);
    dice(`${casi()} ${pista}`);
    escrito = []; pintaCasillas();
  }
}

/* ==================== NIVEL 3: PROBLEMAS ==================== */
function nivel3(){
  const it = PROBLEMAS[idx];
  $("chip").textContent = `Nivel 3 · ${idx+1} de ${PROBLEMAS.length}`;
  $("pregunta").textContent = "Escucha el problema";
  $("escena").className = "escena";
  /* si son pocos, se dibujan los dos grupos por separado para poder contarlos;
     si son muchos, se muestra el número al lado del dibujo */
  const dibujo = it.a + it.b <= 20
    ? `<div class="grupos">
         <div class="grupo-emo">${`<span>${it.emo}</span>`.repeat(it.a)}</div>
         <div class="mas">+</div>
         <div class="grupo-emo">${`<span>${it.emo}</span>`.repeat(it.b)}</div>
       </div>`
    : `<div class="grupos">
         <div class="grupo-emo grande"><span>${it.emo}</span><b>${it.a}</b></div>
         <div class="mas">+</div>
         <div class="grupo-emo grande"><span>${it.emo}</span><b>${it.b}</b></div>
       </div>`;
  $("escena").innerHTML = `${dibujo}<div class="cuento">${it.txt}<br><b>${it.pre}</b></div>`;
  $("respuesta").innerHTML = `
    <div class="opciones tres">${mezclar(it.op).map(n=>`<button class="opcion num" data-n="${n}">${n}</button>`).join("")}</div>
    <div class="controles" style="margin-top:10px">
      <button class="ctrl audio" id="repetir">🔁 Escuchar otra vez</button>
    </div>`;
  $("avanzar").innerHTML = "";
  aviso("", "");
  intentos = 0;
  const frase = `${it.txt} ${it.pre}`;
  $("repetir").onclick = ()=>dice(frase);
  document.querySelectorAll(".opcion").forEach(b=>{
    b.onclick = ()=>revisa3(b, +b.dataset.n, it);
  });
  dice(frase);
}
function revisa3(btn, elegido, it){
  if(cerrado || btn.disabled) return;
  if(elegido === it.r){
    btn.classList.add("bien"); clic(); pito(true); sumaEstrella();
    document.querySelectorAll(".opcion").forEach(b=>b.disabled = true);
    $("escena").classList.add("bien");
    const txt = `${animo()} ${it.a} más ${it.b} es ${it.r}. Cuando algo llega o se junta, se suma.`;
    aviso("ok", txt);
    cierra(txt);
  }else{
    btn.classList.add("mal"); btn.disabled = true; pito(false); intentos++;
    const pista = intentos >= 2
      ? `Parte de ${palabras(it.a)} y cuenta ${palabras(it.b)} más.`
      : `Vuelve a escuchar: había ${palabras(it.a)} y llegaron ${palabras(it.b)} más.`;
    aviso("ups", `${casi()} ${pista}`);
    dice(`${casi()} ${pista}`);
  }
}

/* ==================== FLUJO ==================== */
function render(){
  serie++;
  if(nivel === 1) nivel1();
  else if(nivel === 2) nivel2();
  else nivel3();
}
function terminar(){
  serie++;
  pantalla("final");
  $("album").innerHTML = album.map(e=>`<span>${e}</span>`).join("");
  const total = SUMAS1.length + SUMAS2.length + PROBLEMAS.length;
  $("resumen").textContent = `Juntaste ${estrellas} estrellas de ${total}. Sumaste contando objetos, juntaste decenas y unidades, y resolviste ocho problemas escuchando el cuento.`;
  confeti(["⭐","➕","🎉","🧮"]);
  dice(`${animo()} Juntaste ${estrellas} estrellas. Ya sumas de un dígito, de dos dígitos y resuelves problemas. Si quieres, juega de nuevo.`);
}
function arranca(){
  audio();
  nivel = 1; idx = 0; estrellas = 0; album = []; cerrado = false; escrito = [];
  $("puntaje").textContent = "⭐ 0";
  pantalla("juego");
  render();
}
conectarVoz();
$("btnEmpezar").onclick = arranca;
$("btnOtraVez").onclick = arranca;

</script>

<script id="selva-js">
/* ==========================================================================
   SELVA v2 · comportamiento común
   1. Guarda el progreso (veces jugada y mejor puntaje) para que la portada
      muestre las estrellas ganadas. Solo en este dispositivo, sin internet.
   2. Si ya hay estrellas en la ronda, "Inicio" pregunta antes de salir.
   3. Hace saltar el contador cuando se gana una estrella.
   4. Etiqueta los botones que solo tienen un ícono.
   ========================================================================== */
(function(){
  var CLAVE = "aprendo:progreso";
  var ruta = decodeURIComponent(location.pathname).replace(/^.*?(\d+-basico\/)/, "$1");
  var $ = function(s){ return document.querySelector(s); };

  function estrellas(){
    var el = $("#puntaje, #cuenta");
    var m = el && el.textContent.match(/\d+/);
    return m ? +m[0] : 0;
  }
  function registrar(){
    var d = {};
    try{ d = JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){}
    var r = d[ruta] || { veces:0, mejor:0 };
    r.veces++;
    r.mejor = Math.max(r.mejor || 0, estrellas());
    r.ultima = new Date().toISOString().slice(0, 10);
    d[ruta] = r;
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
  }

  /* 1. fin de la actividad: pantalla #final (juegos) o #pFinal (misiones) */
  var fin = $("#final, #pFinal");
  if(fin){
    var visto = false;
    new MutationObserver(function(){
      var ve = fin.classList.contains("activa") || (fin.id === "pFinal" && !fin.hidden);
      if(ve && !visto){ visto = true; setTimeout(registrar, 400); }
      if(!ve) visto = false;
    }).observe(fin, { attributes:true, attributeFilter:["class", "hidden"] });
  }
  /* presentaciones: cuenta como vista al llegar a la última diapositiva */
  var cont = $("#contador");
  if(cont && !fin){
    var vista = false;
    new MutationObserver(function(){
      var p = cont.textContent.match(/(\d+)\s*\/\s*(\d+)/);
      if(p && p[1] === p[2] && !vista){ vista = true; registrar(); }
    }).observe(cont, { childList:true, characterData:true, subtree:true });
  }

  /* 2. confirmar antes de salir a mitad de una ronda */
  function enRonda(){
    return !!$("#juego.activa, #ensayo.activa, #pJuego:not([hidden])") && estrellas() > 0;
  }
  var dlg = null;
  function preguntarSalida(destino){
    if(!window.HTMLDialogElement){ location.href = destino; return; }
    if(!dlg){
      dlg = document.createElement("dialog");
      dlg.className = "selva-dialogo";
      dlg.innerHTML =
        '<div class="selva-dialogo-emo" aria-hidden="true">🏠</div>' +
        '<h2>¿Quieres salir?</h2>' +
        '<p>Si sales ahora, se pierden las estrellas de esta ronda.</p>' +
        '<button class="selva-seguir" value="seguir">▶️ Seguir jugando</button>' +
        '<button class="selva-salir" value="salir">Salir</button>';
      dlg.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        dlg.close();
        if(b.value === "salir") location.href = dlg.dataset.destino;
      });
      document.body.appendChild(dlg);
    }
    dlg.dataset.destino = destino;
    dlg.showModal();
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance("¿Quieres salir? Si sales ahora, se pierden las estrellas de esta ronda.");
        u.lang = "es-ES"; speechSynthesis.speak(u);
      }
    }catch(e){}
    dlg.querySelector(".selva-seguir").focus();
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href$="index.html"]');
    if(!a || !enRonda()) return;
    e.preventDefault();
    preguntarSalida(a.href);
  }, true);

  /* 3. el contador salta al ganar una estrella */
  var pts = $("#puntaje");
  if(pts){
    var antes = estrellas();
    new MutationObserver(function(){
      var ahora = estrellas();
      if(ahora > antes){
        pts.classList.remove("salta"); void pts.offsetWidth; pts.classList.add("salta");
      }
      antes = ahora;
    }).observe(pts, { childList:true, characterData:true, subtree:true });
  }

  /* 4. etiquetas para lectores de pantalla */
  var nombres = { btnGeneral:"Ver todas las diapositivas", btnPantalla:"Pantalla completa", btnVoz:"Voz", sonido:"Voz y sonidos" };
  Object.keys(nombres).forEach(function(id){
    var b = document.getElementById(id);
    if(b && !b.getAttribute("aria-label") && !/[a-záéíóú]{3}/i.test(b.textContent)) b.setAttribute("aria-label", nombres[id]);
  });
  /* el iPhone no permite pantalla completa en páginas web: se oculta el botón */
  var d = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) d.classList.add("selva-sin-pantalla-completa");
})();
</script>
