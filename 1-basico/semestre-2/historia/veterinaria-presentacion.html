<style>
/* tokens y componentes comunes: bloque generado más abajo (diseno/) */
:root{--W:1600; --H:900}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;display:flex;flex-direction:column;font-family:var(--font-ui)}

/* ============ barra superior ============ */
.barra{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;z-index:20}
.grupo{display:flex;gap:6px;align-items:center}
.contador{font:500 var(--fs-meta)/1 var(--font-mono);color:var(--text-secondary);white-space:nowrap}

/* ============ escenario y lienzo ============ */
.escenario{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:var(--bg-wash)}
.zona{position:absolute;top:0;bottom:0;width:24%;border:none;background:transparent;cursor:pointer;z-index:15}
.zona.izq{left:0}
.zona.der{right:0}
.lienzo{
  width:1600px;height:900px;flex:0 0 auto;position:relative;overflow:hidden;
  transform-origin:center center;background:var(--bg-page);
  border:1px solid var(--border-primary);border-radius:var(--r-lg);box-shadow:var(--shadow-L3);
}

/* ============ diapositivas ============ */
.diapo{
  position:absolute;inset:0;opacity:0;pointer-events:none;background:var(--bg-page);
  transition:opacity .16s ease-out;
}
.diapo.activa{opacity:1;pointer-events:auto;z-index:2}
.d-portada,.d-duo,.d-rejilla,.d-numero,.d-cierre{height:100%}

.marca{position:absolute;left:56px;bottom:28px;font-size:20px;color:var(--text-tertiary);z-index:6}
.pagina{position:absolute;right:56px;bottom:26px;font:500 22px/1 var(--font-mono);color:var(--text-tertiary);z-index:6}
.progreso{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);z-index:8;transition:width .16s ease-out}

/* --- fotos --- */
.foto{display:block;width:100%;height:100%;object-fit:cover;background:var(--tint-faint)}
.cuadro{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border-primary);background:var(--tint-faint);position:relative}

/* --- portada --- */
.d-portada{display:grid;grid-template-columns:1fr 700px}
.portada-txt{display:flex;flex-direction:column;justify-content:center;padding:0 72px 0 96px;position:relative;z-index:3}
.eyebrow{font:500 26px/1.2 var(--font-ui);color:var(--text-secondary);margin:0 0 20px}
.d-portada h1{font:500 96px/1.02 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);margin:0 0 22px}
.d-portada .sub{font-size:38px;line-height:1.25;margin:0 0 48px;color:var(--text-secondary);max-width:16ch}
.autor{
  display:inline-flex;flex-direction:column;gap:6px;width:fit-content;padding:16px 24px;
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);border-radius:var(--r-lg);box-shadow:var(--shadow-L1);
}
.autor small{font-size:20px;color:var(--text-secondary)}
.autor b{font:500 32px/1.1 var(--font-ui)}
.portada-foto{position:relative;overflow:hidden;border-left:1px solid var(--border-primary)}
.portada-foto .foto{object-position:center 18%}

/* --- duo: foto + texto --- */
.d-duo{display:grid;grid-template-rows:auto 1fr;padding:56px 72px 76px}
.d-duo h2,.d-rejilla h2,.d-numero h2{
  font:500 64px/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);margin:0 0 36px;text-align:center;
}
.duo-cuerpo{display:grid;grid-template-columns:560px 1fr;gap:56px;align-items:center;min-height:0}
.duo-cuerpo .cuadro{height:100%;max-height:520px}
.bloque{display:flex;flex-direction:column;gap:20px}
.frase{
  background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-primary);
  border-radius:var(--r-lg);box-shadow:var(--shadow-L1);padding:30px 34px;margin:0;
  font-size:46px;line-height:1.25;
}
.frase.destacada{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}
.frase.chica{font-size:36px}

/* --- rejilla de tarjetas --- */
.d-rejilla{display:grid;grid-template-rows:auto 1fr;padding:56px 64px 76px}
.rejilla{display:grid;gap:24px;align-items:stretch;min-height:0}
.rejilla.n2{grid-template-columns:repeat(2,1fr);max-width:1120px;margin:0 auto;width:100%}
.rejilla.n3{grid-template-columns:repeat(3,1fr)}
.rejilla.n4{grid-template-columns:repeat(4,1fr)}
.tarjeta{
  background:var(--bg-elevated);border:1px solid var(--border-primary);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-L1);
  display:grid;grid-template-rows:auto 108px;min-height:0;align-self:center;
}
.tarjeta .cuadro{border-radius:0;border:0;border-bottom:1px solid var(--border-primary);min-height:0;aspect-ratio:1/1}
.rotulo{
  color:var(--text-primary);font-size:30px;line-height:1.2;font-weight:500;
  padding:10px 16px;text-align:center;display:flex;align-items:center;justify-content:center;
}
.rejilla.n2 .tarjeta{grid-template-rows:1fr 120px;align-self:stretch}
.rejilla.n2 .tarjeta .cuadro{aspect-ratio:auto}
.rejilla.n2 .rotulo{font-size:36px}
.tipo-portada .marca,.tipo-portada .pagina{display:none}
.tipo-cierre .marca,.tipo-cierre .pagina{color:rgba(255,255,255,.7)}

/* --- número grande (133) --- */
.d-numero{display:grid;grid-template-rows:auto 1fr;padding:56px 72px 76px}
.numero-cuerpo{display:grid;grid-template-columns:520px 1fr;gap:56px;align-items:center;min-height:0}
.numero-cuerpo .cuadro{height:100%;max-height:520px}
.numerote{font:500 220px/.85 var(--font-mono);letter-spacing:-.04em;color:var(--accent);margin:0 0 12px}

/* --- cierre a sangre --- */
.d-cierre{position:relative}
.d-cierre .foto{position:absolute;inset:0;object-position:center 60%}
.velo{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,.78))}
.cierre-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 96px;text-align:center}
.d-cierre h2{font:500 76px/1.05 var(--font-ui);letter-spacing:-.02em;color:#FFF;margin:0}
.d-cierre .frase{font-size:44px;max-width:22ch}
.gracias{font:500 72px/1 var(--font-ui);color:#FFF;margin:8px 0 0}

/* ============ vista general ============ */
.general{
  position:fixed;inset:0;background:var(--bg-page);z-index:60;
  display:none;flex-direction:column;padding:16px 20px;
}
.general.abierta{display:flex}
.general-tope{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--border-primary)}
.general h3{font:500 var(--fs-label)/1.3 var(--font-ui);color:var(--text-primary);margin:0;flex:1}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:auto;flex:1;align-content:start}
.mini-diapo{
  background:var(--bg-elevated);border:1px solid var(--border-primary);border-radius:var(--r-sm);overflow:hidden;
  box-shadow:var(--shadow-L1);cursor:pointer;padding:0;display:flex;flex-direction:column;text-align:left;color:var(--text-primary);
  transition:border-color var(--t-rapida);
}
.mini-diapo:hover{border-color:var(--border-hover)}
.mini-diapo.ahora{border-color:var(--accent)}
.mini-diapo .cuadro{border-radius:0;border:0;aspect-ratio:16/10}
.mini-diapo span{padding:8px 10px;font:500 var(--fs-meta)/1.3 var(--font-ui)}
.mini-diapo b{font-family:var(--font-mono);font-weight:500;color:var(--text-secondary);margin-right:6px}

/* ============ guion y pie ============ */
.guion{
  flex:0 0 auto;background:var(--bg-wash);border-top:1px solid var(--border-primary);
  padding:10px 16px;font-size:var(--fs-body);line-height:1.4;display:none;z-index:20;color:var(--text-primary);
}
.guion.visible{display:block}
.guion b{font-weight:600}
.pie{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 12px 14px;flex:0 0 auto;z-index:20}
/* anterior = secundario · siguiente = primario */
.nav{
  width:72px;height:var(--toque-respuesta);border-radius:var(--r-sm);cursor:pointer;
  background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);
  display:flex;align-items:center;justify-content:center;font:400 2rem/1 var(--font-ui);
  transition:background var(--t-rapida),opacity var(--t-rapida);
}
.nav:hover{background:var(--tint-strong)}
.nav.sol{background:var(--button-neutral);color:var(--button-neutral-text);border-color:transparent;box-shadow:none}
.nav.sol:hover{opacity:.9}
.nav[disabled]{opacity:.35;cursor:default}
.puntos{display:flex;gap:8px;align-items:center}
.puntos i{width:8px;height:8px;border-radius:9999px;background:var(--tint-strong);display:block;transition:background var(--t-rapida)}
.puntos i.ahora{background:var(--accent)}

.gira{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:18;
  background:var(--bg-elevated);color:var(--text-secondary);border:1px solid var(--border-primary);box-shadow:var(--shadow-L3);
  font:500 var(--fs-meta)/1 var(--font-ui);border-radius:var(--r-pill);padding:10px 16px;white-space:nowrap}
@media (orientation:portrait) and (max-width:820px){ .gira{display:block} }
@media (max-width:700px){
  .solo-ancho{display:none}
  .nav{width:64px;height:var(--toque)}
  .mini-grid{grid-template-columns:repeat(2,1fr)}
}

/* ============ impresión / PDF ============ */
@media print{
  @page{size:landscape;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  .barra,.pie,.guion,.zona,.general,.gira{display:none !important}
  .escenario{display:block;overflow:visible}
  .lienzo{transform:none !important;border:0;border-radius:0;box-shadow:none;
    width:1600px;height:auto;overflow:visible;display:block}
  .diapo{position:relative;inset:auto;opacity:1 !important;transform:none !important;
    display:block;width:1600px;height:900px;overflow:hidden;
    page-break-after:always;break-after:page}
  .diapo:last-of-type{page-break-after:auto;break-after:auto}
  .progreso{display:none}
}
</style>

  <button class="nav" id="btnAtras" aria-label="Anterior">‹</button>

  <button class="nav sol" id="btnSig" aria-label="Siguiente">›</button>
</footer>

<div class="general" id="general">
  <div class="general-tope">
    <h3>Todas las diapositivas · toca una para ir</h3>
    <button class="mini" id="btnCerrarGeneral">✕ Cerrar</button>
  </div>
  <div class="mini-grid" id="miniGrid"></div>
</div>

<script>
/* ============================================================
   FOTOS · carpeta img/ junto a este archivo
   ============================================================ */
const CARPETA = "img-veterinaria/";
const EXT = [".jpg",".jpeg",".png",".webp"];

/* ============================================================
   LAS 8 DIAPOSITIVAS
   texto = lo proyectado · guion = lo que ella dice · voz = lo que se lee
   ============================================================ */
const DIAPOS = [
  {
    tipo:"portada", miniatura:"veterinaria",
    titulo:"Los Veterinarios",
    sub:"Un oficio que cuida a los animales",
    foto:"veterinaria",
    voz:"Los Veterinarios. Un oficio que cuida a los animales. Presentado por Renata Leiva.",
    guion:"Buenos días. Hoy les voy a hablar de <b>los veterinarios</b>."
  },
  {
    tipo:"duo", miniatura:"estetoscopio",
    titulo:"¡Hola! Soy veterinaria",
    foto:"estetoscopio",
    frase:"Los veterinarios curamos a los animales para que estén sanos.",
    voz:"Hola. Soy veterinaria. Los veterinarios curamos a los animales para que estén sanos.",
    guion:"<b>Soy veterinaria.</b> Los veterinarios somos los que curamos a los animales cuando se enferman. <i>(Muestra tu delantal o tu estetoscopio.)</i>"
  },
  {
    tipo:"rejilla", miniatura:"revisar",
    titulo:"¿Qué hago en mi trabajo?",
    items:[
      {foto:"revisar", rotulo:"Reviso a los animales para saber qué tienen"},
      {foto:"vacunar", rotulo:"Pongo vacunas para que no se enfermen"},
      {foto:"curar",   rotulo:"Curo a los que están heridos"}
    ],
    voz:"¿Qué hago en mi trabajo? Reviso a los animales para saber qué tienen. Les pongo vacunas para que no se enfermen. Y curo a los que están heridos.",
    guion:"En mi trabajo <b>reviso a los animales</b>, <b>les pongo vacunas</b> para que no se enfermen y <b>curo a los que están heridos</b>."
  },
  {
    tipo:"rejilla", miniatura:"termometro",
    titulo:"¿Qué uso para trabajar?",
    items:[
      {foto:"estetoscopio", rotulo:"Estetoscopio: escucho el corazón"},
      {foto:"termometro",   rotulo:"Termómetro: veo si tiene fiebre"},
      {foto:"jeringa",      rotulo:"Vacuna: lo protege de enfermarse"},
      {foto:"delantal",     rotulo:"Delantal: para trabajar limpia"}
    ],
    voz:"¿Qué uso para trabajar? Mi estetoscopio, para escuchar el corazón. El termómetro, para ver si tiene fiebre. Las vacunas, que lo protegen de enfermarse. Y mi delantal, para trabajar limpia.",
    guion:"Uso mi <b>estetoscopio</b>, mi <b>termómetro</b> y las <b>vacunas</b>. El estetoscopio <b>sirve para escuchar el corazón</b>."
  },
  {
    tipo:"rejilla", miniatura:"conejo",
    titulo:"¿A quiénes atiendo?",
    items:[
      {foto:"perro",  rotulo:"Perros de todos los tamaños"},
      {foto:"gato",   rotulo:"Gatos, que llegan más asustados"},
      {foto:"conejo", rotulo:"Conejos, hámsteres y tortugas"}
    ],
    voz:"¿A quiénes atiendo? A perros de todos los tamaños. A gatos, que llegan más asustados. Y también a conejos, hámsteres y tortugas.",
    guion:"Atiendo <b>perros, gatos y también conejos</b>, hámsteres y tortugas."
  },
  {
    tipo:"duo", miniatura:"familia",
    titulo:"¿Cómo ayudo a mi comunidad?",
    foto:"familia",
    frase:"Cuido a las mascotas de todas las familias del barrio.",
    extra:"Una mascota sana hace feliz a toda su familia.",
    voz:"¿Cómo ayudo a mi comunidad? Cuido a las mascotas de todas las familias del barrio. Una mascota sana hace feliz a toda su familia.",
    guion:"Ayudo a las familias <b>manteniendo sanas a sus mascotas</b>. Una mascota sana hace feliz a toda la familia."
  },
  {
    tipo:"numero", miniatura:"temperatura",
    titulo:"¿Sabías que...?",
    foto:"temperatura",
    numero:"38°",
    frase:"Un perro sano tiene 38 grados. ¡Nosotros tenemos 36!",
    voz:"¿Sabías que un perro sano tiene treinta y ocho grados de temperatura? Nosotros tenemos treinta y seis. Por eso los perros se sienten calentitos.",
    guion:"¿Sabían que un perro sano tiene <b>38 grados</b> de temperatura? ¡Nosotros tenemos 36! Por eso se sienten calentitos."
  },
  {
    tipo:"cierre", miniatura:"cierre",
    titulo:"Su trabajo es muy importante",
    foto:"cierre",
    frase:"Porque los animales no pueden decir dónde les duele.",
    gracias:"¡Muchas gracias!",
    voz:"El trabajo del veterinario es muy importante porque los animales no pueden decir dónde les duele. ¡Muchas gracias!",
    guion:"El trabajo del veterinario es <b>muy importante porque los animales no pueden decir dónde les duele</b>. Por eso hay que cuidarlos y llevarlos al veterinario. <b>¡Muchas gracias!</b>"
  }
];

/* ============================================================
   Motor
   ============================================================ */
const $ = id => document.getElementById(id);
let actual = 0, vozOn = false, guionOn = false;

/* --- Fotos: prueba las extensiones hasta encontrar la que existe --- */
const rutaCache = {};
function foto(base, alt, clases){
  const id = "f" + Math.random().toString(36).slice(2,9);
  setTimeout(()=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(rutaCache[base]){ el.src = rutaCache[base]; return; }
    (function probar(k){
      if(k >= EXT.length) return;
      const test = new Image();
      test.onload  = ()=>{ rutaCache[base] = CARPETA+base+EXT[k]; const e=document.getElementById(id); if(e) e.src = rutaCache[base]; };
      test.onerror = ()=>probar(k+1);
      test.src = CARPETA + base + EXT[k];
    })(0);
  },0);
  return '<div class="cuadro '+(clases||"")+'"><img class="foto" id="'+id+'" alt="'+(alt||"")+'"></div>';
}
function precargar(){
  const vistos = new Set();
  DIAPOS.forEach(d=>{
    const bases = d.items ? d.items.map(i=>i.foto) : [d.foto];
    bases.forEach(b=>{
      if(!b || vistos.has(b)) return; vistos.add(b);
      (function probar(k){
        if(k >= EXT.length) return;
        const im = new Image();
        im.onload  = ()=>{ rutaCache[b] = CARPETA+b+EXT[k]; };
        im.onerror = ()=>probar(k+1);
        im.src = CARPETA + b + EXT[k];
      })(0);
    });
  });
}

/* --- Escalado del lienzo, como una diapositiva real --- */
function ajustar(){
  const c = $("escenario"), l = $("lienzo");
  const s = Math.min((c.clientWidth-16)/1600, (c.clientHeight-16)/900);
  l.style.transform = "scale(" + Math.max(s, .05) + ")";
}
window.addEventListener("resize", ajustar);
window.addEventListener("orientationchange", ()=>setTimeout(ajustar,250));

function hablar(txt){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang="es-CL"; u.rate=.9; u.pitch=1.05;
    const v = speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* --- Construcción de cada diapositiva --- */
function armar(d, n){
  let h = "";
  if(d.tipo==="portada"){
    h = '<div class="d-portada">'+
          '<div class="portada-txt">'+
            '<p class="eyebrow">1° Básico · Historia</p>'+
            '<h1>'+d.titulo+'</h1>'+
            '<p class="sub">'+d.sub+'</p>'+
            '<div class="autor"><small>Presentado por</small><b>Renata Leiva</b></div>'+
          '</div>'+
          '<div class="portada-foto">'+
            '<img class="foto" alt="Veterinaria" data-base="'+d.foto+'">'+
          '</div>'+
        '</div>';
  }
  if(d.tipo==="duo"){
    h = '<div class="d-duo"><h2>'+d.titulo+'</h2>'+
          '<div class="duo-cuerpo">'+ foto(d.foto, d.titulo) +
            '<div class="bloque"><p class="frase">'+d.frase+'</p>'+
            (d.extra?'<p class="frase destacada chica">'+d.extra+'</p>':'')+
            '</div></div></div>';
  }
  if(d.tipo==="rejilla"){
    h = '<div class="d-rejilla"><h2>'+d.titulo+'</h2>'+
          '<div class="rejilla n'+d.items.length+'">'+
          d.items.map(it=>'<div class="tarjeta">'+foto(it.foto,it.rotulo)+'<span class="rotulo">'+it.rotulo+'</span></div>').join("")+
          '</div></div>';
  }
  if(d.tipo==="numero"){
    h = '<div class="d-numero"><h2>'+d.titulo+'</h2>'+
          '<div class="numero-cuerpo">'+ foto(d.foto,"Llamar al 133") +
            '<div class="bloque"><p class="numerote">'+d.numero+'</p>'+
            '<p class="frase">'+d.frase+'</p></div></div></div>';
  }
  if(d.tipo==="cierre"){
    h = '<div class="d-cierre">'+
          '<img class="foto" alt="Una niña con su mascota" data-base="'+d.foto+'">'+
          '<div class="velo"></div>'+
          '<div class="cierre-txt"><h2>'+d.titulo+'</h2>'+
            '<p class="frase">'+d.frase+'</p>'+
            '<p class="gracias">'+d.gracias+'</p></div>'+
        '</div>';
  }
  h += '<div class="marca">Los Veterinarios</div>'+
       '<div class="pagina">'+(n+1)+'</div>';
  return h;
}

function construir(){
  const l = $("lienzo");
  l.innerHTML = DIAPOS.map((d,i)=>'<section class="diapo tipo-'+d.tipo+'" id="diapo'+i+'">'+armar(d,i)+'</section>').join("")
              + '<div class="progreso" id="progreso"></div>';
  /* fotos a sangre (portada y cierre) */
  l.querySelectorAll("img[data-base]").forEach(im=>{
    const b = im.dataset.base;
    (function probar(k){
      if(k >= EXT.length) return;
      const t = new Image();
      t.onload  = ()=>{ im.src = CARPETA+b+EXT[k]; rutaCache[b]=im.src; };
      t.onerror = ()=>probar(k+1);
      t.src = CARPETA + b + EXT[k];
    })(0);
  });
}

function mostrar(dir){
  DIAPOS.forEach((_,i)=>{
    const el = $("diapo"+i);
    el.classList.remove("activa","entra-der","entra-izq");
    if(i===actual){
      el.classList.add(dir==="atras" ? "entra-izq" : "entra-der");
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        el.classList.remove("entra-der","entra-izq");
        el.classList.add("activa");
      }));
    }
  });
  const d = DIAPOS[actual];
  $("contador").textContent = (actual+1)+" / "+DIAPOS.length;
  $("guion").innerHTML = '<b>Digo:</b> '+d.guion;
  $("progreso").style.width = ((actual+1)/DIAPOS.length*100)+"%";
  $("btnAtras").disabled = actual===0;
  $("btnSig").disabled   = actual===DIAPOS.length-1;
  const p = $("puntos"); p.innerHTML="";
  DIAPOS.forEach((_,k)=>{ const i=document.createElement("i"); if(k===actual) i.className="ahora"; p.appendChild(i); });
  document.querySelectorAll(".mini-diapo").forEach((b,k)=>b.classList.toggle("ahora",k===actual));
  if(vozOn) hablar(d.voz);
}

function ir(n, dir){
  const nuevo = Math.min(DIAPOS.length-1, Math.max(0, n));
  if(nuevo===actual) return;
  const d = dir || (nuevo>actual ? "adelante" : "atras");
  actual = nuevo;
  mostrar(d);
}

/* --- Vista general --- */
function armarGeneral(){
  const g = $("miniGrid");
  g.innerHTML = DIAPOS.map((d,i)=>
    '<button class="mini-diapo" data-i="'+i+'">'+foto(d.miniatura,"")+
    '<span><b>'+(i+1)+'</b>'+d.titulo+'</span></button>').join("");
  g.querySelectorAll(".mini-diapo").forEach(b=>{
    b.onclick = ()=>{ ir(parseInt(b.dataset.i,10)); $("general").classList.remove("abierta"); };
  });
}

/* --- Botones --- */
$("btnSig").onclick   = ()=>ir(actual+1,"adelante");
$("btnAtras").onclick = ()=>ir(actual-1,"atras");
$("zonaDer").onclick  = ()=>ir(actual+1,"adelante");
$("zonaIzq").onclick  = ()=>ir(actual-1,"atras");
$("btnGeneral").onclick = ()=>$("general").classList.add("abierta");
$("btnCerrarGeneral").onclick = ()=>$("general").classList.remove("abierta");
$("general").onclick = e=>{ if(e.target===$("general")) $("general").classList.remove("abierta"); };
$("btnVoz").onclick = function(){
  vozOn = !vozOn;
  this.setAttribute("aria-pressed", vozOn);
  this.innerHTML = (vozOn ? "🔊" : "🔇") + '<span class="solo-ancho"> Leer</span>';
  if(vozOn) hablar(DIAPOS[actual].voz);
  else if(window.speechSynthesis) speechSynthesis.cancel();
};
$("btnGuion").onclick = function(){
  guionOn = !guionOn;
  this.setAttribute("aria-pressed", guionOn);
  $("guion").classList.toggle("visible", guionOn);
  setTimeout(ajustar, 40);
};
$("btnPantalla").onclick = function(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else{
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }
  }catch(e){}
  setTimeout(ajustar, 300);
};
if(!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen){
  $("btnPantalla").style.display="none";
}
document.addEventListener("fullscreenchange", ()=>setTimeout(ajustar,120));

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ $("general").classList.toggle("abierta"); e.preventDefault(); return; }
  if($("general").classList.contains("abierta")) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); ir(actual+1,"adelante"); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); ir(actual-1,"atras"); }
  if(e.key==="Home") ir(0,"atras");
  if(e.key==="End") ir(DIAPOS.length-1,"adelante");
});

if(window.speechSynthesis) speechSynthesis.getVoices();
construir();
armarGeneral();
ajustar();
precargar();
mostrar("adelante");
</script>

<script id="selva-js">
/* ==========================================================================
   SELVA v2 · comportamiento común
   1. Guarda el progreso (veces jugada y mejor puntaje) para que la portada
      muestre las estrellas ganadas. Solo en este dispositivo, sin internet.
   2. Si ya hay estrellas en la ronda, "Inicio" pregunta antes de salir.
   3. Hace saltar el contador cuando se gana una estrella.
   4. Etiqueta los botones que solo tienen un ícono.
   ========================================================================== */
(function(){
  var CLAVE = "aprendo:progreso";
  var ruta = decodeURIComponent(location.pathname).replace(/^.*?(\d+-basico\/)/, "$1");
  var $ = function(s){ return document.querySelector(s); };

  function estrellas(){
    var el = $("#puntaje, #cuenta");
    var m = el && el.textContent.match(/\d+/);
    return m ? +m[0] : 0;
  }
  function registrar(){
    var d = {};
    try{ d = JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){}
    var r = d[ruta] || { veces:0, mejor:0 };
    r.veces++;
    r.mejor = Math.max(r.mejor || 0, estrellas());
    r.ultima = new Date().toISOString().slice(0, 10);
    d[ruta] = r;
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
  }

  /* 1. fin de la actividad: pantalla #final (juegos) o #pFinal (misiones) */
  var fin = $("#final, #pFinal");
  if(fin){
    var visto = false;
    new MutationObserver(function(){
      var ve = fin.classList.contains("activa") || (fin.id === "pFinal" && !fin.hidden);
      if(ve && !visto){ visto = true; setTimeout(registrar, 400); }
      if(!ve) visto = false;
    }).observe(fin, { attributes:true, attributeFilter:["class", "hidden"] });
  }
  /* presentaciones: cuenta como vista al llegar a la última diapositiva */
  var cont = $("#contador");
  if(cont && !fin){
    var vista = false;
    new MutationObserver(function(){
      var p = cont.textContent.match(/(\d+)\s*\/\s*(\d+)/);
      if(p && p[1] === p[2] && !vista){ vista = true; registrar(); }
    }).observe(cont, { childList:true, characterData:true, subtree:true });
  }

  /* 2. confirmar antes de salir a mitad de una ronda */
  function enRonda(){
    return !!$("#juego.activa, #ensayo.activa, #pJuego:not([hidden])") && estrellas() > 0;
  }
  var dlg = null;
  function preguntarSalida(destino){
    if(!window.HTMLDialogElement){ location.href = destino; return; }
    if(!dlg){
      dlg = document.createElement("dialog");
      dlg.className = "selva-dialogo";
      dlg.innerHTML =
        '<div class="selva-dialogo-emo" aria-hidden="true">🏠</div>' +
        '<h2>¿Quieres salir?</h2>' +
        '<p>Si sales ahora, se pierden las estrellas de esta ronda.</p>' +
        '<button class="selva-seguir" value="seguir">▶️ Seguir jugando</button>' +
        '<button class="selva-salir" value="salir">Salir</button>';
      dlg.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        dlg.close();
        if(b.value === "salir") location.href = dlg.dataset.destino;
      });
      document.body.appendChild(dlg);
    }
    dlg.dataset.destino = destino;
    dlg.showModal();
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance("¿Quieres salir? Si sales ahora, se pierden las estrellas de esta ronda.");
        u.lang = "es-ES"; speechSynthesis.speak(u);
      }
    }catch(e){}
    dlg.querySelector(".selva-seguir").focus();
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href$="index.html"]');
    if(!a || !enRonda()) return;
    e.preventDefault();
    preguntarSalida(a.href);
  }, true);

  /* 3. el contador salta al ganar una estrella */
  var pts = $("#puntaje");
  if(pts){
    var antes = estrellas();
    new MutationObserver(function(){
      var ahora = estrellas();
      if(ahora > antes){
        pts.classList.remove("salta"); void pts.offsetWidth; pts.classList.add("salta");
      }
      antes = ahora;
    }).observe(pts, { childList:true, characterData:true, subtree:true });
  }

  /* 4. etiquetas para lectores de pantalla */
  var nombres = { btnGeneral:"Ver todas las diapositivas", btnPantalla:"Pantalla completa", btnVoz:"Voz", sonido:"Voz y sonidos" };
  Object.keys(nombres).forEach(function(id){
    var b = document.getElementById(id);
    if(b && !b.getAttribute("aria-label") && !/[a-záéíóú]{3}/i.test(b.textContent)) b.setAttribute("aria-label", nombres[id]);
  });
  /* el iPhone no permite pantalla completa en páginas web: se oculta el botón */
  var d = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) d.classList.add("selva-sin-pantalla-completa");
})();
</script>
