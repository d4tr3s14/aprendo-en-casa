:root{
  --selva:#0E3B2E; --selva-claro:#17513E; --crema:#FFF6E5;
  --sol:#FFC93C; --coral:#FF6B5A; --agua:#3FC1E0; --hoja:#7ED957;
  --sombra:0 10px 0 rgba(0,0,0,.2);
  --W:1600; --H:900;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  margin:0;color:var(--crema);display:flex;flex-direction:column;
  font-family:'Nunito','Baloo 2',system-ui,-apple-system,sans-serif;
  background:#08251C;
}
h1,h2,h3,.chip,.frase,.rotulo,.contador,.numerote,.marca,.nav{font-family:'Baloo 2',system-ui,sans-serif}

/* ============ barra superior ============ */
.barra{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;flex:0 0 auto;z-index:20;background:#08251C;
}
.grupo{display:flex;gap:6px;align-items:center}
.mini{
  background:rgba(255,246,229,.08);border:2.5px solid rgba(255,246,229,.28);color:var(--crema);
  border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:.95rem;
  font-family:'Nunito',system-ui,sans-serif;text-decoration:none;display:inline-block;line-height:1;
}
.mini[aria-pressed="true"]{background:var(--sol);color:var(--selva);border-color:var(--sol)}
.mini:focus-visible,.nav:focus-visible,.zona:focus-visible,.mini-diapo:focus-visible{outline:4px solid var(--agua);outline-offset:3px}
.contador{color:var(--sol);font-size:1.15rem;letter-spacing:2px;white-space:nowrap}

/* ============ escenario y lienzo ============ */
.escenario{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.zona{position:absolute;top:0;bottom:0;width:24%;border:none;background:transparent;cursor:pointer;z-index:15}
.zona.izq{left:0}
.zona.der{right:0}
.lienzo{
  width:1600px;height:900px;flex:0 0 auto;position:relative;overflow:hidden;
  transform-origin:center center;background:var(--selva);
  border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55);
}

/* ============ diapositivas ============ */
.diapo{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .42s ease, transform .42s ease;
  background:
    radial-gradient(circle at 10% 8%, rgba(126,217,87,.16), transparent 46%),
    radial-gradient(circle at 92% 88%, rgba(63,193,224,.16), transparent 46%),
    var(--selva);
}
.diapo.activa{opacity:1;pointer-events:auto;transform:none;z-index:2}
.d-portada,.d-duo,.d-rejilla,.d-numero,.d-cierre{height:100%}
.diapo.entra-der{transform:translateX(70px) scale(.985)}
.diapo.entra-izq{transform:translateX(-70px) scale(.985)}

.marca{
  position:absolute;left:52px;bottom:26px;font-size:20px;color:rgba(255,246,229,.42);
  letter-spacing:2px;z-index:6;
}
.pagina{
  position:absolute;right:52px;bottom:24px;font-size:26px;color:var(--sol);
  font-family:'Baloo 2',sans-serif;z-index:6;
}
.progreso{position:absolute;left:0;bottom:0;height:9px;background:var(--sol);z-index:8;transition:width .42s ease;border-radius:0 6px 0 0}

/* --- fotos --- */
.foto{display:block;width:100%;height:100%;object-fit:cover;background:#1E5C46}
.cuadro{border-radius:26px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.4);background:#1E5C46;position:relative}

/* --- portada --- */
.d-portada{display:grid;grid-template-columns:1fr 700px}
.portada-txt{display:flex;flex-direction:column;justify-content:center;padding:0 70px 0 90px;position:relative;z-index:3}
.eyebrow{font-size:26px;letter-spacing:5px;color:var(--hoja);text-transform:uppercase;margin:0 0 18px;font-weight:800}
.d-portada h1{font-size:92px;line-height:1;color:var(--sol);margin:0 0 20px;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.d-portada .sub{font-size:38px;line-height:1.2;margin:0 0 44px;color:var(--crema);max-width:16ch}
.autor{display:inline-flex;align-items:center;gap:16px;background:var(--crema);color:var(--selva);
  border-radius:999px;padding:14px 30px;box-shadow:var(--sombra);width:fit-content}
.autor small{font-size:20px;font-weight:800;opacity:.65;letter-spacing:1px}
.autor b{font-family:'Baloo 2',sans-serif;font-size:34px;line-height:1}
.portada-foto{position:relative;overflow:hidden}
.portada-foto .foto{object-position:center 18%}
.portada-foto::after{content:"";position:absolute;inset:0;width:180px;
  background:linear-gradient(to right, var(--selva), transparent)}

/* --- duo: foto + texto --- */
.d-duo{display:grid;grid-template-rows:auto 1fr;padding:52px 70px 74px}
.d-duo h2,.d-rejilla h2,.d-numero h2{
  font-size:66px;line-height:1.04;color:var(--sol);margin:0 0 34px;text-align:center;
}
.duo-cuerpo{display:grid;grid-template-columns:560px 1fr;gap:56px;align-items:center;min-height:0}
.duo-cuerpo .cuadro{height:100%;max-height:520px}
.bloque{display:flex;flex-direction:column;gap:22px}
.frase{
  background:var(--crema);color:var(--selva);border-radius:26px;padding:30px 34px;
  font-size:48px;line-height:1.2;box-shadow:var(--sombra);margin:0;
}
.frase.destacada{background:var(--sol);color:#1B2E1C}
.frase.chica{font-size:38px}

/* --- rejilla de tarjetas --- */
.d-rejilla{display:grid;grid-template-rows:auto 1fr;padding:52px 64px 74px}
.rejilla{display:grid;gap:32px;align-items:stretch;min-height:0}
.rejilla.n2{grid-template-columns:repeat(2,1fr);max-width:1120px;margin:0 auto;width:100%}
.rejilla.n3{grid-template-columns:repeat(3,1fr)}
.rejilla.n4{grid-template-columns:repeat(4,1fr)}
.tarjeta{
  background:var(--crema);border-radius:28px;overflow:hidden;box-shadow:var(--sombra);
  display:grid;grid-template-rows:auto 108px;min-height:0;align-self:center;
}
.tarjeta .cuadro{border-radius:0;box-shadow:none;min-height:0;aspect-ratio:1/1}
.rotulo{
  color:var(--selva);font-size:30px;line-height:1.15;font-weight:800;
  padding:10px 16px;text-align:center;display:flex;align-items:center;justify-content:center;
}
.rejilla.n2 .tarjeta{grid-template-rows:1fr 120px;align-self:stretch}
.rejilla.n2 .tarjeta .cuadro{aspect-ratio:auto}
.rejilla.n2 .rotulo{font-size:38px}
.tipo-portada .marca,.tipo-portada .pagina{display:none}
.tipo-cierre .marca,.tipo-cierre .pagina{color:rgba(255,246,229,.75);text-shadow:0 2px 6px rgba(0,0,0,.6)}

/* --- número grande (133) --- */
.d-numero{display:grid;grid-template-rows:auto 1fr;padding:52px 70px 74px}
.numero-cuerpo{display:grid;grid-template-columns:520px 1fr;gap:56px;align-items:center;min-height:0}
.numero-cuerpo .cuadro{height:100%;max-height:520px}
.numerote{font-size:230px;line-height:.85;color:var(--coral);margin:0 0 8px;text-shadow:0 8px 0 rgba(0,0,0,.2)}

/* --- cierre a sangre --- */
.d-cierre{position:relative}
.d-cierre .foto{position:absolute;inset:0;object-position:center 60%}
.velo{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(14,59,46,.62), rgba(14,59,46,.9))}
.cierre-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 90px;text-align:center}
.d-cierre h2{font-size:76px;line-height:1.05;color:var(--sol);margin:0;text-shadow:0 6px 14px rgba(0,0,0,.5)}
.d-cierre .frase{font-size:46px;max-width:22ch}
.gracias{font-family:'Baloo 2',sans-serif;font-size:80px;color:var(--crema);margin:8px 0 0;text-shadow:0 6px 14px rgba(0,0,0,.5)}

/* ============ vista general ============ */
.general{
  position:fixed;inset:0;background:#08251C;z-index:60;
  display:none;flex-direction:column;padding:20px 24px;
}
.general.abierta{display:flex}
.general-tope{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.general h3{font-size:1.4rem;color:var(--sol);margin:0;text-align:center;flex:1}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;overflow:auto;flex:1;align-content:start}
.mini-diapo{
  background:var(--selva-claro);border:4px solid transparent;border-radius:18px;overflow:hidden;
  cursor:pointer;padding:0;display:flex;flex-direction:column;text-align:left;color:var(--crema);
}
.mini-diapo.ahora{border-color:var(--sol)}
.mini-diapo .cuadro{border-radius:0;box-shadow:none;aspect-ratio:16/10}
.mini-diapo span{padding:8px 10px;font-size:.9rem;font-weight:800;line-height:1.15;font-family:'Nunito',sans-serif}
.mini-diapo b{color:var(--sol);margin-right:6px}

/* ============ guion y pie ============ */
.guion{
  flex:0 0 auto;background:rgba(0,0,0,.34);border-top:3px solid rgba(255,201,60,.35);
  padding:10px 18px;font-size:1.05rem;line-height:1.35;display:none;z-index:20;
}
.guion.visible{display:block}
.guion b{color:var(--sol)}
.pie{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 12px 14px;flex:0 0 auto;z-index:20;background:#08251C}
.nav{
  background:var(--coral);color:#fff;border:none;border-radius:999px;
  width:78px;height:60px;font-size:2.2rem;font-weight:800;cursor:pointer;box-shadow:var(--sombra);
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.nav.sol{background:var(--sol);color:var(--selva)}
.nav:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.nav[disabled]{opacity:.3;box-shadow:none}
.puntos{display:flex;gap:7px;align-items:center}
.puntos i{width:12px;height:12px;border-radius:99px;background:rgba(255,246,229,.28);display:block;transition:transform .2s}
.puntos i.ahora{background:var(--sol);transform:scale(1.4)}

.gira{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:18;
  background:var(--sol);color:var(--selva);font-weight:800;border-radius:999px;padding:8px 18px;font-size:.92rem}
@media (orientation:portrait) and (max-width:820px){ .gira{display:block} }
@media (max-width:700px){
  .mini{padding:8px 11px;font-size:.88rem}
  .contador{font-size:1rem;letter-spacing:1px}
  .solo-ancho{display:none}
  .nav{width:66px;height:54px;font-size:1.9rem}
  .mini-grid{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ============ impresión / PDF ============ */
@media print{
  @page{size:landscape;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  .barra,.pie,.guion,.zona,.general,.gira{display:none !important}
  .escenario{display:block;overflow:visible}
  .lienzo{transform:none !important;border-radius:0;box-shadow:none;
    width:1600px;height:auto;overflow:visible;display:block}
  .diapo{position:relative;inset:auto;opacity:1 !important;transform:none !important;
    display:block;width:1600px;height:900px;overflow:hidden;
    page-break-after:always;break-after:page}
  .diapo:last-of-type{page-break-after:auto;break-after:auto}
  .progreso{display:none}
}
</style>
</head>
<body>

<header class="barra">
  <div class="grupo">
    <a class="mini" href="../../../index.html">🏠<span class="solo-ancho"> Inicio</span></a>
    <a class="mini" href="carabineros-practica.html">🎯<span class="solo-ancho"> Practicar</span></a>
  </div>
  <div class="contador" id="contador">1 / 8</div>
  <div class="grupo">
    <button class="mini" id="btnGeneral">▦</button>
    <button class="mini" id="btnGuion" aria-pressed="false">📝<span class="solo-ancho"> Guion</span></button>
    <button class="mini" id="btnVoz" aria-pressed="false">🔊<span class="solo-ancho"> Leer</span></button>
    <button class="mini" id="btnPantalla">⛶</button>
  </div>
</header>

<main class="escenario" id="escenario">
  <div class="gira">↻ Gira el teléfono para verla más grande</div>
  <button class="zona izq" id="zonaIzq" aria-label="Diapositiva anterior"></button>
  <button class="zona der" id="zonaDer" aria-label="Diapositiva siguiente"></button>
  <div class="lienzo" id="lienzo" aria-live="polite"></div>
</main>

<div class="guion" id="guion"></div>

<footer class="pie">
  <button class="nav" id="btnAtras" aria-label="Anterior">‹</button>
  <div class="puntos" id="puntos"></div>
  <button class="nav sol" id="btnSig" aria-label="Siguiente">›</button>
</footer>

<div class="general" id="general">
  <div class="general-tope">
    <h3>Todas las diapositivas · toca una para ir</h3>
    <button class="mini" id="btnCerrarGeneral">✕ Cerrar</button>
  </div>
  <div class="mini-grid" id="miniGrid"></div>
</div>

<script>
/* ============================================================
   FOTOS · carpeta img/ junto a este archivo
   ============================================================ */
const CARPETA = "img/";
const EXT = [".jpg",".jpeg",".png",".webp"];

/* ============================================================
   LAS 8 DIAPOSITIVAS
   texto = lo proyectado · guion = lo que ella dice · voz = lo que se lee
   ============================================================ */
const DIAPOS = [
  {
    tipo:"portada", miniatura:"carabinera",
    titulo:"Los Carabineros de Chile",
    sub:"Un oficio que cuida a las personas",
    foto:"carabinera",
    voz:"Los Carabineros de Chile. Un oficio que cuida a las personas. Presentado por Renata Leiva.",
    guion:"Buenos días. Hoy les voy a hablar de <b>los Carabineros de Chile</b>."
  },
  {
    tipo:"duo", miniatura:"placa",
    titulo:"¡Hola! Soy carabinera",
    foto:"placa",
    frase:"Los carabineros cuidamos a las personas en las calles.",
    voz:"Hola. Soy carabinera de Chile. Los carabineros cuidamos a las personas en las calles.",
    guion:"<b>Soy carabinera de Chile.</b> Los carabineros somos los que cuidamos a las personas en las calles. <i>(Muestra tu gorro o tu placa.)</i>"
  },
  {
    tipo:"rejilla", miniatura:"patrulla",
    titulo:"¿Qué hago en mi trabajo?",
    items:[
      {foto:"patrulla", rotulo:"Cuido las calles en mi patrulla"},
      {foto:"cruzar",   rotulo:"Ayudo a cruzar la calle"},
      {foto:"radio",    rotulo:"Voy rápido si alguien necesita ayuda"}
    ],
    voz:"¿Qué hago en mi trabajo? Cuido las calles en mi patrulla. Ayudo a las personas a cruzar la calle. Y voy rápido si alguien necesita ayuda.",
    guion:"En mi trabajo <b>cuido las calles</b> en mi patrulla, <b>ayudo a los niños a cruzar</b> y voy rápido cuando alguien necesita ayuda."
  },
  {
    tipo:"rejilla", miniatura:"quepis",
    titulo:"¿Qué uso para trabajar?",
    items:[
      {foto:"quepis",  rotulo:"Quepis: mi gorro"},
      {foto:"silbato", rotulo:"Silbato: detiene los autos"},
      {foto:"radio",   rotulo:"Radio: pido ayuda"},
      {foto:"chaleco", rotulo:"Chaleco: para que me vean"}
    ],
    voz:"¿Qué uso para trabajar? Mi quepis, que es mi gorro. El silbato, que sirve para detener los autos. La radio, para pedir ayuda. Y el chaleco, para que todos me vean.",
    guion:"Uso mi <b>quepis</b>, mi <b>silbato</b> y mi <b>radio</b>. El silbato <b>sirve para detener los autos</b> y con la radio pido ayuda."
  },
  {
    tipo:"rejilla", miniatura:"perro",
    titulo:"Mis ayudantes",
    items:[
      {foto:"perro",   rotulo:"El perro busca personas perdidas"},
      {foto:"caballo", rotulo:"El caballo cuida plazas y parques"}
    ],
    voz:"Estos son mis ayudantes. El perro busca personas perdidas porque huele muy bien. Y el caballo cuida las plazas y los parques.",
    guion:"Los carabineros también trabajamos con <b>perros</b> y con <b>caballos</b>. El perro busca personas perdidas porque huele muy bien."
  },
  {
    tipo:"numero", miniatura:"telefono",
    titulo:"¿Cómo ayudo a mi comunidad?",
    foto:"telefono",
    numero:"133",
    frase:"Si alguien necesita ayuda, llama al 133 y llegamos rápido.",
    voz:"¿Cómo ayudo a mi comunidad? Si alguien necesita ayuda, llama al ciento treinta y tres, y los carabineros llegamos rápido.",
    guion:"Los carabineros ayudamos a la comunidad: si alguien necesita ayuda <b>llama al 133</b> y llegamos rápido a cuidarlo."
  },
  {
    tipo:"duo", miniatura:"bandera",
    titulo:"¿Sabías que...?",
    foto:"bandera",
    frase:"Los Carabineros de Chile nacieron en el año 1927.",
    extra:"Su lema es: “Orden y Patria”.",
    voz:"¿Sabías que los Carabineros de Chile nacieron en el año mil novecientos veintisiete? Su lema es: Orden y Patria.",
    guion:"¿Sabían que los Carabineros de Chile <b>nacieron en el año 1927</b>? Su lema es <b>Orden y Patria</b>."
  },
  {
    tipo:"cierre", miniatura:"comunidad",
    titulo:"Su trabajo es muy importante",
    foto:"comunidad",
    frase:"Porque nos cuida a todos.",
    gracias:"¡Muchas gracias!",
    voz:"El trabajo de los carabineros es muy importante porque nos cuida a todos. ¡Muchas gracias!",
    guion:"El trabajo de los carabineros es <b>muy importante porque nos cuida a todos</b>. Por eso hay que respetarlos y darles las gracias. <b>¡Muchas gracias!</b>"
  }
];

/* ============================================================
   Motor
   ============================================================ */
const $ = id => document.getElementById(id);
let actual = 0, vozOn = false, guionOn = false;

/* --- Fotos: prueba las extensiones hasta encontrar la que existe --- */
const rutaCache = {};
function foto(base, alt, clases){
  const id = "f" + Math.random().toString(36).slice(2,9);
  setTimeout(()=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(rutaCache[base]){ el.src = rutaCache[base]; return; }
    (function probar(k){
      if(k >= EXT.length) return;
      const test = new Image();
      test.onload  = ()=>{ rutaCache[base] = CARPETA+base+EXT[k]; const e=document.getElementById(id); if(e) e.src = rutaCache[base]; };
      test.onerror = ()=>probar(k+1);
      test.src = CARPETA + base + EXT[k];
    })(0);
  },0);
  return '<div class="cuadro '+(clases||"")+'"><img class="foto" id="'+id+'" alt="'+(alt||"")+'"></div>';
}
function precargar(){
  const vistos = new Set();
  DIAPOS.forEach(d=>{
    const bases = d.items ? d.items.map(i=>i.foto) : [d.foto];
    bases.forEach(b=>{
      if(!b || vistos.has(b)) return; vistos.add(b);
      (function probar(k){
        if(k >= EXT.length) return;
        const im = new Image();
        im.onload  = ()=>{ rutaCache[b] = CARPETA+b+EXT[k]; };
        im.onerror = ()=>probar(k+1);
        im.src = CARPETA + b + EXT[k];
      })(0);
    });
  });
}

/* --- Escalado del lienzo, como una diapositiva real --- */
function ajustar(){
  const c = $("escenario"), l = $("lienzo");
  const s = Math.min((c.clientWidth-16)/1600, (c.clientHeight-16)/900);
  l.style.transform = "scale(" + Math.max(s, .05) + ")";
}
window.addEventListener("resize", ajustar);
window.addEventListener("orientationchange", ()=>setTimeout(ajustar,250));

function hablar(txt){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang="es-CL"; u.rate=.9; u.pitch=1.05;
    const v = speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* --- Construcción de cada diapositiva --- */
function armar(d, n){
  let h = "";
  if(d.tipo==="portada"){
    h = '<div class="d-portada">'+
          '<div class="portada-txt">'+
            '<p class="eyebrow">1° Básico · Historia</p>'+
            '<h1>'+d.titulo+'</h1>'+
            '<p class="sub">'+d.sub+'</p>'+
            '<div class="autor"><small>PRESENTADO POR</small><b>Renata Leiva</b></div>'+
          '</div>'+
          '<div class="portada-foto">'+
            '<img class="foto" alt="Carabinera de Chile" data-base="'+d.foto+'">'+
          '</div>'+
        '</div>';
  }
  if(d.tipo==="duo"){
    h = '<div class="d-duo"><h2>'+d.titulo+'</h2>'+
          '<div class="duo-cuerpo">'+ foto(d.foto, d.titulo) +
            '<div class="bloque"><p class="frase">'+d.frase+'</p>'+
            (d.extra?'<p class="frase destacada chica">'+d.extra+'</p>':'')+
            '</div></div></div>';
  }
  if(d.tipo==="rejilla"){
    h = '<div class="d-rejilla"><h2>'+d.titulo+'</h2>'+
          '<div class="rejilla n'+d.items.length+'">'+
          d.items.map(it=>'<div class="tarjeta">'+foto(it.foto,it.rotulo)+'<span class="rotulo">'+it.rotulo+'</span></div>').join("")+
          '</div></div>';
  }
  if(d.tipo==="numero"){
    h = '<div class="d-numero"><h2>'+d.titulo+'</h2>'+
          '<div class="numero-cuerpo">'+ foto(d.foto,"Llamar al 133") +
            '<div class="bloque"><p class="numerote">'+d.numero+'</p>'+
            '<p class="frase">'+d.frase+'</p></div></div></div>';
  }
  if(d.tipo==="cierre"){
    h = '<div class="d-cierre">'+
          '<img class="foto" alt="La comunidad" data-base="'+d.foto+'">'+
          '<div class="velo"></div>'+
          '<div class="cierre-txt"><h2>'+d.titulo+'</h2>'+
            '<p class="frase">'+d.frase+'</p>'+
            '<p class="gracias">'+d.gracias+'</p></div>'+
        '</div>';
  }
  h += '<div class="marca">Carabineros de Chile</div>'+
       '<div class="pagina">'+(n+1)+'</div>';
  return h;
}

function construir(){
  const l = $("lienzo");
  l.innerHTML = DIAPOS.map((d,i)=>'<section class="diapo tipo-'+d.tipo+'" id="diapo'+i+'">'+armar(d,i)+'</section>').join("")
              + '<div class="progreso" id="progreso"></div>';
  /* fotos a sangre (portada y cierre) */
  l.querySelectorAll("img[data-base]").forEach(im=>{
    const b = im.dataset.base;
    (function probar(k){
      if(k >= EXT.length) return;
      const t = new Image();
      t.onload  = ()=>{ im.src = CARPETA+b+EXT[k]; rutaCache[b]=im.src; };
      t.onerror = ()=>probar(k+1);
      t.src = CARPETA + b + EXT[k];
    })(0);
  });
}

function mostrar(dir){
  DIAPOS.forEach((_,i)=>{
    const el = $("diapo"+i);
    el.classList.remove("activa","entra-der","entra-izq");
    if(i===actual){
      el.classList.add(dir==="atras" ? "entra-izq" : "entra-der");
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        el.classList.remove("entra-der","entra-izq");
        el.classList.add("activa");
      }));
    }
  });
  const d = DIAPOS[actual];
  $("contador").textContent = (actual+1)+" / "+DIAPOS.length;
  $("guion").innerHTML = '<b>Digo:</b> '+d.guion;
  $("progreso").style.width = ((actual+1)/DIAPOS.length*100)+"%";
  $("btnAtras").disabled = actual===0;
  $("btnSig").disabled   = actual===DIAPOS.length-1;
  const p = $("puntos"); p.innerHTML="";
  DIAPOS.forEach((_,k)=>{ const i=document.createElement("i"); if(k===actual) i.className="ahora"; p.appendChild(i); });
  document.querySelectorAll(".mini-diapo").forEach((b,k)=>b.classList.toggle("ahora",k===actual));
  if(vozOn) hablar(d.voz);
}

function ir(n, dir){
  const nuevo = Math.min(DIAPOS.length-1, Math.max(0, n));
  if(nuevo===actual) return;
  const d = dir || (nuevo>actual ? "adelante" : "atras");
  actual = nuevo;
  mostrar(d);
}

/* --- Vista general --- */
function armarGeneral(){
  const g = $("miniGrid");
  g.innerHTML = DIAPOS.map((d,i)=>
    '<button class="mini-diapo" data-i="'+i+'">'+foto(d.miniatura,"")+
    '<span><b>'+(i+1)+'</b>'+d.titulo+'</span></button>').join("");
  g.querySelectorAll(".mini-diapo").forEach(b=>{
    b.onclick = ()=>{ ir(parseInt(b.dataset.i,10)); $("general").classList.remove("abierta"); };
  });
}

/* --- Botones --- */
$("btnSig").onclick   = ()=>ir(actual+1,"adelante");
$("btnAtras").onclick = ()=>ir(actual-1,"atras");
$("zonaDer").onclick  = ()=>ir(actual+1,"adelante");
$("zonaIzq").onclick  = ()=>ir(actual-1,"atras");
$("btnGeneral").onclick = ()=>$("general").classList.add("abierta");
$("btnCerrarGeneral").onclick = ()=>$("general").classList.remove("abierta");
$("general").onclick = e=>{ if(e.target===$("general")) $("general").classList.remove("abierta"); };
$("btnVoz").onclick = function(){
  vozOn = !vozOn;
  this.setAttribute("aria-pressed", vozOn);
  this.innerHTML = (vozOn ? "🔊" : "🔇") + '<span class="solo-ancho"> Leer</span>';
  if(vozOn) hablar(DIAPOS[actual].voz);
  else if(window.speechSynthesis) speechSynthesis.cancel();
};
$("btnGuion").onclick = function(){
  guionOn = !guionOn;
  this.setAttribute("aria-pressed", guionOn);
  $("guion").classList.toggle("visible", guionOn);
  setTimeout(ajustar, 40);
};
$("btnPantalla").onclick = function(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else{
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }
  }catch(e){}
  setTimeout(ajustar, 300);
};
if(!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen){
  $("btnPantalla").style.display="none";
}
document.addEventListener("fullscreenchange", ()=>setTimeout(ajustar,120));

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ $("general").classList.toggle("abierta"); e.preventDefault(); return; }
  if($("general").classList.contains("abierta")) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); ir(actual+1,"adelante"); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); ir(actual-1,"atras"); }
  if(e.key==="Home") ir(0,"atras");
  if(e.key==="End") ir(DIAPOS.length-1,"adelante");
});

if(window.speechSynthesis) speechSynthesis.getVoices();
construir();
armarGeneral();
ajustar();
precargar();
mostrar("adelante");
</script>
</body>
</html>
