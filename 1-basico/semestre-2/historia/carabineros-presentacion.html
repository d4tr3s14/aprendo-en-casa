:root{
  --selva:#0E3B2E; --selva-claro:#17513E; --crema:#FFF6E5;
  --sol:#FFC93C; --coral:#FF6B5A; --agua:#3FC1E0; --hoja:#7ED957;
  --sombra:0 8px 0 rgba(0,0,0,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--crema);overflow:hidden;
  font-family:'Nunito','Baloo 2',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 12% 10%, rgba(126,217,87,.20), transparent 46%),
    radial-gradient(circle at 88% 82%, rgba(63,193,224,.20), transparent 46%),
    var(--selva);
  display:flex;flex-direction:column;
}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
h1,h2,h3,.btn,.chip,.frase,.rotulo,.contador{font-family:'Baloo 2',system-ui,sans-serif}

/* ---------- barra superior ---------- */
.barra{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;flex:0 0 auto;position:relative;z-index:5;
}
.grupo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mini{
  background:rgba(255,246,229,.08);border:2.5px solid rgba(255,246,229,.3);color:var(--crema);
  border-radius:999px;padding:7px 13px;font-weight:800;cursor:pointer;font-size:.95rem;
  font-family:'Nunito',system-ui,sans-serif;text-decoration:none;display:inline-block;line-height:1;
}
.mini[aria-pressed="true"]{background:var(--sol);color:var(--selva);border-color:var(--sol)}
.mini:focus-visible,.nav:focus-visible,.zona:focus-visible{outline:4px solid var(--agua);outline-offset:3px}
.contador{color:var(--sol);font-size:1.15rem;letter-spacing:2px;white-space:nowrap}
@media (max-width:640px){
  .barra{padding:6px 8px;gap:6px;flex-wrap:nowrap}
  .mini{padding:7px 10px;font-size:.9rem}
  .contador{font-size:1rem;letter-spacing:1px}
  .solo-ancho{display:none}
}

/* ---------- escenario ---------- */
.escena{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;padding:0 clamp(10px,3vw,34px);min-height:0}
.zona{position:absolute;top:0;bottom:0;width:26%;border:none;background:transparent;cursor:pointer;z-index:2}
.zona.izq{left:0}
.zona.der{right:0}
.diapo{
  width:min(1180px,100%);max-height:100%;overflow:auto;text-align:center;
  background:var(--selva-claro);border:5px solid var(--sol);border-radius:30px;
  padding:clamp(14px,2.6vh,28px) clamp(14px,3vw,32px);box-shadow:0 16px 40px rgba(0,0,0,.35);
  animation:entra .4s ease;position:relative;z-index:3;
}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.diapo h2{
  font-size:clamp(1.5rem,4.6vmin,3.1rem);color:var(--sol);margin:0 0 clamp(8px,1.6vh,18px);line-height:1.08;
}
.diapo h1{
  font-size:clamp(2rem,7vmin,4.6rem);color:var(--sol);margin:0 0 .1em;line-height:1;
}
.sub{font-size:clamp(1rem,2.9vmin,1.9rem);margin:0 0 clamp(8px,1.6vh,16px);line-height:1.25}
.credito{font-size:clamp(.85rem,2.1vmin,1.3rem);opacity:.9;margin:0;letter-spacing:.5px}
.credito .nombre{font-family:'Baloo 2',system-ui,sans-serif;color:var(--sol);font-size:1.25em}
.frase{
  background:var(--crema);color:var(--selva);border-radius:22px;
  padding:clamp(10px,1.8vh,18px) clamp(12px,2.4vw,22px);
  font-size:clamp(1.15rem,4.1vmin,2.7rem);line-height:1.22;box-shadow:var(--sombra);
  margin:clamp(8px,1.6vh,16px) auto 0;max-width:26ch;
}
.frase.destacada{background:var(--sol);color:#20301F}
.numerote{font-size:clamp(2.6rem,11vmin,7rem);color:var(--coral);line-height:1;margin:.1em 0}

/* ilustraciones */
.ilu{display:block;width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:#E4F0E2;box-shadow:var(--sombra)}
.ilu svg,.ilu img{display:block;width:100%;height:100%}
.ilu img{object-fit:cover}
.grande{max-width:min(34vh,300px);margin:0 auto}
.rejilla{display:grid;gap:clamp(8px,1.6vw,16px);justify-content:center}
.rejilla.n2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:760px;margin:0 auto}
.rejilla.n3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1000px;margin:0 auto}
.rejilla.n4{grid-template-columns:repeat(4,minmax(0,1fr));max-width:1060px;margin:0 auto}
.tarjeta{background:var(--crema);color:var(--selva);border-radius:22px;padding:clamp(7px,1.2vh,12px);box-shadow:var(--sombra);display:flex;flex-direction:column;gap:6px}
.tarjeta .ilu{box-shadow:none;border-radius:16px}
.rotulo{font-size:clamp(.85rem,2.4vmin,1.55rem);line-height:1.15;font-weight:800}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(10px,2.4vw,26px);align-items:center;text-align:left}
.duo .frase{margin:0;max-width:none;text-align:left}
@media (max-width:640px), (orientation:portrait){
  .duo{grid-template-columns:1fr;text-align:center}
  .duo .frase{text-align:center}
  .rejilla.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grande{max-width:min(28vh,220px)}
}

/* ---------- guion ---------- */
.guion{
  flex:0 0 auto;background:rgba(0,0,0,.28);border-top:3px solid rgba(255,201,60,.35);
  padding:10px 16px;font-size:clamp(.95rem,2.2vmin,1.35rem);line-height:1.35;display:none;
}
.guion.visible{display:block}
.guion b{color:var(--sol)}

/* ---------- barra inferior ---------- */
.pie{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px 14px;flex:0 0 auto;position:relative;z-index:5}
.nav{
  background:var(--coral);color:#fff;border:none;border-radius:999px;
  width:clamp(62px,9vmin,88px);height:clamp(52px,7.4vmin,72px);
  font-size:clamp(1.8rem,4.4vmin,2.6rem);font-weight:800;cursor:pointer;box-shadow:var(--sombra);
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.nav.sol{background:var(--sol);color:var(--selva)}
.nav:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.nav[disabled]{opacity:.35;box-shadow:none}
.puntos{display:flex;gap:6px;align-items:center}
.puntos i{width:11px;height:11px;border-radius:99px;background:rgba(255,246,229,.28);display:block}
.puntos i.ahora{background:var(--sol);transform:scale(1.35)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

<header class="barra">
  <div class="grupo">
    <a class="mini" href="../../../index.html">🏠<span class="solo-ancho"> Inicio</span></a>
    <a class="mini" href="carabineros-practica.html">🎯<span class="solo-ancho"> Practicar</span></a>
  </div>
  <div class="contador" id="contador">1 / 8</div>
  <div class="grupo">
    <button class="mini" id="btnGuion" aria-pressed="false">📝<span class="solo-ancho"> Guion</span></button>

<main class="escena">
  <button class="zona izq" id="zonaIzq" aria-label="Diapositiva anterior"></button>
  <button class="zona der" id="zonaDer" aria-label="Diapositiva siguiente"></button>

</main>

<div class="guion" id="guion"></div>

<footer class="pie">
  <button class="nav" id="btnAtras" aria-label="Anterior">‹</button>
  <div class="puntos" id="puntos"></div>
  <button class="nav sol" id="btnSig" aria-label="Siguiente">›</button>
</footer>

<script>
/* ============================================================
   FOTOS REALES OPCIONALES
   ============================================================ */
const CARPETA_FOTOS = "img/";
const FOTOS = {
  "i-carabinera":"carabinera","i-carabinero":"carabinero","i-patrulla":"patrulla",
  "i-quepis":"quepis","i-silbato":"silbato","i-radio":"radio","i-chaleco":"chaleco",
  "i-linterna":"linterna","i-perro":"perro","i-caballo":"caballo","i-cruzar":"cruzar",
  "i-telefono":"telefono","i-placa":"placa","i-bandera":"bandera","i-moto":"moto",
  "i-comunidad":"comunidad","i-cono":"cono","i-noche":"noche"
};

/* ============================================================
   LAS 8 DIAPOSITIVAS
   · "texto"  = lo que se ve proyectado (corto y grande)
   · "guion"  = lo que ella dice en voz alta
   · "voz"    = lo que se lee si toca 🔊
   ============================================================ */
const DIAPOS = [
  {
    tipo:"portada",
    titulo:"Los Carabineros de Chile",
    sub:"Un oficio que cuida a las personas",
    credito:"1° Básico · Historia",
    icono:"i-placa",
    voz:"Los Carabineros de Chile. Un oficio que cuida a las personas.",
    guion:"Buenos días. Hoy les voy a hablar de <b>los Carabineros de Chile</b>."
  },
  {
    tipo:"duo",
    titulo:"¡Hola! Soy carabinera",
    icono:"i-carabinera",
    frase:"Los carabineros cuidamos a las personas en las calles.",
    voz:"Hola. Soy carabinera de Chile. Los carabineros cuidamos a las personas en las calles.",
    guion:"<b>Soy carabinera de Chile.</b> Los carabineros somos los que cuidamos a las personas en las calles. <i>(Muestra tu gorro o tu placa.)</i>"
  },
  {
    tipo:"rejilla",
    titulo:"¿Qué hago en mi trabajo?",
    items:[
      {icono:"i-patrulla", rotulo:"Cuido las calles en mi patrulla"},
      {icono:"i-cruzar",   rotulo:"Ayudo a cruzar la calle"},
      {icono:"i-radio",    rotulo:"Voy rápido si alguien necesita ayuda"}
    ],
    voz:"¿Qué hago en mi trabajo? Cuido las calles en mi patrulla. Ayudo a las personas a cruzar la calle. Y voy rápido si alguien necesita ayuda.",
    guion:"En mi trabajo <b>cuido las calles</b> en mi patrulla, <b>ayudo a los niños a cruzar</b> y voy rápido cuando alguien necesita ayuda."
  },
  {
    tipo:"rejilla",
    titulo:"¿Qué uso para trabajar?",
    items:[
      {icono:"i-quepis",  rotulo:"Quepis: mi gorro"},
      {icono:"i-silbato", rotulo:"Silbato: detiene los autos"},
      {icono:"i-radio",   rotulo:"Radio: pido ayuda"},
      {icono:"i-chaleco", rotulo:"Chaleco: para que me vean"}
    ],
    voz:"¿Qué uso para trabajar? Mi quepis, que es mi gorro. El silbato, que sirve para detener los autos. La radio, para pedir ayuda. Y el chaleco, para que todos me vean.",
    guion:"Uso mi <b>quepis</b>, mi <b>silbato</b> y mi <b>radio</b>. El silbato <b>sirve para detener los autos</b> y con la radio pido ayuda."
  },
  {
    tipo:"rejilla",
    titulo:"Mis ayudantes",
    items:[
      {icono:"i-perro",   rotulo:"El perro busca personas perdidas"},
      {icono:"i-caballo", rotulo:"El caballo cuida plazas y parques"}
    ],
    voz:"Estos son mis ayudantes. El perro busca personas perdidas porque huele muy bien. Y el caballo cuida las plazas y los parques.",
    guion:"Los carabineros también trabajamos con <b>perros</b> y con <b>caballos</b>. El perro busca personas perdidas porque huele muy bien."
  },
  {
    tipo:"numero",
    titulo:"¿Cómo ayudo a mi comunidad?",
    icono:"i-telefono",
    numero:"133",
    frase:"Si alguien necesita ayuda, llama al 133 y llegamos rápido.",
    voz:"¿Cómo ayudo a mi comunidad? Si alguien necesita ayuda, llama al ciento treinta y tres, y los carabineros llegamos rápido.",
    guion:"Los carabineros ayudamos a la comunidad: si alguien necesita ayuda <b>llama al 133</b> y llegamos rápido a cuidarlo."
  },
  {
    tipo:"duo",
    titulo:"¿Sabías que...?",
    icono:"i-bandera",
    frase:"Los Carabineros de Chile nacieron en el año 1927.",
    extra:"Su lema es: “Orden y Patria”.",
    voz:"¿Sabías que los Carabineros de Chile nacieron en el año mil novecientos veintisiete? Su lema es: Orden y Patria.",
    guion:"¿Sabían que los Carabineros de Chile <b>nacieron en el año 1927</b>? Su lema es <b>Orden y Patria</b>."
  },
  {
    tipo:"cierre",
    titulo:"Su trabajo es muy importante",
    icono:"i-comunidad",
    frase:"Porque nos cuida a todos.",
    gracias:"¡Muchas gracias!",
    voz:"El trabajo de los carabineros es muy importante porque nos cuida a todos. ¡Muchas gracias!",
    guion:"El trabajo de los carabineros es <b>muy importante porque nos cuida a todos</b>. Por eso hay que respetarlos y darles las gracias. <b>¡Muchas gracias!</b>"
  }
];

/* ============================================================
   Motor
   ============================================================ */
const $ = id => document.getElementById(id);
let actual = 0, vozOn = false, guionOn = false;

function svgIlu(id,label){
  return '<svg viewBox="0 0 120 120" role="img" aria-label="'+(label||"")+'"><use href="#'+id+'"/></svg>';
}
function ilu(id,label,clases){
  return '<span class="ilu '+(clases||"")+'" data-icono="'+id+'">'+svgIlu(id,label)+'</span>';
}
/* Acepta .jpg, .jpeg, .png o .webp: usa la primera que encuentre. */
const EXTENSIONES = [".jpg",".jpeg",".png",".webp"];
function cargarFotos(){
  document.querySelectorAll('.ilu[data-icono]').forEach(el=>{
    const id = el.dataset.icono, base = FOTOS[id];
    if(!base) return;
    (function probar(k){
      if(k >= EXTENSIONES.length) return;
      const im = new Image();
      im.alt = "";
      im.onload  = ()=>{ if(el.dataset.icono===id && el.isConnected){ el.innerHTML=""; el.appendChild(im); } };
      im.onerror = ()=>probar(k+1);
      im.src = CARPETA_FOTOS + base + EXTENSIONES[k];
    })(0);
  });
}
function hablar(txt){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang="es-CL"; u.rate=.9; u.pitch=1.05;
    const v = speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function pintar(){
  const d = DIAPOS[actual];
  let html = "";

  if(d.tipo==="portada"){
    html += ilu(d.icono,"Escudo de Carabineros de Chile","grande");
    html += '<h1>'+d.titulo+'</h1>';
    html += '<p class="sub">'+d.sub+'</p>';
    html += '<p class="credito">Presentado por: <b class="nombre">Renata Leiva</b></p>';
    html += '<p class="credito">'+d.credito+'</p>';
  }

  if(d.tipo==="duo"){
    html += '<h2>'+d.titulo+'</h2>';
    html += '<div class="duo">'+ilu(d.icono,d.titulo,"grande")+
            '<div><p class="frase">'+d.frase+'</p>'+
            (d.extra?'<p class="frase destacada" style="margin-top:10px">'+d.extra+'</p>':'')+
            '</div></div>';
  }

  if(d.tipo==="rejilla"){
    html += '<h2>'+d.titulo+'</h2>';
    html += '<div class="rejilla n'+d.items.length+'">';
    d.items.forEach(it=>{
      html += '<div class="tarjeta">'+ilu(it.icono,it.rotulo)+'<span class="rotulo">'+it.rotulo+'</span></div>';
    });
    html += '</div>';
  }

  if(d.tipo==="numero"){
    html += '<h2>'+d.titulo+'</h2>';
    html += '<div class="duo">'+ilu(d.icono,"Llamar al 133","grande")+
            '<div><p class="numerote">'+d.numero+'</p><p class="frase">'+d.frase+'</p></div></div>';
  }

  if(d.tipo==="cierre"){
    html += '<h2>'+d.titulo+'</h2>';
    html += '<div class="duo">'+ilu(d.icono,"La comunidad","grande")+
            '<div><p class="frase">'+d.frase+'</p>'+
            '<p class="frase destacada" style="margin-top:10px">'+d.gracias+'</p></div></div>';
  }

  $("diapo").innerHTML = html;
  cargarFotos();

  $("contador").textContent = (actual+1)+" / "+DIAPOS.length;
  $("guion").innerHTML = '<b>Digo:</b> '+d.guion;
  $("btnAtras").disabled = actual===0;
  $("btnSig").disabled = actual===DIAPOS.length-1;

  const p = $("puntos"); p.innerHTML="";
  DIAPOS.forEach((_,k)=>{
    const i=document.createElement("i");
    if(k===actual) i.className="ahora";
    p.appendChild(i);
  });

  if(vozOn) hablar(d.voz);
}

function ir(n){
  const nuevo = Math.min(DIAPOS.length-1, Math.max(0, n));
  if(nuevo===actual) return;
  actual = nuevo;
  pintar();
}

$("btnSig").onclick   = ()=>ir(actual+1);
$("btnAtras").onclick = ()=>ir(actual-1);
$("zonaDer").onclick  = ()=>ir(actual+1);
$("zonaIzq").onclick  = ()=>ir(actual-1);

$("btnVoz").onclick = function(){
  vozOn = !vozOn;
  this.setAttribute("aria-pressed", vozOn);
  this.innerHTML = (vozOn ? "🔊" : "🔇") + '<span class="solo-ancho"> Leer</span>';
  if(vozOn) hablar(DIAPOS[actual].voz);
  else if(window.speechSynthesis) speechSynthesis.cancel();
};
$("btnGuion").onclick = function(){
  guionOn = !guionOn;
  this.setAttribute("aria-pressed", guionOn);
  $("guion").classList.toggle("visible", guionOn);
};
$("btnPantalla").onclick = function(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else{
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }
  }catch(e){}
};
if(!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen){
  $("btnPantalla").style.display="none";
}

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); ir(actual+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); ir(actual-1); }
  if(e.key==="Home") ir(0);
  if(e.key==="End") ir(DIAPOS.length-1);
});

if(window.speechSynthesis) speechSynthesis.getVoices();
pintar();
</script>
</body>
</html>
