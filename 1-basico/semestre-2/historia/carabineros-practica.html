<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.pregunta{margin:0 0 12px}

.aviso{min-height:58px;margin-top:12px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.progreso{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.progreso i{width:8px;height:8px;border-radius:9999px;background:var(--tint-strong);display:block}
.progreso i.hecho{background:var(--green)}
.progreso i.ahora{background:var(--accent);animation:pulso 1.5s ease-in-out infinite}
@keyframes pulso{50%{opacity:.4}}
.album{padding:10px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.album .ilu{width:62px;border-radius:var(--r-xs)}
.trofeo{font-size:4rem;display:block}
.confeti{position:absolute;top:-20px;font-size:1.4rem;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(360deg);opacity:0}}

/* ==========================================================================
   BASE común (tipografía, superficie, accesibilidad) · ver DESIGN.md

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPad: se mira a más distancia, todo crece un 12 % */
@media (min-width:700px) and (min-height:600px){ html{font-size:112.5%} }
*{-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg-page);color:var(--text-primary);
  font:400 var(--fs-body)/1.45 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-ui);font-weight:500;letter-spacing:-.01em}
b,strong{font-weight:600}
button,a{touch-action:manipulation}
button{font-family:var(--font-ui)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}

}

/* diálogo "¿Quieres salir?" (lo crea selva.js) · modal: bg-elevated + sombra L4 */
.selva-dialogo{
  border:1px solid var(--border-primary);border-radius:var(--r-lg);padding:20px 20px 16px;
  width:min(360px, calc(100vw - 32px));
  background:var(--bg-elevated);color:var(--text-primary);text-align:center;box-shadow:var(--shadow-L4);
  font-family:var(--font-ui);
}
.selva-dialogo::backdrop{background:rgba(0,0,0,.32)}
.selva-dialogo-emo{font-size:2.6rem;line-height:1}
.selva-dialogo h2{font:500 1.25rem/1.3 var(--font-ui);margin:10px 0 4px;color:var(--text-strong)}
.selva-dialogo p{font-size:var(--fs-body);line-height:1.4;margin:0 0 16px;color:var(--text-secondary)}
.selva-dialogo button{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--toque);
  border:1px solid transparent;border-radius:var(--r-xs);cursor:pointer;
  font:500 var(--fs-label)/1 var(--font-ui);transition:background var(--t-rapida);
}
.selva-seguir{background:var(--button-neutral);color:var(--button-neutral-text);margin-bottom:8px}
.selva-salir{background:transparent;color:var(--red)}
.selva-salir:hover{background:var(--red-tint)}
/* ==========================================================================
   Capa para actividades de juego (pantallas inicio / juego / final)
   Se carga DESPUÉS del estilo propio de cada archivo, así que lo reemplaza
   sin tocar la lógica del juego. Componentes según DESIGN.md §5.
   ========================================================================== */

/* ---------- vista a pantalla completa sobre bg-page ---------- */
body{
  display:block;min-height:100vh;min-height:100dvh;margin:0;
  padding:0 max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:var(--bg-page);
}
.marco{
  width:min(720px,100%);margin:0 auto;padding:0 0 8px;
  background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;
}

/* ---------- barra superior: fija, borde inferior de 1px, respeta el notch ---------- */
.marco > .barra,.marco > .barra-sup{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:0 -16px 20px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  background:var(--bg-page);border-bottom:1px solid var(--border-primary);
}
/* botón secundario: bg-elevated + borde + L1 */
.marco > .barra .mini,.marco > .barra-sup .mini,.pantalla .mini{
  min-height:var(--toque);padding:0 14px;border:1px solid var(--border-primary);border-radius:var(--r-xs);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--shadow-L1);
  font:500 var(--fs-meta)/1 var(--font-ui);text-decoration:none;cursor:pointer;
  transition:background var(--t-rapida),border-color var(--t-rapida);
}
.marco > .barra .mini:hover,.marco > .barra-sup .mini:hover,.pantalla .mini:hover{background:var(--tint-strong)}
.marco > .barra .mini[aria-pressed="false"],.marco > .barra-sup .mini[aria-pressed="false"]{background:transparent;box-shadow:none;color:var(--text-secondary)}
/* contador de estrellas: chip pill */
.puntaje{
  min-height:36px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--border-primary);color:var(--text-primary);box-shadow:none;
  font:500 var(--fs-meta)/1 var(--font-ui);letter-spacing:0;white-space:nowrap;
  transition:background var(--t-rapida);
}
.puntaje.salta{animation:selva-salta 1s ease-out}
@keyframes selva-salta{0%{background:var(--accent-tint);border-color:var(--accent)}100%{background:transparent}}

/* ---------- títulos y texto: jerarquía por peso y opacidad ---------- */
.pantalla{padding-top:4px}
h1{font:500 var(--fs-display)/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-strong);text-shadow:none}
h1 span{display:block;font-size:var(--fs-body) !important;font-weight:400;letter-spacing:0 !important;line-height:1.4;color:var(--text-secondary);margin-top:8px}
.intro{font-size:var(--fs-body);line-height:1.5;max-width:40ch;color:var(--text-secondary)}
.intro b{color:var(--text-primary)}
.pregunta{font:500 var(--fs-title)/1.3 var(--font-ui);color:var(--text-primary);letter-spacing:-.01em}
.nivel-chip,.nivelChip{
  display:inline-flex;align-items:center;gap:6px;min-height:32px;
  font:500 var(--fs-meta)/1 var(--font-ui) !important;padding:0 12px !important;
  border-radius:var(--r-pill);border:1px solid var(--border-primary);background:transparent;color:var(--text-secondary);box-shadow:none;
}

/* ---------- botón principal: button-neutral, sin volumen 3D ---------- */
.btn{
  min-height:var(--toque-respuesta);padding:0 24px;border:1px solid transparent;border-radius:var(--r-sm);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:500 1.125rem/1.2 var(--font-ui);
  background:var(--button-neutral);color:var(--button-neutral-text);box-shadow:none;cursor:pointer;
  transition:opacity var(--t-rapida);
}
.btn:hover{opacity:.9}
.btn:active{transform:none;opacity:.8;box-shadow:none}
/* sol y hoja ("Siguiente", "Jugar de nuevo") también son primarios */
.btn.sol,.btn.sol:active,.btn.hoja,.btn.hoja:active{background:var(--button-neutral);color:var(--button-neutral-text);box-shadow:none}
/* agua ("Escuchar otra vez", "Ir a la presentación"): botón secundario */
.btn.agua,.btn.secundario{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-primary);box-shadow:var(--shadow-L1)}
.btn.agua:hover,.btn.secundario:hover{opacity:1;background:var(--tint-strong)}
.btn.agua:active,.btn.secundario:active{box-shadow:var(--shadow-L1)}
.btn[disabled]{opacity:.4;cursor:default}

/* ---------- tarjeta del ítem (escenario) ---------- */
.escenario{
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);border-radius:var(--r-lg);box-shadow:var(--shadow-L1);
}
.nombre{font:500 var(--fs-title)/1.25 var(--font-ui);color:var(--text-primary)}

/* ---------- respuestas, controles y teclas: tarjetas tocables ≥ 56 px ---------- */
.opcion,.ctrl,.tecla{
  min-height:var(--toque-respuesta);border-radius:var(--r-sm);cursor:pointer;
  background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);
  font-family:var(--font-ui);font-weight:500;
  transition:background var(--t-rapida),border-color var(--t-rapida);
}
.opcion:hover,.ctrl:hover,.tecla:hover{border-color:var(--border-hover);background:var(--bg-elevated)}
.opcion:active,.ctrl:active,.tecla:active{transform:none;background:var(--tint-faint);box-shadow:var(--shadow-L1)}
.opcion b,.ctrl b,.tecla b{font-family:var(--font-ui);font-weight:500}
.ctrl.audio{color:var(--accent)}
.ctrl.listo{background:var(--button-neutral);color:var(--button-neutral-text);border-color:transparent}
.ctrl.listo:hover{background:var(--button-neutral);opacity:.9}
.ctrl.quitar{color:var(--red)}
.ctrl.quitar:hover{background:var(--red-tint)}
/* estados: color solo en borde y fondo tint (DESIGN.md §6) */
.opcion.bien,.opcion.correcta{background:var(--green-tint);border-color:var(--green);color:var(--text-primary);box-shadow:none}
.opcion.mal,.opcion.incorrecta{background:var(--red-tint);border-color:var(--red);color:var(--text-primary);box-shadow:none}
.opcion[disabled],.ctrl[disabled],.tecla[disabled]{cursor:default}
.opcion.incorrecta[disabled],.opcion.mal[disabled]{opacity:.7}

/* ---------- aviso: el dato para repetir en la prueba · tarjeta con punto de estado ---------- */
.aviso{border-radius:var(--r-sm);line-height:1.4;font-weight:500;font-size:var(--fs-body);color:var(--text-primary)}
.aviso.ok:not(:empty),.aviso.ups:not(:empty){
  position:relative;background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-primary);box-shadow:var(--shadow-L1);padding:12px 14px 12px 32px;text-align:left;
}
.aviso.ok:not(:empty)::before,.aviso.ups:not(:empty)::before{
  content:"";position:absolute;left:14px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:9999px;background:var(--green);
}
.aviso.ups:not(:empty)::before{background:var(--orange)}

/* ---------- detalles ---------- */
.ecuacion .hueco,.escena .hueco,.cuento .hueco{color:var(--accent);border-bottom-color:var(--accent)}
.rot small,.letraBtn small{font-size:var(--fs-meta)}          /* "decenas", "unidades", letra mayúscula */
.base10 .rot,.casilla b{font-size:var(--fs-meta)}
.pista-escucha{color:var(--text-secondary)}

/* ---------- cierre: panel agrupado (álbum) ---------- */
.confeti{position:fixed !important;z-index:50}
.album{background:var(--bg-elevated);border:0;border-radius:var(--r-lg);box-shadow:var(--shadow-ring)}
.trofeo{filter:none}

/* ---------- iPad: más aire, mismas funciones ---------- */
@media (min-width:700px){
  .marco > .barra,.marco > .barra-sup{margin-bottom:28px}
  .opciones{gap:12px}
}

/* ---------- Aumentar contraste (Ajustes › Accesibilidad) ---------- */
@media (prefers-contrast: more){
  .opcion,.ctrl,.tecla,.escenario,.marco > .barra .mini,.puntaje{border-color:currentColor}
  .intro,h1 span{color:var(--text-primary)}
}

/* ---------- portada y cierre de cada actividad: ocupan la pantalla ---------- */
#inicio.activa,#final.activa{
  display:flex;flex-direction:column;justify-content:center;
  min-height:calc(100dvh - 110px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
}

#inicio .intro{margin-bottom:24px}

    </div>
  </section>

  <section class="pantalla" id="final">
    <span class="trofeo" id="trofeo">🏆</span>
    <h1 id="tituloFinal">¡Lo lograste!</h1>
    <p class="intro" id="resumen"></p>
    <div class="album" id="album"></div>
    <div class="menu">
      <button class="btn sol" id="btnOtraVez">Jugar de nuevo 🔁</button>
      <a class="btn agua" href="carabineros-presentacion.html">📽️ Ir a la presentación</a>
      <button class="mini" id="btnMenu">Volver al menú</button>
    </div>
  </section>

</div>

<script>
/* ============================================================
   FOTOS REALES OPCIONALES
   Si existe img/<nombre>.jpg, reemplaza al dibujo automáticamente.
   ============================================================ */
const CARPETA_FOTOS = "img/";
const EXTENSIONES = [".jpg",".jpeg",".png",".webp"];
const rutaCache = {};

/* ============================================================
   1. PREGUNTAS DEL JUEGO  (10 · una por idea de la rúbrica)
   ============================================================ */
/* Regla: cada opción muestra el dibujo de LO QUE DICE su texto.
   Así ella puede responder mirando, aunque todavía no lea de corrido. */
const PREGUNTAS = [
  { icono:"carabinera", p:"¿Qué hace un carabinero?",
    ops:[{i:"cruzar",t:"Ayuda a las personas",ok:1},{i:"comunidad",t:"Construye casas"}],
    dato:"Los carabineros cuidan y ayudan a las personas." },

  { icono:"patrulla", p:"¿Cómo se llama el auto verde y blanco de Carabineros?",
    ops:[{i:"patrulla",t:"La patrulla",ok:1},{i:"moto",t:"La moto"},{i:"caballo",t:"El caballo"}],
    dato:"El auto de Carabineros se llama patrulla." },

  { icono:"silbato", p:"¿Qué usa el carabinero para detener los autos?",
    ops:[{i:"silbato",t:"El silbato",ok:1},{i:"linterna",t:"La linterna"},{i:"radio",t:"La radio"}],
    dato:"El silbato sirve para avisar y detener los autos." },

  { icono:"telefono", p:"¿A qué número llamamos si necesitamos a Carabineros?",
    ops:[{t:"133",ok:1},{t:"711"},{t:"250"}],
    dato:"En Chile llamamos al ciento treinta y tres." },

  { icono:"perro", p:"¿Qué animal ayuda a buscar personas perdidas?",
    ops:[{i:"perro",t:"El perro",ok:1},{i:"caballo",t:"El caballo"}],
    dato:"El perro busca personas perdidas porque huele muy bien." },

  { icono:"quepis", p:"¿Cómo se llama este gorro del carabinero?",
    ops:[{i:"quepis",t:"El quepis",ok:1},{i:"chaleco",t:"El chaleco"},{i:"placa",t:"La placa"}],
    dato:"El gorro del carabinero se llama quepis." },

  { icono:"radio", p:"¿Con qué pide ayuda el carabinero?",
    ops:[{i:"radio",t:"La radio",ok:1},{i:"silbato",t:"El silbato"},{i:"linterna",t:"La linterna"}],
    dato:"Con la radio pide ayuda y avisa a los otros carabineros." },

  { icono:"caballo", p:"¿En qué animal patrullan las plazas y los parques?",
    ops:[{i:"caballo",t:"El caballo",ok:1},{i:"perro",t:"El perro"}],
    dato:"Los carabineros a caballo cuidan las plazas y los parques." },

  { icono:"chaleco", p:"¿Qué se pone el carabinero para que todos lo vean?",
    ops:[{i:"chaleco",t:"El chaleco",ok:1},{i:"quepis",t:"El quepis"},{i:"placa",t:"La placa"}],
    dato:"El chaleco brilla para que todos lo vean, hasta de noche." },

  { icono:"comunidad", p:"¿Por qué es importante el trabajo de los carabineros?",
    ops:[{i:"comunidad",t:"Porque nos cuidan",ok:1},{i:"cono",t:"Porque pintan las calles"}],
    dato:"Su trabajo es importante porque nos cuida a todos." }
];

/* ============================================================
   2. ENSAYO · 8 pasos, uno por criterio de la rúbrica
   ============================================================ */
const ENSAYO = [
  { titulo:"1. Me presento", icono:"carabinera",
    frase:"Buenos días. Soy carabinera de Chile.",
    pista:"Párate derecha, mira a tus compañeros y habla fuerte. <b>Toca tu gorro o tu placa al decirlo.</b>" },

  { titulo:"2. Digo qué es mi oficio", icono:"placa",
    frase:"Los carabineros somos los que cuidamos a las personas en las calles.",
    pista:"Este es el criterio más importante: <b>di el nombre del oficio y qué trabajo hace</b>." },

  { titulo:"3. Cuento qué hago", icono:"cruzar",
    frase:"Yo cuido las calles en mi patrulla y ayudo a los niños a cruzar.",
    pista:"Aquí nombras <b>dos cosas</b> que hace un carabinero. Puedes agregar: busco a personas perdidas." },

  { titulo:"4. Muestro mis herramientas", icono:"silbato",
    frase:"Uso mi quepis, mi silbato y mi radio. El silbato sirve para detener los autos.",
    pista:"Nombra <b>dos o más</b> objetos y explica <b>para qué sirve uno</b>. Muéstralos si los tienes." },

  { titulo:"5. Presento a mis ayudantes", icono:"perro",
    frase:"Los carabineros también trabajamos con perros y con caballos.",
    pista:"Este dato le gusta mucho al curso. Los perros <b>huelen</b> para buscar personas." },

  { titulo:"6. Explico cómo ayudo", icono:"telefono",
    frase:"Si alguien necesita ayuda, llama al ciento treinta y tres y nosotros llegamos rápido.",
    pista:"Aquí explicas <b>cómo ayudas a la comunidad</b>. El número es el <b>133</b>." },

  { titulo:"7. Cuento un dato entretenido", icono:"bandera",
    frase:"¿Sabían que los Carabineros de Chile nacieron en el año mil novecientos veintisiete? Su lema es Orden y Patria.",
    pista:"Un dato sorprendente hace que todos te escuchen. Di <b>Orden y Patria</b> bien fuerte." },

  { titulo:"8. Me despido", icono:"comunidad",
    frase:"El trabajo de los carabineros es muy importante porque nos cuida a todos. Muchas gracias.",
    pista:"Termina <b>agradeciendo</b> y diciendo por qué el trabajo es importante." }
];

/* ============================================================
   3. Motor
   ============================================================ */
const APLAUSOS = ["¡Muy bien!","¡Excelente!","¡Lo lograste!","¡Qué buena carabinera!","¡Perfecto!","¡Qué atenta estuviste!","¡Brillante!","¡Así se hace!"];
const ANIMOS = ["Casi... observa bien e inténtalo otra vez.","Uy, casi. Mira de nuevo y elige.","No pasa nada, prueba otra vez.","Estás cerca, observa con calma."];
const $ = id => document.getElementById(id);
const mezclar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

let indice=0, estrellas=0, lista=[], coleccion=[], vozOn=true, pasoEnsayo=0, hechos=[];

/* Busca la foto probando .jpg, .jpeg, .png y .webp. */
function ponerIlu(el, base, label){
  el.innerHTML = "";
  el.dataset.icono = base;
  const pinta = ruta => {
    if(el.dataset.icono !== base) return;
    const im = new Image();
    im.alt = label || "";
    im.decoding = "async";
    im.src = ruta;
    el.innerHTML = "";
    el.appendChild(im);
  };
  if(rutaCache[base]){ pinta(rutaCache[base]); return; }
  (function probar(k){
    if(k >= EXTENSIONES.length) return;
    const t = new Image();
    t.onload  = ()=>{ rutaCache[base] = CARPETA_FOTOS+base+EXTENSIONES[k]; pinta(rutaCache[base]); };
    t.onerror = ()=>probar(k+1);
    t.src = CARPETA_FOTOS + base + EXTENSIONES[k];
  })(0);
}
/* Precarga todo para que el juego no parpadee. */
function precargar(){
  const bases = new Set();
  PREGUNTAS.forEach(p=>{ bases.add(p.icono); p.ops.forEach(o=>{ if(o.i) bases.add(o.i); }); });
  ENSAYO.forEach(e=>bases.add(e.icono));
  bases.forEach(b=>{
    (function probar(k){
      if(k >= EXTENSIONES.length) return;
      const im = new Image();
      im.onload  = ()=>{ rutaCache[b] = CARPETA_FOTOS+b+EXTENSIONES[k]; };
      im.onerror = ()=>probar(k+1);
      im.src = CARPETA_FOTOS + b + EXTENSIONES[k];
    })(0);
  });
}
function hablar(txt){
  if(!vozOn || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang="es-CL"; u.rate=.9; u.pitch=1.1;
    const v = speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
let ctxAudio=null;
function pito(ok){
  try{
    ctxAudio = ctxAudio || new (window.AudioContext||window.webkitAudioContext)();
    if(ctxAudio.state==="suspended") ctxAudio.resume();
    (ok?[523,659,784]:[330,262]).forEach((f,i)=>{
      const o=ctxAudio.createOscillator(), g=ctxAudio.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.001,ctxAudio.currentTime);
      g.gain.exponentialRampToValueAtTime(.16,ctxAudio.currentTime+.02+i*.11);
      g.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+.20+i*.11);
      o.connect(g); g.connect(ctxAudio.destination);
      o.start(ctxAudio.currentTime+i*.11); o.stop(ctxAudio.currentTime+.4+i*.11);
    });
  }catch(e){}
}
function pantalla(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
  $(id).classList.add("activa");
  window.scrollTo(0,0);
}
function confeti(){
  const em=["⭐","🎉","🌟","✨"];
  for(let i=0;i<24;i++){
    const c=document.createElement("div");
    c.className="confeti"; c.textContent=em[i%em.length];
    c.style.left=Math.random()*100+"%";
    c.style.animationDuration=(2+Math.random()*1.6)+"s";
    c.style.animationDelay=(Math.random()*.6)+"s";
    document.querySelector(".marco").appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}

/* ---- Juego ---- */
function iniciarJuego(){
  estrellas=0; indice=0; coleccion=[];
  $("puntaje").textContent="⭐ 0";
  lista = mezclar(PREGUNTAS).slice(0,10);
  pantalla("juego"); mostrar();
}
function mostrar(){
  const p=lista[indice];
  $("pregunta").textContent=p.p;
  ponerIlu($("figura"), p.icono, "");
  $("escenario").className="escenario";
  $("aviso").textContent=""; $("aviso").className="aviso";
  const cont=$("opciones"); cont.innerHTML="";
  const orden = mezclar(p.ops);
  orden.forEach(o=>{
    const b=document.createElement("button");
    b.className="opcion"; b.type="button";
    if(o.i){
      const sp=document.createElement("span"); sp.className="ilu";
      b.appendChild(sp); ponerIlu(sp,o.i,o.t);
    }
    const bo=document.createElement("b"); bo.textContent=o.t; b.appendChild(bo);
    b.setAttribute("aria-label",o.t);
    b.onclick=()=>responder(b,o,p);
    cont.appendChild(b);
  });
  /* Todavía no lee de corrido: la voz también nombra las opciones, en el orden en que aparecen. */
  hablar(p.p + " Elige: " + orden.map(o=>o.t).join(". ") + ".");
}
function responder(boton,o,p){
  if(o.ok){
    boton.classList.add("correcta");
    document.querySelectorAll(".opcion").forEach(b=>b.disabled=true);
    $("escenario").classList.add("bien");
    estrellas++; $("puntaje").textContent="⭐ "+estrellas;
    coleccion.push(p.icono);
    const frase=APLAUSOS[Math.floor(Math.random()*APLAUSOS.length)];
    $("aviso").textContent=frase+" "+p.dato;
    $("aviso").className="aviso ok";
    pito(true); hablar(frase+" "+p.dato);
    setTimeout(siguiente,3400);
  }else{
    boton.classList.add("incorrecta"); boton.disabled=true;
    $("escenario").classList.remove("mal"); void $("escenario").offsetWidth;
    $("escenario").classList.add("mal");
    const a=ANIMOS[Math.floor(Math.random()*ANIMOS.length)];
    $("aviso").textContent="🤔 "+a;
    $("aviso").className="aviso ups";
    pito(false); hablar(a);
  }
}
function siguiente(){
  indice++;
  if(indice<lista.length){ mostrar(); return; }
  $("trofeo").textContent="🏆";
  $("tituloFinal").textContent="¡Lo lograste!";
  $("resumen").textContent="Acertaste "+estrellas+" de "+lista.length+". Ya sabes mucho sobre los carabineros.";
  const al=$("album"); al.innerHTML="";
  coleccion.forEach(ic=>{ const s=document.createElement("span"); s.className="ilu"; al.appendChild(s); ponerIlu(s,ic,""); });
  pantalla("final"); confeti();
  hablar("¡Felicitaciones! Acertaste "+estrellas+" preguntas. Ahora puedes ensayar tu presentación.");
}

/* ---- Ensayo ---- */
function iniciarEnsayo(){
  pasoEnsayo=0; hechos=[]; estrellas=0;
  $("puntaje").textContent="⭐ 0";
  pantalla("ensayo"); pintarPaso();
}
function pintarPaso(){
  const e=ENSAYO[pasoEnsayo];
  $("chipPaso").textContent="Paso "+(pasoEnsayo+1)+" de "+ENSAYO.length;
  $("tituloPaso").textContent=e.titulo;
  ponerIlu($("iluEnsayo"), e.icono, "");
  $("fraseEnsayo").textContent="“"+e.frase+"”";
  $("pistaEnsayo").innerHTML="💡 "+e.pista;
  const pr=$("progreso"); pr.innerHTML="";
  ENSAYO.forEach((_,k)=>{
    const i=document.createElement("i");
    if(hechos.includes(k)) i.className="hecho";
    else if(k===pasoEnsayo) i.className="ahora";
    pr.appendChild(i);
  });
  $("btnAtras").style.visibility = pasoEnsayo===0 ? "hidden" : "visible";
  hablar(e.frase);
}
function pasoListo(){
  if(!hechos.includes(pasoEnsayo)){
    hechos.push(pasoEnsayo);
    estrellas=hechos.length;
    $("puntaje").textContent="⭐ "+estrellas;
  }
  pito(true);
  if(pasoEnsayo < ENSAYO.length-1){
    pasoEnsayo++;
    const frase=APLAUSOS[Math.floor(Math.random()*APLAUSOS.length)];
    hablar(frase);
    setTimeout(pintarPaso,900);
  }else{
    $("trofeo").textContent="🎖️";
    $("tituloFinal").textContent="¡Presentación lista!";
    $("resumen").textContent="Ensayaste los 8 pasos de tu presentación. Si la dices así el lunes, te va a salir perfecta.";
    const al=$("album"); al.innerHTML="";
    ENSAYO.forEach(e=>{ const s=document.createElement("span"); s.className="ilu"; al.appendChild(s); ponerIlu(s,e.icono,""); });
    pantalla("final"); confeti();
    hablar("¡Felicitaciones! Ensayaste toda tu presentación.");
  }
}

/* ---- Botones ---- */
$("btnJuego").onclick = ()=>{ pito(true); iniciarJuego(); };
$("btnEnsayo").onclick = ()=>{ pito(true); iniciarEnsayo(); };
$("btnDicho").onclick = pasoListo;
$("btnRepetirVoz").onclick = ()=>hablar(ENSAYO[pasoEnsayo].frase);
$("btnAtras").onclick = ()=>{ if(pasoEnsayo>0){ pasoEnsayo--; pintarPaso(); } };
$("btnOtraVez").onclick = ()=>{ hechos.length ? iniciarEnsayo() : iniciarJuego(); };
$("btnMenu").onclick = ()=>{ pantalla("inicio"); estrellas=0; $("puntaje").textContent="⭐ 0"; };
$("btnVoz").onclick = function(){
  vozOn=!vozOn;
  this.textContent = vozOn ? "🔊 Voz" : "🔇 Voz";
  this.setAttribute("aria-pressed",vozOn);
  if(!vozOn && window.speechSynthesis) speechSynthesis.cancel();
};
if(window.speechSynthesis) speechSynthesis.getVoices();
ponerIlu($("iluInicio"), "carabinera", "Carabinera de Chile");
precargar();
</script>

<script id="selva-js">
/* ==========================================================================
   SELVA v2 · comportamiento común
   1. Guarda el progreso (veces jugada y mejor puntaje) para que la portada
      muestre las estrellas ganadas. Solo en este dispositivo, sin internet.
   2. Si ya hay estrellas en la ronda, "Inicio" pregunta antes de salir.
   3. Hace saltar el contador cuando se gana una estrella.
   4. Etiqueta los botones que solo tienen un ícono.
   ========================================================================== */
(function(){
  var CLAVE = "aprendo:progreso";
  var ruta = decodeURIComponent(location.pathname).replace(/^.*?(\d+-basico\/)/, "$1");
  var $ = function(s){ return document.querySelector(s); };

  function estrellas(){
    var el = $("#puntaje, #cuenta");
    var m = el && el.textContent.match(/\d+/);
    return m ? +m[0] : 0;
  }
  function registrar(){
    var d = {};
    try{ d = JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){}
    var r = d[ruta] || { veces:0, mejor:0 };
    r.veces++;
    r.mejor = Math.max(r.mejor || 0, estrellas());
    r.ultima = new Date().toISOString().slice(0, 10);
    d[ruta] = r;
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
  }

  /* 1. fin de la actividad: pantalla #final (juegos) o #pFinal (misiones) */
  var fin = $("#final, #pFinal");
  if(fin){
    var visto = false;
    new MutationObserver(function(){
      var ve = fin.classList.contains("activa") || (fin.id === "pFinal" && !fin.hidden);
      if(ve && !visto){ visto = true; setTimeout(registrar, 400); }
      if(!ve) visto = false;
    }).observe(fin, { attributes:true, attributeFilter:["class", "hidden"] });
  }
  /* presentaciones: cuenta como vista al llegar a la última diapositiva */
  var cont = $("#contador");
  if(cont && !fin){
    var vista = false;
    new MutationObserver(function(){
      var p = cont.textContent.match(/(\d+)\s*\/\s*(\d+)/);
      if(p && p[1] === p[2] && !vista){ vista = true; registrar(); }
    }).observe(cont, { childList:true, characterData:true, subtree:true });
  }

  /* 2. confirmar antes de salir a mitad de una ronda */
  function enRonda(){
    return !!$("#juego.activa, #ensayo.activa, #pJuego:not([hidden])") && estrellas() > 0;
  }
  var dlg = null;
  function preguntarSalida(destino){
    if(!window.HTMLDialogElement){ location.href = destino; return; }
    if(!dlg){
      dlg = document.createElement("dialog");
      dlg.className = "selva-dialogo";
      dlg.innerHTML =
        '<div class="selva-dialogo-emo" aria-hidden="true">🏠</div>' +
        '<h2>¿Quieres salir?</h2>' +
        '<p>Si sales ahora, se pierden las estrellas de esta ronda.</p>' +
        '<button class="selva-seguir" value="seguir">▶️ Seguir jugando</button>' +
        '<button class="selva-salir" value="salir">Salir</button>';
      dlg.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        dlg.close();
        if(b.value === "salir") location.href = dlg.dataset.destino;
      });
      document.body.appendChild(dlg);
    }
    dlg.dataset.destino = destino;
    dlg.showModal();
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance("¿Quieres salir? Si sales ahora, se pierden las estrellas de esta ronda.");
        u.lang = "es-ES"; speechSynthesis.speak(u);
      }
    }catch(e){}
    dlg.querySelector(".selva-seguir").focus();
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href$="index.html"]');
    if(!a || !enRonda()) return;
    e.preventDefault();
    preguntarSalida(a.href);
  }, true);

  /* 3. el contador salta al ganar una estrella */
  var pts = $("#puntaje");
  if(pts){
    var antes = estrellas();
    new MutationObserver(function(){
      var ahora = estrellas();
      if(ahora > antes){
        pts.classList.remove("salta"); void pts.offsetWidth; pts.classList.add("salta");
      }
      antes = ahora;
    }).observe(pts, { childList:true, characterData:true, subtree:true });
  }

  /* 4. etiquetas para lectores de pantalla */
  var nombres = { btnGeneral:"Ver todas las diapositivas", btnPantalla:"Pantalla completa", btnVoz:"Voz", sonido:"Voz y sonidos" };
  Object.keys(nombres).forEach(function(id){
    var b = document.getElementById(id);
    if(b && !b.getAttribute("aria-label") && !/[a-záéíóú]{3}/i.test(b.textContent)) b.setAttribute("aria-label", nombres[id]);
  });
  /* el iPhone no permite pantalla completa en páginas web: se oculta el botón */
  var d = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) d.classList.add("selva-sin-pantalla-completa");
})();
</script>
